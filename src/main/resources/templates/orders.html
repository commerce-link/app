<!DOCTYPE HTML>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}">
<body>

<div layout:fragment="content">

    <div class="is-flex is-justify-content-flex-end mb-2">
        <button th:replace="~{fragments/screen-intro :: toggle}"></button>
    </div>

    <div th:replace="~{fragments/screen-intro :: panel('orders', 'fas fa-shopping-cart')}"></div>

    <div class="box">
        <h4 class="title is-5">Filter by Order Status</h4>
        <div class="field is-grouped is-grouped-multiline" id="filterTags">
            <div class="control">
                <div class="tags has-addons">
                    <span class="tag is-info">Statuses:</span>
                </div>
            </div>
            <div class="control" th:each="status : ${statuses}">
                <button type="button"
                        class="button is-small status-tag"
                        th:classappend="${#lists.contains(selectedStatuses, status.name())} ? 'is-primary' : 'is-primary is-light'"
                        th:data-status="${status.name()}">
                    <span th:text="${enumI18n.localize(status)}"></span>
                    <span th:if="${itemCountsByStatus.get(status) != null}" th:text="' (' + ${itemCountsByStatus.get(status)} + ')'"></span>
                    <span th:if="${itemCountsByStatus.get(status) == null}"> (0)</span>
                </button>
            </div>

            <div class="control">
                <button type="button" class="button is-small is-danger is-light" id="clearFilters">
                    <span class="icon is-small"><i class="fas fa-times"></i></span>
                    <span>Clear Filters</span>
                </button>
            </div>

            <div class="control ml-auto">
                <form method="post" action="/dashboard/orders/new/pos">
                    <button type="submit" class="button is-small is-success">
                        <span class="icon is-small"><i class="fas fa-cash-register"></i></span>
                        <span th:text="#{orders.new.pos.button}">New POS sale</span>
                    </button>
                </form>
            </div>
        </div>
    </div>

    <div class="box">
        <div class="is-flex is-justify-content-space-between is-align-items-center mb-3">
            <h4 class="title is-5 mb-0">Saved filters</h4>
            <button type="button" class="button is-small" id="toggleFilterForm">
                <span class="icon is-small"><i class="fas fa-plus"></i></span>
                <span>New filter</span>
            </button>
        </div>

        <div th:if="${error}" class="notification is-danger is-light" th:text="${error}"></div>

        <div class="field is-grouped is-grouped-multiline">
            <div class="control">
                <a class="button is-small"
                   th:classappend="${selectedFilterKey == null} ? 'is-link' : 'is-link is-light'"
                   href="/dashboard/orders">All open orders</a>
            </div>
            <div class="control" th:each="saved : ${savedFilters}">
                <div class="field has-addons mb-0">
                    <p class="control">
                        <a class="button is-small"
                           th:classappend="${saved.filterKey == selectedFilterKey} ? 'is-link' : 'is-link is-light'"
                           th:href="@{/dashboard/orders(filterKey=${saved.filterKey})}">
                            <span class="icon is-small" th:if="${saved.sharedWithStore}"><i class="fas fa-users"></i></span>
                            <span class="icon is-small" th:unless="${saved.sharedWithStore}"><i class="fas fa-user"></i></span>
                            <span th:text="${saved.label}"></span>
                        </a>
                    </p>
                    <p class="control" th:if="${!saved.sharedWithStore or canManageStoreFilters}">
                        <button type="button" class="button is-small edit-filter"
                                th:data-filter-key="${saved.filterKey}"
                                th:data-label="${saved.label}"
                                th:data-conditions="${saved.conditionsByField}">
                            <span class="icon is-small"><i class="fas fa-pen"></i></span>
                        </button>
                    </p>
                    <p class="control" th:if="${!saved.sharedWithStore or canManageStoreFilters}">
                        <form method="post" action="/dashboard/orders/filters/delete">
                            <input type="hidden" name="filterKey" th:value="${saved.filterKey}"/>
                            <button type="submit" class="button is-small is-danger is-light">
                                <span class="icon is-small"><i class="fas fa-times"></i></span>
                            </button>
                        </form>
                    </p>
                </div>
            </div>
            <div class="control" th:if="${#lists.isEmpty(savedFilters)}">
                <span class="has-text-grey is-size-7">No saved filters yet.</span>
            </div>
        </div>

        <form method="post" action="/dashboard/orders/filters" id="filterForm" style="display: none;" class="mt-4">
            <input type="hidden" name="filterKey" id="filterKeyField"/>
            <div class="field">
                <label class="label is-small">Name</label>
                <div class="control">
                    <input class="input is-small" type="text" name="label" required/>
                </div>
            </div>

            <div class="columns is-multiline">
                <div class="column is-one-third">
                    <label class="label is-small">Shipping due</label>
                    <div class="select is-small is-fullwidth">
                        <select name="shippingDue">
                            <option value="">—</option>
                            <option th:each="due : ${shippingDueOptions}" th:value="${due.name()}" th:text="${due.name()}"></option>
                        </select>
                    </div>
                </div>
                <div class="column is-one-third">
                    <label class="label is-small">Shipment type</label>
                    <div class="select is-small is-fullwidth">
                        <select name="shipmentType">
                            <option value="">—</option>
                            <option th:each="type : ${shipmentTypes}" th:value="${type.name()}" th:text="${type.name()}"></option>
                        </select>
                    </div>
                </div>
                <div class="column is-one-third">
                    <label class="label is-small">Payment</label>
                    <div class="select is-small is-fullwidth">
                        <select name="paymentSource">
                            <option value="">—</option>
                            <option th:each="source : ${paymentSources}" th:value="${source.name()}" th:text="${source.name()}"></option>
                        </select>
                    </div>
                </div>
                <div class="column is-one-third">
                    <label class="label is-small">Status</label>
                    <div class="select is-small is-fullwidth">
                        <select name="status">
                            <option value="">—</option>
                            <option th:each="status : ${statuses}" th:value="${status.name()}" th:text="${enumI18n.localize(status)}"></option>
                        </select>
                    </div>
                </div>
                <div class="column is-one-third">
                    <label class="label is-small">Marketplace</label>
                    <div class="control">
                        <input class="input is-small" type="text" name="sourceName" placeholder="Allegro"/>
                    </div>
                </div>
                <div class="column is-one-third">
                    <label class="label is-small">Postal code starts with</label>
                    <div class="control">
                        <input class="input is-small" type="text" name="shippingPostalCode" placeholder="00-9"/>
                    </div>
                </div>
            </div>

            <div class="field" th:if="${canManageStoreFilters}">
                <label class="checkbox is-size-7">
                    <input type="checkbox" name="sharedWithStore" value="true"/>
                    Share with the whole store
                </label>
            </div>

            <div class="field">
                <button type="submit" class="button is-small is-primary">Save filter</button>
            </div>
        </form>
    </div>

    <!-- Sections for each order status -->
    <th:block th:if="${!#lists.isEmpty(ordersByStatus.get(NewStatus))}">
        <div th:replace="~{fragments/ordersListFragment :: box('Nowe', ${ordersByStatus.get(NewStatus)})}"></div>
    </th:block>

    <th:block th:if="${!#lists.isEmpty(ordersByStatus.get(AssemblyStatus))}">
        <div th:replace="~{fragments/ordersListFragment :: box('W trakcie kompletowania', ${ordersByStatus.get(AssemblyStatus)})}"></div>
    </th:block>

    <th:block th:if="${!#lists.isEmpty(ordersByStatus.get(AssembledStatus))}">
        <div th:replace="~{fragments/ordersListFragment :: box('Gotowe do realizacji', ${ordersByStatus.get(AssembledStatus)})}"></div>
    </th:block>

    <th:block th:if="${!#lists.isEmpty(ordersByStatus.get(BlockedStatus))}">
        <div th:replace="~{fragments/ordersListFragment :: box('Zablokowane', ${ordersByStatus.get(BlockedStatus)})}"></div>
    </th:block>

    <th:block th:if="${!#lists.isEmpty(ordersByStatus.get(RealizationStatus))}">
        <div th:replace="~{fragments/ordersListFragment :: box('W realizacji', ${ordersByStatus.get(RealizationStatus)})}"></div>
    </th:block>

    <th:block th:if="${!#lists.isEmpty(ordersByStatus.get(PackagingStatus))}">
        <div th:replace="~{fragments/ordersListFragment :: box('W trakcie pakowania', ${ordersByStatus.get(PackagingStatus)})}"></div>
    </th:block>

    <th:block th:if="${!#lists.isEmpty(ordersByStatus.get(ShippingStatus))}">
        <div th:replace="~{fragments/ordersListFragment :: box('W dostawie', ${ordersByStatus.get(ShippingStatus)})}"></div>
    </th:block>

    <th:block th:if="${!#lists.isEmpty(ordersByStatus.get(DeliveredStatus))}">
        <div th:replace="~{fragments/ordersListFragment :: box('Dostarczone', ${ordersByStatus.get(DeliveredStatus)})}"></div>
    </th:block>

    <script th:inline="javascript">
        // Initialize from server-side selected values (includes defaults)
        const selectedStatuses = new Set(/*[[${selectedStatuses}]]*/ []);
        const selectedFilterKey = /*[[${selectedFilterKey}]]*/ null;

        function navigateWithFilters() {
            const params = new URLSearchParams();

            selectedStatuses.forEach(status => params.append('statuses', status));
            if (selectedFilterKey) {
                params.append('filterKey', selectedFilterKey);
            }

            window.location.href = '/dashboard/orders?' + params.toString();
        }

        // Status tag click handler
        document.querySelectorAll('.status-tag').forEach(tag => {
            tag.addEventListener('click', function() {
                const status = this.getAttribute('data-status');
                if (selectedStatuses.has(status)) {
                    selectedStatuses.delete(status);
                } else {
                    selectedStatuses.add(status);
                }
                navigateWithFilters();
            });
        });

        // Clear filters button
        document.getElementById('clearFilters').addEventListener('click', function() {
            window.location.href = '/dashboard/orders?showAll=true';
        });

        const filterForm = document.getElementById('filterForm');
        const filterKeyField = document.getElementById('filterKeyField');

        function openFilterForm(creating) {
            filterForm.action = creating ? '/dashboard/orders/filters' : '/dashboard/orders/filters/update';
            filterForm.style.display = 'block';
        }

        document.getElementById('toggleFilterForm').addEventListener('click', function() {
            if (filterForm.style.display === 'block') {
                filterForm.style.display = 'none';
                return;
            }
            filterForm.reset();
            filterKeyField.value = '';
            openFilterForm(true);
        });

        document.querySelectorAll('.edit-filter').forEach(button => {
            button.addEventListener('click', function() {
                filterForm.reset();
                filterKeyField.value = this.getAttribute('data-filter-key');
                filterForm.elements['label'].value = this.getAttribute('data-label');

                const conditions = this.getAttribute('data-conditions') || '';
                conditions.replace(/[{}]/g, '').split(',').forEach(pair => {
                    const [field, value] = pair.split('=').map(part => part && part.trim());
                    if (!field || !value) {
                        return;
                    }
                    const input = filterForm.elements[field.charAt(0).toLowerCase() + field.slice(1)];
                    if (input) {
                        input.value = value;
                    }
                });

                openFilterForm(false);
            });
        });
    </script>

</div>

</body>
</html>
