<!DOCTYPE HTML>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}">
<body>

<div layout:fragment="content">

    <div class="is-flex is-justify-content-flex-end mb-2">
        <button th:replace="~{fragments/screen-intro :: toggle}"></button>
    </div>

    <div th:replace="~{fragments/screen-intro :: panel('orders', 'fas fa-shopping-cart')}"></div>

    <div class="box">
        <div th:if="${error}" class="notification is-danger is-light" th:text="${error}"></div>

        <div class="is-flex is-flex-wrap-wrap is-align-items-center">
            <div class="dropdown mr-4" id="statusDropdown">
                <div class="dropdown-trigger">
                    <button type="button" class="button is-small" id="statusDropdownButton"
                            aria-haspopup="true" aria-controls="statusDropdownMenu">
                        <span th:text="#{orders.status.filter.title}"></span>
                        <span class="tag is-info ml-2" th:if="${!#lists.isEmpty(selectedStatuses)}"
                              th:text="${#lists.size(selectedStatuses)}"></span>
                        <span class="icon is-small"><i class="fas fa-angle-down"></i></span>
                    </button>
                </div>
                <div class="dropdown-menu" id="statusDropdownMenu" role="menu" style="min-width: 16rem;">
                    <div class="dropdown-content">
                        <label class="dropdown-item checkbox" th:each="status : ${statuses}">
                            <input type="checkbox" class="status-option" th:value="${status.name()}"
                                   th:checked="${#lists.contains(selectedStatuses, status.name())}"/>
                            <span class="ml-1" th:text="${enumI18n.localize(status)}"></span>
                            <span class="has-text-grey" th:if="${itemCountsByStatus.get(status) != null}"
                                  th:text="' (' + ${itemCountsByStatus.get(status)} + ')'"></span>
                            <span class="has-text-grey" th:if="${itemCountsByStatus.get(status) == null}"> (0)</span>
                        </label>
                        <hr class="dropdown-divider"/>
                        <div class="dropdown-item is-flex">
                            <button type="button" class="button is-small is-primary mr-2" id="applyStatuses"
                                    th:text="#{orders.status.filter.apply}"></button>
                            <button type="button" class="button is-small" id="clearStatuses"
                                    th:text="#{orders.status.filter.clear}"></button>
                        </div>
                    </div>
                </div>
            </div>

            <a class="button is-small mr-2"
               th:classappend="${selectedFilterId == null} ? 'is-link' : 'is-link is-light'"
               href="/dashboard/orders"
               th:text="#{orders.filters.all}"></a>

            <a th:each="saved : ${savedFilters}" class="button is-small mr-2"
               th:classappend="${saved.id == selectedFilterId} ? 'is-link' : 'is-link is-light'"
               th:href="${saved.id == selectedFilterId}
                            ? @{/dashboard/orders}
                            : @{/dashboard/orders(filterId=${saved.id})}"
               th:title="${saved.id == selectedFilterId} ? #{orders.filters.turn.off} : #{orders.filters.turn.on}"
               th:text="${saved.label}"></a>

            <span class="has-text-grey is-size-7 mr-2" th:if="${#lists.isEmpty(savedFilters)}"
                  th:text="#{orders.filters.empty}"></span>

            <div class="is-flex ml-auto">
                <button type="button" class="button is-small mr-2" onclick="toggleOrderFiltersModal(true)">
                    <span class="icon is-small"><i class="fas fa-sliders-h"></i></span>
                    <span th:text="#{orders.filters.manage}"></span>
                </button>
                <form method="post" action="/dashboard/orders/new/pos">
                    <button type="submit" class="button is-small is-success">
                        <span class="icon is-small"><i class="fas fa-cash-register"></i></span>
                        <span th:text="#{orders.new.pos.button}">New POS sale</span>
                    </button>
                </form>
            </div>
        </div>
    </div>

    <div id="orderFiltersModal" class="modal">
        <div class="modal-background" onclick="toggleOrderFiltersModal(false)"></div>
        <div class="modal-card">
            <header class="modal-card-head">
                <p class="modal-card-title" th:text="#{orders.filters.title}"></p>
                <button type="button" class="delete" aria-label="close" onclick="toggleOrderFiltersModal(false)"></button>
            </header>

            <section class="modal-card-body">
                <div id="savedFiltersPane">
                    <table class="table is-fullwidth is-narrow is-hoverable" th:if="${!#lists.isEmpty(savedFilters)}">
                        <tbody>
                        <tr th:each="saved : ${savedFilters}">
                            <td class="is-vcentered" th:text="${saved.label}"></td>
                            <td class="is-vcentered">
                                <span class="tag is-light" th:if="${saved.sharedWithStore}"
                                      th:text="#{orders.filters.scope.store}"></span>
                                <span class="tag is-light" th:unless="${saved.sharedWithStore}"
                                      th:text="#{orders.filters.scope.private}"></span>
                            </td>
                            <td class="is-vcentered">
                                <div class="is-flex is-justify-content-flex-end"
                                     th:if="${!saved.sharedWithStore or canManageStoreFilters}">
                                    <button type="button" class="button is-small edit-filter mr-2"
                                            th:title="#{orders.filters.edit}"
                                            th:data-filter-id="${saved.id}"
                                            th:data-label="${saved.label}"
                                            th:data-conditions="${saved.conditionsByField}"
                                            th:data-shared="${saved.sharedWithStore}">
                                        <span class="icon is-small"><i class="fas fa-pencil-alt"></i></span>
                                    </button>
                                    <form method="post" action="/dashboard/orders/filters/delete">
                                        <input type="hidden" name="filterId" th:value="${saved.id}"/>
                                        <input type="hidden" name="activeFilterId" th:value="${selectedFilterId}"/>
                                        <button type="submit" class="button is-small is-danger is-light"
                                                th:title="#{orders.filters.delete}">
                                            <span class="icon is-small"><i class="fas fa-trash"></i></span>
                                        </button>
                                    </form>
                                </div>
                            </td>
                        </tr>
                        </tbody>
                    </table>

                    <p class="has-text-grey is-size-7" th:if="${#lists.isEmpty(savedFilters)}"
                       th:text="#{orders.filters.empty}"></p>

                    <button type="button" class="button is-small is-primary mt-3" id="newFilterButton">
                        <span class="icon is-small"><i class="fas fa-plus"></i></span>
                        <span th:text="#{orders.filters.new}"></span>
                    </button>
                </div>

                <form method="post" action="/dashboard/orders/filters" id="filterForm" style="display: none;">
                    <input type="hidden" name="filterId" id="filterIdField"/>
                    <input type="hidden" name="activeFilterId" th:value="${selectedFilterId}"/>

                    <div class="field">
                        <label class="label is-small" th:text="#{orders.filters.name}"></label>
                        <div class="control">
                            <input class="input is-small" type="text" name="label" required/>
                        </div>
                    </div>

                    <div class="columns is-multiline">
                        <div class="column is-half">
                            <label class="label is-small" th:text="#{orders.filters.field.shipping.due}"></label>
                            <div class="select is-small is-fullwidth">
                                <select name="shippingDue">
                                    <option value="" th:text="#{orders.filters.any}"></option>
                                    <option th:each="due : ${shippingDueOptions}" th:value="${due.name()}"
                                            th:text="${enumI18n.localize(due)}"></option>
                                </select>
                            </div>
                        </div>
                        <div class="column is-half">
                            <label class="label is-small" th:text="#{orders.filters.field.shipment.type}"></label>
                            <div class="select is-small is-fullwidth">
                                <select name="shipmentType">
                                    <option value="" th:text="#{orders.filters.any}"></option>
                                    <option th:each="type : ${shipmentTypes}" th:value="${type.name()}"
                                            th:text="${enumI18n.localize(type)}"></option>
                                </select>
                            </div>
                        </div>
                        <div class="column is-half">
                            <label class="label is-small" th:text="#{orders.filters.field.payment.source}"></label>
                            <div class="select is-small is-fullwidth">
                                <select name="paymentSource">
                                    <option value="" th:text="#{orders.filters.any}"></option>
                                    <option th:each="source : ${paymentSources}" th:value="${source.name()}"
                                            th:text="${enumI18n.localize(source)}"></option>
                                </select>
                            </div>
                        </div>
                        <div class="column is-half">
                            <label class="label is-small" th:text="#{orders.filters.field.status}"></label>
                            <div class="select is-small is-fullwidth">
                                <select name="status">
                                    <option value="" th:text="#{orders.filters.any}"></option>
                                    <option th:each="status : ${statuses}" th:value="${status.name()}"
                                            th:text="${enumI18n.localize(status)}"></option>
                                </select>
                            </div>
                        </div>
                        <div class="column is-half">
                            <label class="label is-small" th:text="#{orders.filters.field.marketplace}"></label>
                            <div class="select is-small is-fullwidth" th:if="${!#lists.isEmpty(marketplaces)}">
                                <select name="sourceName">
                                    <option value="" th:text="#{orders.filters.any}"></option>
                                    <option th:each="marketplace : ${marketplaces}" th:value="${marketplace}"
                                            th:text="${marketplace}"></option>
                                </select>
                            </div>
                            <p class="has-text-grey is-size-7" th:if="${#lists.isEmpty(marketplaces)}"
                               th:text="#{orders.filters.marketplaces.empty}"></p>
                        </div>
                        <div class="column is-half">
                            <label class="label is-small" th:text="#{orders.filters.field.postal.code}"></label>
                            <div class="control">
                                <input class="input is-small" type="text" name="shippingPostalCode" placeholder="00-9"/>
                            </div>
                        </div>
                    </div>

                    <div class="field" th:if="${canManageStoreFilters}">
                        <label class="checkbox is-size-7">
                            <input type="checkbox" name="sharedWithStore" value="true"/>
                            <span th:text="#{orders.filters.share}"></span>
                        </label>
                    </div>

                    <div class="field is-grouped">
                        <div class="control">
                            <button type="submit" class="button is-small is-primary" th:text="#{orders.filters.save}"></button>
                        </div>
                        <div class="control">
                            <button type="button" class="button is-small" id="backToFiltersList"
                                    th:text="#{orders.filters.back}"></button>
                        </div>
                    </div>
                </form>
            </section>

            <footer class="modal-card-foot">
                <button type="button" class="button is-small" onclick="toggleOrderFiltersModal(false)"
                        th:text="#{orders.filters.close}"></button>
            </footer>
        </div>
    </div>

    <!-- Sections for each order status -->
    <th:block th:if="${!#lists.isEmpty(ordersByStatus.get(NewStatus))}">
        <div th:replace="~{fragments/ordersListFragment :: box('Nowe', ${ordersByStatus.get(NewStatus)})}"></div>
    </th:block>

    <th:block th:if="${!#lists.isEmpty(ordersByStatus.get(AssemblyStatus))}">
        <div th:replace="~{fragments/ordersListFragment :: box('W trakcie kompletowania', ${ordersByStatus.get(AssemblyStatus)})}"></div>
    </th:block>

    <th:block th:if="${!#lists.isEmpty(ordersByStatus.get(AssembledStatus))}">
        <div th:replace="~{fragments/ordersListFragment :: box('Gotowe do realizacji', ${ordersByStatus.get(AssembledStatus)})}"></div>
    </th:block>

    <th:block th:if="${!#lists.isEmpty(ordersByStatus.get(BlockedStatus))}">
        <div th:replace="~{fragments/ordersListFragment :: box('Zablokowane', ${ordersByStatus.get(BlockedStatus)})}"></div>
    </th:block>

    <th:block th:if="${!#lists.isEmpty(ordersByStatus.get(RealizationStatus))}">
        <div th:replace="~{fragments/ordersListFragment :: box('W realizacji', ${ordersByStatus.get(RealizationStatus)})}"></div>
    </th:block>

    <th:block th:if="${!#lists.isEmpty(ordersByStatus.get(PackagingStatus))}">
        <div th:replace="~{fragments/ordersListFragment :: box('W trakcie pakowania', ${ordersByStatus.get(PackagingStatus)})}"></div>
    </th:block>

    <th:block th:if="${!#lists.isEmpty(ordersByStatus.get(ShippingStatus))}">
        <div th:replace="~{fragments/ordersListFragment :: box('W dostawie', ${ordersByStatus.get(ShippingStatus)})}"></div>
    </th:block>

    <th:block th:if="${!#lists.isEmpty(ordersByStatus.get(DeliveredStatus))}">
        <div th:replace="~{fragments/ordersListFragment :: box('Dostarczone', ${ordersByStatus.get(DeliveredStatus)})}"></div>
    </th:block>

    <script th:inline="javascript">
        const selectedFilterId = /*[[${selectedFilterId}]]*/ null;

        function navigateWithStatuses(statuses) {
            const params = new URLSearchParams();
            statuses.forEach(status => params.append('statuses', status));
            if (statuses.length === 0) {
                params.append('showAll', 'true');
            }
            if (selectedFilterId) {
                params.append('filterId', selectedFilterId);
            }
            window.location.href = '/dashboard/orders?' + params.toString();
        }

        const statusDropdown = document.getElementById('statusDropdown');

        document.getElementById('statusDropdownButton').addEventListener('click', function(event) {
            event.stopPropagation();
            statusDropdown.classList.toggle('is-active');
        });

        document.getElementById('statusDropdownMenu').addEventListener('click', function(event) {
            event.stopPropagation();
        });

        document.addEventListener('click', function() {
            statusDropdown.classList.remove('is-active');
        });

        document.getElementById('applyStatuses').addEventListener('click', function() {
            navigateWithStatuses([...document.querySelectorAll('.status-option:checked')].map(box => box.value));
        });

        document.getElementById('clearStatuses').addEventListener('click', function() {
            navigateWithStatuses([]);
        });

        const filtersModal = document.getElementById('orderFiltersModal');
        const savedFiltersPane = document.getElementById('savedFiltersPane');
        const filterForm = document.getElementById('filterForm');
        const filterIdField = document.getElementById('filterIdField');

        function toggleOrderFiltersModal(open) {
            filtersModal.classList.toggle('is-active', open);
            if (open) {
                showSavedFiltersPane();
            }
        }

        function showSavedFiltersPane() {
            savedFiltersPane.style.display = 'block';
            filterForm.style.display = 'none';
        }

        function showFilterForm(creating) {
            filterForm.action = creating ? '/dashboard/orders/filters' : '/dashboard/orders/filters/update';
            savedFiltersPane.style.display = 'none';
            filterForm.style.display = 'block';
        }

        function selectOption(select, value) {
            const match = Array.from(select.options)
                    .find(option => option.value.toUpperCase() === value.toUpperCase());
            if (match) {
                select.value = match.value;
                return;
            }
            const missing = new Option(value, value, true, true);
            select.add(missing);
        }

        document.getElementById('newFilterButton').addEventListener('click', function() {
            filterForm.reset();
            filterIdField.value = '';
            showFilterForm(true);
        });

        document.getElementById('backToFiltersList').addEventListener('click', showSavedFiltersPane);

        document.querySelectorAll('.edit-filter').forEach(button => {
            button.addEventListener('click', function() {
                filterForm.reset();
                filterIdField.value = this.getAttribute('data-filter-id');
                filterForm.elements['label'].value = this.getAttribute('data-label');

                const shared = filterForm.elements['sharedWithStore'];
                if (shared) {
                    shared.checked = this.getAttribute('data-shared') === 'true';
                }

                const conditions = this.getAttribute('data-conditions') || '';
                conditions.replace(/[{}]/g, '').split(',').forEach(pair => {
                    const [field, value] = pair.split('=').map(part => part && part.trim());
                    if (!field || !value) {
                        return;
                    }
                    const input = filterForm.elements[field.charAt(0).toLowerCase() + field.slice(1)];
                    if (!input) {
                        return;
                    }
                    if (input.tagName === 'SELECT') {
                        selectOption(input, value);
                    } else {
                        input.value = value;
                    }
                });

                showFilterForm(false);
            });
        });

        if (/*[[${openFilters}]]*/ false) {
            toggleOrderFiltersModal(true);
        }
    </script>

</div>

</body>
</html>
