<!DOCTYPE HTML>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}">
<body>

<div layout:fragment="content">
<section class="cl-page">
    <div class="cl-page-body is-wide">

        <header class="cl-page-header">
            <div class="cl-page-header-row">
                <h1 class="cl-page-title" th:text="#{warehouse.page.title}"></h1>
                <button th:replace="~{fragments/screen-intro :: toggle}"></button>
                <div class="cl-page-actions">
                    <a th:if="${page.admin() and restock != null}" class="cl-button" th:href="@{/dashboard/warehouse/restock}"
                       data-cl-dialog-open="warehouse-restock">
                        <span class="icon is-small" aria-hidden="true"><i class="fas fa-sync-alt"></i></span>
                        <span th:text="#{warehouse.action.restock}"></span>
                    </a>
                    <a class="cl-button is-primary" th:href="@{/dashboard/warehouse/items/new}">
                        <span class="icon is-small" aria-hidden="true"><i class="fas fa-plus"></i></span>
                        <span th:text="#{warehouse.action.add.item}"></span>
                    </a>
                </div>
            </div>
            <p class="cl-page-lead" th:text="#{warehouse.page.lead}"></p>
        </header>

        <div th:replace="~{fragments/screen-intro :: panel('warehouse', 'fas fa-warehouse')}"></div>
        <th:block th:replace="~{fragments/settings-form :: savedAlert}"></th:block>
        <div th:if="${page.wms()}" class="cl-alert is-info" role="status">
            <i class="fas fa-info-circle cl-alert-icon" aria-hidden="true"></i>
            <p class="cl-alert-text" th:text="#{warehouse.external.wms.info}"></p>
        </div>

        <div data-cl-list-results data-cl-list-path="/dashboard/warehouse" data-cl-list-fragment="/dashboard/warehouse/list"
             th:fragment="results" th:with="q=${page.query()}">

            <ul class="cl-stat-grid is-orders" th:attr="aria-label=#{warehouse.tiles.label}">
                <li th:each="tile : ${page.tiles()}">
                    <a class="cl-stat is-link" th:href="@{${tile.href()}}"
                       th:attr="aria-current=${tile.active()} ? 'true' : null" data-cl-list-nav>
                        <span class="cl-eyebrow" th:text="${tile.label()}"></span>
                        <span class="cl-stat-value" th:text="${tile.value()}"></span>
                        <span class="cl-stat-hint" th:text="${tile.hint()}"></span>
                        <span class="cl-visually-hidden" th:if="${tile.active()}" th:text="#{warehouse.tile.active}"></span>
                    </a>
                </li>
            </ul>

            <section class="cl-card" aria-labelledby="warehouse-table-title">
                <h2 class="cl-visually-hidden" id="warehouse-table-title" th:text="#{warehouse.list.table.title}"></h2>

                <div class="cl-table-toolbar" th:unless="${page.storeEmpty()}">
                    <div class="cl-toolbar-filters" id="warehouse-filters">
                        <details class="cl-filter-menu" data-cl-filter-menu="statuses">
                            <summary class="cl-filter-menu-trigger">
                                <span class="cl-filter-menu-key" th:text="#{warehouse.list.status.menu}"></span>
                                <span class="cl-filter-menu-value" th:text="${page.statusSummary()}"></span>
                            </summary>
                            <form method="get" th:action="@{/dashboard/warehouse}" class="cl-filter-menu-panel" data-cl-list-form data-cl-autosubmit>
                                <th:block th:replace="~{fragments/warehouse-list :: hidden('statuses')}"></th:block>
                                <input type="hidden" th:name="${T(pl.commercelink.warehouse.builtin.WarehouseListQuery).STATUS_MENU}" value="1"/>
                                <th:block th:replace="~{fragments/deliveries-list :: checks('statuses', null, ${page.statusOptions()})}"></th:block>
                                <div class="cl-filter-menu-actions">
                                    <button type="submit" class="cl-button is-primary" data-cl-autosubmit-hide th:text="#{warehouse.list.menu.apply}"></button>
                                </div>
                            </form>
                        </details>
                        <details class="cl-filter-menu" data-cl-filter-menu="categories">
                            <summary class="cl-filter-menu-trigger">
                                <span class="cl-filter-menu-key" th:text="#{warehouse.list.category.menu}"></span>
                                <span class="cl-filter-menu-value" th:text="${page.categorySummary()}"></span>
                            </summary>
                            <form method="get" th:action="@{/dashboard/warehouse}" class="cl-filter-menu-panel" data-cl-list-form data-cl-autosubmit>
                                <th:block th:replace="~{fragments/warehouse-list :: hidden('categories')}"></th:block>
                                <th:block th:replace="~{fragments/deliveries-list :: checks('categories', null, ${page.categoryOptions()})}"></th:block>
                                <div class="cl-filter-menu-actions">
                                    <button type="submit" class="cl-button is-primary" data-cl-autosubmit-hide th:text="#{warehouse.list.menu.apply}"></button>
                                </div>
                            </form>
                        </details>
                        <a th:if="${q.isFiltered()}" class="cl-link-button cl-toolbar-clear" th:href="@{${q.cleared().href()}}"
                           th:text="#{general.clear.filters}" data-cl-list-nav></a>
                    </div>
                    <div class="cl-toolbar-search">
                        <form method="get" th:action="@{/dashboard/warehouse}" class="cl-search-form" role="search" data-cl-list-form>
                            <th:block th:replace="~{fragments/warehouse-list :: hidden('search')}"></th:block>
                            <label class="cl-visually-hidden" for="warehouse-search" th:text="#{warehouse.list.search.label}"></label>
                            <div class="cl-search-field">
                                <span class="cl-search-icon icon is-small" aria-hidden="true"><i class="fas fa-search"></i></span>
                                <input class="cl-input cl-table-search" type="search" id="warehouse-search" name="q" autocomplete="off"
                                       th:value="${q.q()}" th:attr="placeholder=#{warehouse.list.search.placeholder}, data-cl-search-had=${q.q() != null}"/>
                                <a th:if="${q.q() != null}" class="cl-search-clear" th:href="@{${q.withQ(null).href()}}"
                                   th:attr="aria-label=#{warehouse.list.search.clear}" data-cl-list-nav>
                                    <i class="fas fa-times" aria-hidden="true"></i>
                                </a>
                            </div>
                            <button type="submit" class="cl-button is-primary cl-search-submit" th:attr="aria-label=#{general.search}">
                                <span class="icon is-small cl-search-submit-icon" aria-hidden="true"><i class="fas fa-search"></i></span>
                                <span class="cl-search-submit-text" th:text="#{general.search}"></span>
                            </button>
                        </form>
                        <button type="button" class="cl-button cl-toolbar-toggle" data-cl-toolbar-toggle aria-controls="warehouse-filters" aria-expanded="true">
                            <i class="fas fa-sliders-h" aria-hidden="true"></i><span class="cl-toolbar-toggle-label"><span th:text="#{warehouse.list.filters}"></span><th:block th:if="${page.activeFilterCount() > 0}" th:text="|: ${page.activeFilterCount()}|"></th:block></span>
                        </button>
                    </div>
                </div>

                <div class="cl-list-meta is-warehouse" th:unless="${page.storeEmpty()}">
                    <div class="cl-filter-chips" th:if="${!page.chips().isEmpty()}">
                        <span class="cl-filter-chip" th:each="chip : ${page.chips()}">
                            <span th:text="${chip.label()}"></span>
                            <a class="cl-filter-chip-clear" th:href="@{${chip.clearHref()}}" th:attr="aria-label=${chip.clearLabel()}"
                               data-cl-list-nav><span aria-hidden="true">×</span></a>
                        </span>
                    </div>
                    <p class="cl-table-results" role="status"
                       th:text="${page.resultsLine()}"></p>
                </div>

                <th:block th:unless="${page.rows().isEmpty()}">
                    <form id="warehouse-bulk-form" method="post" th:action="@{/dashboard/warehouse}" hidden></form>
                    <p class="cl-visually-hidden" role="status" data-cl-selection-status></p>
                    <div class="cl-selection-row" data-cl-selection-bar hidden>
                        <label class="cl-check-target"><input class="cl-check-input" type="checkbox" data-cl-select-all
                               th:attr="aria-label=#{warehouse.selection.selectAll}, data-cl-label-select=#{warehouse.selection.selectAll}, data-cl-label-clear=#{warehouse.selection.clearAll}"></label>
                        <span class="cl-selection-count" data-cl-selection-count th:attr="data-template=#{warehouse.selection.count('{k}', '{n}')}"></span>
                        <span class="cl-selection-count" data-cl-selection-units th:attr="data-template=#{warehouse.selection.units('{m}')}"></span>
                        <div class="cl-selection-actions" data-cl-selection-actions th:attr="data-reason-source=#{warehouse.bulk.reason.source}">
                            <details class="cl-menu">
                                <summary class="cl-button"><span th:text="#{warehouse.bulk.menu}"></span>
                                    <span class="icon is-small" aria-hidden="true"><i class="fas fa-chevron-down"></i></span></summary>
                                <ul class="cl-menu-list">
                                    <li th:each="a : ${page.menuActions()}">
                                        <button type="button" class="cl-menu-item" th:replace="~{fragments/warehouse-list :: action(${a}, 'cl-menu-item')}"></button>
                                    </li>
                                </ul>
                            </details>
                            <span class="cl-help cl-selection-reason" id="warehouse-destroy-reason" hidden></span>
                            <button th:replace="~{fragments/warehouse-list :: action(${page.destroyAction()}, 'cl-link-button is-danger cl-selection-remove')}"></button>
                        </div>
                    </div>

                    <nav class="cl-table-sortbar" th:attr="aria-label=#{warehouse.list.sort.label}">
                        <span class="cl-eyebrow" th:text="#{warehouse.list.sort.label}"></span>
                        <a class="cl-tab" th:each="s : ${T(pl.commercelink.warehouse.builtin.WarehouseListQuery.Sort).values()}"
                           th:with="h=${page.sortHeaders().get(s)}" th:href="@{${h.href()}}"
                           th:attr="aria-current=${h.ariaSort() != 'none'} ? 'page' : null" data-cl-list-nav>
                            <span th:text="#{|warehouse.list.sort.${s.param()}|}"></span>
                            <span th:if="${h.ariaSort() != 'none'}" aria-hidden="true" th:text="${h.ariaSort() == 'ascending'} ? '▲' : '▼'"></span>
                        </a>
                    </nav>

                    <table class="cl-table is-warehouse" data-cl-select-table="true">
                        <caption class="cl-visually-hidden" th:text="#{warehouse.list.caption}"></caption>
                        <colgroup>
                            <col class="cl-col-check"><col><col class="cl-col-category"><col class="cl-col-qty"><col class="cl-col-cost">
                            <col class="cl-col-delivery is-secondary-column"><col class="cl-col-status">
                        </colgroup>
                        <thead>
                        <tr>
                            <th scope="col" class="cl-table-check"><label class="cl-check-target"><input class="cl-check-input" type="checkbox" data-cl-select-all hidden
                                   th:attr="aria-label=#{warehouse.selection.selectAll}, data-cl-label-select=#{warehouse.selection.selectAll}, data-cl-label-clear=#{warehouse.selection.clearAll}"></label></th>
                            <th scope="col" th:replace="~{fragments/warehouse-list :: sortHead('NAME', 'warehouse.list.column.product', '')}"></th>
                            <th scope="col" th:replace="~{fragments/warehouse-list :: sortHead('CATEGORY', 'warehouse.list.column.category', '')}"></th>
                            <th scope="col" th:replace="~{fragments/warehouse-list :: sortHead('QTY', 'warehouse.list.column.qty', 'is-numeric')}"></th>
                            <th scope="col" th:replace="~{fragments/warehouse-list :: sortHead('COST', 'warehouse.list.column.cost', 'is-numeric')}"></th>
                            <th scope="col" class="is-secondary-column" th:text="#{warehouse.list.column.delivery}"></th>
                            <th scope="col" th:replace="~{fragments/warehouse-list :: sortHead('STATUS', 'warehouse.list.column.status', '')}"></th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr th:each="row : ${page.rows()}">
                            <td class="cl-table-check">
                                <label class="cl-check-target" th:if="${row.selectable()}">
                                    <input class="cl-check-input" type="checkbox" data-cl-select-row hidden th:value="${row.itemId()}"
                                           th:attr="data-status=${row.status()}, data-qty=${row.qty()}, data-source=${row.source()},
                                                    data-name=${row.name()}, data-status-label=${row.statusLabel()},
                                                    aria-label=#{warehouse.row.select(${row.name()})}">
                                </label>
                            </td>
                            <th scope="row" class="cl-table-key" th:attr="data-label=#{warehouse.list.column.product}">
                                <a th:href="@{${row.href()}}" th:text="${row.name()}"></a>
                                <span class="cl-table-sub" th:if="${!#strings.isEmpty(row.codes())}"><span class="cl-table-code" th:text="${row.codes()}"></span></span>
                                <span class="cl-table-pills" th:if="${row.conditionLabel() != null}"><span class="cl-status" th:classappend="${row.conditionTone()}" th:text="${row.conditionLabel()}"></span></span>
                                <span class="cl-table-sub cl-table-note" th:if="${row.comment() != null}" th:title="${row.comment()}" th:text="${row.comment()}"></span>
                            </th>
                            <td class="is-hyphenated" th:attr="data-label=#{warehouse.list.column.category}"><span th:classappend="${row.uncategorized()} ? 'cl-muted' : ''" th:text="${row.categoryLabel()}"></span></td>
                            <td class="is-numeric" th:attr="data-label=#{warehouse.list.column.qty}" th:text="${row.qty()}"></td>
                            <td class="is-numeric" th:attr="data-label=#{warehouse.list.column.cost}">
                                <span class="cl-cell-stack">
                                    <span th:text="${row.costNet()}"></span>
                                    <span class="cl-table-sub" th:text="${row.costGross()}"></span>
                                    <span class="cl-table-pills" th:if="${row.systemCost() != null}"><span class="cl-status is-info" th:title="${row.systemCostTitle()}" th:text="${row.systemCost()}"></span></span>
                                </span>
                            </td>
                            <td class="is-secondary-column" th:attr="data-label=#{warehouse.list.column.delivery}">
                                <span class="cl-cell-stack">
                                    <a th:if="${row.deliveryHref() != null}" th:href="@{${row.deliveryHref()}}" th:text="${row.deliveryNumber()}"></a>
                                    <span th:unless="${row.deliveryHref() != null}" class="cl-muted" th:text="#{warehouse.row.delivery.none}"></span>
                                    <span class="cl-table-sub" th:if="${row.supplier() != null}" th:text="${row.supplier()}"></span>
                                    <span class="cl-table-sub" th:if="${row.serialNo() != null}" th:text="${row.serialNo()}"></span>
                                </span>
                            </td>
                            <td th:attr="data-label=#{warehouse.list.column.status}"><span class="cl-status" th:classappend="${row.statusTone()}" th:text="${row.statusLabel()}"></span></td>
                        </tr>
                        </tbody>
                    </table>
                </th:block>

                <div class="cl-list-empty" th:if="${page.emptyState() != null}" th:with="es=${page.emptyState()}">
                    <span th:text="${es.text()}"></span>
                    <a th:if="${es.actionHref() != null}" th:class="${page.storeEmpty()} ? 'cl-button is-primary' : 'cl-link-button'"
                       th:href="@{${es.actionHref()}}" th:text="${es.actionLabel()}" th:attr="data-cl-list-nav=${page.storeEmpty()} ? null : ''"></a>
                </div>
                <div th:replace="~{fragments/pagination :: pages(${page.pagination()})}"></div>
                <div class="cl-card-desc cl-card-note" th:if="${page.destroyedCount() > 0}">
                    <a class="cl-link-button" th:href="@{/dashboard/warehouse/items/destroyed}" th:text="|#{warehouse.list.destroyed.link(${page.destroyedCount()})} ›|"></a>
                </div>
            </section>

            <dialog class="cl-dialog is-form" id="cl-quantity-dialog" aria-labelledby="cl-quantity-title" th:unless="${page.rows().isEmpty()}">
                <form method="post" th:action="@{/dashboard/warehouse}" data-cl-quantity-form novalidate>
                    <h2 class="cl-dialog-title" id="cl-quantity-title" data-cl-quantity-title th:attr="data-template=#{warehouse.bulk.dialog.title('{label}', '{k}')}"></h2>
                    <div class="cl-dialog-body">
                        <table class="cl-table is-compact cl-quantity-table">
                            <caption class="cl-visually-hidden" th:text="#{warehouse.bulk.dialog.qty}"></caption>
                            <thead><tr><th scope="col" th:text="#{warehouse.bulk.dialog.item}"></th><th scope="col" class="is-numeric" th:text="#{warehouse.bulk.dialog.qty}"></th></tr></thead>
                            <tbody data-cl-quantity-rows></tbody>
                        </table>
                        <template data-cl-quantity-row>
                            <tr>
                                <th scope="row" class="cl-table-key"><span data-name></span><span class="cl-table-sub" data-meta></span></th>
                                <td class="is-numeric">
                                    <input type="hidden" name="selectedItemIds">
                                    <input class="cl-input is-qty" type="number" name="quantities" min="1" required>
                                    <p class="cl-field-error" hidden></p>
                                </td>
                            </tr>
                        </template>
                        <div class="cl-form-grid" data-cl-quantity-destroy hidden>
                            <div class="cl-span-6 cl-field">
                                <label class="cl-label" for="destroy-reason" th:text="#{warehouse.bulk.destroy.reason}"></label>
                                <select class="cl-select" id="destroy-reason" name="reason" required disabled>
                                    <option th:each="r : ${page.destroyReasons()}" th:value="${r.value()}" th:text="${r.label()}"></option>
                                </select>
                            </div>
                            <div class="cl-span-6 cl-field">
                                <label class="cl-label" for="destroy-note" th:text="#{warehouse.bulk.destroy.note}"></label>
                                <textarea class="cl-textarea" id="destroy-note" name="note" rows="2" required disabled aria-describedby="destroy-note-help"></textarea>
                                <p class="cl-help" id="destroy-note-help" th:text="#{warehouse.bulk.destroy.note.help}"></p>
                                <p class="cl-field-error" hidden th:text="#{warehouse.bulk.destroy.note.required}"></p>
                            </div>
                        </div>
                        <p class="cl-dialog-effect" data-cl-quantity-effect
                           th:attr="data-effect-split=#{warehouse.bulk.dialog.effect.split}, data-effect-destroy=#{warehouse.bulk.dialog.effect.destroy},
                                    data-error-max=#{warehouse.bulk.dialog.max('{0}')}, data-error-min=#{warehouse.bulk.dialog.min}"></p>
                    </div>
                    <div class="cl-dialog-actions">
                        <button type="submit" class="cl-button is-primary" data-cl-quantity-submit></button>
                        <button type="button" class="cl-button" data-cl-dialog-close th:text="#{general.cancel}"></button>
                    </div>
                </form>
            </dialog>
        </div>

        <noscript><p class="cl-help" th:text="#{warehouse.list.noscript}"></p></noscript>
        <div th:replace="~{fragments/confirm-dialog :: dialog}"></div>
        <dialog th:if="${restock != null}" class="cl-dialog is-form" id="warehouse-restock" aria-labelledby="restock-title">
            <form method="post" th:action="@{/dashboard/warehouse/restock}">
                <h2 class="cl-dialog-title" id="restock-title" th:text="#{warehouse.restock.title}"></h2>
                <div class="cl-dialog-body">
                    <p class="cl-dialog-message" th:text="#{warehouse.restock.lead}"></p>
                    <th:block th:replace="~{fragments/warehouse-restock :: fields}"></th:block>
                </div>
                <div class="cl-dialog-actions">
                    <button type="submit" class="cl-button is-primary" th:text="#{warehouse.restock.submit}"></button>
                    <button type="button" class="cl-button" data-cl-dialog-close th:text="#{general.cancel}"></button>
                </div>
            </form>
        </dialog>
    </div>
</section>

<script th:src="@{/js/list-page.js}" defer></script>
<script th:src="@{/js/menu.js}" defer></script>
<script th:src="@{/js/table-select.js}" defer></script>
<script th:src="@{/js/dialog.js}" defer></script>
<script th:src="@{/js/dependent-select.js}" defer></script>
<script th:src="@{/js/confirm-dialog.js}" defer></script>
<script th:src="@{/js/selection-actions.js}" defer></script>
</div>
</body>
</html>
