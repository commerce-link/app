<!DOCTYPE HTML>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}">
<body>

<div layout:fragment="content">
<section class="cl-page">
    <div class="cl-page-body is-form" th:fragment="body">

        <!--/* Inline rather than settings-header :: subpageWithActions: that fragment is a div, because a header element in
               settings-header.html would also be selected by its "header" fragment. */-->
        <header class="cl-page-header">
            <a class="cl-back" th:href="@{/dashboard/warehouse}">
                <span class="icon is-small" aria-hidden="true"><i class="fas fa-chevron-left"></i></span>
                <span th:text="#{nav.warehouse}"></span>
            </a>
            <div class="cl-page-header-row">
                <h1 class="cl-page-title" th:text="#{warehouse.restock.title}"></h1>
            </div>
            <p class="cl-page-lead" th:text="#{warehouse.restock.lead}"></p>
        </header>


        <form class="cl-form" method="post" th:action="@{/dashboard/warehouse/restock}" data-cl-submit-once>
            <!--/* th:replace runs before th:if, so the guard is on a block around it */-->
            <th:block th:if="${restock.error() != null}">
                <div th:replace="~{fragments/settings-form :: errorSummaryTextTitled('restock-errors', ${ {'restock-catalog': restock.error()} }, 'form.errors.title.neutral')}"></div>
            </th:block>
            <div class="cl-card">
                <fieldset class="cl-fieldset">
                    <legend class="cl-visually-hidden" th:text="#{warehouse.restock.params}"></legend>
                    <th:block th:replace="~{fragments/warehouse-restock :: fields}"></th:block>
                </fieldset>
                <div class="cl-card-footer">
                    <button class="cl-button is-primary" type="submit" th:text="#{warehouse.restock.submit}"></button>
                    <a class="cl-button" th:href="@{/dashboard/warehouse}" th:text="#{general.cancel}"></a>
                </div>
            </div>
        </form>

    </div>
</section>
<script th:src="@{/js/error-summary.js}" defer></script>
<script th:src="@{/js/dependent-select.js}" defer></script>
<script th:src="@{/js/submit-once.js}" defer></script>
</div>
</body>
</html>
