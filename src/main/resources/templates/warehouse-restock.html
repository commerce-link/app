<!DOCTYPE HTML>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}">
<body>

<div layout:fragment="content">
<section class="cl-page">
    <div class="cl-page-body is-wide">

        <div th:replace="~{fragments/settings-header :: subpageWithActions('/dashboard/warehouse', #{nav.warehouse}, #{warehouse.restock.title}, #{warehouse.restock.lead}, null)}"></div>

        <div th:if="${restock.error() != null}" class="cl-alert is-bad" role="status">
            <i class="fas fa-exclamation-circle cl-alert-icon" aria-hidden="true"></i>
            <p class="cl-alert-text" th:text="${restock.error()}"></p>
        </div>

        <form class="cl-form" method="post" th:action="@{/dashboard/warehouse/restock}" data-cl-submit-once>
            <div class="cl-card">
                <fieldset class="cl-fieldset">
                    <legend class="cl-visually-hidden" th:text="#{warehouse.restock.params}"></legend>
                    <th:block th:replace="~{fragments/warehouse-restock :: fields}"></th:block>
                </fieldset>
                <div class="cl-card-footer">
                    <button class="cl-button is-primary" type="submit" th:text="#{warehouse.restock.submit}"></button>
                    <a class="cl-button" th:href="@{/dashboard/warehouse}" th:text="#{general.cancel}"></a>
                </div>
            </div>
        </form>

    </div>
</section>
<script th:src="@{/js/dependent-select.js}" defer></script>
<script th:src="@{/js/submit-once.js}" defer></script>
</div>
</body>
</html>
