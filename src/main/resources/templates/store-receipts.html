<!DOCTYPE HTML>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}">
<body>
<div layout:fragment="content">
    <section class="cl-page">
        <div class="cl-page-body">
            <div th:replace="~{fragments/settings-header :: header(false, null)}"></div>
            <div th:replace="~{fragments/settings-form :: savedAlert}"></div>

            <div class="cl-stack">
                <!--/* The receipt system comes first: without it no e-receipt is issued, whatever is set below. It is a
                       status here, chosen and configured on its own page, so this page carries one form. */-->
                <section class="cl-card is-status" aria-labelledby="receipts-system-title"
                         th:with="status=${systemStatus}">
                    <div class="cl-card-head">
                        <h2 class="cl-card-title" id="receipts-system-title">
                            <i class="fas" th:classappend="${status.configured()} ? 'fa-check-circle is-ok' : 'fa-exclamation-triangle is-warn'"
                               aria-hidden="true"></i>
                            <span th:if="${status.configured()}" th:text="#{store.receipts.system.status.ok(${status.displayName()})}"></span>
                            <span th:unless="${status.chosen()}" th:text="#{store.receipts.system.none.title}"></span>
                            <span th:if="${status.chosen() and !status.installed()}"
                                  th:text="#{store.receipts.system.missing.title(${status.providerName()})}"></span>
                            <span th:if="${status.installed() and !status.configured()}"
                                  th:text="#{store.receipts.system.status.incomplete(${status.displayName()})}"></span>
                        </h2>
                        <div class="cl-list-actions">
                            <a class="cl-link-button" th:href="@{${systemHref}}"
                               th:text="${!status.chosen()} ? #{store.receipts.system.choose.action}
                                        : (${status.installed() and !status.configured()} ? #{store.receipts.system.complete} : #{store.receipts.system.change})"></a>
                            <a th:if="${status.chosen()}" class="cl-link-button is-danger" th:href="@{${disconnectHref}}"
                               data-cl-confirm th:text="#{store.receipts.system.disconnect}"
                               th:attr="data-cl-confirm-title=#{store.receipts.system.disconnect.title(${status.displayName()})},
                                        data-cl-confirm-message=#{store.receipts.system.disconnect.message},
                                        data-cl-confirm-action=#{store.receipts.system.disconnect.action}"></a>
                        </div>
                    </div>
                    <p class="cl-card-desc"
                       th:text="${status.configured()} ? #{store.receipts.system.status.ok.text}
                                : (${!status.chosen()} ? #{store.receipts.system.none.text}
                                : (${!status.installed()} ? #{store.receipts.system.missing.text} : #{store.receipts.system.incomplete.text}))"></p>
                </section>

                <form th:fragment="receiptsForm" id="receipts-form" class="cl-form is-wide"
                      th:action="@{${receiptsAction}}" th:object="${receiptsForm}" method="post" novalidate data-cl-async
                      th:attr="data-success-message=${savedMessage}, data-error-message=#{form.save.failed}">
                    <div th:replace="~{fragments/settings-form :: errorSummary('receipts-errors', ${receiptsErrors}, null)}"></div>
                    <div class="cl-card">
                        <fieldset class="cl-fieldset">
                            <legend class="cl-fieldset-title" th:text="#{store.receipts.automatic.title}"></legend>
                            <div th:replace="~{fragments/settings-form :: check('enabled', 'store.receipts.enabled.label', *{enabled}, 'store.receipts.enabled.description', null, ${receiptsErrors['enabled'] != null ? 'enabled-error' : null})}"></div>
                            <p th:if="${receiptsErrors['enabled'] != null}" class="cl-field-error" id="enabled-error">
                                <i class="fas fa-exclamation-circle" aria-hidden="true"></i>
                                <span th:text="#{${receiptsErrors['enabled']}}"></span>
                            </p>
                        </fieldset>
                        <div class="cl-card-footer">
                            <button class="cl-button is-primary" type="submit" th:text="#{form.save.changes}"></button>
                        </div>
                    </div>
                </form>
            </div>

            <dialog th:replace="~{fragments/confirm-dialog :: dialog}"></dialog>
        </div>
    </section>
    <script th:if="${!receiptsErrors.isEmpty()}">
        document.getElementById('receipts-errors').focus();
    </script>
    <script th:src="@{/js/async-form.js}" defer></script>
    <script th:src="@{/js/confirm-dialog.js}" defer></script>
</div>
</body>
</html>
