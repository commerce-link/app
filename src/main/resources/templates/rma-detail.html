<!DOCTYPE HTML>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}">
<body>
<div layout:fragment="content">
    <!--/* RMA details (RmaDetailPage): the record header, the work column (lock card of a closed RMA, items, shipments,
           files) and the side column (customer and settings, marketplace return, return address, history). Every form
           posting to /dashboard/rma/{id} carries the full field set (rma/detail/dialogs :: currentFields). */-->
    <section class="cl-page" th:fragment="body">
        <div class="cl-page-body is-wide">
            <div th:replace="~{rma/detail/header :: header}"></div>
            <div th:replace="~{rma/detail/parts :: notice('PAGE')}"></div>

            <div class="cl-layout-aside">
                <div class="cl-layout-main">
                    <section th:replace="~{rma/detail/parts :: closedStatus}"></section>
                    <section th:replace="~{rma/detail/items :: card}"></section>
                    <section th:replace="~{rma/detail/shipments :: card}"></section>
                    <section th:replace="~{rma/detail/media :: card}"></section>
                </div>
                <div class="cl-layout-side">
                    <section th:replace="~{rma/detail/side :: settings}"></section>
                    <section th:replace="~{rma/detail/side :: marketplace}"></section>
                    <section th:replace="~{rma/detail/side :: address}"></section>
                    <section th:replace="~{rma/detail/history :: card}"></section>
                </div>
            </div>

            <th:block th:replace="~{rma/detail/dialogs :: single}"></th:block>
            <th:block th:replace="~{rma/detail/shipments :: dialogs}"></th:block>
            <dialog th:replace="~{rma/detail/side :: addressDialog}"></dialog>
            <dialog th:replace="~{rma/detail/side :: resendDialog}"></dialog>
            <dialog th:replace="~{fragments/confirm-dialog :: dialog}"></dialog>
        </div>
    </section>
    <script th:src="@{/js/menu.js}" defer></script>
    <script th:src="@{/js/dialog.js}" defer></script>
    <script th:src="@{/js/collapse.js}" defer></script>
    <script th:src="@{/js/timeline.js}" defer></script>
    <script th:src="@{/js/table-select.js}" defer></script>
    <script th:src="@{/js/money.js}" defer></script>
    <script th:src="@{/js/copy-field.js}" defer></script>
    <script th:src="@{/js/confirm-dialog.js}" defer></script>
    <script th:src="@{/js/shipment-cancellation.js}" defer></script>
    <script th:src="@{/js/rma-detail.js}" defer></script>
</div>
</body>
</html>
