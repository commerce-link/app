<!DOCTYPE HTML>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{auth-layout}">
<head>
    <title th:text="#{registration.success.page-title}"></title>
</head>
<body>

<section class="cl-card" layout:fragment="content">
    <div class="cl-auth-body">
        <header class="cl-auth-head">
            <h1 class="cl-page-title" th:text="#{registration.success.title}"></h1>
            <p class="cl-page-lead" th:text="#{registration.success.created(${email})}"></p>
        </header>
        <div th:unless="${demoMode}" class="cl-alert is-info">
            <i class="fas fa-info-circle cl-alert-icon" aria-hidden="true"></i>
            <p class="cl-alert-text" th:text="#{registration.success.mfa-notice(${email})}"></p>
        </div>
    </div>
    <div class="cl-card-footer">
        <a class="cl-button is-primary" href="/login" th:text="#{registration.success.login}"></a>
    </div>
</section>

</body>
</html>
