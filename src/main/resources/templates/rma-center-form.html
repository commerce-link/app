<!DOCTYPE HTML>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}">
<body>
<div layout:fragment="content">
    <section class="cl-page">
        <div class="cl-page-body">
            <div th:replace="~{fragments/settings-header :: subpage(${centersHref}, ${backLabel}, ${pageTitle})}"></div>

            <form th:fragment="centerForm" id="rma-center-form" class="cl-form"
                  th:action="@{${formAction}}" th:object="${form}" method="post" novalidate data-cl-async
                  th:attr="data-cl-redirect=${redirectTo}, data-error-message=#{form.save.failed}">
                <div th:replace="~{fragments/settings-form :: errorSummary('rma-center-errors', ${errors}, null)}"></div>

                <div class="cl-card">
                    <fieldset class="cl-fieldset">
                        <legend class="cl-fieldset-title" th:text="#{rma.center.section.address}"></legend>
                        <div class="cl-form-grid">
                            <!--/* The supplier comes first: it is what the centre is found by when goods go back, and
                                   it is the row's title on the list. */-->
                            <div class="cl-span-3" th:insert="~{fragments/form-field :: select('provider', 'general.provider.name', *{provider}, ${providerOptions}, 'off', true, ${errors['provider']})}"></div>
                            <div class="cl-span-3" th:insert="~{fragments/settings-form :: textField('companyName', 'rma.center.companyName', *{companyName}, 'text', 'organization', true, ${errors['companyName']}, null)}"></div>
                            <div th:insert="~{fragments/settings-form :: textField('streetAndNumber', 'order.address.street', *{streetAndNumber}, 'text', 'street-address', true, ${errors['streetAndNumber']}, null)}"></div>
                            <div class="cl-span-2" th:insert="~{fragments/settings-form :: textField('postalCode', 'order.address.postal', *{postalCode}, 'text', 'postal-code', true, ${errors['postalCode']}, null)}"></div>
                            <div class="cl-span-2" th:insert="~{fragments/settings-form :: textField('city', 'order.address.city', *{city}, 'text', 'address-level2', true, ${errors['city']}, null)}"></div>
                            <div class="cl-span-2" th:insert="~{fragments/form-field :: select('country', 'order.address.country', *{country}, ${countries}, 'country', true, ${errors['country']})}"></div>
                        </div>
                    </fieldset>
                    <fieldset class="cl-fieldset">
                        <legend class="cl-fieldset-title" th:text="#{rma.center.section.contact}"></legend>
                        <div class="cl-form-grid">
                            <div class="cl-span-3" th:insert="~{fragments/settings-form :: textField('phone', 'order.address.phone', *{phone}, 'tel', 'tel', true, ${errors['phone']}, #{rma.center.phone.help})}"></div>
                            <div class="cl-span-3" th:insert="~{fragments/settings-form :: textField('email', 'order.address.email', *{email}, 'email', 'email', false, ${errors['email']}, null)}"></div>
                        </div>
                    </fieldset>
                    <div class="cl-card-footer">
                        <button class="cl-button is-primary" type="submit" th:text="#{rma.center.save}"></button>
                        <a class="cl-button" th:href="@{${centersHref}}" th:text="#{general.cancel}"></a>
                    </div>
                </div>
            </form>
        </div>
    </section>
    <script th:if="${!errors.isEmpty()}">
        document.getElementById('rma-center-errors').focus();
    </script>
    <script th:src="@{/js/async-form.js}" defer></script>
</div>
</body>
</html>
