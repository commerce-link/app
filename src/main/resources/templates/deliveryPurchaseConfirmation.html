<!DOCTYPE HTML>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}">
<body>

<div layout:fragment="content">

    <section class="section">
        <div class="container">
            <h1 class="title" th:text="#{deliveries.purchase.confirm.title}">Supplier order confirmation</h1>
            <h2 class="subtitle" th:text="${form.provider}">Supplier</h2>

            <div class="notification is-danger" th:if="${errorMessage}" th:text="${errorMessage}"></div>

            <div id="validation-area" class="mb-6">
                <p class="mb-2" th:text="#{deliveries.purchase.confirm.checking}">Checking availability at the supplier...</p>
                <progress class="progress is-small is-primary" max="100"></progress>
            </div>

            <div th:fragment="validationResult" th:remove="${validation == null && validationError == null} ? all : none"
                 th:attr="data-fully-available=${validation != null && validation.fullyAvailable()}">
                <div class="notification is-danger" th:if="${validationError}">
                    <span th:text="${validationError}"></span>
                    <a href="javascript:void(0)" onclick="loadValidation()" th:text="#{deliveries.purchase.confirm.retry}">Retry</a>
                </div>
                <th:block th:if="${validation != null}">
                    <div class="notification is-warning" th:if="${!validation.fullyAvailable()}"
                         th:text="#{deliveries.purchase.confirm.unavailable.note}">Some items unavailable</div>

                    <table class="table is-fullwidth is-striped">
                        <thead>
                        <tr>
                            <th th:text="#{general.product}">Product</th>
                            <th th:text="#{general.ean}">EAN</th>
                            <th th:text="#{deliveries.purchase.confirm.requested}">Requested</th>
                            <th th:text="#{deliveries.purchase.confirm.available}">Available</th>
                            <th th:text="#{deliveries.purchase.confirm.feedPrice}">Price (feed)</th>
                            <th th:text="#{deliveries.purchase.confirm.livePrice}">Price (live)</th>
                            <th>&Delta;</th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr th:each="line : ${validation.lines()}"
                            th:classappend="${!line.isAvailable()} ? 'has-background-danger-light'">
                            <td th:text="${line.name}"></td>
                            <td th:text="${line.ean}"></td>
                            <td th:text="${line.requestedQty}"></td>
                            <td>
                                <span th:text="${line.availableQty}"></span>
                                <span class="tag is-danger ml-1" th:if="${!line.isAvailable()}"
                                      th:text="#{deliveries.purchase.confirm.missing} + ' ' + ${line.missingQty}"></span>
                            </td>
                            <td th:text="${#numbers.formatDecimal(line.feedUnitCost, 1, 2)}"></td>
                            <td th:text="${#numbers.formatDecimal(line.liveUnitCost, 1, 2)}"></td>
                            <td th:text="${#numbers.formatDecimal(line.priceDelta, 1, 2)}"></td>
                        </tr>
                        </tbody>
                    </table>

                    <div class="level">
                        <div class="level-left">
                            <p>
                                <strong th:text="#{deliveries.purchase.confirm.total}">Net total</strong>:
                                <span th:text="${#numbers.formatDecimal(validation.totalNet(), 1, 2)} + ' ' + ${validation.currency()}"></span>
                            </p>
                        </div>
                    </div>
                </th:block>
            </div>

            <form id="purchase-confirm-form"
                  th:action="${isSuperAdmin} ? @{/dashboard/store/{storeId}/deliveries/create/{provider}/purchase/confirm(storeId=${form.storeId},provider=${form.provider})} : @{/dashboard/deliveries/create/{provider}/purchase/confirm(provider=${form.provider})}"
                  th:attr="data-validate-url=${isSuperAdmin} ? @{/dashboard/store/{storeId}/deliveries/create/{provider}/purchase/validate(storeId=${form.storeId},provider=${form.provider})} : @{/dashboard/deliveries/create/{provider}/purchase/validate(provider=${form.provider})}"
                  th:object="${form}" method="post"
                  onsubmit="document.getElementById('purchase-confirm-submit').disabled = true;">
                <input type="hidden" name="purchaseRef" th:value="${purchaseRef}"/>

                <input type="hidden" id="delivery-address-blocked" th:if="${deliveryAddressError}"/>
                <div class="notification is-danger" th:if="${deliveryAddressError}">
                    <span th:text="#{deliveries.purchase.confirm.addressUnavailable}">Could not fetch delivery addresses.</span>
                    <span th:text="' (' + ${deliveryAddressError} + ')'"></span>
                </div>

                <div class="field" th:if="${deliveryAddresses != null and !#lists.isEmpty(deliveryAddresses)}">
                    <label class="label" th:text="#{deliveries.purchase.confirm.address}">Delivery address</label>
                    <div th:replace="~{fragments/searchable-picker :: picker('deliveryAddressId', *{deliveryAddressId}, ${deliveryAddressLabel}, #{deliveries.purchase.confirm.addressPlaceholder})}"></div>
                </div>
                <input type="hidden" th:field="*{storeId}"/>
                <input type="hidden" th:field="*{provider}"/>
                <input type="hidden" th:field="*{removeUnselected}"/>
                <input type="hidden" th:field="*{paymentCost}"/>
                <input type="hidden" th:field="*{paymentTerms}"/>

                <th:block th:each="item, itemStat : *{items}">
                    <input type="hidden" th:field="*{items[__${itemStat.index}__].name}"/>
                    <input type="hidden" th:field="*{items[__${itemStat.index}__].ean}"/>
                    <input type="hidden" th:field="*{items[__${itemStat.index}__].mfn}"/>
                    <input type="hidden" th:field="*{items[__${itemStat.index}__].orderedQty}"/>
                    <input type="hidden" th:field="*{items[__${itemStat.index}__].requestedQty}"/>
                    <input type="hidden" th:field="*{items[__${itemStat.index}__].unitCost}"/>
                    <th:block th:each="allocation, allocStat : ${item.allocations}">
                        <input type="hidden" th:field="*{items[__${itemStat.index}__].allocations[__${allocStat.index}__].key.orderId}"/>
                        <input type="hidden" th:field="*{items[__${itemStat.index}__].allocations[__${allocStat.index}__].key.itemId}"/>
                        <input type="hidden" th:field="*{items[__${itemStat.index}__].allocations[__${allocStat.index}__].key.name}"/>
                        <input type="hidden" th:field="*{items[__${itemStat.index}__].allocations[__${allocStat.index}__].type}"/>
                        <input type="hidden" th:field="*{items[__${itemStat.index}__].allocations[__${allocStat.index}__].name}"/>
                        <input type="hidden" th:field="*{items[__${itemStat.index}__].allocations[__${allocStat.index}__].qty}"/>
                        <input type="hidden" th:field="*{items[__${itemStat.index}__].allocations[__${allocStat.index}__].ean}"/>
                        <input type="hidden" th:field="*{items[__${itemStat.index}__].allocations[__${allocStat.index}__].mfn}"/>
                        <input type="hidden" th:field="*{items[__${itemStat.index}__].allocations[__${allocStat.index}__].deliveryId}"/>
                        <input type="hidden" th:field="*{items[__${itemStat.index}__].allocations[__${allocStat.index}__].unitCost}"/>
                        <input type="hidden" th:field="*{items[__${itemStat.index}__].allocations[__${allocStat.index}__].selected}"/>
                    </th:block>
                </th:block>

                <div class="buttons">
                    <button type="submit" id="purchase-confirm-submit" class="button is-primary" disabled
                            th:text="#{deliveries.purchase.confirm.submit}">Place order</button>
                    <a class="button"
                       th:href="${isSuperAdmin} ? @{/dashboard/store/{storeId}/deliveries/create/{provider}(storeId=${form.storeId},provider=${form.provider})} : @{/dashboard/deliveries/create/{provider}(provider=${form.provider})}"
                       th:text="#{deliveries.purchase.confirm.back}">Back</a>
                </div>
            </form>

            <script th:inline="none">
                let validationPassed = false;

                function refreshSubmitState() {
                    const submit = document.getElementById('purchase-confirm-submit');
                    const address = document.querySelector('[data-picker-value][name="deliveryAddressId"]');
                    const addressBlocked = document.getElementById('delivery-address-blocked') !== null;
                    const addressChosen = !address || address.value !== '';
                    submit.disabled = addressBlocked || !validationPassed || !addressChosen;
                }

                function loadValidation() {
                    const form = document.getElementById('purchase-confirm-form');
                    const area = document.getElementById('validation-area');
                    validationPassed = false;
                    refreshSubmitState();
                    area.innerHTML = document.getElementById('validation-spinner-template').innerHTML;
                    fetch(form.dataset.validateUrl, {method: 'POST', body: new URLSearchParams(new FormData(form))})
                        .then(function (response) {
                            if (!response.ok) {
                                throw new Error('HTTP ' + response.status);
                            }
                            return response.text();
                        })
                        .then(function (html) {
                            area.innerHTML = html;
                            const result = area.querySelector('[data-fully-available]');
                            validationPassed = !!(result && result.dataset.fullyAvailable === 'true');
                            refreshSubmitState();
                        })
                        .catch(function () {
                            area.innerHTML = document.getElementById('validation-error-template').innerHTML;
                            validationPassed = false;
                            refreshSubmitState();
                        });
                }
                document.addEventListener('DOMContentLoaded', function () {
                    const address = document.querySelector('[data-picker-value][name="deliveryAddressId"]');
                    if (address) {
                        address.addEventListener('change', refreshSubmitState);
                    }
                    loadValidation();
                });
            </script>

            <th:block th:if="${deliveryAddresses != null and !#lists.isEmpty(deliveryAddresses)}"
                      th:replace="~{fragments/searchable-picker :: pickerScript('deliveryAddressId', ${deliveryAddressOptions})}"></th:block>

            <template id="validation-spinner-template">
                <p class="mb-2" th:text="#{deliveries.purchase.confirm.checking}">Checking availability at the supplier...</p>
                <progress class="progress is-small is-primary" max="100"></progress>
            </template>
            <template id="validation-error-template">
                <div class="notification is-danger">
                    <span th:text="#{deliveries.purchase.confirm.checkFailed}">Failed to fetch availability from the supplier.</span>
                    <a href="javascript:void(0)" onclick="loadValidation()" th:text="#{deliveries.purchase.confirm.retry}">Retry</a>
                </div>
            </template>
        </div>
    </section>

</div>
</body>
</html>
