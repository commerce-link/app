<!DOCTYPE HTML>
<html xmlns:th="http://www.thymeleaf.org">
<body>

<div th:fragment="input(inputName, value, minInterval)" class="schedule-field"
     th:attr="data-min-interval=${minInterval}">

    <div class="field mb-1">
        <label class="radio is-size-7">
            <input type="radio" class="schedule-mode" value="default">
            <span th:text="#{schedule.mode.default}"></span>
        </label>
    </div>

    <div class="field is-grouped is-align-items-center mb-1">
        <div class="control">
            <label class="radio is-size-7">
                <input type="radio" class="schedule-mode" value="every">
                <span th:text="#{schedule.mode.every}"></span>
            </label>
        </div>
        <div class="control schedule-every">
            <div class="select is-small"><select class="schedule-every-value"></select></div>
            <div class="select is-small">
                <select class="schedule-every-unit">
                    <option value="minutes" th:text="#{schedule.unit.minutes}"></option>
                    <option value="hours" th:text="#{schedule.unit.hours}"></option>
                    <option value="days" th:text="#{schedule.unit.days}"></option>
                </select>
            </div>
        </div>
    </div>

    <div class="field is-grouped is-align-items-flex-start mb-1">
        <div class="control">
            <label class="radio is-size-7">
                <input type="radio" class="schedule-mode" value="exact">
                <span th:text="#{schedule.mode.exact}"></span>
            </label>
        </div>
        <div class="control schedule-exact">
            <div class="schedule-exact-times">
                <div class="schedule-exact-time mb-1">
                    <span class="is-size-7" th:text="#{schedule.exact.hour}"></span>
                    <div class="select is-small"><select class="schedule-exact-hour"></select></div>
                    <span class="is-size-7" th:text="#{schedule.exact.minute}"></span>
                    <div class="select is-small"><select class="schedule-exact-minute"></select></div>
                    <button type="button" class="delete is-small schedule-exact-remove" th:title="#{schedule.exact.remove}"></button>
                </div>
            </div>
            <div class="mb-1">
                <button type="button" class="button is-small is-light schedule-exact-add">
                    <span class="has-text-weight-bold mr-1">+</span><span th:text="#{schedule.exact.add}"></span>
                </button>
            </div>
            <div>
                <span class="is-size-7" th:text="#{schedule.exact.day}"></span>
                <div class="select is-small">
                    <select class="schedule-exact-day">
                        <option value="every" th:text="#{schedule.exact.day.every}"></option>
                        <option value="MON-FRI" th:text="#{schedule.exact.day.weekdays}"></option>
                        <option value="MON" th:text="#{schedule.day.mon}"></option>
                        <option value="TUE" th:text="#{schedule.day.tue}"></option>
                        <option value="WED" th:text="#{schedule.day.wed}"></option>
                        <option value="THU" th:text="#{schedule.day.thu}"></option>
                        <option value="FRI" th:text="#{schedule.day.fri}"></option>
                        <option value="SAT" th:text="#{schedule.day.sat}"></option>
                        <option value="SUN" th:text="#{schedule.day.sun}"></option>
                    </select>
                </div>
            </div>
            <p class="schedule-exact-conflict is-size-7 has-text-danger" th:text="#{schedule.exact.conflict}"></p>
        </div>
    </div>

    <p class="schedule-timezone is-size-7 has-text-grey" th:text="#{schedule.timezone}"></p>
    <p class="schedule-unsupported is-size-7 has-text-warning-dark" th:text="#{schedule.advanced.only}"></p>

    <div class="schedule-advanced">
        <a class="is-size-7 schedule-advanced-toggle" href="#">
            <span class="schedule-advanced-caret">▸</span> <span th:text="#{schedule.advanced}"></span>
        </a>
        <div class="schedule-advanced-body mt-1">
            <input class="input is-small schedule-input" type="text" autocomplete="off" spellcheck="false"
                   th:name="${inputName}" th:value="${value}" th:placeholder="#{schedule.placeholder}">
            <p class="help" th:text="#{schedule.description(${minInterval})}"></p>
        </div>
    </div>
</div>

<script th:fragment="script">
    (function () {
        var EVERY_VALUES = { minutes: [5, 10, 15, 20, 30], hours: [1, 2, 3, 4, 6, 8, 12], days: [2, 3, 7, 14] };
        var DAYS = ['MON', 'TUE', 'WED', 'THU', 'FRI', 'SAT', 'SUN'];
        var pad = function (n) { return (n < 10 ? '0' : '') + n; };
        var range = function (n) { return Array.from({ length: n }, function (_, i) { return i; }); };
        var byNumber = function (a, b) { return a - b; };
        var instance = 0;

        function fill(select, values, label) {
            select.innerHTML = '';
            values.forEach(function (v) {
                var o = document.createElement('option');
                o.value = String(v); o.textContent = label ? label(v) : String(v);
                select.appendChild(o);
            });
        }

        function bind(field) {
            instance += 1;
            var minInterval = parseInt(field.getAttribute('data-min-interval'), 10) || 1;
            var q = function (sel) { return field.querySelector(sel); };
            var qa = function (sel) { return Array.prototype.slice.call(field.querySelectorAll(sel)); };
            var input = q('.schedule-input');
            var modes = qa('.schedule-mode');
            var everyValue = q('.schedule-every-value');
            var everyUnit = q('.schedule-every-unit');
            var times = q('.schedule-exact-times');
            var timeTemplate = q('.schedule-exact-time').cloneNode(true);
            var exactDay = q('.schedule-exact-day');
            var conflict = q('.schedule-exact-conflict');
            var unsupported = q('.schedule-unsupported');
            var advancedBody = q('.schedule-advanced-body');
            var caret = q('.schedule-advanced-caret');
            var everyBox = q('.schedule-every');
            var exactBox = q('.schedule-exact');
            var timezoneNote = q('.schedule-timezone');

            modes.forEach(function (r) { r.name = 'schedule-mode-' + instance; });

            function fillEveryValues(unit, keep) {
                var values = EVERY_VALUES[unit].filter(function (v) { return unit !== 'minutes' || v >= minInterval; });
                fill(everyValue, values);
                if (keep && values.indexOf(parseInt(keep, 10)) >= 0) { everyValue.value = String(keep); }
            }
            fillEveryValues('minutes'); everyValue.value = '30';

            function timeRows() { return qa('.schedule-exact-time'); }
            function refreshRemoveButtons() {
                var rows = timeRows();
                rows.forEach(function (r) { r.querySelector('.schedule-exact-remove').style.visibility = rows.length > 1 ? '' : 'hidden'; });
            }
            function addTime(hour, minute) {
                var row = timeTemplate.cloneNode(true);
                var h = row.querySelector('.schedule-exact-hour'), m = row.querySelector('.schedule-exact-minute');
                fill(h, range(24), pad); fill(m, range(60), pad);
                h.value = String(hour); m.value = String(minute);
                [h, m].forEach(function (el) { el.addEventListener('change', fromBuilder); });
                row.querySelector('.schedule-exact-remove').addEventListener('click', function () {
                    if (timeRows().length > 1) { row.remove(); refreshRemoveButtons(); fromBuilder(); }
                });
                times.appendChild(row);
                refreshRemoveButtons();
            }
            function setTimes(list) {
                times.innerHTML = '';
                list.forEach(function (t) { addTime(t[0], t[1]); });
            }
            function chosenTimes() {
                var seen = {}, list = [];
                timeRows().forEach(function (r) {
                    var h = parseInt(r.querySelector('.schedule-exact-hour').value, 10);
                    var m = parseInt(r.querySelector('.schedule-exact-minute').value, 10);
                    if (!seen[h + ':' + m]) { seen[h + ':' + m] = true; list.push([h, m]); }
                });
                return list;
            }
            function exactFields() {
                var list = chosenTimes(), hours = [], minutes = [];
                list.forEach(function (t) {
                    if (hours.indexOf(t[0]) < 0) { hours.push(t[0]); }
                    if (minutes.indexOf(t[1]) < 0) { minutes.push(t[1]); }
                });
                if (hours.length * minutes.length !== list.length) { return null; }
                return { minutes: minutes.sort(byNumber).join(','), hours: hours.sort(byNumber).join(',') };
            }

            q('.schedule-exact-add').addEventListener('click', function () {
                var last = chosenTimes().slice(-1)[0] || [5, 0];
                addTime((last[0] + 1) % 24, last[1]);
                fromBuilder();
            });

            function mode() { var r = modes.filter(function (x) { return x.checked; })[0]; return r ? r.value : 'default'; }
            function setMode(m) { modes.forEach(function (r) { r.checked = r.value === m; }); }

            var advancedOpen = false;
            function setAdvanced(open) {
                advancedOpen = open;
                advancedBody.style.display = open ? '' : 'none';
                caret.textContent = open ? '▾' : '▸';
            }
            q('.schedule-advanced-toggle').addEventListener('click', function (e) { e.preventDefault(); setAdvanced(!advancedOpen); });

            function build() {
                var m = mode();
                if (m === 'default') { return ''; }
                if (m === 'every') {
                    var n = parseInt(everyValue.value, 10), unit = everyUnit.value;
                    if (unit === 'minutes') { return '0/' + n + ' * * * ? *'; }
                    if (unit === 'hours') { return '0 ' + (n === 1 ? '*' : '0/' + n) + ' * * ? *'; }
                    return '0 0 1/' + n + ' * ? *';
                }
                var f = exactFields();
                if (!f) { return null; }
                var day = exactDay.value;
                if (day === 'every') { return f.minutes + ' ' + f.hours + ' * * ? *'; }
                return f.minutes + ' ' + f.hours + ' ? * ' + day + ' *';
            }

            function parseList(text, max) {
                var out = [];
                var values = text.split(',');
                for (var i = 0; i < values.length; i++) {
                    if (!/^\d{1,2}$/.test(values[i])) { return null; }
                    var v = parseInt(values[i], 10);
                    if (v >= max || out.indexOf(v) >= 0) { return null; }
                    out.push(v);
                }
                return out;
            }

            function parse(cron) {
                var v = (cron || '').trim().replace(/\s+/g, ' ').toUpperCase();
                if (v === '') { setMode('default'); return true; }
                var p = v.split(' '), m;
                if (p.length !== 6 || p[3] !== '*' || p[5] !== '*') { return false; }
                if ((m = /^0\/(\d+)$/.exec(p[0])) && p[1] === '*' && p[2] === '*' && p[4] === '?') {
                    if (EVERY_VALUES.minutes.indexOf(parseInt(m[1], 10)) < 0) { return false; }
                    setMode('every'); everyUnit.value = 'minutes'; fillEveryValues('minutes', m[1]); return everyValue.value === m[1];
                }
                if (p[0] === '0' && (m = /^0\/(\d+)$/.exec(p[1])) && p[2] === '*' && p[4] === '?') {
                    if (EVERY_VALUES.hours.indexOf(parseInt(m[1], 10)) < 0) { return false; }
                    setMode('every'); everyUnit.value = 'hours'; fillEveryValues('hours', m[1]); return everyValue.value === m[1];
                }
                if (p[0] === '0' && p[1] === '*' && p[2] === '*' && p[4] === '?') {
                    setMode('every'); everyUnit.value = 'hours'; fillEveryValues('hours', '1'); return true;
                }
                if (p[0] === '0' && p[1] === '0' && (m = /^1\/(\d+)$/.exec(p[2])) && p[4] === '?') {
                    if (EVERY_VALUES.days.indexOf(parseInt(m[1], 10)) < 0) { return false; }
                    setMode('every'); everyUnit.value = 'days'; fillEveryValues('days', m[1]); return everyValue.value === m[1];
                }
                var minutes = parseList(p[0], 60), hours = parseList(p[1], 24);
                if (minutes && hours) {
                    var day = null;
                    if (p[2] === '*' && p[4] === '?') { day = 'every'; }
                    else if (p[2] === '?' && (p[4] === 'MON-FRI' || DAYS.indexOf(p[4]) >= 0)) { day = p[4]; }
                    if (!day) { return false; }
                    var list = [];
                    hours.sort(byNumber).forEach(function (h) { minutes.sort(byNumber).forEach(function (mi) { list.push([h, mi]); }); });
                    setMode('exact'); setTimes(list); exactDay.value = day;
                    return true;
                }
                return false;
            }

            function refresh(supported) {
                var m = mode();
                timezoneNote.style.display = m === 'default' ? 'none' : '';
                everyBox.style.display = m === 'every' ? '' : 'none';
                exactBox.style.display = m === 'exact' ? '' : 'none';
                unsupported.style.display = supported ? 'none' : '';
                modes.forEach(function (r) { r.disabled = !supported; });
            }

            function fromBuilder() {
                var cron = build();
                conflict.style.display = cron === null ? '' : 'none';
                if (cron !== null) { input.value = cron; }
                refresh(true);
            }
            function fromInput() {
                var ok = parse(input.value);
                if (!ok) { modes.forEach(function (r) { r.checked = false; }); }
                conflict.style.display = 'none';
                refresh(ok);
            }

            modes.forEach(function (r) { r.addEventListener('change', fromBuilder); });
            everyUnit.addEventListener('change', function () { fillEveryValues(everyUnit.value); fromBuilder(); });
            [everyValue, exactDay].forEach(function (el) { el.addEventListener('change', fromBuilder); });
            input.addEventListener('input', fromInput);

            setTimes([ [5, 0] ]);
            var supported = parse(input.value);
            setAdvanced(!supported);
            conflict.style.display = 'none';
            refresh(supported);
        }

        document.querySelectorAll('.schedule-field').forEach(bind);
    })();
</script>

<style th:fragment="style">
    .schedule-field .select + .select { margin-left: .25rem; }
    .schedule-field .schedule-exact .select { vertical-align: middle; margin-right: .5rem; }
    .schedule-field .schedule-exact span.is-size-7 { margin-right: .25rem; }
    .schedule-field .schedule-exact-remove { vertical-align: middle; }
    .schedule-field .field.is-grouped .control + .control { margin-left: .5rem; }
</style>

</body>
</html>
