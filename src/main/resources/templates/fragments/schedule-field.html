<!DOCTYPE HTML>
<html xmlns:th="http://www.thymeleaf.org">
<body>

<!--
  Feed refresh schedule, built for a reusable modal: the markup is rendered once and re-filled for
  whichever supplier is being edited, so the script exposes sync()/read() instead of parsing the
  input once at page load.

  The builder can only produce expressions that are valid by construction. "At" schedules pick a
  set of hours and one minute, never a set of both: a cron's minute and hour fields are a cross
  product, so allowing both would make combinations like 05:00 + 06:30 unrepresentable and leave
  the operator staring at a conflict they cannot act on. Anything outside what the builder covers
  stays reachable through the advanced expression below.
-->
<div th:fragment="input(inputName, value, minInterval)" class="schedule-field"
     th:attr="data-min-interval=${minInterval}">

    <div class="tabs is-toggle is-small schedule-modes mb-2">
        <ul>
            <li data-mode="default"><a><span th:text="#{schedule.mode.default}"></span></a></li>
            <li data-mode="every"><a><span th:text="#{schedule.mode.every}"></span></a></li>
            <li data-mode="at"><a><span th:text="#{schedule.mode.at}"></span></a></li>
        </ul>
    </div>

    <div class="schedule-pane" data-pane="every">
        <div class="field is-grouped is-align-items-center">
            <div class="control"><div class="select is-small"><select class="schedule-every-value"></select></div></div>
            <div class="control">
                <div class="select is-small">
                    <select class="schedule-every-unit">
                        <option value="minutes" th:text="#{schedule.unit.minutes}"></option>
                        <option value="hours" th:text="#{schedule.unit.hours}"></option>
                        <option value="days" th:text="#{schedule.unit.days}"></option>
                    </select>
                </div>
            </div>
        </div>
    </div>

    <div class="schedule-pane" data-pane="at">
        <label class="label is-size-7 mb-1" th:text="#{schedule.at.hours}"></label>
        <div class="buttons are-small schedule-hours"></div>
        <div class="field is-grouped is-align-items-center is-flex-wrap-wrap">
            <div class="control"><span class="is-size-7" th:text="#{schedule.at.minute}"></span></div>
            <div class="control"><div class="select is-small"><select class="schedule-minute"></select></div></div>
            <div class="control"><span class="is-size-7" th:text="#{schedule.at.day}"></span></div>
            <div class="control">
                <div class="select is-small">
                    <select class="schedule-day">
                        <option value="every" th:text="#{schedule.at.day.every}"></option>
                        <option value="MON-FRI" th:text="#{schedule.at.day.weekdays}"></option>
                        <option value="MON" th:text="#{schedule.day.mon}"></option>
                        <option value="TUE" th:text="#{schedule.day.tue}"></option>
                        <option value="WED" th:text="#{schedule.day.wed}"></option>
                        <option value="THU" th:text="#{schedule.day.thu}"></option>
                        <option value="FRI" th:text="#{schedule.day.fri}"></option>
                        <option value="SAT" th:text="#{schedule.day.sat}"></option>
                        <option value="SUN" th:text="#{schedule.day.sun}"></option>
                    </select>
                </div>
            </div>
        </div>
    </div>

    <!-- The one thing the operator should read instead of the expression itself. -->
    <p class="schedule-summary is-size-7 mt-2"></p>
    <p class="schedule-unsupported is-size-7 has-text-warning-dark" th:text="#{schedule.advanced.only}"></p>

    <div class="schedule-advanced mt-2">
        <a class="is-size-7 schedule-advanced-toggle" href="#">
            <span class="schedule-advanced-caret">&#9656;</span> <span th:text="#{schedule.advanced}"></span>
        </a>
        <div class="schedule-advanced-body mt-1">
            <input class="input is-small schedule-input" type="text" autocomplete="off" spellcheck="false"
                   th:name="${inputName}" th:value="${value}" th:placeholder="#{schedule.placeholder}">
            <p class="help" th:text="#{schedule.description(${minInterval})}"></p>
        </div>
    </div>
</div>

<script th:fragment="script" th:inline="javascript">
    window.scheduleField = (function () {
        var EVERY_VALUES = { minutes: [5, 10, 15, 20, 30], hours: [1, 2, 3, 4, 6, 8, 12], days: [2, 3, 7, 14] };
        var MINUTES = [0, 5, 10, 15, 20, 25, 30, 35, 40, 45, 50, 55];
        var DAYS = ['MON', 'TUE', 'WED', 'THU', 'FRI', 'SAT', 'SUN'];

        // The same message keys the server uses for the table cell (PollingScheduleDescription),
        // so the summary shown while editing and the one shown in the row cannot disagree.
        var TEXT = {
            'default': /*[[#{store.supplier.schedule.summary.default}]]*/ '',
            custom: /*[[#{store.supplier.schedule.summary.custom}]]*/ '',
            'every.minutes': /*[[#{store.supplier.schedule.summary.every.minutes}]]*/ '',
            'every.hours': /*[[#{store.supplier.schedule.summary.every.hours}]]*/ '',
            'every.days': /*[[#{store.supplier.schedule.summary.every.days}]]*/ '',
            'at': /*[[#{store.supplier.schedule.summary.at}]]*/ '',
            'at.MON-FRI': /*[[#{store.supplier.schedule.summary.at.MON-FRI}]]*/ '',
            'at.MON': /*[[#{store.supplier.schedule.summary.at.MON}]]*/ '',
            'at.TUE': /*[[#{store.supplier.schedule.summary.at.TUE}]]*/ '',
            'at.WED': /*[[#{store.supplier.schedule.summary.at.WED}]]*/ '',
            'at.THU': /*[[#{store.supplier.schedule.summary.at.THU}]]*/ '',
            'at.FRI': /*[[#{store.supplier.schedule.summary.at.FRI}]]*/ '',
            'at.SAT': /*[[#{store.supplier.schedule.summary.at.SAT}]]*/ '',
            'at.SUN': /*[[#{store.supplier.schedule.summary.at.SUN}]]*/ '',
            timezone: /*[[#{schedule.timezone}]]*/ '',
            noHours: /*[[#{schedule.at.nohours}]]*/ ''
        };

        function pad(n) { return (n < 10 ? '0' : '') + n; }

        function fill(select, values, label) {
            select.innerHTML = '';
            values.forEach(function (value) {
                var option = document.createElement('option');
                option.value = String(value);
                option.textContent = label ? label(value) : String(value);
                select.appendChild(option);
            });
        }

        function format(template, value) {
            return String(template).replace('{0}', value);
        }

        function controller(field) {
            var minInterval = parseInt(field.getAttribute('data-min-interval'), 10) || 1;
            var q = function (selector) { return field.querySelector(selector); };
            var input = q('.schedule-input');
            var tabs = Array.prototype.slice.call(field.querySelectorAll('.schedule-modes li'));
            var panes = Array.prototype.slice.call(field.querySelectorAll('.schedule-pane'));
            var everyValue = q('.schedule-every-value');
            var everyUnit = q('.schedule-every-unit');
            var hourButtons = q('.schedule-hours');
            var minute = q('.schedule-minute');
            var day = q('.schedule-day');
            var summary = q('.schedule-summary');
            var unsupported = q('.schedule-unsupported');
            var advancedBody = q('.schedule-advanced-body');
            var caret = q('.schedule-advanced-caret');
            var mode = 'default';
            var supported = true;

            fill(minute, MINUTES, pad);
            for (var hour = 0; hour < 24; hour++) {
                var button = document.createElement('button');
                button.type = 'button';
                button.className = 'button is-small';
                button.setAttribute('data-hour', String(hour));
                button.textContent = pad(hour);
                hourButtons.appendChild(button);
            }

            function everyOptions(unit, keep) {
                var values = EVERY_VALUES[unit].filter(function (v) { return unit !== 'minutes' || v >= minInterval; });
                fill(everyValue, values);
                if (keep && values.indexOf(parseInt(keep, 10)) >= 0) { everyValue.value = String(keep); }
            }

            function hours() {
                return Array.prototype.slice.call(hourButtons.querySelectorAll('.is-link'))
                        .map(function (b) { return parseInt(b.getAttribute('data-hour'), 10); })
                        .sort(function (a, b) { return a - b; });
            }

            function setHours(list) {
                Array.prototype.slice.call(hourButtons.children).forEach(function (b) {
                    var on = list.indexOf(parseInt(b.getAttribute('data-hour'), 10)) >= 0;
                    b.classList.toggle('is-link', on);
                });
            }

            function setMode(next) {
                mode = next;
                tabs.forEach(function (tab) { tab.classList.toggle('is-active', tab.getAttribute('data-mode') === next); });
                panes.forEach(function (pane) { pane.hidden = pane.getAttribute('data-pane') !== next; });
            }

            // Returns null only when the operator has cleared every hour, which is the single
            // invalid state the builder can reach; the caller blocks the save on it.
            function build() {
                // No mode is selected while the operator is writing an advanced expression by
                // hand; that expression is the value, and only the server judges it.
                if (mode === null) { return input.value; }
                if (mode === 'default') { return ''; }
                if (mode === 'every') {
                    var n = parseInt(everyValue.value, 10);
                    if (everyUnit.value === 'minutes') { return '0/' + n + ' * * * ? *'; }
                    if (everyUnit.value === 'hours') { return '0 ' + (n === 1 ? '*' : '0/' + n) + ' * * ? *'; }
                    return '0 0 1/' + n + ' * ? *';
                }
                var chosen = hours();
                if (chosen.length === 0) { return null; }
                var expression = minute.value + ' ' + chosen.join(',');
                return day.value === 'every'
                        ? expression + ' * * ? *'
                        : expression + ' ? * ' + day.value + ' *';
            }

            function describe() {
                if (!supported) { return TEXT.custom; }
                if (mode === 'default') { return TEXT['default']; }
                if (mode === 'every') {
                    return format(TEXT['every.' + everyUnit.value], everyValue.value) + '. ' + TEXT.timezone;
                }
                var chosen = hours();
                if (chosen.length === 0) { return null; }
                var times = chosen.map(function (h) { return pad(h) + ':' + pad(parseInt(minute.value, 10)); }).join(', ');
                var key = day.value === 'every' ? 'at' : 'at.' + day.value;
                return format(TEXT[key], times) + '. ' + TEXT.timezone;
            }

            function render() {
                var text = describe();
                summary.textContent = text === null ? TEXT.noHours : text;
                summary.classList.toggle('has-text-danger', text === null);
                summary.classList.toggle('has-text-grey', text !== null);
                unsupported.hidden = supported;
            }

            function fromBuilder() {
                var expression = build();
                if (expression !== null) { input.value = expression; }
                render();
            }

            function parse(expression) {
                var value = String(expression || '').trim().replace(/\s+/g, ' ').toUpperCase();
                if (value === '') { setMode('default'); return true; }
                var f = value.split(' '), m;
                if (f.length !== 6 || f[3] !== '*' || f[5] !== '*') { return false; }
                if (f[2] === '*' && f[4] === '?') {
                    if ((m = /^0\/(\d{1,2})$/.exec(f[0])) && f[1] === '*') {
                        if (EVERY_VALUES.minutes.indexOf(parseInt(m[1], 10)) < 0) { return false; }
                        setMode('every'); everyUnit.value = 'minutes'; everyOptions('minutes', m[1]);
                        return everyValue.value === m[1];
                    }
                    if (f[0] === '0' && f[1] === '*') {
                        setMode('every'); everyUnit.value = 'hours'; everyOptions('hours', '1');
                        return true;
                    }
                    if (f[0] === '0' && (m = /^0\/(\d{1,2})$/.exec(f[1]))) {
                        if (EVERY_VALUES.hours.indexOf(parseInt(m[1], 10)) < 0) { return false; }
                        setMode('every'); everyUnit.value = 'hours'; everyOptions('hours', m[1]);
                        return everyValue.value === m[1];
                    }
                }
                if (f[0] === '0' && f[1] === '0' && (m = /^1\/(\d{1,2})$/.exec(f[2])) && f[4] === '?') {
                    if (EVERY_VALUES.days.indexOf(parseInt(m[1], 10)) < 0) { return false; }
                    setMode('every'); everyUnit.value = 'days'; everyOptions('days', m[1]);
                    return everyValue.value === m[1];
                }
                // A single minute and a list of hours: the only "at" shape this builder writes.
                // Anything wider (several minutes, ranges, steps) belongs to the advanced field.
                if (!/^\d{1,2}$/.test(f[0]) || !/^\d{1,2}(,\d{1,2})*$/.test(f[1])) { return false; }
                var chosenDay = null;
                if (f[2] === '*' && f[4] === '?') { chosenDay = 'every'; }
                else if (f[2] === '?' && (f[4] === 'MON-FRI' || DAYS.indexOf(f[4]) >= 0)) { chosenDay = f[4]; }
                if (chosenDay === null || MINUTES.indexOf(parseInt(f[0], 10)) < 0) { return false; }
                var chosen = f[1].split(',').map(Number);
                if (chosen.some(function (h) { return h > 23; })) { return false; }
                setMode('at');
                setHours(chosen);
                minute.value = String(parseInt(f[0], 10));
                day.value = chosenDay;
                return true;
            }

            function setAdvanced(open) {
                advancedBody.hidden = !open;
                caret.textContent = open ? '▾' : '▸';
            }

            function sync(value) {
                input.value = value || '';
                setHours([5]);
                minute.value = '0';
                day.value = 'every';
                everyUnit.value = 'minutes';
                everyOptions('minutes');
                supported = parse(input.value);
                if (!supported) { setMode(null); }
                setAdvanced(!supported);
                render();
            }

            tabs.forEach(function (tab) {
                tab.querySelector('a').addEventListener('click', function (event) {
                    event.preventDefault();
                    supported = true;
                    setMode(tab.getAttribute('data-mode'));
                    fromBuilder();
                });
            });
            hourButtons.addEventListener('click', function (event) {
                var button = event.target.closest('[data-hour]');
                if (!button) { return; }
                button.classList.toggle('is-link');
                fromBuilder();
            });
            everyUnit.addEventListener('change', function () { everyOptions(everyUnit.value); fromBuilder(); });
            [everyValue, minute, day].forEach(function (el) { el.addEventListener('change', fromBuilder); });
            input.addEventListener('input', function () {
                supported = parse(input.value);
                if (!supported) { setMode(null); }
                render();
            });
            q('.schedule-advanced-toggle').addEventListener('click', function (event) {
                event.preventDefault();
                setAdvanced(advancedBody.hidden);
            });

            sync(input.value);
            return {
                sync: sync,
                read: function () { return input.value; },
                valid: function () { return build() !== null; }
            };
        }

        function of(field) {
            if (!field.scheduleController) { field.scheduleController = controller(field); }
            return field.scheduleController;
        }

        return {
            init: function (field) { return of(field); },
            sync: function (field, value) { of(field).sync(value); },
            valid: function (field) { return of(field).valid(); }
        };
    })();
</script>

<style th:fragment="style">
    .schedule-field .schedule-hours { gap: .25rem; }
    .schedule-field .schedule-hours .button { min-width: 2.4rem; }
    .schedule-field .field.is-grouped .control + .control { margin-left: .5rem; }
    .schedule-field .tabs.is-toggle { margin-bottom: .5rem; }
    /* The screen's body is a Bulma `.content` block, and `.content ul` applies its typography to
       any plain list -- including the one a tabs bar is built from. That indented the mode toggle
       by 2em (24px at this font size) and pushed it down by 1em, while every other control in the
       modal starts at the box's left edge. */
    .schedule-field .tabs ul { margin: 0; list-style: none; border-bottom: 0; }
</style>

</body>
</html>
