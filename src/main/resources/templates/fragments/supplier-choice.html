<!DOCTYPE HTML>
<html xmlns:th="http://www.thymeleaf.org">
<body>

<!--/* The same choice in the cl-* forms: a select of the store's connections plus "Other supplier…", which reveals a
       text field (static/js/supplier-choice.js). current is the chosen identity, custom the typed name (or null).
       supplierOptional (th:with by the caller) makes the empty option mean "no supplier" instead of a placeholder; the
       assign-supplier dialog never sets it, so its choice stays required. supplierFieldName (th:with, optional) renames
       the select for a form that posts the choice under another name (the item page posts it as deliveryId).
       supplierErrorField (th:with, optional) is the id of the field the page's supplier error belongs to, id or
       id + '-custom'; that field is marked invalid and described by the error the page renders as id + '-error'. */-->
<div th:fragment="clField(id, options, current, custom)" class="cl-field"
     th:with="selectInvalid=${supplierErrorField != null and supplierErrorField == id},
              customInvalid=${supplierErrorField != null and supplierErrorField == id + '-custom'}">
    <label class="cl-label" th:for="${id}" th:text="#{order.item.supplier}"></label>
    <select class="cl-select" th:id="${id}" th:name="${supplierFieldName != null} ? ${supplierFieldName} : 'supplier'" th:required="${supplierOptional == null or !supplierOptional}"
            data-cl-custom-option="__custom__" th:classappend="${selectInvalid} ? 'is-invalid'"
            th:attr="aria-invalid=${selectInvalid ? 'true' : null}, aria-describedby=${selectInvalid ? id + '-error' : null}">
        <option value="" th:text="${supplierOptional != null and supplierOptional} ? #{order.item.supplier.none} : #{general.select}"></option>
        <option th:each="option : ${options}" th:value="${option.identity()}" th:selected="${option.identity() == current}"
                th:text="${option.label()}"></option>
        <!--/* A form posted back after a refusal always carries the (hidden) typed-name field, empty when a connection was
               chosen: the typed name selects "Other supplier…" only when no connection was picked. */-->
        <option value="__custom__" th:selected="${current == T(pl.commercelink.inventory.supplier.SupplierChoice).CUSTOM or (#strings.isEmpty(current) and !#strings.isEmpty(custom))}"
                th:text="#{order.item.supplier.custom}"></option>
    </select>
    <div class="cl-field" data-cl-custom-field>
        <label class="cl-label" th:for="${id} + '-custom'" th:text="#{store.supplier.billing.shortcut}"></label>
        <input class="cl-input" th:id="${id} + '-custom'" type="text" name="customSupplier" autocomplete="off"
               pattern="[\p{L}\p{N}_\-]+" th:value="${custom}" th:title="#{order.item.supplier.custom.format}"
               th:placeholder="#{order.item.supplier.custom.placeholder}" th:classappend="${customInvalid} ? 'is-invalid'"
               th:attr="aria-invalid=${customInvalid ? 'true' : null}, aria-describedby=${customInvalid ? id + '-error' : null}">
        <p class="cl-help" th:text="#{order.item.supplier.custom.hint}"></p>
    </div>
</div>

</body>
</html>
