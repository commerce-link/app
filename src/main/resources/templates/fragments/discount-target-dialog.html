<th:block th:fragment="dialogs (catalogs, pricelistUrl)">
    <dialog class="cl-dialog is-form" id="discount-categories-dialog" aria-labelledby="discount-categories-title"
            data-discount-dialog="categories"
            th:attr="data-pricelist-url=@{${pricelistUrl}},
                     data-count=#{store.discounts.pick.categories.count},
                     data-choose-label=#{store.discounts.pick.choose},
                     data-remove-label=#{store.discounts.picked.remove},
                     data-submit-label=#{store.discounts.pick.submit},
                     data-submit-count=#{store.discounts.pick.submit.count}">
        <h2 class="cl-dialog-title" id="discount-categories-title" th:text="#{store.discounts.categories.pick}"></h2>
        <div class="cl-dialog-body">
            <div class="cl-form-grid">
                <div class="cl-span-3 cl-field">
                    <label class="cl-label" for="discount-categories-catalog" th:text="#{store.discounts.pick.catalog}"></label>
                    <select class="cl-select" id="discount-categories-catalog" data-discount-pick-catalog>
                        <option value="" th:text="#{store.discounts.pick.catalog.choose}"></option>
                        <option th:each="catalog : ${catalogs}" th:value="${catalog.catalogId}" th:text="${catalog.name}"></option>
                    </select>
                </div>
                <div class="cl-span-3 cl-field">
                    <label class="cl-label" for="discount-categories-search" th:text="#{store.discounts.pick.search}"></label>
                    <input class="cl-input" type="search" id="discount-categories-search" data-discount-pick-search
                           th:placeholder="#{store.discounts.pick.search.categories}">
                </div>
            </div>
            <div class="cl-item-add-scroll">
                <table class="cl-table is-compact cl-item-add-table">
                    <caption class="cl-visually-hidden" th:text="#{store.discounts.categories.pick}"></caption>
                    <thead>
                    <tr>
                        <th scope="col" class="cl-table-check"><span class="cl-visually-hidden" th:text="#{store.discounts.pick.column.pick}"></span></th>
                        <th scope="col" th:text="#{store.discounts.pick.column.category}"></th>
                        <th scope="col" class="is-numeric" th:text="#{store.discounts.pick.column.products}"></th>
                    </tr>
                    </thead>
                    <tbody data-discount-pick-rows></tbody>
                </table>
                <p class="cl-list-empty" data-discount-pick-state="loading" hidden th:text="#{store.discounts.pick.loading}"></p>
                <p class="cl-list-empty" data-discount-pick-state="noCatalog" th:text="#{store.discounts.pick.chooseCatalog}"></p>
                <p class="cl-list-empty" data-discount-pick-state="empty" hidden th:text="#{store.discounts.pick.empty}"></p>
                <p class="cl-list-empty" data-discount-pick-state="noResults" hidden th:text="#{store.discounts.pick.noResults}"></p>
            </div>
            <p class="cl-help" data-discount-pick-count></p>
            <div class="cl-item-add-basket" data-discount-pick-basket>
                <button type="button" class="cl-item-add-basket-head" aria-expanded="true"
                        aria-controls="discount-categories-picked" data-discount-pick-basket-toggle>
                    <span class="cl-item-add-chev" aria-hidden="true">▾</span>
                    <span class="cl-eyebrow" th:text="#{store.discounts.pick.picked}"></span>
                    <span class="cl-item-add-basket-n" data-discount-pick-picked-count>0</span>
                </button>
                <button type="button" class="cl-link-button cl-item-add-basket-clear" data-discount-pick-clear
                        th:text="#{store.discounts.pick.clear}"></button>
                <div class="cl-item-add-basket-body" id="discount-categories-picked">
                    <table class="cl-table is-compact cl-item-add-table">
                        <caption class="cl-visually-hidden" th:text="#{store.discounts.pick.picked}"></caption>
                        <tbody data-discount-pick-picked></tbody>
                    </table>
                    <p class="cl-list-empty" data-discount-pick-none th:text="#{store.discounts.categories.none}"></p>
                </div>
            </div>
        </div>
        <div class="cl-dialog-actions">
            <button class="cl-button is-primary" type="button" data-discount-pick-submit disabled
                    th:text="#{store.discounts.pick.submit}"></button>
            <button class="cl-button" type="button" data-discount-pick-close th:text="#{general.cancel}"></button>
            <span class="cl-help" th:text="#{store.discounts.pick.categories.hint}"></span>
        </div>
    </dialog>

    <dialog class="cl-dialog is-form is-wide" id="discount-products-dialog" aria-labelledby="discount-products-title"
            data-discount-dialog="products"
            th:attr="data-pricelist-url=@{${pricelistUrl}},
                     data-count=#{store.discounts.pick.products.count},
                     data-choose-label=#{store.discounts.pick.choose},
                     data-remove-label=#{store.discounts.picked.remove},
                     data-qty=#{store.discounts.pick.qty},
                     data-submit-label=#{store.discounts.pick.submit},
                     data-submit-count=#{store.discounts.pick.submit.count}">
        <h2 class="cl-dialog-title" id="discount-products-title" th:text="#{store.discounts.products.pick}"></h2>
        <div class="cl-dialog-body">
            <div class="cl-form-grid">
                <div class="cl-span-2 cl-field">
                    <label class="cl-label" for="discount-products-catalog" th:text="#{store.discounts.pick.catalog}"></label>
                    <select class="cl-select" id="discount-products-catalog" data-discount-pick-catalog>
                        <option value="" th:text="#{store.discounts.pick.catalog.choose}"></option>
                        <option th:each="catalog : ${catalogs}" th:value="${catalog.catalogId}" th:text="${catalog.name}"></option>
                    </select>
                </div>
                <div class="cl-span-2 cl-field">
                    <label class="cl-label" for="discount-products-category" th:text="#{store.discounts.pick.category}"></label>
                    <select class="cl-select" id="discount-products-category" data-discount-pick-category
                            th:attr="data-placeholder=#{store.discounts.pick.category.all}"></select>
                </div>
                <div class="cl-span-2 cl-field">
                    <label class="cl-label" for="discount-products-label" th:text="#{store.discounts.pick.label}"></label>
                    <select class="cl-select" id="discount-products-label" data-discount-pick-label
                            th:attr="data-placeholder=#{store.discounts.pick.label.all}"></select>
                </div>
                <div class="cl-span-6 cl-field">
                    <label class="cl-label" for="discount-products-search" th:text="#{store.discounts.pick.search}"></label>
                    <input class="cl-input" type="search" id="discount-products-search" data-discount-pick-search
                           th:placeholder="#{store.discounts.pick.search.products}">
                </div>
            </div>
            <div class="cl-item-add-scroll">
                <table class="cl-table is-compact cl-item-add-table">
                    <caption class="cl-visually-hidden" th:text="#{store.discounts.products.pick}"></caption>
                    <thead>
                    <tr>
                        <th scope="col" class="cl-table-check"><span class="cl-visually-hidden" th:text="#{store.discounts.pick.column.pick}"></span></th>
                        <th scope="col" th:text="#{store.discounts.pick.column.product}"></th>
                        <th scope="col" th:text="#{store.discounts.pick.column.category}"></th>
                        <th scope="col" class="is-numeric" th:text="#{store.discounts.pick.column.price}"></th>
                        <th scope="col" class="is-numeric" th:text="#{store.discounts.pick.column.qty}"></th>
                        <th scope="col" class="is-numeric" th:text="#{store.discounts.pick.column.days}"></th>
                    </tr>
                    </thead>
                    <tbody data-discount-pick-rows></tbody>
                </table>
                <p class="cl-list-empty" data-discount-pick-state="loading" hidden th:text="#{store.discounts.pick.loading}"></p>
                <p class="cl-list-empty" data-discount-pick-state="noCatalog" th:text="#{store.discounts.pick.chooseCatalog}"></p>
                <p class="cl-list-empty" data-discount-pick-state="empty" hidden th:text="#{store.discounts.pick.empty}"></p>
                <p class="cl-list-empty" data-discount-pick-state="noResults" hidden th:text="#{store.discounts.pick.noResults}"></p>
            </div>
            <p class="cl-help" data-discount-pick-count></p>
            <div class="cl-item-add-basket" data-discount-pick-basket>
                <button type="button" class="cl-item-add-basket-head" aria-expanded="true"
                        aria-controls="discount-products-picked" data-discount-pick-basket-toggle>
                    <span class="cl-item-add-chev" aria-hidden="true">▾</span>
                    <span class="cl-eyebrow" th:text="#{store.discounts.pick.picked}"></span>
                    <span class="cl-item-add-basket-n" data-discount-pick-picked-count>0</span>
                </button>
                <button type="button" class="cl-link-button cl-item-add-basket-clear" data-discount-pick-clear
                        th:text="#{store.discounts.pick.clear}"></button>
                <div class="cl-item-add-basket-body" id="discount-products-picked">
                    <table class="cl-table is-compact cl-item-add-table">
                        <caption class="cl-visually-hidden" th:text="#{store.discounts.pick.picked}"></caption>
                        <tbody data-discount-pick-picked></tbody>
                    </table>
                    <p class="cl-list-empty" data-discount-pick-none th:text="#{store.discounts.products.none}"></p>
                </div>
            </div>
        </div>
        <div class="cl-dialog-actions">
            <button class="cl-button is-primary" type="button" data-discount-pick-submit disabled
                    th:text="#{store.discounts.pick.submit}"></button>
            <button class="cl-button" type="button" data-discount-pick-close th:text="#{general.cancel}"></button>
            <span class="cl-help" th:text="#{store.discounts.pick.products.hint}"></span>
        </div>
    </dialog>

    <dialog class="cl-dialog is-form" id="discount-brands-dialog" aria-labelledby="discount-brands-title"
            data-discount-dialog="brands"
            th:attr="data-pricelist-url=@{${pricelistUrl}},
                     data-count=#{store.discounts.pick.brands.count},
                     data-choose-label=#{store.discounts.pick.choose},
                     data-remove-label=#{store.discounts.picked.remove},
                     data-submit-label=#{store.discounts.pick.submit},
                     data-submit-count=#{store.discounts.pick.submit.count}">
        <h2 class="cl-dialog-title" id="discount-brands-title" th:text="#{store.discounts.brands.pick}"></h2>
        <div class="cl-dialog-body">
            <div class="cl-form-grid">
                <div class="cl-span-3 cl-field">
                    <label class="cl-label" for="discount-brands-catalog" th:text="#{store.discounts.pick.catalog}"></label>
                    <select class="cl-select" id="discount-brands-catalog" data-discount-pick-catalog>
                        <option value="" th:text="#{store.discounts.pick.catalog.choose}"></option>
                        <option th:each="catalog : ${catalogs}" th:value="${catalog.catalogId}" th:text="${catalog.name}"></option>
                    </select>
                </div>
                <div class="cl-span-3 cl-field">
                    <label class="cl-label" for="discount-brands-search" th:text="#{store.discounts.pick.search}"></label>
                    <input class="cl-input" type="search" id="discount-brands-search" data-discount-pick-search
                           th:placeholder="#{store.discounts.pick.search.brands}">
                </div>
            </div>
            <div class="cl-item-add-scroll">
                <table class="cl-table is-compact cl-item-add-table">
                    <caption class="cl-visually-hidden" th:text="#{store.discounts.brands.pick}"></caption>
                    <thead>
                    <tr>
                        <th scope="col" class="cl-table-check"><span class="cl-visually-hidden" th:text="#{store.discounts.pick.column.pick}"></span></th>
                        <th scope="col" th:text="#{store.discounts.pick.column.brand}"></th>
                        <th scope="col" class="is-numeric" th:text="#{store.discounts.pick.column.products}"></th>
                        <th scope="col" class="is-numeric" th:text="#{store.discounts.pick.column.categories}"></th>
                    </tr>
                    </thead>
                    <tbody data-discount-pick-rows></tbody>
                </table>
                <p class="cl-list-empty" data-discount-pick-state="loading" hidden th:text="#{store.discounts.pick.loading}"></p>
                <p class="cl-list-empty" data-discount-pick-state="noCatalog" th:text="#{store.discounts.pick.chooseCatalog}"></p>
                <p class="cl-list-empty" data-discount-pick-state="empty" hidden th:text="#{store.discounts.pick.empty}"></p>
                <p class="cl-list-empty" data-discount-pick-state="noResults" hidden th:text="#{store.discounts.pick.noResults}"></p>
            </div>
            <p class="cl-help" data-discount-pick-count></p>
            <div class="cl-item-add-basket" data-discount-pick-basket>
                <button type="button" class="cl-item-add-basket-head" aria-expanded="true"
                        aria-controls="discount-brands-picked" data-discount-pick-basket-toggle>
                    <span class="cl-item-add-chev" aria-hidden="true">▾</span>
                    <span class="cl-eyebrow" th:text="#{store.discounts.pick.picked}"></span>
                    <span class="cl-item-add-basket-n" data-discount-pick-picked-count>0</span>
                </button>
                <button type="button" class="cl-link-button cl-item-add-basket-clear" data-discount-pick-clear
                        th:text="#{store.discounts.pick.clear}"></button>
                <div class="cl-item-add-basket-body" id="discount-brands-picked">
                    <table class="cl-table is-compact cl-item-add-table">
                        <caption class="cl-visually-hidden" th:text="#{store.discounts.pick.picked}"></caption>
                        <tbody data-discount-pick-picked></tbody>
                    </table>
                    <p class="cl-list-empty" data-discount-pick-none th:text="#{store.discounts.brands.none}"></p>
                </div>
            </div>
        </div>
        <div class="cl-dialog-actions">
            <button class="cl-button is-primary" type="button" data-discount-pick-submit disabled
                    th:text="#{store.discounts.pick.submit}"></button>
            <button class="cl-button" type="button" data-discount-pick-close th:text="#{general.cancel}"></button>
            <span class="cl-help" th:text="#{store.discounts.pick.brands.hint}"></span>
        </div>
    </dialog>
</th:block>
