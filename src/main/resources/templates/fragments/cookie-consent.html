<th:block th:fragment="banner" xmlns:th="http://www.thymeleaf.org">
    <div th:if="${clarityProjectId != null and gtmContainerId != null}" id="cookieNotice"
         class="notification is-dark is-radiusless m-0"
         style="display: none; position: fixed; left: 0; right: 0; bottom: 0; z-index: 40;">
        <div class="is-flex is-flex-wrap-wrap is-align-items-center is-justify-content-space-between">
            <p class="mr-4" th:text="#{cookie.notice.message}"></p>
            <div class="buttons mb-0 mt-2">
                <button type="button" id="cookieNoticeAccept" class="button is-small is-primary"
                        th:text="#{cookie.notice.accept}"></button>
                <button type="button" id="cookieNoticeDecline" class="button is-small"
                        th:text="#{cookie.notice.decline}"></button>
            </div>
        </div>
    </div>
    <script th:if="${clarityProjectId != null and gtmContainerId != null}">
        (function () {
            var banner = document.getElementById("cookieNotice");
            if (!banner) {
                return;
            }
            if (!document.cookie.match(/(?:^|; )cookieNotice=/)) {
                banner.style.display = "block";
            }

            function dismiss() {
                document.cookie = "cookieNotice=seen; path=/; max-age=31536000; SameSite=Lax";
                banner.style.display = "none";
            }

            document.getElementById("cookieNoticeAccept").addEventListener("click", dismiss);
            document.getElementById("cookieNoticeDecline").addEventListener("click", dismiss);
        })();
    </script>
</th:block>
