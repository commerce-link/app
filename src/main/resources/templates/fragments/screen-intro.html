<!DOCTYPE HTML>
<html xmlns:th="http://www.thymeleaf.org">
<body>

<button th:fragment="toggle" type="button" class="screen-intro-toggle" data-intro-toggle
        th:attr="aria-label=#{intro.toggle}">?</button>

<div th:fragment="panel(screen, icon)" class="screen-intro" th:id="${'screen-intro-' + screen}"
     th:attr="data-intro-panel=${screen}" hidden>
    <button type="button" class="cl-icon-button screen-intro-close" data-intro-dismiss th:attr="aria-label=#{general.close}">
        <i class="fas fa-times" aria-hidden="true"></i>
    </button>
    <div class="screen-intro-inner">
    <div class="screen-intro-body">
        <div class="screen-intro-icon" aria-hidden="true">
            <i th:class="${icon}"></i>
        </div>
        <div class="screen-intro-text">
            <p class="screen-intro-eyebrow" th:text="#{intro.eyebrow}"></p>
            <h2 class="screen-intro-title" th:text="#{${'intro.' + screen + '.title'}}"></h2>
            <p class="screen-intro-lead" th:text="#{${'intro.' + screen + '.lead'}}"></p>
            <ul class="screen-intro-list">
                <li th:each="i : ${#numbers.sequence(1, 5)}" th:if="${#messages.msgOrNull('intro.' + screen + '.item' + i) != null}">
                    <span class="screen-intro-check" aria-hidden="true"><i class="fas fa-check"></i></span>
                    <span>
                        <strong th:text="#{${'intro.' + screen + '.item' + i}}"></strong>
                        <span th:text="'— ' + #{${'intro.' + screen + '.item' + i + '.text'}}"></span>
                    </span>
                </li>
            </ul>
        </div>
    </div>
    <div class="screen-intro-footer">
        <button type="button" class="cl-button is-primary" data-intro-dismiss th:text="#{intro.dismiss}"></button>
        <span class="screen-intro-hint" th:text="#{intro.hint}"></span>
    </div>
    </div>
    <!--/* Not deferred: the panel is shown before the first paint, so a guide seen earlier does not flash */-->
    <script th:src="@{/js/screen-intro.js}"></script>
</div>

</body>
</html>
