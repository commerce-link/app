<!DOCTYPE HTML>
<html xmlns:th="http://www.thymeleaf.org">
<body>

<header th:fragment="header(intro, actions)" th:if="${settingsPage != null}" class="cl-page-header">
    <a th:if="${settingsPage.homeHref() != null}" class="cl-back" th:href="@{${settingsPage.homeHref()}}">
        <span class="icon is-small" aria-hidden="true"><i class="fas fa-chevron-left"></i></span>
        <span th:text="#{nav.settings}"></span>
    </a>
    <div class="cl-page-header-row">
        <h1 class="cl-page-title" th:text="#{${settingsPage.tile().titleKey()}}"></h1>
        <th:block th:if="${intro}">
            <button th:replace="~{fragments/screen-intro :: toggle}"></button>
        </th:block>
        <div th:if="${actions != null}" class="cl-page-actions">
            <th:block th:replace="${actions}"></th:block>
        </div>
    </div>
    <div class="cl-page-lead" th:text="#{${settingsPage.tile().descriptionKey()}}"></div>
</header>

<!--/* Header of a page below a settings page (a record's form, a confirmation): back to the parent page, own title. */-->
<!--/* A div, not a header element: "header" is also the name of the fragment above and would select both. */-->
<div th:fragment="subpage(backHref, backLabel, title)" class="cl-page-header">
    <a class="cl-back" th:href="@{${backHref}}">
        <span class="icon is-small" aria-hidden="true"><i class="fas fa-chevron-left"></i></span>
        <span th:text="${backLabel}"></span>
    </a>
    <div class="cl-page-header-row">
        <h1 class="cl-page-title" th:text="${title}"></h1>
    </div>
</div>

<!--/* Subpage header with a lead line and actions on the right (catalog pages: "Add products", "Category settings").
       Both are optional; the actions slot is a fragment block (~{::x}) or null.
       lead is either plain text, printed escaped, or a fragment block (e.g. ~{::x}) when the caller needs markup such
       as a status pill or a link. Never HTML put together in a controller. */-->
<div th:fragment="subpageWithActions(backHref, backLabel, title, lead, actions)" class="cl-page-header">
    <a class="cl-back" th:href="@{${backHref}}">
        <span class="icon is-small" aria-hidden="true"><i class="fas fa-chevron-left"></i></span>
        <span th:text="${backLabel}"></span>
    </a>
    <div class="cl-page-header-row">
        <h1 class="cl-page-title" th:text="${title}"></h1>
        <div th:if="${actions != null}" class="cl-page-actions">
            <th:block th:replace="${actions}"></th:block>
        </div>
    </div>
    <p th:if="${lead != null and lead instanceof T(org.thymeleaf.standard.expression.Fragment)}" class="cl-page-lead">
        <th:block th:insert="${lead}"></th:block>
    </p>
    <p th:if="${lead != null and !(lead instanceof T(org.thymeleaf.standard.expression.Fragment))}"
       class="cl-page-lead" th:text="${lead}"></p>
</div>

<!--/* Header of a record page with a status (an order): back link (or none, backHref null), h1 with the status pill and
       its action beside it, the meta lines below and actions on the right. titleAction (the copy icon of the number),
       status, meta and actions are fragment blocks (~{::x}) or null; titleAction stays glued to the end of the h1, so
       on a narrow screen it never wraps alone onto the next line. title is plain text, printed escaped, or a fragment block
       when the heading needs markup (a document number with break opportunities). */-->
<div th:fragment="record(backHref, backLabel, title, titleAction, status, meta, actions)" class="cl-page-header">
    <a th:if="${backHref != null}" class="cl-back" th:href="@{${backHref}}">
        <span class="icon is-small" aria-hidden="true"><i class="fas fa-chevron-left"></i></span>
        <span th:text="${backLabel}"></span>
    </a>
    <div class="cl-page-header-row is-record">
        <div class="cl-record-title">
            <div class="cl-record-name">
                <h1 th:if="${title instanceof T(org.thymeleaf.standard.expression.Fragment)}" class="cl-page-title"><th:block th:insert="${title}"></th:block></h1>
                <h1 th:unless="${title instanceof T(org.thymeleaf.standard.expression.Fragment)}" class="cl-page-title" th:text="${title}"></h1>
                <th:block th:if="${titleAction != null}">
                    <th:block th:insert="${titleAction}"></th:block>
                </th:block>
            </div>
            <th:block th:if="${status != null}">
                <th:block th:insert="${status}"></th:block>
            </th:block>
        </div>
        <div th:if="${actions != null}" class="cl-page-actions">
            <th:block th:insert="${actions}"></th:block>
        </div>
    </div>
    <th:block th:if="${meta != null}">
        <th:block th:insert="${meta}"></th:block>
    </th:block>
</div>

</body>
</html>
