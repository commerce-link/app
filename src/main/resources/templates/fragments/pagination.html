<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<div th:fragment="pagination(actionUrl, currentPage, hasNextPage, extraParams)">
    <div class="pagination-controls mt-5 mb-5" style="display: flex; justify-content: center;">
        <nav class="pagination is-small" role="navigation" aria-label="pagination"
             style="max-width: fit-content; margin: 0">

            <form th:action="${actionUrl}" method="get" style="display: inline;">
                <input type="hidden" name="page" th:value="${currentPage - 1}" />
                <div th:if="${extraParams != null}" th:each="entry : ${extraParams}">
                    <input type="hidden" th:name="${entry.key}" th:value="${entry.value}" />
                </div>
                <button th:text="#{general.pagination.previous}" class="pagination-previous"
                        type="submit"
                        th:disabled="${currentPage <= 1}"></button>
            </form>

            <form th:action="${actionUrl}" method="get" style="display: inline;">
                <input type="hidden" name="page" th:value="${currentPage + 1}" />
                <div th:if="${extraParams != null}" th:each="entry : ${extraParams}">
                    <input type="hidden" th:name="${entry.key}" th:value="${entry.value}" />
                </div>
                <button th:text="#{general.pagination.next}" class="pagination-next"
                        type="submit"
                        th:disabled="${!hasNextPage}"></button>
            </form>
        </nav>
    </div>
</div>
<!--/* Server-side paging of a cl-table: the record already carries the neighbour links, nothing renders at one page. */-->
<nav th:fragment="pages(pagination)" th:if="${pagination.isNeeded()}" class="cl-pagination"
     th:attr="aria-label=#{general.pagination.label}">
    <a th:if="${pagination.previousHref() != null}" class="cl-button" th:href="@{${pagination.previousHref()}}"
       th:text="'‹ ' + #{general.pagination.previous}" data-cl-orders-nav></a>
    <span th:unless="${pagination.previousHref() != null}" class="cl-button is-disabled"
          th:text="'‹ ' + #{general.pagination.previous}"></span>
    <span class="cl-pagination-page" th:text="#{general.pagination.range(${pagination.fromIndex() + 1}, ${pagination.toIndex()}, ${pagination.totalItems()})}"></span>
    <a th:if="${pagination.nextHref() != null}" class="cl-button" th:href="@{${pagination.nextHref()}}"
       th:text="#{general.pagination.next} + ' ›'" data-cl-orders-nav></a>
    <span th:unless="${pagination.nextHref() != null}" class="cl-button is-disabled"
          th:text="#{general.pagination.next} + ' ›'"></span>
</nav>
</body>
</html>
