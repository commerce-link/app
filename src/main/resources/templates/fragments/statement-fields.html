<!DOCTYPE HTML>
<html xmlns:th="http://www.thymeleaf.org">
<body>

<!--/* A column of the statement format: the header text typed or picked from the sample's headers (datalist
       statement-headers, empty without a sample). help is already resolved, or null. */-->
<div th:fragment="columnField(name, labelKey, value, required, errorKey, help)" class="cl-field">
    <label class="cl-label" th:for="${name}">
        <span th:text="#{${labelKey}}"></span>
        <span th:unless="${required}" class="cl-optional" th:text="#{form.optional}"></span>
    </label>
    <input class="cl-input" th:classappend="${errorKey != null} ? 'is-invalid'" type="text" autocomplete="off"
           list="statement-headers" th:id="${name}" th:name="${name}" th:value="${value}"
           th:attr="aria-invalid=${errorKey != null ? 'true' : null},
                    aria-describedby=${(help != null or errorKey != null) ? ((help != null ? name + '-help' : '') + (help != null and errorKey != null ? ' ' : '') + (errorKey != null ? name + '-error' : '')) : null}"/>
    <p th:if="${help != null}" class="cl-help" th:id="${name} + '-help'" th:text="${help}"></p>
    <p th:if="${errorKey != null}" class="cl-field-error" th:id="${name} + '-error'">
        <i class="fas fa-exclamation-circle" aria-hidden="true"></i>
        <span th:text="#{${errorKey}}"></span>
    </p>
</div>

<!--/* The fields of one payout row: what the format form posts. Without JavaScript they are the editable table; with it
       static/js/payout-rows.js hides them and edits them through its dialog. index is the row's index, or '@INDEX@' in
       the blank row the script copies (channel is then null). Uses errors, sourceOptions and methodOptions of the page. */-->
<tr th:fragment="payoutRow(channel, index)" data-cl-payout-row
    th:with="matchId=|channel-${index}-match|, sourceId=|channel-${index}-source|, methodId=|channel-${index}-method|,
             netId=|channel-${index}-netOfFees|, feeRatesId=|channel-${index}-feeRates|, feeLimitId=|channel-${index}-maxFeePercent|">
    <td>
        <input class="cl-input" type="text" autocomplete="off" th:id="${matchId}"
               th:name="|channels[${index}].match|" th:value="${channel?.match}"
               th:classappend="${errors.get(matchId) != null} ? 'is-invalid'"
               th:attr="aria-label=#{store.payments.statement.channels.match}, aria-invalid=${errors.get(matchId) != null ? 'true' : null}"/>
        <p th:if="${errors.get(matchId) != null}" class="cl-field-error">
            <i class="fas fa-exclamation-circle" aria-hidden="true"></i>
            <span th:text="#{${errors.get(matchId)}}"></span>
        </p>
    </td>
    <td>
        <select class="cl-select" th:id="${sourceId}" th:name="|channels[${index}].source|"
                th:classappend="${errors.get(sourceId) != null} ? 'is-invalid'"
                th:attr="aria-label=#{store.payments.statement.channels.source}, aria-invalid=${errors.get(sourceId) != null ? 'true' : null}">
            <option th:each="option : ${sourceOptions}" th:value="${option.value()}" th:text="${option.label()}"
                    th:selected="${option.value() == (channel?.source == null ? '' : channel.source)}"></option>
        </select>
        <p th:if="${errors.get(sourceId) != null}" class="cl-field-error">
            <i class="fas fa-exclamation-circle" aria-hidden="true"></i>
            <span th:text="#{${errors.get(sourceId)}}"></span>
        </p>
    </td>
    <td>
        <select class="cl-select" th:id="${methodId}" th:name="|channels[${index}].method|"
                th:classappend="${errors.get(methodId) != null} ? 'is-invalid'"
                th:attr="aria-label=#{store.payments.statement.channels.method}, aria-invalid=${errors.get(methodId) != null ? 'true' : null}">
            <option th:each="option : ${methodOptions}" th:value="${option.value()}" th:text="${option.label()}"
                    th:selected="${option.value() == (channel?.method == null ? '' : channel.method)}"></option>
        </select>
        <p th:if="${errors.get(methodId) != null}" class="cl-field-error">
            <i class="fas fa-exclamation-circle" aria-hidden="true"></i>
            <span th:text="#{${errors.get(methodId)}}"></span>
        </p>
    </td>
    <td>
        <label class="cl-check">
            <input type="checkbox" value="true" th:id="${netId}" th:name="|channels[${index}].netOfFees|"
                   th:checked="${channel?.netOfFees}"/>
            <span th:text="#{store.payments.statement.channels.net.short}"></span>
        </label>
    </td>
    <td>
        <input class="cl-input is-qty" type="text" autocomplete="off" th:id="${feeRatesId}"
               th:name="|channels[${index}].feeRates|" th:value="${channel?.feeRates}"
               th:placeholder="#{store.payments.statement.channels.feeRates.placeholder}"
               th:classappend="${errors.get(feeRatesId) != null} ? 'is-invalid'"
               th:attr="aria-label=#{store.payments.statement.channels.feeRates}, aria-invalid=${errors.get(feeRatesId) != null ? 'true' : null}"/>
        <p th:if="${errors.get(feeRatesId) != null}" class="cl-field-error">
            <i class="fas fa-exclamation-circle" aria-hidden="true"></i>
            <span th:text="#{${errors.get(feeRatesId)}}"></span>
        </p>
    </td>
    <td>
        <input class="cl-input is-qty" type="text" inputmode="decimal" autocomplete="off" th:id="${feeLimitId}"
               th:name="|channels[${index}].maxFeePercent|" th:value="${channel?.maxFeePercent}"
               th:classappend="${errors.get(feeLimitId) != null} ? 'is-invalid'"
               th:attr="aria-label=#{store.payments.statement.channels.feeLimit}, aria-invalid=${errors.get(feeLimitId) != null ? 'true' : null}"/>
        <p th:if="${errors.get(feeLimitId) != null}" class="cl-field-error">
            <i class="fas fa-exclamation-circle" aria-hidden="true"></i>
            <span th:text="#{${errors.get(feeLimitId)}}"></span>
        </p>
    </td>
</tr>

</body>
</html>
