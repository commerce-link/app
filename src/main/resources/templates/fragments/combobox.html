<!DOCTYPE HTML>
<html xmlns:th="http://www.thymeleaf.org">
<body>

<!--/* One value out of a flat list of options, typed to filter: an editable combobox (one text field) on the tree picker's
       skin (fragments/category-picker), for options that are known when the page is drawn. An option is its label with
       an optional grey second line (ComboboxOption.meta).

       Progressive enhancement: the native select is the field without JavaScript ("label — note" per option).
       static/js/combobox.js shows the text field instead, moves the name to the hidden input and fires
       "cl:combobox-change" on the .cl-combobox when a choice is made with Enter or a click -- never on the arrows.
       The text field shows the chosen label; whatever was typed and not picked goes back to it.

       The label of the field carries the id fieldId + '-label' and points at the select (for = fieldId); the script
       points it at the text field. describedBy is the id list of the help and the error under the field, or null. */-->
<div th:fragment="combobox(fieldId, name, options, selected, placeholder, required, autofocus, describedBy, invalid)"
     class="cl-picker cl-combobox" data-cl-combobox
     th:with="labelledBy=${fieldId + '-label'},
              selectedLabel=${T(pl.commercelink.web.dtos.ComboboxOption).labelOf(options, selected)}">
    <select class="cl-select" th:id="${fieldId}" th:name="${name}" th:required="${required}" data-combobox-select
            th:autofocus="${autofocus}" th:classappend="${invalid} ? 'is-invalid'"
            th:attr="aria-invalid=${invalid} ? 'true' : null, aria-describedby=${describedBy}">
        <option value="" th:selected="${selectedLabel == null}" th:text="${placeholder}"></option>
        <option th:each="option : ${options}" th:value="${option.value()}"
                th:selected="${option.value() == selected}" th:text="${option.selectText()}"></option>
    </select>
    <!--/* Disabled, so the form does not post it next to the select; the script enables it as it hides the select. */-->
    <input type="hidden" th:name="${name}" th:value="${selectedLabel == null} ? '' : ${selected}" disabled data-combobox-value>

    <div class="cl-picker-field cl-combobox-field" data-combobox hidden>
        <!--/* No name: the hidden input above carries the value. required here gives the field its required state and
               the browser's message for an empty submit -- the text is empty exactly when nothing is chosen, since a
               half-typed text never stays. */-->
        <input class="cl-input cl-combobox-input" type="text" th:id="${fieldId + '-input'}" data-combobox-input
               role="combobox" aria-autocomplete="list" aria-expanded="false" autocomplete="off" spellcheck="false"
               th:required="${required}" th:classappend="${invalid} ? 'is-invalid'"
               th:value="${selectedLabel}" th:placeholder="${placeholder}" th:attr="aria-controls=${fieldId + '-listbox'},
                        aria-labelledby=${labelledBy}, aria-describedby=${describedBy},
                        aria-invalid=${invalid} ? 'true' : null">
        <!--/* Out of the Tab order (the text field opens the list itself); a pointer shortcut, as in the APG example. */-->
        <button type="button" class="cl-combobox-toggle" tabindex="-1" data-combobox-toggle aria-expanded="false"
                th:attr="aria-controls=${fieldId + '-listbox'}, aria-label=#{picker.toggle}">
            <i class="fas fa-angle-down" aria-hidden="true"></i>
        </button>
        <div class="cl-picker-menu" hidden>
            <!--/* tabindex -1: Chromium would make the scrolling list a Tab stop of its own (see the tree picker). */-->
            <div class="cl-picker-list" role="listbox" tabindex="-1" data-combobox-list
                 th:id="${fieldId + '-listbox'}" th:attr="aria-labelledby=${labelledBy}">
                <div class="cl-picker-option" role="option" th:each="option, optionStatus : ${options}"
                     th:id="${fieldId + '-option-' + optionStatus.index}"
                     th:classappend="${option.value() == selected} ? 'is-selected'"
                     th:attr="aria-selected=${option.value() == selected}, data-value=${option.value()},
                              data-label=${option.label()}, aria-label=${option.accessibleName()}">
                    <span class="cl-picker-option-text">
                        <span class="cl-picker-name" th:text="${option.label()}"></span>
                        <span class="cl-picker-meta" th:if="${option.meta() != null}" th:text="${option.meta()}"></span>
                    </span>
                    <i class="fas fa-check cl-combobox-check" aria-hidden="true"></i>
                </div>
            </div>
            <p class="cl-picker-empty" data-combobox-empty hidden th:text="#{picker.empty}"></p>
            <!--/* Announced a moment after the typing stops, not on every key (the tree picker's chatty count, §7). */-->
            <p class="cl-help cl-picker-count" role="status" data-combobox-count
               th:attr="data-combobox-count-template=#{picker.count}"></p>
        </div>
    </div>
</div>

</body>
</html>
