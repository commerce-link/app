<!-- fragments/item-add-modal.html: shared by the order details and the offer details (actionPrefix) -->
<div class="cl-page cl-dialog-host" th:fragment="itemAddModal (entityId, actionPrefix)">
    <dialog class="cl-dialog is-form is-wide" id="item-add-dialog" aria-labelledby="item-add-title"
            th:attr="data-pricelist-url=@{/dashboard/pricelist},
                     data-add-items-url=@{|${actionPrefix}/${entityId}/add-items|},
                     data-days-suffix=#{item.add.days.suffix},
                     data-inventory-tag=#{item.add.list.inventory.tag},
                     data-inventory-price=#{item.add.list.inventory.price},
                     data-remove-label=#{item.add.list.remove},
                     data-qty-label=#{offers.quantity},
                     data-add-label=#{general.add},
                     data-submit-label=#{item.add.submit},
                     data-submit-count=#{item.add.submit.count},
                     data-summary=#{item.add.summary},
                     data-summary-unpriced=#{item.add.summary.unpriced}">
        <h2 class="cl-dialog-title" id="item-add-title" th:text="#{item.add.title}"></h2>
        <div class="cl-dialog-body">
            <div class="cl-segmented is-inline" role="group" th:attr="aria-label=#{item.add.source}">
                <button type="button" class="cl-segment" id="itemAddTabPricelist" data-item-add-tab="pricelist" aria-pressed="true"
                        th:text="#{item.add.tab.pricelist}"></button>
                <button type="button" class="cl-segment" id="itemAddTabInventory" data-item-add-tab="inventory" aria-pressed="false"
                        th:text="#{item.add.tab.inventory}"></button>
            </div>

            <div id="itemAddPricelistPane">
                <div class="cl-form-grid">
                    <div class="cl-span-2 cl-field">
                        <label class="cl-label" for="itemAddCatalog" th:text="#{item.add.catalog}"></label>
                        <select class="cl-select" id="itemAddCatalog">
                            <option value="" th:text="#{orders.select.catalog}"></option>
                            <option th:each="catalog : ${catalogs}" th:value="${catalog.catalogId}" th:text="${catalog.name}"></option>
                        </select>
                    </div>
                    <div class="cl-span-2 cl-field">
                        <label class="cl-label" for="itemAddCategory" th:text="#{product.category}"></label>
                        <select class="cl-select" id="itemAddCategory" th:attr="data-placeholder=#{item.add.all.categories}"></select>
                    </div>
                    <div class="cl-span-2 cl-field">
                        <label class="cl-label" for="itemAddLabel" th:text="#{order.item.assign.sku.label}"></label>
                        <select class="cl-select" id="itemAddLabel" th:attr="data-placeholder=#{item.add.all.labels}"></select>
                    </div>
                    <div class="cl-span-6 cl-field">
                        <label class="cl-label" for="itemAddSearch" th:text="#{general.search}"></label>
                        <input class="cl-input" type="search" id="itemAddSearch" th:placeholder="#{item.add.search.placeholder}">
                    </div>
                </div>
                <div class="cl-item-add-scroll">
                    <table class="cl-table is-compact cl-item-add-table">
                        <caption class="cl-visually-hidden" th:text="#{item.add.tab.pricelist}"></caption>
                        <thead>
                        <tr>
                            <th scope="col" class="cl-table-check"><span class="cl-visually-hidden" th:text="#{order.item.assign.sku.pick}"></span></th>
                            <th scope="col"><button type="button" class="cl-table-sort" data-item-add-sort="name">
                                <span th:text="#{order.item.name}"></span> <span class="cl-item-add-arrow" id="itemAddArrowName"></span></button></th>
                            <th scope="col" th:text="#{product.category}"></th>
                            <th scope="col" class="is-numeric"><button type="button" class="cl-table-sort" data-item-add-sort="price">
                                <span th:text="#{item.add.price.gross}"></span> <span class="cl-item-add-arrow" id="itemAddArrowPrice"></span></button></th>
                            <th scope="col" class="is-numeric" th:text="#{order.item.assign.sku.availability}"></th>
                            <th scope="col" class="is-numeric" th:text="#{item.add.delivery}"></th>
                            <th scope="col" class="is-numeric" th:text="#{offers.quantity}"></th>
                        </tr>
                        </thead>
                        <tbody id="itemAddRows"></tbody>
                    </table>
                    <p class="cl-list-empty" id="itemAddLoading" hidden th:text="#{item.add.loading}"></p>
                    <p class="cl-list-empty" id="itemAddNoCatalog" th:text="#{item.add.select.catalog.hint}"></p>
                    <p class="cl-list-empty" id="itemAddNoResults" hidden th:text="#{order.item.assign.sku.no.results}"></p>
                </div>
                <p class="cl-help" id="itemAddCount" th:attr="data-template=#{item.add.count}"></p>
            </div>

            <div id="itemAddInventoryPane" hidden>
                <div class="cl-form-grid">
                    <div class="cl-span-2 cl-field">
                        <label class="cl-label" for="itemAddEan" th:text="#{general.ean}"></label>
                        <input class="cl-input" type="text" id="itemAddEan" th:placeholder="#{inventory.ean.placeholder}">
                    </div>
                    <div class="cl-span-2 cl-field">
                        <label class="cl-label" for="itemAddMfn" th:text="#{general.manufacturer.code}"></label>
                        <input class="cl-input" type="text" id="itemAddMfn" th:placeholder="#{inventory.product.code.placeholder}">
                    </div>
                    <div class="cl-span-2 cl-field">
                        <label class="cl-label" for="itemAddQty" th:text="#{offers.quantity}"></label>
                        <div class="cl-input-row">
                            <input class="cl-input is-qty" type="text" inputmode="numeric" id="itemAddQty" value="1">
                            <span class="cl-item-add-stepper-buttons">
                                <button type="button" class="cl-button is-icon" data-item-add-bump="-1" th:attr="aria-label=#{item.add.qty.less}">−</button>
                                <button type="button" class="cl-button is-icon" data-item-add-bump="1" th:attr="aria-label=#{item.add.qty.more}">+</button>
                            </span>
                        </div>
                    </div>
                </div>
                <p class="cl-card-actions">
                    <button class="cl-button" type="button" id="itemAddInventoryAdd" disabled th:text="#{item.add.inventory.add}"></button>
                </p>
                <p class="cl-help" th:text="#{item.add.inventory.hint}"></p>
            </div>

            <div class="cl-item-add-basket" id="itemAddBasket">
                <button type="button" class="cl-item-add-basket-head" aria-expanded="true" aria-controls="itemAddBasketBody" data-item-add-basket-toggle>
                    <span class="cl-item-add-chev" aria-hidden="true">▾</span>
                    <span th:text="#{item.add.list.title}"></span>
                    <span class="cl-item-add-basket-n" id="itemAddBasketCount">0</span>
                </button>
                <button type="button" class="cl-link-button cl-item-add-basket-clear" data-item-add-clear th:text="#{item.add.list.clear}"></button>
                <div class="cl-item-add-basket-body" id="itemAddBasketBody">
                    <table class="cl-table is-compact cl-item-add-table">
                        <caption class="cl-visually-hidden" th:text="#{item.add.list.title}"></caption>
                        <tbody id="itemAddBasketRows"></tbody>
                    </table>
                    <p class="cl-list-empty" id="itemAddBasketEmpty" th:text="#{item.add.list.empty}"></p>
                </div>
            </div>
        </div>
        <div class="cl-dialog-actions">
            <button class="cl-button is-primary" type="button" id="itemAddSubmit" disabled th:text="#{item.add.submit}"></button>
            <button class="cl-button" type="button" data-cl-item-add-close th:text="#{general.cancel}"></button>
            <span class="cl-help" id="itemAddHint" th:text="#{item.add.select.hint}" th:attr="data-select-hint=#{item.add.select.hint}"></span>
        </div>
    </dialog>
    <script th:src="@{/js/money.js}" defer></script>
    <script th:src="@{/js/item-add-dialog.js}" defer></script>
</div>
