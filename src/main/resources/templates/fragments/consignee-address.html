<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<!-- Customer address a dropship delivery ships to; used by the create, confirmation and approval screens. -->
<div class="box" th:fragment="consigneeAddress(consignee, pickupShipment)">
    <h3 class="title is-6" th:text="#{orders.dropship.consignee.address}">Customer address</h3>
    <p>
        <strong th:text="${consignee.displayName}">Jan Kowalski</strong><br/>
        <span th:text="${consignee.streetAndNumber}">ul. Polna 1</span><br/>
        <span th:text="${consignee.postalCode} + ' ' + ${consignee.city} + ', ' + ${consignee.country}">00-001 Warszawa, PL</span><br/>
        <span th:text="${consignee.phone}">+48601234567</span><br/>
        <span th:text="${consignee.email}">jan@example.com</span>
    </p>
    <p th:if="${pickupShipment != null}" class="mt-2">
        <span class="tag is-warning" th:text="#{orders.dropship.confirm.pickupPoint}">Pickup point</span>
        <strong th:text="${pickupShipment.carrier}">InPost</strong>
        <span th:text="${pickupShipment.collectionPointCode}">WAW04A</span>
    </p>
</div>
</body>
</html>
