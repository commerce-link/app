<!DOCTYPE HTML>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<!--/* Pieces of the destroyed archive (warehouse-destroyed.html); here because a fragment inside the page's layout:fragment
       would also render, with null parameters, as part of the page. */-->

<!--/* The rest of the archive query as hidden fields, so a menu's form never drops what the others set. */-->
<th:block th:fragment="hidden(skip)" th:with="q=${page.query()}">
    <th:block th:if="${skip != 'dates'}">
        <input type="hidden" name="period" th:if="${q.period().param() != ''}" th:value="${q.period().param()}"/>
        <input type="hidden" name="from" th:if="${q.from() != null}" th:value="${q.from()}"/>
        <input type="hidden" name="to" th:if="${q.to() != null}" th:value="${q.to()}"/>
    </th:block>
    <th:block th:if="${skip != 'categories'}"><input type="hidden" name="categories" th:each="c : ${q.categories()}" th:value="${c}"/></th:block>
    <th:block th:if="${skip != 'conditions'}"><input type="hidden" name="conditions" th:each="c : ${q.conditions()}" th:value="${c.name()}"/></th:block>
    <input type="hidden" name="q" th:if="${skip != 'search' and q.q() != null}" th:value="${q.q()}"/>
    <input type="hidden" name="sort" th:if="${q.sort() != null}" th:value="${q.sort().param()}"/>
    <input type="hidden" name="dir" th:if="${q.dir() != null}" th:value="${q.dir().param()}"/>
</th:block>

<th th:fragment="sortHead(sort, labelKey, extra)" scope="col" th:class="${extra}"
    th:with="h=${page.sortHeaders().get(T(pl.commercelink.warehouse.builtin.DestroyedListQuery.Sort).valueOf(sort))}"
    th:attr="aria-sort=${h.ariaSort()}">
    <a class="cl-table-sort" th:href="@{${h.href()}}" th:text="#{${labelKey}}" data-cl-list-nav></a>
</th>
</body>
</html>
