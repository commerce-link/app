<!DOCTYPE HTML>
<html xmlns:th="http://www.thymeleaf.org">
<body>

<!--
  Wraps one whole supplier section - heading, Add button and the table (with its own empty
  state) - so a single swap refreshes all of it, not just the table rows.

  Used two ways:
    - store-fulfilment.html replaces the static #external-supplier-section /
      #manual-supplier-section boxes with this fragment on the initial page load, via th:replace
      with explicit positional arguments;
    - StoreFulfilmentSupplierController and ManualSupplierController return the no-argument
      externalSection / manualSection wrapper fragments below as the response body of an async
      connect/edit/disconnect/save/delete. A view name returned from a controller is resolved by
      Spring's ThymeleafView, which (unlike th:replace/th:insert) rejects positional fragment
      parameters, so the wrappers take none and instead read the same values off the model
      (populated fresh after the mutation) before delegating to this fragment via th:replace.

  successMessage (nullable) is carried back as a data attribute on the fragment root rather than
  a flash attribute, since there is no redirect left to flash it through; the page script reads
  it once after the swap and shows it as a toast.

  showMode is carried back the same way (data-show-mode) so the external section's stable
  container always has a fresh reading of it after any swap: the fulfilment settings modal can
  flip canUseGlobalSuppliers from a different section entirely, and the supplier modal's own mode
  selector (rendered once, outside this fragment) reads this attribute on every open instead of a
  page-load snapshot that a settings save would leave stale.
-->
<div th:fragment="supplierSection(rows, manual, showMode, titleKey, addButtonId, addButtonLabelKey, addDisabled, addDisabledTitleKey, successMessage)"
     th:attr="data-success-message=${successMessage},data-show-mode=${showMode}">
    <div class="is-flex is-justify-content-space-between is-align-items-center mb-3">
        <h2 class="subtitle mb-0" th:text="#{${titleKey}}"></h2>
        <button type="button" class="button is-primary is-small" th:id="${addButtonId}"
                th:text="#{${addButtonLabelKey}}"
                th:disabled="${addDisabled}"
                th:title="${addDisabled} ? #{${addDisabledTitleKey}} : ''"></button>
    </div>
    <div th:replace="~{fragments/supplier-table :: supplierTable(${rows}, ${manual}, ${showMode})}"></div>
</div>

<!-- No-argument selector for StoreFulfilmentSupplierController's async endpoints: sectionRows,
     sectionShowMode, sectionAvailableSuppliers and sectionSuccessMessage are model attributes set
     by SupplierSectionModel.renderExternalSection. -->
<div th:fragment="externalSection"
     th:replace="~{fragments/supplier-section :: supplierSection(${sectionRows}, false, ${sectionShowMode}, 'store.supplier.section.title', 'supplier-add-button', 'store.supplier.add.button', ${sectionAvailableSuppliers.isEmpty()}, 'store.supplier.add.none', ${sectionSuccessMessage})}"></div>

<!-- No-argument selector for ManualSupplierController's async endpoints: sectionRows and
     sectionSuccessMessage are model attributes set by SupplierSectionModel.renderManualSection. -->
<div th:fragment="manualSection"
     th:replace="~{fragments/supplier-section :: supplierSection(${sectionRows}, true, false, 'store.manual.section.title', 'manual-add-button', 'store.manual.add.button', false, null, ${sectionSuccessMessage})}"></div>

<!-- Small error carrier for a rejected connect/edit/save: a non-2xx status lets the page script
     tell this apart from a successful section swap, so the modal stays open with the operator's
     input untouched instead of being replaced by this notification. -->
<div th:fragment="sectionError" class="notification is-danger" th:text="${errorMessage}"></div>

</body>
</html>
