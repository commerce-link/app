<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<!--/* The "register payment" dialog, shared by the order details, Payments (payments.html) and Deliveries (through
       fragments/payments-section.html). formAction may be '' when a page script sets it per row; expectedAmount is the
       unpaid amount (0 when unknown); pendingPayment (or null) pre-fills the fields; paymentSources is a list of
       OrderLabels.Option<PaymentSource> (value + labelKey), like every other enum choice list on this page.
       loadMoneyJs is required (Thymeleaf's named-parameter fragment call rejects a missing declared parameter);
       every caller passes true except the order details page, which passes false because it also includes
       fragments/item-add-modal.html, which loads money.js already. */-->
<div class="cl-page cl-dialog-host" th:fragment="addPaymentModal(formAction, expectedAmount, pendingPayment, paymentSources, loadMoneyJs)">
    <dialog class="cl-dialog is-form" id="addPaymentModal" aria-labelledby="add-payment-title" data-mode="order"
            th:attr="data-hint=#{order.payment.hint}, data-hint-full=#{order.payment.hint.full},
                     data-hint-under=#{order.payment.hint.under}, data-hint-over=#{order.payment.hint.over}">
        <form method="post" th:action="${formAction}">
            <h2 class="cl-dialog-title" id="add-payment-title" th:text="#{order.payment.action.add.title}"></h2>
            <div class="cl-dialog-body">
                <div class="cl-form-grid">
                    <div class="cl-span-3 cl-field">
                        <label class="cl-label" for="addPaymentExpected" th:text="#{order.payment.expected.amount}"></label>
                        <input class="cl-input" type="text" readonly id="addPaymentExpected"
                               th:attr="data-value=${expectedAmount}" th:value="${#numbers.formatDecimal(expectedAmount, 1, 2)}">
                    </div>
                    <div class="cl-span-3 cl-field">
                        <label class="cl-label" for="addPaymentBankAmount" th:text="#{order.payment.bank.amount}"></label>
                        <input class="cl-input" type="number" step="0.01" required id="addPaymentBankAmount" name="bankAmount"
                               inputmode="decimal">
                    </div>
                    <div class="cl-span-3 cl-field">
                        <label class="cl-label" for="addPaymentProcessingFee" th:text="#{order.payment.processing.fee}"></label>
                        <input class="cl-input" type="number" step="0.01" min="0" id="addPaymentProcessingFee" name="processingFee"
                               inputmode="decimal"
                               th:value="${pendingPayment != null and pendingPayment.fee > 0} ? ${pendingPayment.fee} : '0'">
                    </div>
                    <div class="cl-span-3 cl-field">
                        <label class="cl-label" for="addPaymentDirection" th:text="#{order.payment.direction}"></label>
                        <select class="cl-select" name="direction" id="addPaymentDirection" required aria-describedby="addPaymentDirectionHelp">
                            <option value="Incoming" th:text="#{PaymentDirection.Incoming}"></option>
                            <option value="Outgoing" th:text="#{PaymentDirection.Outgoing}"></option>
                        </select>
                    </div>
                    <p class="cl-span-6 cl-help" id="addPaymentDirectionHelp" th:text="#{order.payment.direction.help}"></p>

                    <div class="cl-span-6 cl-field" data-payment-mode="order">
                        <label class="cl-check">
                            <input type="checkbox" id="addPaymentFeeAutofill">
                            <span th:text="#{order.payment.fee.autofill}"></span>
                        </label>
                        <p class="cl-help" th:text="#{order.payment.fee.autofill.help}"></p>
                    </div>
                    <div class="cl-span-6 cl-field" data-payment-mode="order">
                        <label class="cl-check">
                            <input type="checkbox" id="addPaymentFeeIncluded" name="feeIncluded" value="true">
                            <span th:text="#{order.payment.fee.included}"></span>
                        </label>
                        <p class="cl-help" th:text="#{order.payment.fee.included.help}"></p>
                    </div>
                    <div class="cl-span-6 cl-field" data-payment-mode="delivery" hidden>
                        <label class="cl-check">
                            <input type="checkbox" id="addPaymentFeeFromSurplus">
                            <span th:text="#{delivery.payment.fee.from.surplus}"></span>
                        </label>
                        <p class="cl-help" th:text="#{delivery.payment.fee.from.surplus.help}"></p>
                    </div>
                    <p class="cl-span-6 cl-help cl-payment-hint" id="addPaymentComputed" aria-live="polite"></p>

                    <div class="cl-span-3 cl-field">
                        <label class="cl-label" for="addPaymentSource" th:text="#{order.payment.source}"></label>
                        <select class="cl-select" id="addPaymentSource" name="source" required>
                            <option th:each="source : ${paymentSources}" th:value="${source.value().name()}"
                                    th:selected="${pendingPayment != null and pendingPayment.source == source.value()}"
                                    th:text="#{${source.labelKey()}}"></option>
                        </select>
                    </div>
                    <div class="cl-span-3 cl-field">
                        <label class="cl-label" for="addPaymentName" th:text="#{payments.source.name}"></label>
                        <input class="cl-input" type="text" id="addPaymentName" name="name" autocomplete="off"
                               th:value="${pendingPayment != null} ? ${pendingPayment.name} : ''">
                    </div>
                    <div class="cl-span-2 cl-field">
                        <label class="cl-label" for="addPaymentReference" th:text="#{order.payment.reference.no}"></label>
                        <input class="cl-input" type="text" id="addPaymentReference" name="referenceNo" autocomplete="off"
                               th:value="${pendingPayment != null} ? ${pendingPayment.referenceNo} : ''">
                    </div>
                    <div class="cl-span-2 cl-field">
                        <label class="cl-label" for="addPaymentBankNo" th:text="#{order.payment.bank.transaction.no}"></label>
                        <input class="cl-input" type="text" id="addPaymentBankNo" name="bankTransactionNo" autocomplete="off"
                               th:value="${pendingPayment != null} ? ${pendingPayment.bankTransactionNo} : ''">
                    </div>
                    <div class="cl-span-2 cl-field">
                        <label class="cl-label" for="addPaymentBankDate" th:text="#{order.payment.bank.transaction.date}"></label>
                        <input class="cl-input" type="date" id="addPaymentBankDate" name="bankTransactionDate"
                               th:value="${pendingPayment != null} ? ${pendingPayment.bankTransactionDate} : ''">
                    </div>
                </div>
            </div>
            <div class="cl-dialog-actions">
                <button class="cl-button is-primary" type="submit" th:text="#{order.payment.save}"></button>
                <button class="cl-button" type="button" data-cl-payment-close th:text="#{general.cancel}"></button>
            </div>
        </form>
    </dialog>
    <!--/* loadMoneyJs is false only on the order details page, where fragments/item-add-modal.html is included
           on the same page and already loads money.js -- loading it twice would run its IIFE twice. Every other
           caller passes true explicitly (Thymeleaf requires it); the "== null" half of the guard only matters
           for a test that calls this fragment directly with ${null}. */-->
    <script th:if="${loadMoneyJs == null or loadMoneyJs}" th:src="@{/js/money.js}" defer></script>
    <script th:src="@{/js/add-payment-dialog.js}" defer></script>
</div>
</body>
</html>
