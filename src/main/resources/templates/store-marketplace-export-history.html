<!DOCTYPE HTML>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}">
<body>
<div layout:fragment="content">
    <section class="cl-page">
        <div class="cl-page-body">
            <div th:replace="~{fragments/settings-header :: subpage(${marketplacesHref}, ${backLabel}, ${pageTitle})}"></div>

            <div class="cl-stack">
                <section class="cl-card" id="marketplace-export-history" aria-labelledby="export-runs-title">
                    <div class="cl-card-head">
                        <h2 class="cl-card-title" id="export-runs-title" th:text="#{store.marketplaces.exports.runs.title}"></h2>
                    </div>
                    <p class="cl-card-desc" th:text="#{store.marketplaces.exports.runs.description(${displayName})}"></p>

                    <p th:if="${exportRuns.isEmpty()}" class="cl-list-empty" th:text="#{store.marketplaces.exports.empty}"></p>

                    <ul th:unless="${exportRuns.isEmpty()}" class="cl-list" aria-labelledby="export-runs-title">
                        <li class="cl-list-item" th:each="run : ${exportRuns}">
                            <div>
                                <div class="cl-list-title">
                                    <a th:href="@{${marketplacesHref + '/exports/' + run.marketplace() + '/' + run.catalogId() + '/' + run.runId()}}"
                                       th:text="${T(pl.commercelink.marketplace.MarketplaceExportRunId).readable(run.runId())}"></a>
                                    <span th:unless="${run.failed()}" class="cl-status is-ok" th:text="#{store.marketplaces.exports.status.succeeded}"></span>
                                    <span th:if="${run.failed()}" class="cl-status is-warn" th:text="#{store.marketplaces.exports.status.failed}"></span>
                                </div>
                                <p class="cl-list-desc"
                                   th:text="#{store.marketplaces.exports.catalog(${catalogNames.getOrDefault(run.catalogId(), run.catalogId())})}"></p>
                            </div>
                        </li>
                    </ul>

                    <p th:if="${exportRuns.size() == runLimit}" class="cl-card-body cl-help" th:text="#{store.marketplaces.exports.limited(${runLimit})}"></p>
                </section>
            </div>
        </div>
    </section>
</div>
</body>
</html>
