<!DOCTYPE HTML>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}">
<body>
<div layout:fragment="content">
    <section class="cl-page">
        <div class="cl-page-body">
            <div th:replace="~{fragments/settings-header :: header(false, null)}"></div>
            <div th:replace="~{fragments/settings-form :: savedAlert}"></div>

            <div class="cl-stack">
                <!--/* Shipping integrations: the courier account (the default) and Wysyłam z Allegro, each edited on its
                       own page. Nothing here asks a provider: the rows show what the store has saved. */-->
                <section class="cl-card" id="shipping-integrations" aria-labelledby="shipping-integrations-title">
                    <div class="cl-card-head">
                        <h2 class="cl-card-title" id="shipping-integrations-title" th:text="#{settings.shipping.integrations.title}"></h2>
                        <a th:unless="${account.chosen()}" class="cl-button" th:href="@{${accountHref}}">
                            <i class="fas fa-plus" aria-hidden="true"></i>
                            <span th:text="#{store.shipping.account.connect}"></span>
                        </a>
                    </div>
                    <p class="cl-card-desc" th:text="#{settings.shipping.integrations.description}"></p>
                    <div th:if="${!account.chosen() and !allegroShipping.enabled()}" class="cl-alert is-warn" role="status">
                        <i class="fas fa-exclamation-triangle" aria-hidden="true"></i>
                        <span th:text="#{settings.shipping.integrations.none}"></span>
                    </div>
                    <ul th:if="${account.chosen() or allegroShipping.installed()}" class="cl-list"
                        aria-labelledby="shipping-integrations-title">
                        <li th:if="${account.chosen()}" class="cl-list-item"
                            th:with="name=${account.installed()} ? ${account.displayName()} : ${account.providerName()}">
                            <div>
                                <div class="cl-list-title">
                                    <span th:text="${name}"></span>
                                    <span class="cl-status is-info" th:text="#{settings.shipping.integrations.default}"></span>
                                    <span th:if="${account.installed() and !account.configured()}" class="cl-status is-warn"
                                          th:text="#{settings.list.incomplete}"></span>
                                    <span th:unless="${account.installed()}" class="cl-status is-warn"
                                          th:text="#{settings.shipping.integrations.unavailable}"></span>
                                </div>
                                <p class="cl-list-desc"
                                   th:text="${allegroShipping.enabled()} ? #{settings.shipping.integrations.default.scope}
                                            : #{settings.shipping.integrations.default.scope.only}"></p>
                                <p th:if="${account.configured() and webhookTokenMissing}" class="cl-list-desc is-warn"
                                   th:text="#{store.shipping.account.status.unverified(${name})}"></p>
                                <p th:if="${account.installed() and !account.configured()}" class="cl-list-desc is-warn"
                                   th:text="#{store.shipping.account.incomplete.text}"></p>
                                <p th:unless="${account.installed()}" class="cl-list-desc is-warn"
                                   th:text="#{store.shipping.account.missing.text}"></p>
                            </div>
                            <div class="cl-list-actions">
                                <a th:if="${account.installed()}" class="cl-link-button" th:href="@{${accountHref}}"
                                   th:text="${account.configured()} ? #{settings.list.edit} : #{settings.list.complete}"
                                   th:attr="aria-label=${account.configured()} ? #{settings.list.edit.for(${name})} : #{settings.list.complete.for(${name})}"></a>
                                <a class="cl-link-button is-danger" th:href="@{${disconnectHref}}" data-cl-confirm
                                   th:text="#{store.shipping.account.disconnect}"
                                   th:attr="aria-label=#{store.shipping.account.disconnect} + ': ' + ${name},
                                            data-cl-confirm-title=#{store.shipping.account.disconnect.title(${name})},
                                            data-cl-confirm-message=#{store.shipping.account.disconnect.message},
                                            data-cl-confirm-action=#{store.shipping.account.disconnect.action}"></a>
                            </div>
                        </li>
                        <li th:if="${allegroShipping.installed()}" class="cl-list-item">
                            <div>
                                <div class="cl-list-title">
                                    <span th:text="#{shipping.allegro.name}"></span>
                                    <span th:if="${allegroShipping.enabled()}" class="cl-status is-neutral"
                                          th:text="#{settings.shipping.integrations.allegro.badge}"></span>
                                </div>
                                <th:block th:if="${allegroShipping.enabled()}">
                                    <p class="cl-list-desc" th:text="#{settings.shipping.integrations.allegro.scope}"></p>
                                    <p class="cl-list-desc"
                                       th:text="#{settings.shipping.integrations.allegro.details(#{${allegroShipping.labelFormat().messageKey()}})}"></p>
                                </th:block>
                                <p th:if="${!allegroShipping.enabled() and allegroShipping.marketplaceConnected()}" class="cl-list-desc"
                                   th:text="#{settings.shipping.integrations.allegro.off}"></p>
                                <p th:if="${!allegroShipping.enabled() and !allegroShipping.marketplaceConnected()}" class="cl-list-desc"
                                   th:text="#{settings.shipping.integrations.allegro.noMarketplace}"></p>
                            </div>
                            <div class="cl-list-actions">
                                <a th:if="${allegroShipping.enabled()}" class="cl-link-button" th:href="@{${allegroHref}}"
                                   th:text="#{settings.list.edit}"
                                   th:attr="aria-label=#{settings.list.edit.for(#{shipping.allegro.name})}"></a>
                                <a th:if="${allegroShipping.enabled()}" class="cl-link-button is-danger"
                                   th:href="@{${allegroDisconnectHref}}" data-cl-confirm th:text="#{shipping.allegro.disconnect}"
                                   th:attr="aria-label=#{shipping.allegro.disconnect.for},
                                            data-cl-confirm-title=#{shipping.allegro.disconnect.title},
                                            data-cl-confirm-message=#{shipping.allegro.disconnect.message},
                                            data-cl-confirm-action=#{shipping.allegro.disconnect.action}"></a>
                                <a th:unless="${allegroShipping.enabled()}" class="cl-link-button" th:href="@{${allegroHref}}"
                                   th:text="#{settings.shipping.integrations.allegro.enable}"
                                   th:attr="aria-label=#{settings.shipping.integrations.allegro.enable.for}"></a>
                            </div>
                        </li>
                    </ul>
                    <p th:if="${account.chosen() and account.installed() and allegroShipping.enabled()}" class="cl-card-desc"
                       th:text="#{settings.shipping.integrations.rule(${account.displayName()})}"></p>
                </section>

                <section class="cl-card" id="shipping-carriers" aria-labelledby="shipping-carriers-title">
                    <div class="cl-card-head">
                        <h2 class="cl-card-title" id="shipping-carriers-title"
                            th:text="${account.installed()} ? #{store.shipping.carriers.title.of(${account.displayName()})} : #{store.shipping.carriers.title}"></h2>
                        <!--/* One setting, like the label sender: a text action; "+ Add" buttons belong to list cards. */-->
                        <div th:if="${account.configured()}" class="cl-list-actions">
                            <a class="cl-link-button" th:href="@{${carriersHref}}" th:text="#{store.shipping.carriers.choose}"
                               th:attr="aria-label=#{store.shipping.carriers.change.label}"></a>
                        </div>
                    </div>
                    <p class="cl-card-desc">
                        <span th:text="#{store.shipping.carriers.description}"></span>
                        <span th:if="${allegroShipping.enabled()}" th:text="#{store.shipping.carriers.allegro.note}"></span>
                    </p>
                    <p th:unless="${carriers.isEmpty()}" class="cl-card-body" th:text="${#strings.listJoin(carriers, ' · ')}"></p>
                    <p th:if="${carriers.isEmpty() and account.configured()}" class="cl-list-empty"
                       th:text="#{store.shipping.carriers.empty(${account.displayName()})}"></p>
                    <p th:if="${carriers.isEmpty() and !account.configured()}" class="cl-list-empty"
                       th:text="#{store.shipping.carriers.noAccount}"></p>
                </section>

                <section class="cl-card" id="shipping-addresses" aria-labelledby="shipping-addresses-title">
                    <div class="cl-card-head">
                        <h2 class="cl-card-title" id="shipping-addresses-title" th:text="#{store.shipping.addresses.title}"></h2>
                        <a class="cl-button" th:href="@{${newAddressHref}}">
                            <i class="fas fa-plus" aria-hidden="true"></i>
                            <span th:text="#{store.warehouse.addresses.add}"></span>
                        </a>
                    </div>
                    <p class="cl-card-desc" th:text="#{store.shipping.addresses.description}"></p>
                    <ul th:unless="${addresses.isEmpty()}" class="cl-list">
                        <li class="cl-list-item" th:each="address : ${addresses}"
                            th:with="name=${#strings.isEmpty(address.title())} ? #{settings.list.untitled} : ${address.title()}">
                            <div>
                                <div class="cl-list-title">
                                    <span th:text="${name}"></span>
                                    <span th:if="${address.isDefault()}" class="cl-status is-info" th:text="#{settings.list.default}"></span>
                                    <span th:unless="${address.complete()}" class="cl-status is-warn" th:text="#{settings.list.incomplete}"></span>
                                    <form th:if="${!address.isDefault() and address.complete()}" class="cl-list-title-action" method="post"
                                          th:action="@{${address.defaultHref()}}">
                                        <button type="submit" class="cl-link-button" th:text="#{settings.list.makeDefault}"
                                                th:attr="aria-label=#{settings.list.makeDefault.for(${name})}"></button>
                                    </form>
                                </div>
                                <p th:if="${address.addressLine() != null}" class="cl-list-desc" th:text="${address.addressLine()}"></p>
                                <p th:if="${address.contactLine() != null and address.complete()}" class="cl-list-desc" th:text="${address.contactLine()}"></p>
                                <p th:unless="${address.complete()}" class="cl-list-desc is-warn"
                                   th:text="#{store.warehouse.addresses.missing(${#strings.listJoin(#messages.listMsg(address.missingFieldKeys()), ', ')})}"></p>
                            </div>
                            <div class="cl-list-actions">
                                <a class="cl-link-button" th:href="@{${address.editHref()}}"
                                   th:text="${address.complete()} ? #{settings.list.edit} : #{settings.list.complete}"
                                   th:attr="aria-label=${address.complete()} ? #{settings.list.edit.for(${name})} : #{settings.list.complete.for(${name})}"></a>
                                <a class="cl-link-button is-danger" th:href="@{${address.deleteHref()}}" data-cl-confirm
                                   th:text="#{settings.list.delete}"
                                   th:attr="aria-label=#{settings.list.delete.for(${name})},
                                            data-cl-confirm-title=#{store.shipping.address.delete.title(${name})},
                                            data-cl-confirm-message=${address.isDefault()} ? #{store.shipping.address.delete.message.default} : #{store.shipping.address.delete.message},
                                            data-cl-confirm-action=#{store.shipping.address.delete.action}"></a>
                            </div>
                        </li>
                    </ul>
                    <p th:if="${addresses.isEmpty()}" class="cl-list-empty" th:text="#{store.shipping.addresses.empty}"></p>
                </section>

                <section class="cl-card" id="shipping-sender" aria-labelledby="shipping-sender-title">
                    <div class="cl-card-head">
                        <h2 class="cl-card-title" id="shipping-sender-title" th:text="#{store.shipping.sender.title}"></h2>
                        <div class="cl-list-actions">
                            <a class="cl-link-button" th:href="@{${senderHref}}" th:text="#{store.shipping.sender.change}"
                               th:attr="aria-label=#{store.shipping.sender.change.label}"></a>
                        </div>
                    </div>
                    <p class="cl-card-desc" th:text="#{store.shipping.sender.description}"></p>
                    <p th:if="${sender == null}" class="cl-card-body" th:text="#{store.shipping.sender.pickup}"></p>
                    <p th:if="${sender != null}" class="cl-card-body">
                        <span class="cl-card-body-title" th:text="${sender.title()}"></span>
                        <span th:if="${sender.addressLine() != null}" class="cl-card-body-line" th:text="${sender.addressLine()}"></span>
                    </p>
                </section>

                <section class="cl-card" id="shipping-templates" aria-labelledby="shipping-templates-title">
                    <div class="cl-card-head">
                        <h2 class="cl-card-title" id="shipping-templates-title" th:text="#{store.shipping.templates.title}"></h2>
                        <a class="cl-button" th:href="@{${newTemplateHref}}">
                            <i class="fas fa-plus" aria-hidden="true"></i>
                            <span th:text="#{store.shipping.templates.add}"></span>
                        </a>
                    </div>
                    <p class="cl-card-desc" th:text="#{store.shipping.templates.description}"></p>
                    <ul th:unless="${templates.isEmpty()}" class="cl-list">
                        <li class="cl-list-item" th:each="template : ${templates}"
                            th:with="name=${#strings.isEmpty(template.name())} ? #{settings.list.untitled} : ${template.name()}">
                            <div>
                                <div class="cl-list-title">
                                    <span th:text="${name}"></span>
                                    <span th:if="${template.isDefault()}" class="cl-status is-info" th:text="#{settings.list.default}"></span>
                                    <span th:if="${template.forReturns()}" class="cl-status is-neutral" th:text="#{store.shipping.templates.returns}"></span>
                                    <span th:unless="${template.complete()}" class="cl-status is-warn" th:text="#{settings.list.incomplete}"></span>
                                    <form th:if="${!template.isDefault() and template.complete()}" class="cl-list-title-action" method="post"
                                          th:action="@{${template.defaultHref()}}">
                                        <button type="submit" class="cl-link-button" th:text="#{settings.list.makeDefault}"
                                                th:attr="aria-label=#{settings.list.makeDefault.for(${name})}"></button>
                                    </form>
                                </div>
                                <p th:each="parcel : ${template.parcels()}" class="cl-list-desc cl-tabular" th:text="${parcel}"></p>
                                <p th:unless="${template.complete()}" class="cl-list-desc is-warn"
                                   th:text="${template.parcels().isEmpty()} ? #{store.shipping.templates.noParcels} : #{store.shipping.templates.incompleteParcel}"></p>
                            </div>
                            <div class="cl-list-actions">
                                <a class="cl-link-button" th:href="@{${template.editHref()}}"
                                   th:text="${template.complete()} ? #{settings.list.edit} : #{settings.list.complete}"
                                   th:attr="aria-label=${template.complete()} ? #{settings.list.edit.for(${name})} : #{settings.list.complete.for(${name})}"></a>
                                <a class="cl-link-button is-danger" th:href="@{${template.deleteHref()}}" data-cl-confirm
                                   th:text="#{settings.list.delete}"
                                   th:attr="aria-label=#{settings.list.delete.for(${name})},
                                            data-cl-confirm-title=#{store.shipping.template.delete.title(${name})},
                                            data-cl-confirm-message=${template.forReturns()} ? #{store.shipping.template.delete.message.returns} : #{store.shipping.template.delete.message},
                                            data-cl-confirm-action=#{store.shipping.template.delete.action}"></a>
                            </div>
                        </li>
                    </ul>
                    <p th:if="${templates.isEmpty()}" class="cl-list-empty" th:text="#{store.shipping.templates.empty}"></p>
                    <p th:unless="${templates.isEmpty()}" class="cl-card-desc cl-card-note" th:text="#{store.shipping.templates.returnsHelp}"></p>
                </section>
            </div>

            <dialog th:replace="~{fragments/confirm-dialog :: dialog}"></dialog>
        </div>
    </section>
    <script th:src="@{/js/confirm-dialog.js}" defer></script>
</div>
</body>
</html>
