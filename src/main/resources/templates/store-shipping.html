<!DOCTYPE HTML>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}">
<body>
<div layout:fragment="content">
    <section class="cl-page">
        <div class="cl-page-body">
            <div th:replace="~{fragments/settings-header :: header(true, null)}"></div>
            <div th:replace="~{fragments/screen-intro :: panel('shipping', 'fas fa-shipping-fast')}"></div>
            <div th:replace="~{fragments/settings-form :: savedAlert}"></div>

            <div class="cl-stack">
                <!--/* Courier account: read-only here, chosen and filled in on its own page (as the invoicing system). */-->
                <section class="cl-card is-status" id="shipping-account" aria-labelledby="shipping-account-title"
                         th:with="ok=${account.configured() and !webhookTokenMissing}">
                    <div class="cl-card-head">
                        <h2 class="cl-card-title" id="shipping-account-title">
                            <i class="fas" th:classappend="${ok} ? 'fa-check-circle is-ok' : 'fa-exclamation-triangle is-warn'"
                               aria-hidden="true"></i>
                            <span th:if="${ok}" th:text="#{store.shipping.account.status.ok(${account.displayName()})}"></span>
                            <span th:if="${account.configured() and webhookTokenMissing}"
                                  th:text="#{store.shipping.account.status.unverified(${account.displayName()})}"></span>
                            <span th:unless="${account.chosen()}" th:text="#{store.shipping.account.none.title}"></span>
                            <span th:if="${account.chosen() and !account.installed()}"
                                  th:text="#{store.shipping.account.missing.title(${account.providerName()})}"></span>
                            <span th:if="${account.installed() and !account.configured()}"
                                  th:text="#{store.shipping.account.status.incomplete(${account.displayName()})}"></span>
                        </h2>
                        <div class="cl-list-actions">
                            <a class="cl-link-button" th:href="@{${accountHref}}"
                               th:text="${!account.chosen()} ? #{store.shipping.account.connect}
                                        : (${account.installed() and !account.configured()} ? #{store.shipping.account.complete} : #{store.shipping.account.change})"></a>
                            <a th:if="${account.chosen()}" class="cl-link-button is-danger" th:href="@{${disconnectHref}}"
                               data-cl-confirm th:text="#{store.shipping.account.disconnect}"
                               th:attr="data-cl-confirm-title=#{store.shipping.account.disconnect.title(${account.displayName()})},
                                        data-cl-confirm-message=#{store.shipping.account.disconnect.message},
                                        data-cl-confirm-action=#{store.shipping.account.disconnect.action}"></a>
                        </div>
                    </div>
                    <p class="cl-card-desc" th:classappend="${account.configured() and webhookTokenMissing} ? 'is-warn'"
                       th:text="${ok} ? #{store.shipping.account.status.ok.text(${account.displayName()})}
                                : (${account.configured()} ? #{store.shipping.account.status.unverified.text}
                                : (${!account.chosen()} ? #{store.shipping.account.none.text}
                                : (${!account.installed()} ? #{store.shipping.account.missing.text} : #{store.shipping.account.incomplete.text})))"></p>
                </section>

                <section class="cl-card" id="shipping-carriers" aria-labelledby="shipping-carriers-title">
                    <div class="cl-card-head">
                        <h2 class="cl-card-title" id="shipping-carriers-title" th:text="#{store.shipping.carriers.title}"></h2>
                        <a th:if="${account.configured()}" class="cl-button" th:href="@{${carriersHref}}"
                           th:text="#{store.shipping.carriers.choose}"></a>
                    </div>
                    <p class="cl-card-desc" th:text="#{store.shipping.carriers.description}"></p>
                    <p th:unless="${carriers.isEmpty()}" class="cl-card-body" th:text="${#strings.listJoin(carriers, ' · ')}"></p>
                    <p th:if="${carriers.isEmpty() and account.configured()}" class="cl-list-empty"
                       th:text="#{store.shipping.carriers.empty(${account.displayName()})}"></p>
                    <p th:if="${carriers.isEmpty() and !account.configured()}" class="cl-list-empty"
                       th:text="#{store.shipping.carriers.noAccount}"></p>
                </section>

                <section class="cl-card" id="shipping-addresses" aria-labelledby="shipping-addresses-title">
                    <div class="cl-card-head">
                        <h2 class="cl-card-title" id="shipping-addresses-title" th:text="#{store.shipping.addresses.title}"></h2>
                        <a class="cl-button" th:href="@{${newAddressHref}}">
                            <i class="fas fa-plus" aria-hidden="true"></i>
                            <span th:text="#{store.warehouse.addresses.add}"></span>
                        </a>
                    </div>
                    <p class="cl-card-desc" th:text="#{store.shipping.addresses.description}"></p>
                    <ul th:unless="${addresses.isEmpty()}" class="cl-list">
                        <li class="cl-list-item" th:each="address : ${addresses}">
                            <div>
                                <div class="cl-list-title">
                                    <span th:text="${address.title()}"></span>
                                    <span th:if="${address.isDefault()}" class="cl-status is-info" th:text="#{store.warehouse.addresses.default}"></span>
                                    <span th:unless="${address.complete()}" class="cl-status is-warn" th:text="#{store.warehouse.addresses.incomplete}"></span>
                                    <form th:if="${!address.isDefault() and address.complete()}" class="cl-list-title-action" method="post"
                                          th:action="@{${address.defaultHref()}}">
                                        <button type="submit" class="cl-link-button" th:text="#{store.warehouse.addresses.makeDefault}"
                                                th:attr="aria-label=#{store.warehouse.addresses.makeDefault.for(${address.title()})}"></button>
                                    </form>
                                </div>
                                <p th:if="${address.addressLine() != null}" class="cl-list-desc" th:text="${address.addressLine()}"></p>
                                <p th:if="${address.contactLine() != null and address.complete()}" class="cl-list-desc" th:text="${address.contactLine()}"></p>
                                <p th:unless="${address.complete()}" class="cl-list-desc is-warn"
                                   th:text="#{store.warehouse.addresses.missing(${#strings.listJoin(#messages.listMsg(address.missingFieldKeys()), ', ')})}"></p>
                            </div>
                            <div class="cl-list-actions">
                                <a class="cl-link-button" th:href="@{${address.editHref()}}"
                                   th:text="${address.complete()} ? #{store.warehouse.addresses.edit} : #{store.warehouse.addresses.complete}"
                                   th:attr="aria-label=#{store.warehouse.addresses.edit.for(${address.title()})}"></a>
                                <a class="cl-link-button is-danger" th:href="@{${address.deleteHref()}}" data-cl-confirm
                                   th:text="#{store.warehouse.addresses.delete}"
                                   th:attr="aria-label=#{store.shipping.address.delete.title(${address.title()})},
                                            data-cl-confirm-title=#{store.shipping.address.delete.title(${address.title()})},
                                            data-cl-confirm-message=${address.isDefault()} ? #{store.shipping.address.delete.message.default} : #{store.shipping.address.delete.message},
                                            data-cl-confirm-action=#{store.shipping.address.delete.action}"></a>
                            </div>
                        </li>
                    </ul>
                    <p th:if="${addresses.isEmpty()}" class="cl-list-empty" th:text="#{store.shipping.addresses.empty}"></p>
                </section>

                <section class="cl-card" id="shipping-sender" aria-labelledby="shipping-sender-title">
                    <div class="cl-card-head">
                        <h2 class="cl-card-title" id="shipping-sender-title" th:text="#{store.shipping.sender.title}"></h2>
                        <div class="cl-list-actions">
                            <a class="cl-link-button" th:href="@{${senderHref}}" th:text="#{store.shipping.sender.change}"
                               th:attr="aria-label=#{store.shipping.sender.change.label}"></a>
                        </div>
                    </div>
                    <p class="cl-card-desc" th:text="#{store.shipping.sender.description}"></p>
                    <p th:if="${sender == null}" class="cl-card-body" th:text="#{store.shipping.sender.pickup}"></p>
                    <p th:if="${sender != null}" class="cl-card-body">
                        <span class="cl-card-body-title" th:text="${sender.title()}"></span>
                        <span th:if="${sender.addressLine() != null}" class="cl-card-body-line" th:text="${sender.addressLine()}"></span>
                    </p>
                </section>

                <section class="cl-card" id="shipping-templates" aria-labelledby="shipping-templates-title">
                    <div class="cl-card-head">
                        <h2 class="cl-card-title" id="shipping-templates-title" th:text="#{store.shipping.templates.title}"></h2>
                        <a class="cl-button" th:href="@{${newTemplateHref}}">
                            <i class="fas fa-plus" aria-hidden="true"></i>
                            <span th:text="#{store.shipping.templates.add}"></span>
                        </a>
                    </div>
                    <p class="cl-card-desc" th:text="#{store.shipping.templates.description}"></p>
                    <ul th:unless="${templates.isEmpty()}" class="cl-list">
                        <li class="cl-list-item" th:each="template : ${templates}">
                            <div>
                                <div class="cl-list-title">
                                    <span th:text="${template.name()}"></span>
                                    <span th:if="${template.isDefault()}" class="cl-status is-info" th:text="#{store.warehouse.addresses.default}"></span>
                                    <span th:if="${template.forReturns()}" class="cl-status is-neutral" th:text="#{store.shipping.templates.returns}"></span>
                                    <span th:unless="${template.complete()}" class="cl-status is-warn" th:text="#{store.warehouse.addresses.incomplete}"></span>
                                    <form th:if="${!template.isDefault() and template.complete()}" class="cl-list-title-action" method="post"
                                          th:action="@{${template.defaultHref()}}">
                                        <button type="submit" class="cl-link-button" th:text="#{store.warehouse.addresses.makeDefault}"
                                                th:attr="aria-label=#{store.warehouse.addresses.makeDefault.for(${template.name()})}"></button>
                                    </form>
                                </div>
                                <p th:each="parcel : ${template.parcels()}" class="cl-list-desc cl-tabular" th:text="${parcel}"></p>
                                <p th:unless="${template.complete()}" class="cl-list-desc is-warn"
                                   th:text="${template.parcels().isEmpty()} ? #{store.shipping.templates.noParcels} : #{store.shipping.templates.incompleteParcel}"></p>
                            </div>
                            <div class="cl-list-actions">
                                <a class="cl-link-button" th:href="@{${template.editHref()}}"
                                   th:text="${template.complete()} ? #{store.warehouse.addresses.edit} : #{store.warehouse.addresses.complete}"
                                   th:attr="aria-label=#{store.warehouse.addresses.edit.for(${template.name()})}"></a>
                                <a class="cl-link-button is-danger" th:href="@{${template.deleteHref()}}" data-cl-confirm
                                   th:text="#{store.warehouse.addresses.delete}"
                                   th:attr="aria-label=#{store.shipping.template.delete.title(${template.name()})},
                                            data-cl-confirm-title=#{store.shipping.template.delete.title(${template.name()})},
                                            data-cl-confirm-message=${template.forReturns()} ? #{store.shipping.template.delete.message.returns} : #{store.shipping.template.delete.message},
                                            data-cl-confirm-action=#{store.shipping.template.delete.action}"></a>
                            </div>
                        </li>
                    </ul>
                    <p th:if="${templates.isEmpty()}" class="cl-list-empty" th:text="#{store.shipping.templates.empty}"></p>
                    <p th:unless="${templates.isEmpty()}" class="cl-card-desc cl-card-note" th:text="#{store.shipping.templates.returnsHelp}"></p>
                </section>
            </div>

            <dialog th:replace="~{fragments/confirm-dialog :: dialog}"></dialog>
        </div>
    </section>
    <script th:src="@{/js/confirm-dialog.js}" defer></script>
</div>
</body>
</html>
