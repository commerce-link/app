<!DOCTYPE HTML>
<html xmlns:th="http://www.thymeleaf.org">
<body>

<div th:fragment="header(p)" class="cl-page-header">
    <a class="cl-back" th:href="@{${p.backHref()}}">
        <span class="icon is-small" aria-hidden="true"><i class="fas fa-chevron-left"></i></span>
        <span th:text="${p.backLabel()}"></span>
    </a>
    <div class="cl-page-header-row">
        <h1 class="cl-page-title" th:text="#{rma.new}"></h1>
        <th:block th:if="${p.state().name() != 'START'}"><form th:replace="~{rma-new/parts :: searchForm(${p}, true, false)}"></form></th:block>
    </div>
    <p class="cl-page-lead" th:if="${p.order() != null and p.state().name() == 'ORDER'}">
        <span class="cl-status is-leading" th:classappend="${p.order().statusTone()}" th:text="#{${p.order().statusKey()}}"></span>
        <span th:text="${p.leadText()}"></span>
        <a class="cl-lead-link" th:href="@{${p.order().href()}}" th:text="${p.order().shortId()}"
           th:title="${p.order().orderId()}"></a>
        <th:block th:if="${p.order().client() != null}"> · <span th:text="${p.order().client()}"></span></th:block>
        <th:block th:if="${p.order().ordered() != null}"> · <span th:text="#{rma.new.lead.ordered(${p.order().ordered()})}"></span></th:block>
    </p>
    <p class="cl-page-lead" th:if="${p.state().name() == 'START' or p.state().name() == 'CHOICE'}" th:text="${p.leadText()}"></p>
</div>

<form th:fragment="searchForm(p, header, autofocus)" method="get" th:action="@{/dashboard/rma/new}" role="search"
      class="cl-search-form" th:classappend="${header} ? 'is-header'">
    <label class="cl-visually-hidden" for="rma-search" th:text="#{rma.new.search.label}"></label>
    <input th:if="${p.from() != null}" type="hidden" name="from" th:value="${p.from()}"/>
    <div class="cl-search-field">
        <span class="cl-search-icon icon is-small" aria-hidden="true"><i class="fas fa-search"></i></span>
        <input class="cl-input cl-table-search" type="search" id="rma-search" name="q" autocomplete="off" spellcheck="false"
               th:value="${p.query()}" th:attr="placeholder=#{rma.new.search.label}" th:autofocus="${autofocus}">
        <a th:if="${p.query() != null}" class="cl-search-clear"
           th:href="${p.from() != null} ? @{/dashboard/rma/new(from=${p.from()})} : @{/dashboard/rma/new}"
           th:attr="aria-label=#{rma.new.search.clear}"><i class="fas fa-times" aria-hidden="true"></i></a>
    </div>
    <button type="submit" class="cl-button is-primary cl-search-submit" th:attr="aria-label=#{general.search}">
        <span class="icon is-small cl-search-submit-icon" aria-hidden="true"><i class="fas fa-search"></i></span>
        <span class="cl-search-submit-text" th:text="#{general.search}"></span>
    </button>
</form>

<section th:fragment="searchCard(p)" class="cl-card cl-search-card" aria-labelledby="search-title">
    <h2 class="cl-card-title" id="search-title" th:text="#{rma.new.search.title}"></h2>
    <p class="cl-card-desc is-flush" th:text="#{rma.new.search.desc}"></p>
    <form th:replace="~{rma-new/parts :: searchForm(${p}, false, true)}"></form>
    <p class="cl-help" th:text="#{rma.new.search.hints}"></p>
    <ul class="cl-hints">
        <li th:text="#{rma.new.search.hint.order}"></li>
        <li th:text="#{rma.new.search.hint.serial}"></li>
        <li th:text="#{rma.new.search.hint.email}"></li>
    </ul>
    <p class="cl-help" th:text="#{rma.new.search.note}"></p>
</section>

<section th:fragment="notFound(p)" class="cl-card" aria-labelledby="nf-title">
    <div class="cl-card-head"><h2 class="cl-card-title" id="nf-title" th:text="#{rma.new.notfound.title(${p.query()})}"></h2></div>
    <p class="cl-card-desc" th:text="${p.notFoundDesc()}"></p>
    <p class="cl-list-empty" th:text="#{rma.new.notfound.hint}"></p>
</section>

<section th:fragment="ineligible(p)" class="cl-card" aria-labelledby="na-title">
    <div class="cl-card-head"><h2 class="cl-card-title" id="na-title" th:text="#{${p.ineligible().titleKey()}}"></h2></div>
    <p class="cl-card-desc" th:text="${p.ineligible().desc()}"></p>
    <p class="cl-list-empty"><a class="cl-link-button" th:href="@{${p.ineligible().orderHref()}}" th:text="${p.ineligible().openLabel()}"></a></p>
</section>

<section th:fragment="choice(p)" class="cl-card" aria-labelledby="choice-title">
    <div class="cl-card-head"><h2 class="cl-card-title" id="choice-title" th:text="${p.choice().title()}"></h2></div>
    <div class="cl-card-section">
        <table class="cl-table is-orders is-rma-orders">
            <thead>
            <tr>
                <th scope="col" th:text="#{rma.new.choice.col.order}"></th>
                <th scope="col" th:text="#{rma.new.choice.col.ordered}"></th>
                <th scope="col" th:text="#{rma.new.choice.col.status}"></th>
                <th scope="col" class="is-numeric" th:text="#{rma.new.choice.col.value}"></th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="r : ${p.choice().rows()}" th:classappend="${r.href() == null} ? 'is-unavailable'">
                <th scope="row" class="cl-table-key" th:attr="data-label=#{rma.new.choice.col.order}">
                    <a th:if="${r.href() != null}" class="cl-row-link cl-table-code" th:href="@{${r.href()}}" th:title="${r.fullId()}" th:text="${r.shortId()}"></a>
                    <span th:if="${r.href() == null}" class="cl-table-code" th:title="${r.fullId()}" th:text="${r.shortId()}"></span>
                    <span th:if="${r.unavailableKey() != null}" class="cl-table-sub" th:text="#{${r.unavailableKey()}}"></span>
                </th>
                <td th:attr="data-label=#{rma.new.choice.col.ordered}"><span class="cl-cell-date" th:text="${r.ordered()}"></span></td>
                <td th:attr="data-label=#{rma.new.choice.col.status}"><span class="cl-status" th:classappend="${r.statusTone()}" th:text="#{${r.statusKey()}}"></span></td>
                <td class="is-numeric" th:attr="data-label=#{rma.new.choice.col.value}" th:text="#{general.currency.amount(${r.value()})}"></td>
            </tr>
            </tbody>
        </table>
    </div>
    <p th:if="${p.choice().limitText() != null}" class="cl-search-scope" th:text="${p.choice().limitText()}"></p>
</section>

<section th:fragment="items(p)" class="cl-card" aria-labelledby="items-title">
    <div class="cl-card-head"><h2 class="cl-card-title" id="items-title" th:text="#{rma.new.items.title}"></h2></div>
    <p class="cl-card-desc" th:text="#{rma.new.items.desc}"></p>
    <p th:if="${p.itemsEmptyText() != null}" class="cl-table-section-empty" th:text="${p.itemsEmptyText()}"></p>
    <div class="cl-card-section" th:if="${!p.items().isEmpty()}">
        <table class="cl-table is-key-wrap is-rma-items">
            <colgroup><col class="cl-col-check"><col><col class="cl-col-qty"><col class="cl-col-value"></colgroup>
            <thead>
            <tr>
                <th scope="col"><span class="cl-visually-hidden" th:text="#{rma.new.items.col.select}"></span></th>
                <th scope="col" th:text="#{rma.new.items.col.item}"></th>
                <th scope="col" th:text="#{rma.new.items.col.qty}"></th>
                <th scope="col" class="is-numeric" th:text="#{rma.new.items.col.price}"></th>
            </tr>
            </thead>
            <tbody th:each="r : ${p.items()}" data-cl-rma-item
                   th:with="i=${r.index()}, qtyId=|items${r.index()}.qty|, resId=|items${r.index()}.resolution|,
                            reasonId=|items${r.index()}.reason|, selId=|items${r.index()}.selected|,
                            qtyErr=${p.fieldErrors().get(qtyId)}, resErr=${p.fieldErrors().get(resId)},
                            reasonErr=${p.fieldErrors().get(reasonId)}, selErr=${p.fieldErrors().get(selId)}">
            <tr class="cl-row-main" th:classappend="${(r.selected() ? 'is-open' : '') + (r.claimed() ? ' is-unavailable' : '')}">
                <td class="cl-table-check">
                    <label class="cl-check-target">
                        <input th:if="${!r.claimed()}" class="cl-check-input" type="checkbox" value="true" data-cl-rma-select
                               th:id="${selId}" th:name="|items[${i}].selected|" th:checked="${r.selected()}"
                               th:attr="aria-label=#{rma.new.items.select.label(${r.name()})}, aria-controls=|detail-${i}|,
                                        aria-invalid=${selErr != null ? 'true' : null}, aria-describedby=${selErr != null ? selId + '-error' : null}"/>
                        <input th:if="${r.claimed()}" class="cl-check-input" type="checkbox" disabled
                               th:attr="aria-label=#{rma.new.items.select.label(${r.name()})}"/>
                    </label>
                    <input th:if="${!r.claimed()}" type="hidden" th:name="|_items[${i}].selected|" value="on"/>
                    <input th:if="${!r.claimed()}" type="hidden" th:name="|items[${i}].itemId|" th:value="${r.itemId()}"/>
                </td>
                <!--/* a claimed row has no checkbox: its cell takes the id the error summary links to */-->
                <th scope="row" class="cl-table-key" th:attr="data-label=#{rma.new.items.col.item}, id=${r.claimed() ? selId : null},
                                                            tabindex=${r.claimed() ? '-1' : null}">
                    <span th:text="${r.name()}"></span>
                    <span class="cl-table-sub">
                        <span th:text="${r.sub()}"></span>
                        <th:block th:if="${r.claimed()}"><th:block th:if="${!#strings.isEmpty(r.sub())}"> · </th:block><span th:text="#{rma.new.items.claimed}"></span>
                            <a class="cl-table-code" th:href="@{${r.claimedHref()}}" th:text="${r.claimedShortId()}"></a></th:block>
                    </span>
                    <p th:if="${selErr != null}" class="cl-field-error" th:id="${selId} + '-error'">
                        <i class="fas fa-exclamation-circle" aria-hidden="true"></i> <span th:text="${selErr}"></span></p>
                </th>
                <td th:attr="data-label=#{rma.new.items.col.qty}">
                    <span th:if="${r.claimed()}" class="cl-min">—</span>
                    <th:block th:if="${!r.claimed()}">
                        <input class="cl-input is-qty" type="number" inputmode="numeric" step="1" min="1" data-cl-rma-qty
                               th:id="${qtyId}" th:name="|items[${i}].qty|" th:value="${r.qty()}" th:max="${r.maxQty()}"
                               th:classappend="${qtyErr != null} ? 'is-invalid'"
                               th:attr="data-price=${r.unitPrice()}, aria-label=#{rma.new.items.qty.label(${r.name()})},
                                        aria-invalid=${qtyErr != null ? 'true' : null},
                                        aria-describedby=${qtyErr != null ? qtyId + '-error ' : ''} + |of-${i}|"/>
                        <span class="cl-min" th:id="|of-${i}|" th:text="#{rma.new.items.of(${r.maxQty()})}"></span>
                        <p th:if="${qtyErr != null}" class="cl-field-error" th:id="${qtyId} + '-error'">
                            <i class="fas fa-exclamation-circle" aria-hidden="true"></i> <span th:text="${qtyErr}"></span></p>
                    </th:block>
                </td>
                <td class="is-numeric" th:attr="data-label=#{rma.new.items.col.price}" th:text="#{general.currency.amount(${r.price()})}"></td>
            </tr>
            <tr th:if="${!r.claimed()}" class="cl-row-detail" data-cl-rma-detail th:id="|detail-${i}|">
                <td colspan="4">
                    <div class="cl-row-detail-inner">
                        <div class="cl-rma-item-fields">
                            <fieldset class="cl-choice-group is-row" tabindex="-1" th:id="${resId}"
                                      th:attr="aria-invalid=${resErr != null ? 'true' : null}, aria-describedby=${resErr != null ? resId + '-error' : null}">
                                <legend class="cl-label" th:text="#{rma.new.resolution.legend}"></legend>
                                <label class="cl-choice" th:each="res : ${T(pl.commercelink.web.rma.RmaNewPage).RESOLUTIONS}">
                                    <input type="radio" th:id="|${resId}-${res.name()}|" th:name="|items[${i}].resolution|"
                                           th:value="${res.name()}" th:checked="${res.name() == r.resolution()}"/>
                                    <span class="cl-choice-text"><span class="cl-choice-title" th:text="#{|RMAResolutionType.${res.name()}|}"></span></span>
                                </label>
                                <p th:if="${resErr != null}" class="cl-field-error" th:id="${resId} + '-error'">
                                    <i class="fas fa-exclamation-circle" aria-hidden="true"></i> <span th:text="${resErr}"></span></p>
                            </fieldset>
                            <div class="cl-field">
                                <label class="cl-label" th:for="${reasonId}">
                                    <span th:text="#{rma.new.reason.label}"></span>
                                    <span class="cl-optional" th:text="#{form.optional}"></span>
                                </label>
                                <textarea class="cl-input cl-textarea" rows="2" maxlength="1000" th:id="${reasonId}"
                                          th:name="|items[${i}].reason|" th:text="${r.reason()}"
                                          th:classappend="${reasonErr != null} ? 'is-invalid'"
                                          th:attr="placeholder=#{rma.new.reason.placeholder},
                                                   aria-invalid=${reasonErr != null ? 'true' : null},
                                                   aria-describedby=${reasonErr != null ? reasonId + '-error' : null}"></textarea>
                                <p th:if="${reasonErr != null}" class="cl-field-error" th:id="${reasonId} + '-error'">
                                    <i class="fas fa-exclamation-circle" aria-hidden="true"></i> <span th:text="${reasonErr}"></span></p>
                            </div>
                        </div>
                    </div>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
</section>

<section th:fragment="orderCard(p)" class="cl-card" aria-labelledby="order-title">
    <div class="cl-card-head"><h2 class="cl-card-title" id="order-title" th:text="#{rma.new.order.title}"></h2></div>
    <dl class="cl-kv is-column cl-card-inset is-rma-order">
        <div><dt th:text="#{rma.new.order.number}"></dt>
            <dd><a class="cl-table-code" th:href="@{${p.order().href()}}" th:title="${p.order().orderId()}" th:text="${p.order().shortId()}"></a></dd></div>
        <div><dt th:text="#{rma.new.order.status}"></dt>
            <dd><span class="cl-status" th:classappend="${p.order().statusTone()}" th:text="#{${p.order().statusKey()}}"></span></dd></div>
        <div th:if="${p.order().ordered() != null}"><dt th:text="#{rma.new.order.ordered}"></dt><dd th:text="${p.order().ordered()}"></dd></div>
        <div th:if="${p.order().client() != null}"><dt th:text="#{rma.new.order.client}"></dt><dd th:text="${p.order().client()}"></dd></div>
        <div><dt th:text="#{rma.new.order.source}"></dt><dd th:text="${p.order().source()}"></dd></div>
    </dl>
</section>

<section th:fragment="summaryCard(p)" class="cl-card" aria-labelledby="summary-title" th:with="emailErr=${p.fieldErrors()['email']}">
    <div class="cl-card-head"><h2 class="cl-card-title" id="summary-title" th:text="#{rma.new.summary.title}"></h2></div>
    <div class="cl-card-inset">
        <div class="cl-field">
            <label class="cl-label" for="email" th:text="#{rma.new.email.label}"></label>
            <input class="cl-input" type="email" id="email" name="email" autocomplete="off" inputmode="email" required
                   th:value="${p.summary().email()}" th:classappend="${emailErr != null} ? 'is-invalid'"
                   th:attr="aria-invalid=${emailErr != null ? 'true' : null},
                            aria-describedby=${emailErr != null ? 'email-help email-error' : 'email-help'}"/>
            <p class="cl-help" id="email-help" th:text="#{rma.new.email.help}"></p>
            <p th:if="${emailErr != null}" class="cl-field-error" id="email-error">
                <i class="fas fa-exclamation-circle" aria-hidden="true"></i> <span th:text="${emailErr}"></span></p>
        </div>
    </div>
    <dl class="cl-kv is-column cl-card-inset">
        <div><dt th:text="#{rma.new.summary.items}"></dt><dd class="is-numeric"><output data-cl-rma-count th:text="${p.summary().count()}"></output></dd></div>
        <div><dt th:text="#{rma.new.summary.pieces}"></dt><dd class="is-numeric"><output data-cl-rma-pieces th:text="${p.summary().pieces()}"></output></dd></div>
        <div class="cl-kv-total"><dt th:text="#{rma.new.summary.value}"></dt>
            <dd class="is-numeric"><output data-cl-rma-value aria-live="polite" th:text="${p.summary().value()}"></output>
                <span th:text="#{rma.new.summary.currency}"></span></dd></div>
    </dl>
    <div class="cl-card-footer is-stacked">
        <button type="submit" class="cl-button is-primary" th:disabled="${!p.summary().canCreate()}"
                th:attr="aria-describedby=${p.summary().canCreate()} ? 'create-help' : 'create-blocked'">
            <span th:text="#{rma.new.create}"></span> <i class="fas fa-arrow-right" aria-hidden="true"></i>
        </button>
        <p th:if="${p.summary().canCreate()}" class="cl-help" id="create-help" th:text="#{rma.new.create.help}"></p>
        <p th:unless="${p.summary().canCreate()}" class="cl-help is-warn" id="create-blocked" th:text="#{rma.new.create.blocked}"></p>
        <p class="cl-help is-warn" id="rma-empty-help" hidden th:text="#{rma.new.create.empty}"></p>
        <!--/* a live region must exist, empty and not hidden, before its text arrives; the script fills it on every refused submit */-->
        <span class="cl-visually-hidden" role="status" data-cl-rma-status></span>
        <a class="cl-button" th:href="@{${p.backHref()}}" th:text="#{rma.new.cancel}"></a>
    </div>
</section>

</body>
</html>
