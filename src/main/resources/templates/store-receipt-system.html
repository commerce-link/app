<!DOCTYPE HTML>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}">
<body>
<div layout:fragment="content">
    <section class="cl-page">
        <div class="cl-page-body">
            <div th:replace="~{fragments/settings-header :: subpage(${receiptsHref}, ${backLabel}, ${pageTitle})}"></div>

            <form th:fragment="systemForm" id="receipt-system-form" class="cl-form"
                  th:action="@{${formAction}}" th:object="${form}" method="post" novalidate data-cl-async
                  th:attr="data-cl-redirect=${redirectTo}, data-error-message=#{form.save.failed}">
                <div th:replace="~{fragments/settings-form :: errorSummary('receipt-system-errors', ${errors}, ${errorLabels})}"></div>

                <div class="cl-card">
                    <fieldset class="cl-fieldset">
                        <legend class="cl-fieldset-title" th:text="#{store.receipts.system.title}"></legend>
                        <div class="cl-field">
                            <label class="cl-label" for="providerName" th:text="#{store.receipts.system.provider}"></label>
                            <select class="cl-select" id="providerName" name="providerName" data-cl-variant-select="receipt-provider"
                                    th:classappend="${errors['providerName'] != null} ? 'is-invalid'"
                                    th:attr="aria-invalid=${errors['providerName'] != null ? 'true' : null},
                                             aria-describedby=${errors['providerName'] != null ? 'providerName-help providerName-error' : 'providerName-help'}">
                                <!--/* Without a system, or with one whose adapter is gone, nothing matches an option: the empty
                                       option keeps the browser from silently picking the first system. */-->
                                <option th:unless="${providerKnown}" value="" th:text="#{store.receipts.system.choose}"></option>
                                <option th:each="provider : ${providers}" th:value="${provider.name()}"
                                        th:text="${provider.displayName()}"
                                        th:selected="${provider.name() == form.providerName}"></option>
                            </select>
                            <p class="cl-help" id="providerName-help" th:text="#{store.receipts.system.description}"></p>
                            <p th:if="${errors['providerName'] != null}" class="cl-field-error" id="providerName-error">
                                <i class="fas fa-exclamation-circle" aria-hidden="true"></i>
                                <span th:text="#{${errors['providerName']}}"></span>
                            </p>
                        </div>
                    </fieldset>

                    <fieldset th:each="provider : ${providers}" th:unless="${provider.configurationFields().isEmpty()}"
                              class="cl-fieldset" data-cl-variant-group="receipt-provider"
                              th:attr="data-cl-variant=${provider.name()}">
                        <legend class="cl-fieldset-title" th:text="#{store.receipts.system.settings(${provider.displayName()})}"></legend>

                        <th:block th:if="${webhooks[provider.name()] != null}">
                            <div th:replace="~{fragments/settings-form :: copyField('webhook-' + ${provider.name()},
                                    #{store.receipts.system.webhook}, ${webhooks[provider.name()]},
                                    #{store.receipts.system.webhook.help(${provider.displayName()})})}"></div>
                        </th:block>
                        <details class="cl-disclosure" th:if="${provider.name() == 'fakturownia'}">
                            <summary th:text="#{store.receipts.system.fakturownia.requirements.title}"></summary>
                            <ul class="cl-steps">
                                <li th:text="#{store.receipts.system.fakturownia.requirements.autoFiscalisation}"></li>
                                <li th:text="#{store.receipts.system.fakturownia.requirements.eReceipts}"></li>
                                <li th:text="#{store.receipts.system.fakturownia.requirements.printer}"></li>
                                <li th:text="#{store.receipts.system.fakturownia.requirements.vat}"></li>
                                <li th:text="#{store.receipts.system.fakturownia.requirements.token}"></li>
                                <li th:text="#{store.receipts.system.fakturownia.requirements.webhook}"></li>
                                <li th:text="#{store.receipts.system.fakturownia.requirements.email}"></li>
                            </ul>
                        </details>

                        <div class="cl-form-grid">
                            <div class="cl-span-3 cl-field" th:each="field : ${provider.configurationFields()}"
                                 th:with="id=${T(pl.commercelink.web.dtos.IntegrationSettingsForm).fieldId(provider.name(), field)},
                                          secret=${field.type().name() == 'PASSWORD'},
                                          error=${errors.get(id)},
                                          stored=${storedSecretIds.contains(id)},
                                          example=${!secret and field.placeholder() != null and !#strings.isEmpty(field.placeholder())}">
                                <label class="cl-label" th:for="${id}">
                                    <span th:text="${field.label()}"></span>
                                    <span th:unless="${field.required()}" class="cl-optional" th:text="#{form.optional}"></span>
                                </label>
                                <input class="cl-input" th:classappend="${error != null} ? 'is-invalid'"
                                       th:id="${id}" th:name="${T(pl.commercelink.web.dtos.IntegrationSettingsForm).fieldName(provider.name(), field)}"
                                       th:type="${secret ? 'password' : (field.type().name() == 'URL' ? 'url' : 'text')}"
                                       th:value="${form.value(provider.name(), field)}"
                                       th:attr="autocomplete=${secret ? 'new-password' : 'off'},
                                                inputmode=${field.type().name() == 'NUMBER' ? 'decimal' : null},
                                                aria-invalid=${error != null ? 'true' : null},
                                                aria-describedby=${(example or stored or error != null) ? ((example or stored ? id + '-help' : '') + ((example or stored) and error != null ? ' ' : '') + (error != null ? id + '-error' : '')) : null}"/>
                                <p th:if="${stored}" class="cl-help" th:id="${id} + '-help'" th:text="#{integration.secret.stored}"></p>
                                <p th:if="${example}" class="cl-help" th:id="${id} + '-help'"
                                   th:text="#{integration.setting.example(${field.placeholder()})}"></p>
                                <p th:if="${error != null}" class="cl-field-error" th:id="${id} + '-error'">
                                    <i class="fas fa-exclamation-circle" aria-hidden="true"></i>
                                    <span th:text="#{${error}}"></span>
                                </p>
                            </div>
                        </div>
                    </fieldset>

                    <div class="cl-card-footer">
                        <button class="cl-button is-primary" type="submit" th:text="#{store.receipts.system.save}"></button>
                        <a class="cl-button" th:href="@{${receiptsHref}}" th:text="#{general.cancel}"></a>
                    </div>
                </div>
            </form>
        </div>
    </section>
    <script th:if="${!errors.isEmpty()}">
        document.getElementById('receipt-system-errors').focus();
    </script>
    <script th:src="@{/js/async-form.js}" defer></script>
    <script th:src="@{/js/variant-fields.js}" defer></script>
    <script th:src="@{/js/copy-field.js}" defer></script>
</div>
</body>
</html>
