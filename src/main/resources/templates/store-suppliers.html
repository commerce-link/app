<!DOCTYPE HTML>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}">
<body>
<div layout:fragment="content">
    <section class="cl-page">
        <div class="cl-page-body">
            <div th:replace="~{fragments/settings-header :: header(false, null)}"></div>
            <div th:replace="~{fragments/settings-form :: savedAlert}"></div>

            <div class="cl-stack">
                <section class="cl-card" aria-labelledby="suppliers-title">
                    <div class="cl-card-head">
                        <h2 class="cl-card-title" id="suppliers-title" th:text="#{store.suppliers.list.title}"></h2>
                        <a class="cl-button" th:href="@{${newSupplierHref}}">
                            <i class="fas fa-plus" aria-hidden="true"></i>
                            <span th:text="#{store.suppliers.add}"></span>
                        </a>
                    </div>
                    <p class="cl-card-desc" th:text="#{store.suppliers.list.description}"></p>

                    <p th:if="${suppliers.isEmpty()}" class="cl-list-empty" th:text="#{store.suppliers.list.empty}"></p>

                    <ul th:unless="${suppliers.isEmpty()}" class="cl-list" aria-labelledby="suppliers-title">
                        <li class="cl-list-item" th:each="supplier : ${suppliers}" th:attr="data-supplier=${supplier.identity()}"
                            th:with="state=${supplier.state().name()}, source=${supplier.source().name()}">
                            <div>
                                <div class="cl-list-title">
                                    <span th:text="${supplier.title()}"></span>
                                    <span th:if="${state == 'UNAVAILABLE'}" class="cl-status is-warn" th:text="#{store.suppliers.state.unavailable}"></span>
                                    <span th:if="${state == 'INCOMPLETE'}" class="cl-status is-warn" th:text="#{store.suppliers.state.incomplete}"></span>
                                    <span th:if="${state == 'DISABLED'}" class="cl-status is-neutral" th:text="#{store.suppliers.state.disabled}"></span>
                                </div>
                                <p th:if="${state == 'UNAVAILABLE'}" class="cl-list-desc is-warn" th:text="#{store.suppliers.state.unavailable.text}"></p>
                                <p th:if="${state == 'INCOMPLETE'}" class="cl-list-desc is-warn"
                                   th:text="${source == 'GLOBAL'} ? #{store.suppliers.state.incomplete.global} : #{store.suppliers.state.incomplete.own}"></p>
                                <p class="cl-list-desc">
                                    <span th:switch="${source}">
                                        <span th:case="'GLOBAL'" th:text="#{store.suppliers.source.global(${supplier.type()})}"></span>
                                        <span th:case="'OWN'" th:text="#{store.suppliers.source.own(${supplier.type()})}"></span>
                                        <span th:case="*" th:text="#{store.suppliers.source.csv}"></span>
                                    </span><th:block th:if="${supplier.externalSupplierId() != null}"> · <span
                                        th:text="#{store.suppliers.externalId(${supplier.externalSupplierId()})}"></span></th:block>
                                </p>
                                <p class="cl-list-desc" th:classappend="${supplier.unused()} ? 'is-warn'" th:text="#{${supplier.usageKey()}}"></p>
                                <p th:if="${supplier.feedLastModified() != null}" class="cl-list-desc">
                                    <span th:text="${supplier.csv()} ? #{store.suppliers.file.uploaded(${#temporals.format(supplier.feedLastModified(), 'dd.MM.yyyy HH:mm')})}
                                                                    : #{store.suppliers.feed.at(${#temporals.format(supplier.feedLastModified(), 'dd.MM.yyyy HH:mm')})}"></span><th:block
                                        th:if="${supplier.schedule() != null}"> · <span
                                        th:text="#{store.suppliers.feed.schedule(${#messages.msgWithParams(supplier.schedule().code(), supplier.schedule().messageArgs())})}"></span></th:block>
                                </p>
                                <p th:if="${supplier.feedLastModified() == null and state != 'UNAVAILABLE'}" class="cl-list-desc"
                                   th:classappend="${supplier.csv()} ? 'is-warn'"
                                   th:text="${supplier.csv()} ? #{store.suppliers.file.missing} : #{store.suppliers.feed.missing}"></p>
                            </div>
                            <div class="cl-list-actions">
                                <a th:if="${supplier.editHref() != null}" class="cl-link-button" th:href="@{${supplier.editHref()}}"
                                   th:text="${state == 'INCOMPLETE'} ? #{settings.list.complete} : #{settings.list.edit}"
                                   th:attr="aria-label=${state == 'INCOMPLETE'} ? #{settings.list.complete.for(${supplier.title()})} : #{settings.list.edit.for(${supplier.title()})}"></a>
                                <a class="cl-link-button is-danger" th:href="@{${supplier.removeHref()}}" data-cl-confirm
                                   th:text="${supplier.csv()} ? #{settings.list.delete} : #{settings.list.disconnect}"
                                   th:attr="aria-label=${supplier.csv()} ? #{settings.list.delete.for(${supplier.title()})} : #{settings.list.disconnect.for(${supplier.title()})},
                                            data-cl-confirm-title=${supplier.csv()} ? #{store.suppliers.delete.title(${supplier.title()})} : #{store.suppliers.disconnect.title(${supplier.title()})},
                                            data-cl-confirm-message=${removeMessages[supplier.identity()]},
                                            data-cl-confirm-action=${supplier.csv()} ? #{store.suppliers.delete.action} : #{store.suppliers.disconnect.action}"></a>
                            </div>
                        </li>
                    </ul>
                </section>

                <form th:if="${adminForm != null}" th:fragment="adminForm" id="supplier-admin-form" class="cl-form"
                      th:action="@{${adminFormAction}}" th:object="${adminForm}" method="post" novalidate data-cl-async
                      th:attr="data-cl-redirect=${redirectTo}, data-error-message=#{form.save.failed}">
                    <div th:replace="~{fragments/settings-form :: errorSummary('supplier-admin-errors', ${errors}, null)}"></div>
                    <div th:if="${failure != null}" class="cl-alert is-bad" data-cl-error-summary tabindex="-1">
                        <i class="fas fa-exclamation-circle cl-alert-icon" aria-hidden="true"></i>
                        <p class="cl-alert-text" th:text="${failure}"></p>
                    </div>
                    <div class="cl-card">
                        <fieldset class="cl-fieldset">
                            <legend class="cl-fieldset-title" th:text="#{store.suppliers.admin.title}"></legend>
                            <p class="cl-help" th:text="#{store.suppliers.admin.help}"></p>
                            <div th:replace="~{fragments/settings-form :: check('canUseGlobalSuppliers', 'store.suppliers.admin.global', *{canUseGlobalSuppliers}, 'store.suppliers.admin.global.description', null)}"></div>
                            <div class="cl-form-grid">
                                <div class="cl-span-3" th:insert="~{fragments/settings-form :: textField('inventoryCacheTtlMinutes', 'store.suppliers.admin.cacheTtl', *{inventoryCacheTtlMinutes}, 'text', 'off', false, ${errors['inventoryCacheTtlMinutes']}, #{store.suppliers.admin.cacheTtl.help})}"></div>
                            </div>
                        </fieldset>
                        <div class="cl-card-footer">
                            <button class="cl-button is-primary" type="submit" th:text="#{form.save.changes}"></button>
                        </div>
                    </div>
                </form>
            </div>

            <dialog th:replace="~{fragments/confirm-dialog :: dialog}"></dialog>
        </div>
    </section>
    <script th:if="${!errors.isEmpty()}">
        document.getElementById('supplier-admin-errors').focus();
    </script>
    <script th:src="@{/js/confirm-dialog.js}" defer></script>
    <script th:src="@{/js/async-form.js}" defer></script>
</div>
</body>
</html>
