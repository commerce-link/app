<!DOCTYPE HTML>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout(ownsErrorMessage=true)}">
<body>

<!--/* source is what the offer starts from, decided by the controller: null (empty offer), "template", "offer" or "basket"
       (a shop basket; the controller filled the contact and offerName from it). It picks the way back and the lead. */-->
<div layout:fragment="content"
     th:with="sourcePath=${sourceId == null ? null : #uris.escapePathSegment(sourceId)},
              backHref=${source == 'basket' ? '/dashboard/basket/view/' + sourcePath : (source != null ? '/dashboard/offer/' + sourcePath : '/dashboard/offers')},
              backLabel=${#messages.msg('offers.new.back.' + (source ?: 'offers'))},
              lead=${#messages.msg('offers.new.lead.' + (source ?: 'manual'))}">
    <section class="cl-page">
        <div class="cl-page-body is-form">
            <div th:replace="~{fragments/settings-header :: subpageWithActions(${backHref}, ${backLabel}, #{offers.new.title}, ${lead}, null)}"></div>

            <form id="offer-new-form" class="cl-form" th:action="@{/dashboard/offer/new}" th:object="${contactDetails}" method="post"
                  data-cl-form-check>
                <div th:replace="~{fragments/offer-create :: serverError}"></div>
                <div th:replace="~{fragments/settings-form :: formCheckSummary('offers.new.errors.title')}"></div>
                <input type="hidden" name="intent" th:value="${intent}">
                <input type="hidden" name="sourceId" th:value="${sourceId}">
                <div class="cl-card">
                    <fieldset class="cl-fieldset">
                        <legend class="cl-fieldset-title" th:text="#{offers.new.offer}"></legend>
                        <div class="cl-form-grid">
                            <div th:replace="~{fragments/offer-create :: offerName(${offerName}, ${errorMessage == null and offerName == null})}"></div>
                        </div>
                    </fieldset>
                    <fieldset th:replace="~{fragments/offer-create :: contact('', ${contactDetails})}"></fieldset>
                    <details th:replace="~{fragments/offer-create :: gclid(null)}"></details>
                    <div th:replace="~{fragments/offer-create :: footer(${backHref})}"></div>
                </div>
            </form>
        </div>
    </section>
    <script th:src="@{/js/form-check.js}" defer></script>
    <script th:src="@{/js/error-summary.js}" defer></script>
</div>

</body>
</html>
