<!DOCTYPE HTML>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout-print}">
<head>
    <title th:text="#{order.print.title.card(${print.shortId()})}"></title>
</head>
<body>
<!--/* The order card: a printout for the packing table, printed on A4 straight from the order page's menu. The sheet is
       orders/card-sheet, shared with the batch of cards printed from the orders list (orders/cards). */-->
<div layout:fragment="content">
    <section class="cl-page cl-print-page">
        <div class="cl-page-body">
            <div th:replace="~{orders/card-sheet :: sheet(${print}, '')}"></div>
        </div>
    </section>
</div>
</body>
</html>
