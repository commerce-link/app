<!DOCTYPE HTML>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}">
<body>
<!--/* The order card: a printout for the packing table. On screen a sheet in the frame; printed, only the sheet (A4). */-->
<div layout:fragment="content" th:with="p=${print}">
    <section class="cl-page cl-print-page">
        <div class="cl-page-body">
            <div th:replace="~{fragments/settings-header :: subpageWithActions(${p.detailsHref()},
                    #{order.page.title(${p.shortId()})}, #{order.card.title}, null, ~{orders/card :: printAction})}"></div>

            <article class="cl-card cl-print-sheet">
                <dl class="cl-kv cl-print-meta">
                    <div>
                        <dt th:text="#{order.order.id}"></dt>
                        <dd><a th:href="@{${p.detailsHref()}}" th:text="${p.orderId()}"></a></dd>
                    </div>
                    <div>
                        <dt th:text="#{orders.email}"></dt>
                        <dd th:text="${p.email() != null} ? ${p.email()} : '—'"></dd>
                    </div>
                    <div>
                        <dt th:text="#{order.ordered.at}"></dt>
                        <dd class="is-numeric" th:text="${p.orderedAt() != null} ? ${p.orderedAt()} : '—'"></dd>
                    </div>
                </dl>

                <section class="cl-print-section" aria-labelledby="print-items-title">
                    <h2 class="cl-print-title" id="print-items-title" th:text="#{order.items}"></h2>
                    <table class="cl-table is-compact cl-print-table">
                        <thead>
                        <tr>
                            <th scope="col" th:text="#{order.item.category}"></th>
                            <th scope="col" th:text="#{order.item.name}"></th>
                            <th scope="col" class="is-numeric" th:text="#{general.quantity}"></th>
                            <th scope="col" th:text="#{general.manufacturer.code}"></th>
                            <th scope="col" th:text="#{order.print.column.delivery}"></th>
                            <th scope="col" th:text="#{order.item.comment}"></th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr th:each="r : ${p.items()}">
                            <td th:attr="data-label=#{order.item.category}" th:classappend="${r.category() == null} ? 'is-empty'" th:text="${r.category()}"></td>
                            <td th:attr="data-label=#{order.item.name}" th:text="${r.name()}"></td>
                            <td class="is-numeric" th:attr="data-label=#{general.quantity}" th:text="${r.qty()}"></td>
                            <td class="cl-print-code" th:attr="data-label=#{general.manufacturer.code}" th:classappend="${r.mfn() == null} ? 'is-empty'" th:text="${r.mfn()}"></td>
                            <td th:attr="data-label=#{order.print.column.delivery}" th:classappend="${r.delivery() == null} ? 'is-empty'" th:text="${r.delivery()}"></td>
                            <td class="cl-print-text" th:attr="data-label=#{order.item.comment}" th:classappend="${r.comment() == null} ? 'is-empty'" th:text="${r.comment()}"></td>
                        </tr>
                        </tbody>
                    </table>
                    <p th:if="${p.items().isEmpty()}" class="cl-print-empty" th:text="#{order.print.empty.items}"></p>
                </section>

                <section class="cl-print-section" aria-labelledby="print-comment-title">
                    <h2 class="cl-print-title" id="print-comment-title" th:text="#{general.comment}"></h2>
                    <p th:if="${p.comment() != null}" class="cl-print-text" th:text="${p.comment()}"></p>
                    <p th:if="${p.comment() == null}" class="cl-print-empty" th:text="#{order.print.empty.comment}"></p>
                </section>

                <section class="cl-print-section" aria-labelledby="print-documents-title">
                    <h2 class="cl-print-title" id="print-documents-title" th:text="#{order.documents}"></h2>
                    <table th:if="${!p.documents().isEmpty()}" class="cl-table is-compact cl-print-table">
                        <thead>
                        <tr>
                            <th scope="col" th:text="#{order.print.document.number}"></th>
                            <th scope="col" th:text="#{order.document.type}"></th>
                            <th scope="col" th:text="#{order.status}"></th>
                        </tr>
                        </thead>
                        <tbody>
                        <!--/* a document without a number yet (generation still running) prints a dash, never "null" */-->
                        <tr th:each="d : ${p.documents()}">
                            <td th:attr="data-label=#{order.print.document.number}" th:text="${d.number() != null} ? ${d.number()} : '—'"></td>
                            <td th:attr="data-label=#{order.document.type}" th:text="${d.typeKey() != null} ? #{${d.typeKey()}} : '—'"></td>
                            <td th:attr="data-label=#{order.status}" th:text="#{document.status.issued}"></td>
                        </tr>
                        </tbody>
                    </table>
                    <p th:if="${p.documents().isEmpty()}" class="cl-print-empty" th:text="#{order.print.empty.documents}"></p>
                </section>

                <section class="cl-print-section" aria-labelledby="print-shipments-title">
                    <h2 class="cl-print-title" id="print-shipments-title" th:text="#{order.card.shipments}"></h2>
                    <table th:if="${!p.shipments().isEmpty()}" class="cl-table is-compact cl-print-table">
                        <thead>
                        <tr>
                            <th scope="col" th:text="#{order.shipment.type}"></th>
                            <th scope="col" th:text="#{order.shipment.tracking}"></th>
                            <th scope="col" th:text="#{order.shipment.carrier}"></th>
                            <th scope="col" th:text="#{order.shipped.at}"></th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr th:each="s : ${p.shipments()}">
                            <td th:attr="data-label=#{order.shipment.type}" th:text="${s.typeKey() != null} ? #{${s.typeKey()}} : '—'"></td>
                            <td th:attr="data-label=#{order.shipment.tracking}" th:classappend="${s.trackingNo() == null} ? 'is-empty'" th:text="${s.trackingNo()}"></td>
                            <td th:attr="data-label=#{order.shipment.carrier}" th:classappend="${s.carrier() == null} ? 'is-empty'" th:text="${s.carrier()}"></td>
                            <td th:attr="data-label=#{order.shipped.at}" th:text="${s.shippedAt() != null} ? ${s.shippedAt()} : '—'"></td>
                        </tr>
                        </tbody>
                    </table>
                    <p th:if="${p.shipments().isEmpty()}" class="cl-print-empty" th:text="#{order.print.empty.shipments}"></p>
                </section>
            </article>
        </div>
    </section>
    <script th:src="@{/js/print.js}" defer></script>
</div>

<!--/* The Print button of both printouts. Hidden until print.js runs: without the script it could not print, and the
       browser's own Print menu works either way. */-->
<th:block th:fragment="printAction">
    <button type="button" class="cl-button is-primary" data-cl-print hidden>
        <span class="icon is-small" aria-hidden="true"><i class="fas fa-print"></i></span>
        <span th:text="#{order.print.print}"></span>
    </button>
</th:block>
</body>
</html>
