<!DOCTYPE HTML>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<!--/* Payment rows, paid/unpaid summary and the payment dialog triggers. */-->
<section th:fragment="card" class="cl-card" id="platnosci" aria-labelledby="payments-title" data-order="6"
         th:with="payments=${page.payments()}">
    <div class="cl-card-head">
        <h2 class="cl-card-title" id="payments-title" th:text="#{order.card.payments}"></h2>
        <div class="cl-card-actions" th:unless="${page.readOnly()}">
            <button th:if="${payments.canEdit()}" type="button" class="cl-link-button" data-cl-dialog-open="payments-edit-dialog"
                    th:text="#{order.payments.edit}"></button>
            <button type="button" class="cl-button" data-cl-dialog-open="addPaymentModal" data-mode="order">
                <span class="icon is-small" aria-hidden="true"><i class="fas fa-plus"></i></span>
                <span th:text="#{order.payments.add}"></span>
            </button>
        </div>
    </div>
    <ul class="cl-list" th:if="${!payments.rows().isEmpty()}">
        <li class="cl-list-item" th:each="p : ${payments.rows()}">
            <div>
                <p class="cl-list-title">
                    <!--/* a payment with no amount yet is the one the order waits for, not a payment of 0,00 */-->
                    <span th:if="${p.pending()}" th:text="#{order.payments.pending}"></span>
                    <span th:unless="${p.pending()}" th:text="#{general.currency.amount(${p.amount()})}"></span>
                    <span th:if="${p.sourceKey() != null}" th:text="' · ' + #{${p.sourceKey()}}"></span>
                    <span th:if="${p.pending()}" class="cl-status is-neutral" th:text="#{order.payments.pending.pill}"></span>
                    <span th:if="${p.refund()}" class="cl-status is-warn" th:text="#{order.payments.refund}"></span>
                </p>
                <p class="cl-list-desc">
                    <span th:if="${p.name() != null}" th:text="${p.name()}"></span>
                    <span th:if="${p.referenceNo() != null}" th:text="' · ' + #{order.payments.reference(${p.referenceNo()})}"></span>
                    <span th:if="${p.bankTransactionNo() != null}"
                          th:text="' · ' + #{order.payments.operation(${p.bankTransactionNo()}, ${p.bankTransactionDate() != null ? p.bankTransactionDate() : '—'})}"></span>
                    <span th:if="${p.fee() != null}"
                          th:text="' · ' + #{order.payments.fee(${#messages.msg('general.currency.amount', p.fee())})}"></span>
                </p>
            </div>
        </li>
    </ul>
    <p th:if="${payments.rows().isEmpty()}" class="cl-list-empty" th:text="#{order.payments.empty}"></p>
    <p class="cl-list-summary">
        <span><span th:text="#{order.payments.paid}"></span> <strong th:text="#{general.currency.amount(${payments.paid()})}"></strong></span>
        <span th:if="${!payments.overpaid()}" th:classappend="${payments.unpaidDue()} ? 'is-bad' : ''"
              th:text="#{order.payments.unpaid(${#messages.msg('general.currency.amount', payments.unpaid())})}"></span>
        <span th:if="${payments.overpaid()}" class="is-warn"
              th:text="#{order.payments.overpaid(${#messages.msg('general.currency.amount', payments.overpaidAmount())})}"></span>
    </p>
</section>

<!--/* "Edit payments": one row per raw Payment (not the rows/() summary), Delete just clears the row (order-payments.js). */-->
<dialog th:fragment="editDialog" class="cl-dialog is-form is-wide" id="payments-edit-dialog" aria-labelledby="payments-edit-title"
        th:with="payments=${page.payments()}">
    <form method="post" th:action="@{/dashboard/orders/{o}/updatePayments(o=${page.orderId()})}" data-cl-payments-form>
        <h2 class="cl-dialog-title" id="payments-edit-title" th:text="#{order.payments.edit}"></h2>
        <div class="cl-dialog-body">
            <table class="cl-table is-compact is-editable">
                <caption class="cl-visually-hidden" th:text="#{order.payments.edit}"></caption>
                <thead><tr>
                    <th scope="col" th:text="#{order.payment.source}"></th>
                    <th scope="col" th:text="#{payments.source.name}"></th>
                    <th scope="col" class="is-numeric" th:text="#{order.payment.amount}"></th>
                    <th scope="col" class="is-numeric" th:text="#{order.payment.processing.fee}"></th>
                    <th scope="col" th:text="#{order.payment.reference.no}"></th>
                    <th scope="col" th:text="#{order.payment.bank.transaction.no}"></th>
                    <th scope="col" th:text="#{order.payment.bank.transaction.date}"></th>
                    <th scope="col"><span class="cl-visually-hidden" th:text="#{order.items.column.actions}"></span></th>
                </tr></thead>
                <tbody>
                <tr th:each="p, i : ${payments.editable()}">
                    <td th:attr="data-label=#{order.payment.source}">
                        <input type="hidden" th:name="|payments[${i.index}].direction|" th:value="${p.direction != null ? p.direction.name() : 'Incoming'}">
                        <select class="cl-select" th:name="|payments[${i.index}].source|"
                                th:attr="aria-label=#{order.payments.edit.row.source(${i.count})}">
                            <option th:each="src : ${payments.sources()}" th:value="${src.value().name()}" th:selected="${src.value() == p.source}"
                                    th:text="#{${src.labelKey()}}"></option>
                        </select>
                    </td>
                    <td th:attr="data-label=#{payments.source.name}">
                        <input class="cl-input" type="text" th:name="|payments[${i.index}].name|" th:value="${p.name}"
                               th:attr="aria-label=#{order.payments.edit.row.name(${i.count})}">
                    </td>
                    <td th:attr="data-label=#{order.payment.amount}">
                        <input class="cl-input" type="number" step="0.01" inputmode="decimal" th:name="|payments[${i.index}].amount|"
                               th:value="${p.amount}" th:attr="aria-label=#{order.payments.edit.row.amount(${i.count})}">
                    </td>
                    <td th:attr="data-label=#{order.payment.processing.fee}">
                        <input class="cl-input" type="number" step="0.01" min="0" inputmode="decimal" th:name="|payments[${i.index}].fee|"
                               th:value="${p.fee}" th:attr="aria-label=#{order.payments.edit.row.fee(${i.count})}">
                    </td>
                    <td th:attr="data-label=#{order.payment.reference.no}">
                        <input class="cl-input" type="text" th:name="|payments[${i.index}].referenceNo|" th:value="${p.referenceNo}"
                               th:attr="aria-label=#{order.payments.edit.row.reference(${i.count})}">
                    </td>
                    <td th:attr="data-label=#{order.payment.bank.transaction.no}">
                        <input class="cl-input" type="text" th:name="|payments[${i.index}].bankTransactionNo|" th:value="${p.bankTransactionNo}"
                               th:attr="aria-label=#{order.payments.edit.row.bank.no(${i.count})}">
                    </td>
                    <td th:attr="data-label=#{order.payment.bank.transaction.date}">
                        <input class="cl-input" type="date" th:name="|payments[${i.index}].bankTransactionDate|" th:value="${p.bankTransactionDate}"
                               th:attr="aria-label=#{order.payments.edit.row.bank.date(${i.count})}">
                    </td>
                    <td class="cl-table-actions">
                        <button type="button" class="cl-link-button is-danger" data-cl-payment-remove
                                th:attr="aria-label=#{order.payments.edit.row.remove(${i.count})}" th:text="#{general.delete}"></button>
                    </td>
                </tr>
                </tbody>
            </table>
            <p class="cl-dialog-effect" th:text="#{order.payments.edit.effect}"></p>
        </div>
        <div class="cl-dialog-actions">
            <button type="submit" class="cl-button is-primary" th:text="#{order.payments.edit.save}"></button>
            <button type="button" class="cl-button" data-cl-dialog-close th:text="#{general.cancel}"></button>
        </div>
    </form>
</dialog>
</body>
</html>
