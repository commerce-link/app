<!DOCTYPE HTML>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<!--/* Shipment rows, courier cancellation and the shipments dialog trigger. */-->
<section th:fragment="card" class="cl-card" id="przesylki" aria-labelledby="shipments-title"
         th:with="shipments=${page.shipments()}">
    <div class="cl-card-head">
        <h2 class="cl-card-title" id="shipments-title" th:text="#{order.card.shipments}"></h2>
        <div class="cl-card-actions" th:unless="${page.readOnly()}">
            <a th:if="${shipments.canCancelCourier()}" class="cl-link-button is-danger" data-cl-confirm
               th:href="@{/dashboard/orders/{o}/cancelShipment(o=${page.orderId()})}"
               th:attr="data-cl-confirm-title=#{order.shipments.cancel.confirm.title},
                        data-cl-confirm-message=#{order.shipments.cancel.confirm.message},
                        data-cl-confirm-action=#{order.shipments.cancel.confirm.action}"
               th:text="#{order.shipments.cancel}"></a>
            <button type="button" class="cl-button" data-cl-dialog-open="shipments-dialog"
                    th:text="#{order.shipments.edit}"></button>
        </div>
    </div>
    <ul class="cl-list" th:if="${!shipments.rows().isEmpty()}">
        <li class="cl-list-item" th:each="s : ${shipments.rows()}">
            <div>
                <p class="cl-list-title">
                    <span th:text="#{${s.typeKey()}}"></span>
                    <span th:if="${s.carrier() != null}" th:text="' · ' + ${s.carrier()}"></span>
                    <!--/* the pill text carries the state; the title only adds what to do about a failure */-->
                    <span th:if="${s.trackingKey() != null}" class="cl-status" th:classappend="${s.trackingTone()}"
                          th:attr="title=${s.trackingHelpKey() != null} ? #{${s.trackingHelpKey()}} : null"
                          th:text="#{${s.trackingKey()}}"></span>
                </p>
                <p class="cl-list-desc">
                    <th:block th:if="${s.trackingNo() != null}">
                        <span th:text="#{order.shipments.tracking}"></span>
                        <a th:if="${s.trackingUrl() != null}" th:href="${s.trackingUrl()}" target="_blank" rel="noopener"
                           th:text="${s.trackingNo()}"></a>
                        <span th:unless="${s.trackingUrl() != null}" th:text="${s.trackingNo()}"></span>
                        <span> · </span>
                    </th:block>
                    <th:block th:if="${s.pickupPoint() != null}"><span th:text="#{order.shipments.pickup(${s.pickupPoint()})}"></span><span> · </span></th:block>
                    <span th:if="${s.shippedAt() != null}" th:text="#{order.shipments.shipped(${s.shippedAt()})}"></span>
                    <span th:if="${s.deliveredAt() != null}" th:text="' · ' + #{order.shipments.delivered(${s.deliveredAt()})}"></span>
                    <span th:if="${s.shippedAt() != null and s.deliveredAt() == null}" th:text="' · ' + #{order.shipments.in.transit}"></span>
                    <span th:if="${s.shippedAt() == null}" th:text="#{order.shipments.waiting}"></span>
                </p>
            </div>
        </li>
    </ul>
    <p th:if="${shipments.rows().isEmpty()}" class="cl-list-empty" th:text="#{${shipments.emptyKey()}}"></p>
</section>

<!--/* One group of fields per shipment (the design system's repeatable groups, repeat-fields.js): two columns instead
     of an eight-column table, so the dialog never scrolls sideways and every select shows its whole option. */-->
<dialog th:fragment="dialog" class="cl-dialog is-form" id="shipments-dialog" aria-labelledby="shipments-dialog-title"
        th:with="shipments=${page.shipments()}">
    <form method="post" th:action="@{/dashboard/orders/{o}/updateShipments(o=${page.orderId()})}" data-cl-shipments-form>
        <h2 class="cl-dialog-title" id="shipments-dialog-title" th:text="#{order.card.shipments}"></h2>
        <div class="cl-dialog-body">
            <!--/* No noscript spare group: the dialog itself only opens with JavaScript. */-->
            <div class="cl-repeat" data-cl-repeat="shipments" data-cl-repeat-id="shipment" id="shipments-groups">
                <th:block th:each="s, i : ${shipments.editable()}">
                    <fieldset class="cl-fieldset" data-cl-repeat-item
                              th:insert="~{orders/details/shipments :: shipmentFields(${i.index}, ${i.count}, ${s}, ${shipments})}"></fieldset>
                </th:block>
                <template data-cl-repeat-template>
                    <fieldset class="cl-fieldset" data-cl-repeat-item
                              th:insert="~{orders/details/shipments :: shipmentFields('@INDEX@', '@NUMBER@', null, ${shipments})}"></fieldset>
                </template>
                <div class="cl-repeat-add">
                    <button type="button" class="cl-button" data-cl-repeat-add hidden>
                        <i class="fas fa-plus" aria-hidden="true"></i>
                        <span th:text="#{order.shipments.dialog.add}"></span>
                    </button>
                    <span class="cl-visually-hidden" role="status" data-cl-repeat-status
                          th:attr="data-template=#{order.shipments.dialog.removed('@N@')}"></span>
                </div>
            </div>
            <p class="cl-dialog-effect" th:text="#{order.shipments.dialog.effect}"></p>
        </div>
        <div class="cl-dialog-actions">
            <button type="submit" class="cl-button is-primary" th:text="#{order.shipments.dialog.save}"></button>
            <button type="button" class="cl-button" data-cl-dialog-close th:text="#{general.cancel}"></button>
        </div>
    </form>
</dialog>

<!--/* The fields of one shipment; s is null in the blank template. The carrier is picked from the store's carriers,
     or typed after "Other…": the select only fills the named text field (order-shipments.js). */-->
<th:block th:fragment="shipmentFields(index, number, s, shipments)"
          th:with="id=${'shipment-' + index}, name=${'shipments[' + index + '].'},
                   carrier=${s != null ? s.carrier : null},
                   picker=${!shipments.carriers().isEmpty()},
                   known=${carrier == null or shipments.carriers().contains(carrier)}">
    <legend class="cl-fieldset-title">
        <span th:text="#{order.shipments.dialog.shipment}"></span>
        <span data-cl-repeat-number th:text="${number}"></span>
    </legend>
    <div class="cl-form-grid">
        <div class="cl-span-3 cl-field">
            <label class="cl-label" th:for="${id + '-type'}" th:text="#{order.shipments.dialog.type}"></label>
            <select class="cl-select" th:id="${id + '-type'}" th:name="${name + 'type'}">
                <option th:each="type : ${shipments.types()}" th:value="${type.value().name()}"
                        th:selected="${s != null and type.value() == s.type}" th:text="#{${type.labelKey()}}"></option>
            </select>
        </div>
        <div class="cl-span-3 cl-field">
            <label class="cl-label" th:for="${id + (picker ? '-carrier-select' : '-carrier')}" th:text="#{order.shipments.dialog.carrier}"></label>
            <select th:if="${picker}" class="cl-select" data-cl-carrier-select hidden th:id="${id + '-carrier-select'}">
                <option value=""></option>
                <option th:each="c : ${shipments.carriers()}" th:value="${c}" th:selected="${c == carrier}" th:text="${c}"></option>
                <option value="__other__" th:selected="${!known}" th:text="#{order.shipments.dialog.carrier.other}"></option>
            </select>
            <input class="cl-input" type="text" autocomplete="off" data-cl-carrier-input th:id="${id + '-carrier'}"
                   th:name="${name + 'carrier'}" th:value="${carrier}"
                   th:attr="aria-label=${picker} ? #{order.shipments.dialog.carrier.name} : null">
        </div>
        <div class="cl-span-3 cl-field">
            <label class="cl-label" th:for="${id + '-tracking'}" th:text="#{order.shipments.dialog.tracking}"></label>
            <input class="cl-input" type="text" autocomplete="off" th:id="${id + '-tracking'}" th:name="${name + 'trackingNo'}"
                   th:value="${s != null ? s.trackingNo : null}">
        </div>
        <div class="cl-span-3 cl-field">
            <label class="cl-label" th:for="${id + '-point'}" th:text="#{order.shipments.dialog.point}"></label>
            <input class="cl-input" type="text" autocomplete="off" th:id="${id + '-point'}" th:name="${name + 'collectionPointCode'}"
                   th:value="${s != null ? s.collectionPointCode : null}">
        </div>
        <div class="cl-field">
            <label class="cl-label" th:for="${id + '-url'}" th:text="#{order.shipments.dialog.url}"></label>
            <input class="cl-input" type="url" autocomplete="off" th:id="${id + '-url'}" th:name="${name + 'trackingUrl'}"
                   th:value="${s != null ? s.trackingUrl : null}">
        </div>
        <div class="cl-span-3 cl-field">
            <label class="cl-label" th:for="${id + '-shipped'}" th:text="#{order.shipments.dialog.shipped}"></label>
            <input class="cl-input" type="datetime-local" th:id="${id + '-shipped'}" th:name="${name + 'shippedAt'}"
                   th:value="${s != null and s.shippedAt != null} ? ${#temporals.format(s.shippedAt, 'yyyy-MM-dd''T''HH:mm')} : ''">
        </div>
        <div class="cl-span-3 cl-field">
            <label class="cl-label" th:for="${id + '-delivered'}" th:text="#{order.shipments.dialog.delivered}"></label>
            <input class="cl-input" type="datetime-local" th:id="${id + '-delivered'}" th:name="${name + 'deliveredAt'}"
                   th:value="${s != null and s.deliveredAt != null} ? ${#temporals.format(s.deliveredAt, 'yyyy-MM-dd''T''HH:mm')} : ''">
        </div>
    </div>
    <!--/* After the grid: the floated legend is cleared by the element that follows it, so it must be the grid. */-->
    <button type="button" class="cl-link-button is-danger cl-repeat-remove" data-cl-repeat-remove hidden
            th:text="#{general.delete}"
            th:attr="aria-label=#{order.shipments.dialog.remove(${number})},
                     data-cl-repeat-label=#{order.shipments.dialog.remove('@N@')}"></button>
</th:block>
</body>
</html>
