<!DOCTYPE HTML>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<section th:fragment="card" class="cl-card" id="pozycje" aria-labelledby="items-title"
         th:with="items=${page.items()}, menus=${!page.readOnly()}">
    <div class="cl-card-head">
        <h2 class="cl-card-title" id="items-title" th:text="#{order.card.items(${items.count()})}"></h2>
        <div class="cl-card-actions" th:if="${menus or items.lowMargin().editable()}">
            <!--/* the store's threshold, so it stays on a closed order too; it names the value it holds */-->
            <button th:if="${items.lowMargin().editable()}" type="button" class="cl-link-button" data-cl-dialog-open="low-margin-dialog"
                    th:text="${items.lowMargin().threshold() != null} ? #{order.items.margin.threshold.button(${items.lowMargin().threshold()})}
                             : #{order.items.margin.threshold.button.unset}"></button>
            <th:block th:if="${menus}">
                <button th:if="${items.canAddItems()}" type="button" class="cl-button" data-cl-dialog-open="item-add-dialog"
                        th:attr="aria-describedby=${items.addItemsReasonKey() != null} ? 'add-items-reason' : null">
                    <span class="icon is-small" aria-hidden="true"><i class="fas fa-plus"></i></span>
                    <span th:text="#{order.items.add}"></span>
                </button>
                <!--/* greyed, still focusable, its reason under the head (like "Dodaj dokument"); opens nothing */-->
                <button th:unless="${items.canAddItems()}" type="button" class="cl-button" aria-disabled="true"
                        th:attr="aria-describedby=${items.addItemsReasonKey() != null} ? 'add-items-reason' : null">
                    <span class="icon is-small" aria-hidden="true"><i class="fas fa-plus"></i></span>
                    <span th:text="#{order.items.add}"></span>
                </button>
            </th:block>
        </div>
        <p th:if="${items.addItemsReasonKey() != null}" class="cl-help is-note" id="add-items-reason"
           th:text="${items.addItemsReasonIsSentence()} ? #{${items.addItemsReasonKey()}}
                    : #{order.items.add.reason(${#messages.msg(items.addItemsReasonKey())})}"></p>
    </div>

    <!--/* read-only (closed order, super admin): the same block without method and action, so it never posts */-->
    <form id="order-items-form" class="cl-card-section"
          th:attr="method=${page.readOnly()} ? null : 'post',
                   action=${page.readOnly()} ? null : @{/dashboard/orders/{id}/moveSelectedItemsToAllocation(id=${page.orderId()})}">
        <th:block th:if="${items.selectable()}">
            <p class="cl-visually-hidden" role="status" data-cl-selection-status></p>
            <!--/* The selection row covers the table header while items are checked (table-select.js): its own
                   select-all box (which clears the selection), the count, the menus and "Remove", in this order for the eye and for Tab.
                   An entry that cannot run says why in its .cl-menu-reason, as in the row menu; order-items.js greys
                   what fits none of the checked items. */-->
            <div class="cl-selection-row" data-cl-selection-bar hidden>
                <label class="cl-check-target"><input class="cl-check-input" type="checkbox" data-cl-select-all
                                                      th:attr="aria-label=#{order.items.select.all}, data-cl-label-select=#{order.items.select.all}, data-cl-label-clear=#{order.items.select.none}"></label>
                <span class="cl-selection-count" data-cl-selection-count
                      th:attr="data-template=#{order.bulk.selected('{k}', '{n}')}"></span>
                <div class="cl-selection-actions"
                     th:attr="data-cl-scope-template=#{order.bulk.scope}, data-cl-scope-count-template=#{order.bulk.scope.count}">
                    <details class="cl-menu" th:each="menu : ${items.bulkMenus()}">
                        <summary class="cl-button">
                            <span th:text="#{${menu.menu().labelKey()}}"></span>
                            <span class="icon is-small" aria-hidden="true"><i class="fas fa-chevron-down"></i></span>
                        </summary>
                        <ul class="cl-menu-list" th:id="|bulk-menu-${#strings.toLowerCase(menu.menu().name())}|">
                            <li th:each="bulk : ${menu.actions()}">
                                <button th:if="${bulk.action().name() != 'MOVE'}" type="button" class="cl-menu-item"
                                        th:attr="data-cl-bulk-action=@{${bulk.href()}}, data-cl-bulk-scope=${bulk.action().scope()},
                                                 data-label=#{${bulk.action().labelKey()}}, data-skipped=#{${bulk.action().skippedKey()}},
                                                 data-cl-bulk-unavailable=${bulk.available()} ? null : 'true',
                                                 aria-disabled=${bulk.available()} ? null : 'true',
                                                 data-cl-bulk-confirm-title=#{${bulk.action().confirmTitleKey()}},
                                                 data-cl-bulk-confirm-message=#{${bulk.action().confirmMessageKey()}},
                                                 data-cl-bulk-confirm-action=#{${bulk.action().confirmActionKey()}}">
                                    <span data-cl-bulk-label th:text="#{${bulk.action().labelKey()}}"></span>
                                    <span class="cl-menu-reason" data-cl-bulk-reason th:hidden="${bulk.available()}"
                                          th:text="${bulk.available()} ? '' : #{${bulk.reasonKey()}}"></span>
                                </button>
                                <button th:if="${bulk.action().name() == 'MOVE'}" type="button" class="cl-menu-item"
                                        data-cl-dialog-open="move-dialog"
                                        th:attr="data-cl-bulk-scope=${bulk.action().scope()}, data-label=#{${bulk.action().labelKey()}},
                                                 data-skipped=#{${bulk.action().skippedKey()}},
                                                 data-cl-bulk-unavailable=${bulk.available()} ? null : 'true',
                                                 aria-disabled=${bulk.available()} ? null : 'true'">
                                    <span data-cl-bulk-label th:text="#{${bulk.action().labelKey()}}"></span>
                                    <span class="cl-menu-reason" data-cl-bulk-reason th:hidden="${bulk.available()}"
                                          th:text="${bulk.available()} ? '' : #{${bulk.reasonKey()}}"></span>
                                </button>
                            </li>
                        </ul>
                    </details>
                    <!--/* "Remove" stands alone at the end; greyed, it keeps focus and names its reason in a short
                           visible text right before it (the short wording fits the row's one line) */-->
                    <span th:if="${items.bulkStandalone() != null}" th:with="bulk=${items.bulkStandalone()}"
                          class="cl-help cl-selection-reason" id="bulk-remove-reason" th:hidden="${bulk.available()}"
                          th:text="${bulk.available()} ? '' : #{${bulk.shortReasonKey()}}"></span>
                    <button th:if="${items.bulkStandalone() != null}" th:with="bulk=${items.bulkStandalone()}" type="button"
                            class="cl-link-button is-danger cl-selection-remove"
                            th:attr="data-cl-bulk-action=@{${bulk.href()}}, data-cl-bulk-scope=${bulk.action().scope()},
                                     data-label=#{${bulk.action().labelKey()}}, data-skipped=#{${bulk.action().shortSkippedKey()}},
                                     data-cl-bulk-unavailable=${bulk.available()} ? null : 'true',
                                     aria-disabled=${bulk.available()} ? null : 'true',
                                     data-cl-bulk-reason-id='bulk-remove-reason',
                                     aria-describedby=${bulk.available()} ? null : 'bulk-remove-reason',
                                     data-cl-bulk-confirm-title=#{${bulk.action().confirmTitleKey()}},
                                     data-cl-bulk-confirm-message=#{${bulk.action().confirmMessageKey()}},
                                     data-cl-bulk-confirm-action=#{${bulk.action().confirmActionKey()}}">
                        <span data-cl-bulk-label th:text="#{${bulk.action().labelKey()}}"></span>
                    </button>
                </div>
            </div>
        </th:block>

        <table th:if="${items.count() > 0}" class="cl-table is-compact is-wrap"
               th:attr="data-cl-select-table=${items.selectable()} ? 'true' : null">
            <caption class="cl-visually-hidden" th:text="#{order.items.caption}"></caption>
            <colgroup>
                <col th:if="${items.selectable()}" class="cl-col-check">
                <col>
                <col class="cl-col-price">
                <col class="cl-col-state">
                <col class="cl-col-flag">
                <col th:if="${menus}" class="cl-col-menu">
            </colgroup>
            <thead>
            <tr>
                <th th:if="${items.selectable()}" scope="col" class="cl-table-check">
                    <label class="cl-check-target"><input class="cl-check-input" type="checkbox" data-cl-select-all
                                                          th:attr="aria-label=#{order.items.select.all}, data-cl-label-select=#{order.items.select.all}, data-cl-label-clear=#{order.items.select.none}"></label>
                </th>
                <th scope="col" th:text="#{order.items.column.product}"></th>
                <!--/* the unit comes from the same pattern every amount on the page is written with (general.currency.amount) */-->
                <th scope="col" class="is-numeric" th:text="#{order.items.column.price(${#strings.trim(#messages.msg('general.currency.amount', ''))})}"></th>
                <th scope="col" th:text="#{order.items.column.fulfilment}"></th>
                <th scope="col" class="cl-table-flag" th:text="#{order.items.column.consolidated}"></th>
                <th th:if="${menus}" scope="col" class="cl-table-actions"><span class="cl-visually-hidden" th:text="#{order.items.column.actions}"></span></th>
            </tr>
            </thead>
            <tbody>
            <th:block th:each="row : ${items.products()}"><tr th:replace="~{orders/details/items :: row(${row})}"></tr></th:block>
            <tr th:if="${!items.services().isEmpty()}" class="cl-table-group">
                <th scope="rowgroup" th:colspan="${(items.selectable() ? 1 : 0) + 4 + (menus ? 1 : 0)}"><span class="cl-eyebrow"
                    th:text="#{order.items.group.services}"></span></th>
            </tr>
            <th:block th:each="row : ${items.services()}"><tr th:replace="~{orders/details/items :: row(${row})}"></tr></th:block>
            </tbody>
        </table>
        <p th:if="${items.count() == 0}" class="cl-list-empty" th:text="#{order.items.empty}"></p>
        <noscript th:if="${items.bulkAvailable()}">
            <div class="cl-selection-actions is-static">
                <!--/* the move field comes first: Enter in it submits the first button of the form, which must be "move" */-->
                <th:block th:each="bulk : ${items.bulkActions()}" th:if="${bulk.available() and bulk.action().name() == 'MOVE'}">
                    <label class="cl-label" for="move-target-fallback" th:text="#{order.move.target}"></label>
                    <input class="cl-input is-reference" id="move-target-fallback" name="targetOrderId" type="text" maxlength="64">
                    <button type="submit" class="cl-button" th:formaction="@{${bulk.href()}}" th:text="#{${bulk.action().labelKey()}}"></button>
                </th:block>
                <!--/* every other action is confirmed on a page listing the chosen items, as the dialog does with JavaScript */-->
                <th:block th:each="bulk : ${items.bulkActions()}" th:if="${bulk.available() and bulk.action().name() != 'MOVE'}">
                    <button type="submit" class="cl-button" th:classappend="${bulk.action().danger()} ? 'is-danger' : ''"
                            th:formaction="@{|/dashboard/orders/${page.orderId()}/bulk-confirm?action=${bulk.action().name()}|}"
                            th:text="#{${bulk.action().labelKey()}}"></button>
                </th:block>
            </div>
        </noscript>
    </form>
    <form th:unless="${page.readOnly()}" id="consolidate-form" method="post"
          th:action="@{/dashboard/orders/{o}/toggle-consolidation(o=${page.orderId()})}"></form>
    <!--/* "Do alokacji" of one item: the menu entry submits this form with the item's id as the one selected item of
           the bulk endpoint (forms cannot nest in #order-items-form); it works without JavaScript too */-->
    <form th:unless="${page.readOnly()}" id="allocate-item-form" method="post"
          th:action="@{/dashboard/orders/{o}/moveSelectedItemsToAllocation(o=${page.orderId()})}">
        <input type="hidden" name="orderItems[0].selected" value="true">
    </form>
</section>

<tr th:fragment="row(row)" th:with="menus=${!page.readOnly()}"
    th:attr="data-ready-for-allocation=${row.readyForAllocation()}, data-allocated-product=${row.allocatedProduct()},
             data-delivered-product=${row.deliveredProduct()}, data-movable=${row.movable()}, data-removable=${row.removable()}">
    <td th:if="${page.items().selectable()}" class="cl-table-check">
        <label class="cl-check-target"><input class="cl-check-input" type="checkbox" value="true" data-cl-select-row
                                              th:name="|orderItems[${row.index()}].selected|"
                                              th:attr="aria-label=#{order.items.select(${row.name()})}"></label>
        <input type="hidden" th:name="|orderItems[${row.index()}].itemId|" th:value="${row.itemId()}">
    </td>
    <!--/* Two lines: the name with its markers, then the labelled codes. Physical state stays a pill; the comment is a
           small toggle whose popover the browser opens (details.cl-note, also without JavaScript); menu.js keeps one
           popover or menu open and adds Escape and the outside click. */-->
    <th scope="row" class="cl-table-key" th:attr="data-label=#{order.items.column.product}">
        <a th:if="${row.viewHref() != null}" class="cl-table-link" th:href="@{${row.viewHref()}}" th:text="${row.name()}"></a>
        <span th:unless="${row.viewHref() != null}" th:text="${row.name()}"></span>
        <span th:if="${row.hasMarkers()}" class="cl-table-marks">
            <span th:if="${row.conditionKey() != null}" class="cl-status" th:classappend="${row.conditionTone()}" th:text="#{${row.conditionKey()}}"></span>
            <span th:if="${row.service()}" class="cl-status is-neutral" th:text="#{order.items.pill.service}"></span>
            <details th:if="${row.comment() != null}" class="cl-note is-accent">
                <summary class="cl-note-toggle" th:attr="aria-label=#{order.items.note.comment}"><span class="cl-note-glyph" aria-hidden="true"><i class="far fa-comment-alt"></i></span></summary>
                <div class="cl-note-panel"><p class="cl-note-title" th:text="#{order.items.note.comment}"></p><p class="cl-note-text is-pre" th:text="${row.comment()}"></p></div>
            </details>
        </span>
        <!--/* Every code carries its label and copies on click; its copy icon always follows it. The label and its code
               never part at a line end, nor the code and its icon (the word joiner before the icon). */-->
        <span th:if="${row.hasCodes()}" class="cl-table-sub">
            <span th:if="${row.category() != null}" th:text="${row.category()}"></span>
            <th:block th:if="${row.mfn() != null}">
                <span th:if="${row.category() != null}" class="cl-table-sep">·</span>
                <span th:text="#{order.items.mfn.prefix}"></span>&nbsp;<button type="button" class="cl-copy-inline" th:attr="data-cl-copy=${row.mfn()}, aria-label=#{order.items.copy.mfn(${row.mfn()})}"><span class="cl-copy-code"><span th:text="${row.mfn()}"></span><span class="cl-copy-icon" aria-hidden="true">&#8288;<i class="far fa-copy"></i></span></span></button>
            </th:block>
            <th:block th:if="${row.skuShown()}">
                <span th:if="${row.category() != null or row.mfn() != null}" class="cl-table-sep">·</span>
                <span th:text="#{order.items.sku.prefix}"></span>&nbsp;<button type="button" class="cl-copy-inline" th:attr="data-cl-copy=${row.sku()}, title=${row.sku()}, aria-label=#{order.items.copy.sku(${row.sku()})}"><span class="cl-copy-code"><span th:text="${#strings.abbreviate(row.sku(), 28)}"></span><span class="cl-copy-icon" aria-hidden="true">&#8288;<i class="far fa-copy"></i></span></span></button>
            </th:block>
            <th:block th:if="${row.serialNo() != null}">
                <span th:if="${row.category() != null or row.mfn() != null or row.skuShown()}" class="cl-table-sep">·</span>
                <!--/* with a history page the SN is a link and its own copy button follows it (glued by a word joiner); without
                       one the SN itself copies */-->
                <th:block th:if="${row.serialHref() != null}"><span th:text="#{order.items.sn.prefix}"></span>&nbsp;<a class="cl-table-link" th:href="@{${row.serialHref()}}" th:text="${row.serialNo()}"></a>&#8288;<button type="button" class="cl-copy-inline is-icon" th:attr="data-cl-copy=${row.serialNo()}, aria-label=#{order.items.copy.sn(${row.serialNo()})}"><span class="cl-copy-icon" aria-hidden="true"><i class="far fa-copy"></i></span></button></th:block>
                <th:block th:unless="${row.serialHref() != null}"><span th:text="#{order.items.sn.prefix}"></span>&nbsp;<button type="button" class="cl-copy-inline" th:attr="data-cl-copy=${row.serialNo()}, aria-label=#{order.items.copy.sn(${row.serialNo()})}"><span class="cl-copy-code"><span th:text="${row.serialNo()}"></span><span class="cl-copy-icon" aria-hidden="true">&#8288;<i class="far fa-copy"></i></span></span></button></th:block>
            </th:block>
        </span>
    </th>
    <td class="is-numeric" th:attr="data-label=#{order.items.column.price(${#strings.trim(#messages.msg('general.currency.amount', ''))})}">
        <span class="cl-price-margin"><span th:text="#{order.items.qty.price(${row.qty()}, ${row.unitPrice()})}"></span><span
              th:replace="~{orders/details/items :: margin(${row.margin()})}"></span></span>
    </td>
    <!--/* the state pill, the delivery (supplier or delivery number) as the second line under it */-->
    <td class="cl-table-fulfilment" th:attr="data-label=#{order.items.column.fulfilment}">
        <span class="cl-status" th:classappend="${row.statusTone()}" th:text="#{${row.statusKey()}}"></span>
        <span th:if="${row.deliveryLabel() != null}" class="cl-table-sub">
            <a th:if="${row.deliveryHref() != null}" class="cl-table-link" th:href="@{${row.deliveryHref()}}" th:text="${row.deliveryLabel()}"></a>
            <span th:unless="${row.deliveryHref() != null}" th:text="${row.deliveryLabel()}"></span>
        </span>
    </td>
    <!--/* display only: the item menu toggles it. The glyph is hidden from screen readers, the hidden word says it; an
           unconsolidated item leaves the cell empty, and in card mode an empty cell is not shown at all. */-->
    <td class="cl-table-flag" th:classappend="${row.consolidated()} ? '' : 'is-empty'" th:attr="data-label=#{order.items.column.consolidated}"><th:block th:if="${row.consolidated()}"><span class="cl-table-flag-mark" aria-hidden="true">✓</span><span class="cl-visually-hidden" th:text="#{order.items.consolidated.yes}"></span></th:block></td>
    <td th:if="${menus}" class="cl-table-actions">
        <details class="cl-menu" th:if="${!row.actions().isEmpty()}">
            <summary class="cl-button is-icon" th:attr="aria-label=#{order.items.menu(${row.name()})}">
                <span class="cl-menu-glyph" aria-hidden="true">⋯</span>
            </summary>
            <ul class="cl-menu-list" th:id="|item-menu-${row.index()}|">
                <th:block th:each="state : ${row.actions()}">
                    <li th:if="${state.action().name() == 'EDIT'}" class="cl-menu-sep" aria-hidden="true"></li>
                    <li th:if="${!state.available()}">
                        <button type="button" class="cl-menu-item" aria-disabled="true">
                            <span th:text="#{${state.labelKey()}}"></span>
                            <span class="cl-menu-reason"
                                  th:text="${state.reasonArg() != null} ? #{${state.reasonKey()}(${state.reasonArg()})} : #{${state.reasonKey()}}"></span>
                        </button>
                    </li>
                    <!--/* without JavaScript the dialog cannot open; the link leads to the item's edit page instead */-->
                    <li th:if="${state.available() and state.action().dialogId() != null}">
                        <a class="cl-menu-item" th:href="@{${row.editHref()}}"
                           th:attr="data-cl-dialog-open=${state.action().dialogId()}, data-item-id=${row.itemId()},
                                    data-name=${row.name()}, data-sku=${row.sku()}, data-category=${row.category()},
                                    data-qty=${row.qty()}, data-price=${row.price()}, data-tax=${row.tax()}"
                           th:text="#{${state.labelKey()}}"></a>
                    </li>
                    <li th:if="${state.available() and state.action().name() == 'CLEAR_SUPPLIER'}">
                        <a class="cl-menu-item" data-cl-confirm
                           th:href="@{/dashboard/orders/{o}/clear-supplier(o=${page.orderId()}, itemId=${row.itemId()})}"
                           th:attr="data-cl-confirm-title=#{order.item.clear.confirm.title(${row.name()})},
                                    data-cl-confirm-message=#{order.item.clear.confirm.message},
                                    data-cl-confirm-action=#{order.item.clear.confirm.action}"
                           th:text="#{${state.labelKey()}}"></a>
                    </li>
                    <li th:if="${state.available() and state.action().name() == 'ALLOCATE'}">
                        <button type="submit" class="cl-menu-item" form="allocate-item-form" name="orderItems[0].itemId"
                                th:value="${row.itemId()}" th:text="#{${state.labelKey()}}"></button>
                    </li>
                    <li th:if="${state.available() and state.action().name() == 'CONSOLIDATE'}">
                        <!--/* forms cannot nest: the button submits the separate form#consolidate-form, its value is the itemId */-->
                        <button type="submit" class="cl-menu-item" form="consolidate-form" name="itemId"
                                th:value="${row.itemId()}" th:text="#{${state.labelKey()}}"></button>
                    </li>
                    <li th:if="${state.action().name() == 'EDIT'}">
                        <a class="cl-menu-item" th:href="@{${row.editHref()}}" th:text="#{${state.labelKey()}}"></a>
                    </li>
                </th:block>
            </ul>
        </details>
    </td>
</tr>

<!--/* The margin of one unit as an icon after the price; the tooltip (and the accessible name) carries the numbers,
       the cost included — it used to be the line under the price. A low margin and a loss change the glyph as well as
       the colour, so the mark does not rest on colour alone. Focusable, so the tooltip opens from the keyboard and on tap. */-->
<span th:fragment="margin(m)" class="cl-margin cl-tooltip is-lines" tabindex="0" role="img"
      th:classappend="|is-${#strings.toLowerCase(m.tone().name())}|"
      th:with="text=${m.tone().name() == 'UNKNOWN'} ? #{order.items.margin.unknown}
                : #{${m.tone().key()}(${m.percent() != null ? m.percent() : '—'},
                    ${#messages.msg('general.currency.amount', m.profit())},
                    ${#messages.msg('general.currency.amount', m.cost())}, ${m.threshold()})}"
      th:attr="data-tooltip=${text}, aria-label=${text}"><i aria-hidden="true" class="fas"
      th:classappend="${m.tone().name() == 'LOW'} ? 'fa-exclamation-triangle' : (${m.tone().name() == 'LOSS'} ? 'fa-arrow-down' : 'fa-percent')"></i></span>

<!--/* The store's low-margin threshold; posted on its own, outside the items form. */-->
<dialog th:fragment="lowMarginDialog" class="cl-dialog is-form" id="low-margin-dialog" aria-labelledby="low-margin-title">
    <form method="post" th:action="@{/dashboard/orders/{o}/lowMarginThreshold(o=${page.orderId()})}">
        <h2 class="cl-dialog-title" id="low-margin-title" th:text="#{order.items.margin.threshold.title}"></h2>
        <div class="cl-dialog-body">
            <p class="cl-help" th:text="#{order.items.margin.threshold.desc}"></p>
            <div class="cl-field">
                <label class="cl-label" for="low-margin-threshold" th:text="#{order.items.margin.threshold.label}"></label>
                <input class="cl-input is-short" id="low-margin-threshold" name="threshold" type="text" inputmode="decimal"
                       maxlength="6" autocomplete="off" aria-describedby="low-margin-threshold-help"
                       th:value="${page.items().lowMargin().threshold()}">
                <p class="cl-help" id="low-margin-threshold-help" th:text="#{order.items.margin.threshold.help}"></p>
            </div>
        </div>
        <div class="cl-dialog-actions">
            <button type="submit" class="cl-button is-primary" th:text="#{general.save}"></button>
            <button type="button" class="cl-button" data-cl-dialog-close th:text="#{general.cancel}"></button>
        </div>
    </form>
</dialog>
</body>
</html>
