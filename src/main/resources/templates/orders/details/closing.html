<!DOCTYPE HTML>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<!--/* "Do zamknięcia" strip: one row, the list's doc marks inline as full sentences; only for open orders. */-->
<section th:fragment="strip" th:if="${page.checklist() != null}" class="cl-card is-status cl-closing"
         aria-labelledby="closing-title">
    <h2 class="cl-closing-title" id="closing-title"
        th:classappend="${page.checklist().missing() == 0} ? 'is-ok' : 'is-warn'" th:text="${page.checklistTitle()}"></h2>
    <ul class="cl-doc-marks is-sentences" th:attr="aria-label=#{order.closing.legend}">
        <!--/* three states: done (✓), to do (✗) and "does not apply" (–, neither ticked nor missing); the glyph is
               hidden from screen readers, the hidden prefix says the state in words */-->
        <li th:each="item : ${page.checklist().items()}" class="cl-doc-mark"
            th:classappend="${item.done()} ? 'is-done' : (${item.todo()} ? 'is-todo' : 'is-na')">
            <span class="cl-doc-mark-icon" aria-hidden="true" th:text="${item.done()} ? '✓' : (${item.todo()} ? '✗' : '–')"></span>
            <span class="cl-visually-hidden"
                  th:text="${item.done()} ? #{order.closing.state.done} : (${item.todo()} ? #{order.closing.state.todo} : #{order.closing.state.na})"></span>
            <a th:if="${item.todo() and item.anchor() != null}" th:href="${item.anchor()}" th:text="${item.text()}"></a>
            <button th:if="${item.todo() and item.reviewDialog() and !page.readOnly()}" type="button" class="cl-link-button"
                    data-cl-dialog-open="review-dialog" th:text="${item.text()}"></button>
            <span th:if="${!item.todo() or (item.anchor() == null and !(item.reviewDialog() and !page.readOnly()))}" th:text="${item.text()}"></span>
        </li>
    </ul>
</section>
</body>
</html>
