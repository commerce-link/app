<!DOCTYPE HTML>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<!--/* "Do zamknięcia" strip (spec §4.2): one row, the list's doc marks inline as full sentences; only for open orders. */-->
<section th:fragment="strip" th:if="${page.checklist() != null}" class="cl-card is-status cl-closing"
         aria-labelledby="closing-title">
    <h2 class="cl-closing-title" id="closing-title"
        th:classappend="${page.checklist().missing() == 0} ? 'is-ok' : 'is-warn'" th:text="${page.checklistTitle()}"></h2>
    <ul class="cl-doc-marks is-inline" th:attr="aria-label=#{order.closing.legend}">
        <li th:each="item : ${page.checklist().items()}" class="cl-doc-mark" th:classappend="${item.done()} ? 'is-done' : 'is-todo'">
            <span class="cl-doc-mark-icon" aria-hidden="true"><i class="fas" th:classappend="${item.done()} ? 'fa-check' : 'fa-times'"></i></span>
            <span class="cl-visually-hidden" th:text="${item.done()} ? #{order.closing.state.done} : #{order.closing.state.todo}"></span>
            <a th:if="${!item.done() and item.anchor() != null}" th:href="${item.anchor()}" th:text="${item.text()}"></a>
            <button th:if="${!item.done() and item.reviewDialog() and !page.readOnly()}" type="button" class="cl-link-button"
                    data-cl-dialog-open="review-dialog" th:text="${item.text()}"></button>
            <span th:if="${item.done() or (item.anchor() == null and !(item.reviewDialog() and !page.readOnly()))}" th:text="${item.text()}"></span>
        </li>
    </ul>
</section>
</body>
</html>
