<!DOCTYPE HTML>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}">
<body>

<!--/* The management dialog of the orders list. Without JavaScript the same body renders as the page
       /dashboard/orders/filters (layout:fragment below). */-->
<dialog th:fragment="filtersDialog" class="cl-dialog is-form" id="filters-dialog" aria-labelledby="filters-dialog-title">
    <h2 class="cl-dialog-title" id="filters-dialog-title" th:text="#{orders.filters.title}"></h2>
    <div class="cl-dialog-body" data-cl-dialog-body>
        <div th:replace="~{orders/filters :: dialogBody}"></div>
    </div>
</dialog>

<!--/* List + star + edit/delete, then the new/edit form (hidden until "Nowy filtr" / "Edytuj"). Re-rendered by the
       controller after every fetch; data-cl-redirect tells the script the list under the dialog changed. */-->
<div th:fragment="dialogBody" th:attr="data-cl-redirect=${redirectTo}">
    <div th:if="${filterError}" class="cl-alert is-bad" role="status" data-cl-error-summary tabindex="-1">
        <p class="cl-alert-text" th:text="${filterError}"></p>
    </div>

    <div data-cl-filters-list>
        <ul class="cl-list" th:unless="${filters.sharedWithStore().isEmpty() and filters.own().isEmpty()}">
            <th:block th:each="group : ${ {filters.sharedWithStore(), filters.own()} }" th:with="shared=${groupStat.first}">
                <li class="cl-list-item" th:each="filter : ${group}">
                    <form method="post" class="cl-star-form" data-cl-filters-form
                          th:action="${filters.isDefault(filter.id)} ? @{/dashboard/orders/filters/default/clear} : @{/dashboard/orders/filters/{id}/default(id=${filter.id})}">
                        <input type="hidden" name="returnTo" th:value="${returnTo}"/>
                        <button type="submit" class="cl-star" th:attr="aria-pressed=${filters.isDefault(filter.id)},
                                aria-label=${filters.isDefault(filter.id)} ? #{orders.filters.default.clear(${filter.label})} : #{orders.filters.default.set(${filter.label})}">
                            <span class="icon is-small" aria-hidden="true"><i th:class="${filters.isDefault(filter.id)} ? 'fas fa-star' : 'far fa-star'"></i></span>
                        </button>
                    </form>
                    <div>
                        <span class="cl-list-title" th:text="${filter.label}"></span>
                        <p class="cl-list-desc">
                            <th:block th:each="c, s : ${filter.conditions}"><span th:text="${#messages.msg('orders.filters.field.' + T(pl.commercelink.web.orders.FilterConditionLabels).fieldKey(c.field))} + ': ' + ${T(pl.commercelink.web.orders.FilterConditionLabels).value(c, #messages)}"></span><span th:unless="${s.last}"> · </span></th:block>
                            · <span th:text="${shared} ? #{orders.filters.scope.store} : #{orders.filters.scope.private}"></span>
                        </p>
                    </div>
                    <div class="cl-list-actions" th:if="${!shared or canManageStoreFilters}">
                        <button type="button" class="cl-link-button" data-cl-filter-edit
                                th:attr="aria-label=#{orders.filters.edit.label(${filter.label})},
                                         data-filter-id=${filter.id}, data-label=${filter.label}, data-shared=${shared},
                                         data-status=${filter.conditionsByField.get('Status')},
                                         data-shipment-type=${filter.conditionsByField.get('ShipmentType')},
                                         data-payment-source=${filter.conditionsByField.get('PaymentSource')},
                                         data-source-name=${filter.conditionsByField.get('SourceName')},
                                         data-shipping-postal-code=${filter.conditionsByField.get('ShippingPostalCode')},
                                         data-shipping-due=${filter.conditionsByField.get('ShippingDue')}"
                                th:text="#{settings.list.edit}"></button>
                        <a class="cl-link-button is-danger" data-cl-confirm
                           th:href="@{/dashboard/orders/filters/delete(filterId=${filter.id},returnTo=${returnTo})}"
                           th:attr="aria-label=#{orders.filters.delete.label(${filter.label})},
                                    data-cl-confirm-title=#{orders.filters.delete.title(${filter.label})},
                                    data-cl-confirm-message=#{orders.filters.delete.message},
                                    data-cl-confirm-action=#{orders.filters.delete.action}"
                           th:text="#{settings.list.delete}"></a>
                    </div>
                </li>
            </th:block>
        </ul>
        <p class="cl-list-empty" th:if="${filters.sharedWithStore().isEmpty() and filters.own().isEmpty()}" th:text="#{orders.filters.empty}"></p>
        <p class="cl-help" th:text="#{orders.filters.default.help}"></p>
        <div class="cl-dialog-actions">
            <button type="button" class="cl-button is-primary" data-cl-filter-new th:text="#{orders.filters.new}"></button>
            <a class="cl-button" th:href="@{${returnTo}}" data-cl-dialog-close th:text="#{orders.filters.close}"></a>
        </div>
    </div>

    <form method="post" th:action="@{/dashboard/orders/filters}" class="cl-form" id="filter-form" novalidate hidden data-cl-filters-form data-cl-filter-form>
        <input type="hidden" name="filterId" value="" data-cl-filter-id/>
        <input type="hidden" name="returnTo" th:value="${returnTo}"/>
        <div th:replace="~{orders/filters :: filterFormFields}"></div>
        <div class="cl-dialog-actions">
            <button type="submit" class="cl-button is-primary" th:text="#{orders.filters.save}"></button>
            <button type="button" class="cl-button" data-cl-filter-back th:text="#{orders.filters.cancel}"></button>
        </div>
    </form>
</div>

<!--/* The fields of a filter, shared by new/edit and by "save this view" (which pre-fills them from the address). */-->
<div th:fragment="filterFormFields" class="cl-form-grid">
    <div class="cl-field cl-span-6">
        <label class="cl-label" for="filter-label" th:text="#{orders.filters.name}"></label>
        <input class="cl-input" type="text" id="filter-label" name="label" required/>
    </div>
    <div class="cl-field cl-span-3">
        <label class="cl-label" for="filter-status" th:text="#{orders.filters.field.status}"></label>
        <select class="cl-select" id="filter-status" name="status" aria-describedby="filter-status-help">
            <option value="" th:text="#{orders.filters.any}"></option>
            <option th:each="status : ${statuses}" th:value="${status.name()}" th:text="#{${'OrderStatus.' + status.name()}}"></option>
        </select>
        <p class="cl-help" id="filter-status-help" th:text="#{orders.filters.field.status.help}"></p>
    </div>
    <div class="cl-field cl-span-3">
        <label class="cl-label" for="filter-shipping-due" th:text="#{orders.filters.field.shipping.due}"></label>
        <select class="cl-select" id="filter-shipping-due" name="shippingDue">
            <option value="" th:text="#{orders.filters.any}"></option>
            <option th:each="due : ${shippingDueOptions}" th:value="${due.name()}" th:text="#{${'ShippingDue.' + due.name()}}"></option>
        </select>
    </div>
    <div class="cl-field cl-span-3">
        <label class="cl-label" for="filter-shipment-type" th:text="#{orders.filters.field.shipment.type}"></label>
        <select class="cl-select" id="filter-shipment-type" name="shipmentType">
            <option value="" th:text="#{orders.filters.any}"></option>
            <option th:each="type : ${shipmentTypes}" th:value="${type.name()}" th:text="#{${'ShipmentType.' + type.name()}}"></option>
        </select>
    </div>
    <div class="cl-field cl-span-3">
        <label class="cl-label" for="filter-payment-source" th:text="#{orders.filters.field.payment.source}"></label>
        <select class="cl-select" id="filter-payment-source" name="paymentSource">
            <option value="" th:text="#{orders.filters.any}"></option>
            <option th:each="source : ${paymentSources}" th:value="${source.name()}" th:text="#{${'PaymentSource.' + source.name()}}"></option>
        </select>
    </div>
    <div class="cl-field cl-span-3">
        <label class="cl-label" for="filter-source-name" th:text="#{orders.filters.field.marketplace}"></label>
        <select class="cl-select" id="filter-source-name" name="sourceName" th:unless="${marketplaces.isEmpty()}">
            <option value="" th:text="#{orders.filters.any}"></option>
            <option th:each="m : ${marketplaces}" th:value="${m}" th:text="${m}"></option>
        </select>
        <p class="cl-help" th:if="${marketplaces.isEmpty()}" th:text="#{orders.filters.marketplaces.empty}"></p>
    </div>
    <div class="cl-field cl-span-3">
        <label class="cl-label" for="filter-postal-code" th:text="#{orders.filters.field.postal.code}"></label>
        <input class="cl-input" type="text" id="filter-postal-code" name="shippingPostalCode" inputmode="numeric" data-cl-postal-code/>
    </div>
    <div class="cl-check-field cl-span-6" th:if="${canManageStoreFilters}">
        <label class="cl-check"><input type="checkbox" name="sharedWithStore" value="true"/> <span th:text="#{orders.filters.share}"></span></label>
        <p class="cl-check-description" th:text="#{orders.filters.share.help}"></p>
    </div>
</div>

<!--/* "Save the current view": conditions as pills, pre-filled hidden fields, star checkbox. */-->
<dialog th:fragment="saveViewDialog" class="cl-dialog is-form" id="save-view-dialog" aria-labelledby="save-view-title">
    <h2 class="cl-dialog-title" id="save-view-title" th:text="#{orders.filters.saveView.title}"></h2>
    <div class="cl-dialog-body" data-cl-dialog-body>
        <div th:replace="~{orders/filters :: saveViewBody}"></div>
    </div>
</dialog>

<form th:fragment="saveViewBody" method="post" th:action="@{/dashboard/orders/filters}" class="cl-form" novalidate data-cl-filters-form
      th:attr="data-cl-redirect=${redirectTo}">
    <div th:if="${filterError}" class="cl-alert is-bad" role="status" data-cl-error-summary tabindex="-1">
        <p class="cl-alert-text" th:text="${filterError}"></p>
    </div>
    <input type="hidden" name="returnTo" th:value="${returnTo}"/>
    <input type="hidden" th:each="c : ${page.saveViewConditions()}" th:name="${T(pl.commercelink.web.orders.FilterConditionLabels).formField(c.field())}" th:value="${c.value()}"/>
    <div class="cl-form-grid">
        <div class="cl-field cl-span-6">
            <label class="cl-label" for="save-view-label" th:text="#{orders.filters.name}"></label>
            <input class="cl-input" type="text" id="save-view-label" name="label" required autofocus/>
        </div>
        <div class="cl-span-6">
            <span class="cl-eyebrow" th:text="#{orders.filters.saveView.conditions}"></span>
            <span class="cl-table-pills"><span class="cl-status is-neutral" th:each="c : ${page.saveViewConditions()}" th:text="${c.label()}"></span></span>
            <p class="cl-help" th:text="#{orders.filters.saveView.help}"></p>
        </div>
        <div class="cl-check-field cl-span-6">
            <label class="cl-check"><input type="checkbox" name="makeDefault" value="true" checked/> <span th:text="#{orders.filters.makeDefault}"></span></label>
            <p class="cl-check-description" th:if="${filters.defaultFilter().isPresent()}" th:text="#{orders.filters.default.replace(${filters.defaultFilter().get().label})}"></p>
        </div>
        <div class="cl-check-field cl-span-6" th:if="${canManageStoreFilters}">
            <label class="cl-check"><input type="checkbox" name="sharedWithStore" value="true"/> <span th:text="#{orders.filters.share}"></span></label>
            <p class="cl-check-description" th:text="#{orders.filters.share.help}"></p>
        </div>
    </div>
    <div class="cl-dialog-actions">
        <button type="submit" class="cl-button is-primary" th:text="#{orders.filters.save}"></button>
        <a class="cl-button" th:href="@{${returnTo}}" data-cl-dialog-close th:text="#{orders.filters.cancel}"></a>
    </div>
</form>

<!--/* The page for browsers without JavaScript: the dialog body inside a card. */-->
<div layout:fragment="content">
    <section class="cl-page">
        <div class="cl-page-body">
            <div th:replace="~{fragments/settings-header :: subpage(${returnTo}, #{orders.filters.page.back}, #{orders.filters.page.title})}"></div>
            <section class="cl-card cl-card-dialog-page">
                <div th:replace="~{orders/filters :: dialogBody}"></div>
            </section>
            <div th:replace="~{fragments/confirm-dialog :: dialog}"></div>
        </div>
    </section>
    <script th:src="@{/js/confirm-dialog.js}" defer></script>
    <script th:src="@{/js/filters-dialog.js}" defer></script>
</div>

</body>
</html>
