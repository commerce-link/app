<!DOCTYPE HTML>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}">
<body>
<div layout:fragment="content">
    <section class="cl-page">
        <div class="cl-page-body">
            <div th:replace="~{fragments/settings-header :: header(false, null)}"></div>
            <div th:replace="~{fragments/settings-form :: savedAlert}"></div>

            <div class="cl-stack">
                <form th:fragment="senderForm" id="notification-sender-form" class="cl-form"
                      th:action="@{${formAction}}" th:object="${form}" method="post" novalidate data-cl-async
                      th:attr="data-success-message=${savedMessage}, data-error-message=#{form.save.failed}">
                    <div th:replace="~{fragments/settings-form :: errorSummary('notification-sender-errors', ${errors}, null)}"></div>

                    <div class="cl-card">
                        <fieldset class="cl-fieldset">
                            <legend class="cl-fieldset-title" th:text="#{store.notification.sender.title}"></legend>
                            <div class="cl-form-grid">
                                <div class="cl-span-3" th:insert="~{fragments/settings-form :: textField('senderName', 'store.notification.senderName', *{senderName}, 'text', 'off', false, ${errors['senderName']}, #{store.notification.senderName.help(${senderPreviewName}, ${senderEmail})})}"></div>
                                <div class="cl-span-3" th:insert="~{fragments/settings-form :: textField('replyToEmail', 'store.notification.replyToEmail', *{replyToEmail}, 'email', 'email', false, ${errors['replyToEmail']}, #{store.notification.replyToEmail.help})}"></div>
                            </div>
                        </fieldset>
                        <div class="cl-card-footer">
                            <button class="cl-button is-primary" type="submit" th:text="#{form.save.changes}"></button>
                        </div>
                    </div>
                </form>

                <section class="cl-card" aria-labelledby="customer-messages-title">
                    <div class="cl-card-head">
                        <h2 class="cl-card-title" id="customer-messages-title" th:text="#{store.notification.messages.title}"></h2>
                        <a class="cl-link-button" th:href="@{${templatesHref}}">
                            <span th:text="#{store.notification.messages.templates}"></span>
                            <i class="fas fa-chevron-right" aria-hidden="true"></i>
                        </a>
                    </div>
                    <p class="cl-card-desc"
                       th:text="#{store.notification.messages.summary(${overview.enabledCount()}, ${overview.totalCount()})}"></p>

                    <div th:if="${overview.addressChangeBlocked()}" class="cl-alert is-warn">
                        <i class="fas fa-exclamation-triangle cl-alert-icon" aria-hidden="true"></i>
                        <div>
                            <p class="cl-alert-title" th:text="#{store.notification.messages.addressChange.title}"></p>
                            <p class="cl-alert-text">
                                <span th:text="#{store.notification.messages.addressChange.text}"></span>
                                <a th:href="@{${fulfilmentHref}}" th:text="#{store.notification.messages.addressChange.link}"></a>
                            </p>
                        </div>
                    </div>

                    <th:block th:each="group, groupStat : ${overview.groups()}">
                        <h3 class="cl-list-group" th:id="'message-group-' + ${groupStat.index}" th:text="#{${group.labelKey()}}"></h3>
                        <ul class="cl-list" th:attr="aria-labelledby='message-group-' + ${groupStat.index}">
                            <li class="cl-list-item" th:each="item : ${group.items()}">
                                <div>
                                    <div class="cl-list-title">
                                        <span th:text="#{${item.labelKey()}}"></span>
                                        <span th:if="${item.enabled()}" class="cl-status is-ok" th:text="#{store.notification.messages.enabled}"></span>
                                        <span th:unless="${item.enabled()}" class="cl-status is-neutral" th:text="#{store.notification.messages.disabled}"></span>
                                    </div>
                                    <p th:if="${item.requiredForAddressChange()}" class="cl-list-desc"
                                       th:text="#{store.notification.messages.requiredForAddressChange}"></p>
                                </div>
                                <div class="cl-list-actions">
                                    <a class="cl-link-button" th:href="@{${item.templateHref()}}"
                                       th:text="#{store.notification.messages.editTemplate}"
                                       th:attr="aria-label=#{store.notification.messages.editTemplate.for(${#messages.msg(item.labelKey())})}"></a>
                                </div>
                            </li>
                        </ul>
                    </th:block>
                </section>
            </div>
        </div>
    </section>
    <script th:if="${!errors.isEmpty()}">
        document.getElementById('notification-sender-errors').focus();
    </script>
    <script th:src="@{/js/async-form.js}" defer></script>
</div>
</body>
</html>
