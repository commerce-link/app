<!DOCTYPE HTML>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}">
<body>
<div layout:fragment="content">
    <section class="cl-page">
        <div class="cl-page-body">
            <div th:replace="~{fragments/settings-header :: header(false, null)}"></div>

            <form th:fragment="companyDetailsForm" id="company-details-form" class="cl-form"
                  th:action="@{${formAction}}" th:object="${form}" method="post" novalidate data-cl-async
                  th:attr="data-success-message=${savedMessage}, data-error-message=#{form.save.failed}">
                <div th:if="${!errors.isEmpty()}" id="form-errors" class="cl-alert is-bad" tabindex="-1" data-cl-error-summary>
                    <i class="fas fa-exclamation-circle cl-alert-icon" aria-hidden="true"></i>
                    <div>
                        <p class="cl-alert-title" th:text="#{store.company.details.errors.title}"></p>
                        <ul class="cl-alert-list">
                            <li th:each="error : ${errors}">
                                <a th:href="'#' + ${error.key}" th:text="#{${error.value}}"></a>
                            </li>
                        </ul>
                    </div>
                </div>

                <div class="cl-card">
                    <fieldset class="cl-fieldset">
                        <legend class="cl-fieldset-title" th:text="#{store.company.details.section.company}"></legend>
                        <div class="cl-form-grid">
                            <div class="cl-span-4" th:insert="~{fragments/form-field :: input('companyName', 'order.address.company', *{companyName}, 'text', 'organization', true, ${errors['companyName']})}"></div>
                            <div class="cl-span-2" th:insert="~{fragments/form-field :: input('taxId', 'order.address.tax.id', *{taxId}, 'text', 'off', true, ${errors['taxId']})}"></div>
                        </div>
                    </fieldset>

                    <fieldset class="cl-fieldset">
                        <legend class="cl-fieldset-title" th:text="#{store.company.details.section.address}"></legend>
                        <div class="cl-form-grid">
                            <div class="cl-span-6" th:insert="~{fragments/form-field :: input('streetAndNumber', 'order.address.street', *{streetAndNumber}, 'text', 'street-address', true, ${errors['streetAndNumber']})}"></div>
                            <div class="cl-span-2" th:insert="~{fragments/form-field :: input('postalCode', 'order.address.postal', *{postalCode}, 'text', 'postal-code', true, ${errors['postalCode']})}"></div>
                            <div class="cl-span-2" th:insert="~{fragments/form-field :: input('city', 'order.address.city', *{city}, 'text', 'address-level2', true, ${errors['city']})}"></div>
                            <div class="cl-span-2" th:insert="~{fragments/form-field :: select('country', 'order.address.country', *{country}, ${countries}, 'country', true, ${errors['country']})}"></div>
                        </div>
                    </fieldset>

                    <fieldset class="cl-fieldset">
                        <legend class="cl-fieldset-title" th:text="#{store.company.details.section.contact}"></legend>
                        <div class="cl-form-grid">
                            <div class="cl-span-3" th:insert="~{fragments/form-field :: input('email', 'order.address.email', *{email}, 'email', 'email', true, ${errors['email']})}"></div>
                            <div class="cl-span-3" th:insert="~{fragments/form-field :: input('phone', 'order.address.phone', *{phone}, 'tel', 'tel', false, ${errors['phone']})}"></div>
                        </div>
                    </fieldset>

                    <div class="cl-card-footer">
                        <button class="cl-button is-primary" type="submit" th:text="#{store.company.details.save}"></button>
                    </div>
                </div>
            </form>
        </div>
    </section>
    <script th:if="${!errors.isEmpty()}">
        document.getElementById('form-errors').focus();
    </script>
    <script th:src="@{/js/async-form.js}" defer></script>
</div>
</body>
</html>
