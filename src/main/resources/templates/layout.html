<!DOCTYPE HTML>
<html xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout">
<head>
    <title th:text="#{general.title}"></title>

    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8"/>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bulma@0.9.4/css/bulma.min.css">
    <link rel="stylesheet" th:href="@{/css/commercelink.css}">
    <script>
        (function () {
            try {
                if (localStorage.getItem('cl.nav.collapsed') === '1') {
                    document.documentElement.classList.add('cl-nav-collapsed');
                }
            } catch (error) {
            }
        })();
    </script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bulma-timeline@3.0.5/dist/css/bulma-timeline.min.css">
    <script defer src="https://use.fontawesome.com/releases/v5.0.7/js/all.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.0/Sortable.min.js"></script>
    <th:block th:replace="~{fragments/gtm :: tag}"></th:block>
    <style>
        .cl-tooltip {
            position: relative;
            cursor: help;
        }
        .cl-tooltip::after {
            content: attr(data-tooltip);
            position: absolute;
            bottom: calc(100% + 8px);
            left: 50%;
            transform: translateX(-50%) translateY(4px);
            width: max-content;
            max-width: 320px;
            background: #1f2937;
            color: #fff;
            text-align: left;
            padding: 8px 11px;
            border-radius: 6px;
            font-size: 0.75rem;
            line-height: 1.4;
            font-weight: 400;
            white-space: normal;
            box-shadow: 0 6px 18px rgba(0, 0, 0, 0.22);
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
            transition: opacity 0.15s ease, transform 0.15s ease;
            z-index: 40;
        }
        .cl-tooltip::before {
            content: "";
            position: absolute;
            bottom: calc(100% + 3px);
            left: 50%;
            transform: translateX(-50%);
            border: 5px solid transparent;
            border-top-color: #1f2937;
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
            transition: opacity 0.15s ease;
            z-index: 40;
        }
        .cl-tooltip:hover::after,
        .cl-tooltip:focus::after {
            opacity: 1;
            visibility: visible;
            transform: translateX(-50%) translateY(0);
        }
        .cl-tooltip:hover::before,
        .cl-tooltip:focus::before {
            opacity: 1;
            visibility: visible;
        }
        .cl-toast {
            display: none;
            position: fixed;
            top: 32px;
            right: 32px;
            z-index: 9999;
            padding: 16px 32px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.15);
            font-size: 1.1em;
            color: #fff;
            background: #48c774;
            opacity: 0;
            transition: opacity 0.3s;
        }
        .cl-toast.is-danger { background: #f14668; }
        .cl-toast.is-info { background: #3e8ed0; }
    </style>
</head>
<body>
<th:block th:replace="~{fragments/gtm :: noscript}"></th:block>

<a class="cl-skip" href="#clContent" th:text="#{nav.skip.to.content}"></a>

<div class="cl-shell" th:classappend="${showNavbar == false or navigation == null} ? 'cl-shell-bare' : ''">

    <th:block th:if="${showNavbar != false and navigation != null}">
        <div th:replace="~{fragments/navigation :: sidebar}"></div>
        <div class="cl-scrim" id="clScrim"></div>
    </th:block>

    <div class="cl-main">
        <th:block th:if="${showNavbar != false and navigation != null}">
            <div th:replace="~{fragments/navigation :: topbar}"></div>
        </th:block>

        <div th:if="${successMessage}" class="notification is-success is-small has-text-centered">
            <button class="delete" onclick="hideNotification(this)"></button>
            <span th:text="${successMessage}"></span>
        </div>

        <div th:if="${errorMessage}" class="notification is-danger is-small has-text-centered">
            <button class="delete" onclick="hideNotification(this)"></button>
            <span th:text="${errorMessage}"></span>
        </div>

        <div th:if="${warningMessage}" class="notification is-warning is-small has-text-centered">
            <button class="delete" onclick="hideNotification(this)"></button>
            <span th:text="${warningMessage}"></span>
        </div>

        <div th:if="${demoEnvironment}" class="notification is-warning mb-0" style="border-radius: 0;">
            <p>
                <strong th:text="#{banner.demo.title}"></strong>
                <span th:text="#{banner.demo.integrations}"></span>
                <span th:if="${demoExpiresAt != null}"
                      th:text="#{banner.demo.expiry(${demoExpiresAt}, ${demoDaysLeft})}"></span>
            </p>
        </div>

        <main id="clContent" class="cl-content">
            <section class="section">
                <div class="container content is-fluid" layout:fragment="content">
                </div>
            </section>
        </main>
    </div>
</div>

<!-- Confirm delete modal -->
<div id="deleteModal" class="modal">
    <div class="modal-background"></div>
    <div class="modal-content">
        <div class="box">
            <p th:text="#{confirm.delete}"></p>
            <button class="button is-danger" id="confirmDeleteButton" th:text="#{confirm.yes.delete}">
            </button>
            <button class="button" onclick="closeDelete()" th:text="#{confirm.no}"></button>
        </div>
    </div>
    <button class="modal-close is-large" aria-label="close" onclick="closeDelete()"></button>
</div>

<!-- Confirm save modal -->
<div id="saveModal" class="modal">
    <div class="modal-background"></div>
    <div class="modal-content">
        <div class="box">
            <p th:text="#{confirm.save}"></p>
            <button class="button is-primary" id="confirmSaveButton" th:text="#{confirm.yes.continue}"></button>
            <button class="button" onclick="closeSave()" th:text="#{confirm.no}"></button>
        </div>
    </div>
    <button class="modal-close is-large" aria-label="close" onclick="closeSave()"></button>
</div>

<script>
    let formToSubmit;
    let onConfirmCallback;

    function hideNotification(button) {
        const notification = button.parentNode;
        notification.parentNode.removeChild(notification);
    }

    function confirmDelete(button, callback = null) {
        onConfirmCallback = callback;
        formToSubmit = button.closest('form');
        document.getElementById('deleteModal').classList.add('is-active');
    }

    function closeDelete() {
        onConfirmCallback = null;
        formToSubmit = null;
        document.getElementById('deleteModal').classList.remove('is-active');
    }

    document.getElementById('confirmDeleteButton').addEventListener('click', function() {
        var savedCallback = onConfirmCallback;
        var savedForm = formToSubmit;
        closeDelete();
        if (savedCallback) {
            savedCallback();
        } else if (savedForm) {
            savedForm.submit();
        }
    });

    function confirmSave(button, callback = null) {
        formToSubmit = button.closest('form');
        if (formToSubmit.checkValidity()) {
            onConfirmCallback = callback;
            document.getElementById('saveModal').classList.add('is-active');
        } else {
            formToSubmit.reportValidity();
        }
    }

    function closeSave() {
        document.getElementById('saveModal').classList.remove('is-active');
    }

    document.getElementById('confirmSaveButton').addEventListener('click', function() {
        if (onConfirmCallback) {
            onConfirmCallback();
        } else if (formToSubmit) {
            formToSubmit.submit();
        }
    });

    function validateInputField(inputSelector, errorMessage) {
        const input = document.querySelector(inputSelector);
        if (!input || input.value.trim() === '') {
            let warningDiv = input.closest('div').parentElement;
            let warning = warningDiv.querySelector('.warning-text');
            if (!warning) {
                warning = document.createElement('p');
                warning.className = 'help is-danger warning-text';
                warningDiv.appendChild(warning);
            }
            warning.textContent = errorMessage;
            input.classList.add('is-danger');
            return false;
        } else {
            input.classList.remove('is-danger');
            let warningDiv = input.closest('div').parentElement;
            let warning = warningDiv.querySelector('.warning-text');
            if (warning) {
                warning.remove();
            }
            return true;
        }
    }
</script>

<div id="clToast" class="cl-toast" role="status" aria-live="polite"></div>
<script th:inline="javascript">
    const CL_TOAST_COPIED = /*[[#{general.copied}]]*/ 'Skopiowano';
    let clToastTimer = null;

    function showToast(message, type) {
        const toast = document.getElementById('clToast');
        toast.textContent = message;
        toast.className = 'cl-toast' + (type ? ' is-' + type : '');
        toast.style.display = 'block';
        requestAnimationFrame(() => { toast.style.opacity = '1'; });
        clearTimeout(clToastTimer);
        clToastTimer = setTimeout(() => {
            toast.style.opacity = '0';
            setTimeout(() => { toast.style.display = 'none'; }, 300);
        }, 2000);
    }
</script>

<script th:src="@{/js/navigation.js}" defer></script>

</body>
</html>
