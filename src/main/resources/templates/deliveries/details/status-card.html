<!DOCTYPE HTML>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<!--/* A status card above the items (spec §5, P3): only when the operator has something to do or to understand. */-->
<section th:fragment="card(card, index)" class="cl-card is-status" th:classappend="${card.tone()}"
         th:attr="aria-labelledby=|state-title-${index}|">
    <div class="cl-card-head">
        <h2 class="cl-card-title" th:id="|state-title-${index}|"><i class="fas" th:classappend="|${card.icon()} ${card.tone()}|"
                                                                  aria-hidden="true"></i><span th:text="#{${card.titleKey()}}"></span></h2>
    </div>
    <p th:if="${card.reason() != null}" class="cl-status-reason"><span th:text="#{deliveries.details.status.reason}"></span>
        <code th:text="${card.reason()}"></code></p>
    <p th:if="${card.textKey() != null}" class="cl-card-desc" th:text="#{${card.textKey()}}"></p>
    <div th:if="${!card.actions().isEmpty()}" class="cl-status-actions">
        <a th:each="action : ${card.actions()}" class="cl-button" th:classappend="${action.danger()} ? 'is-danger-outline' : ''"
           th:href="@{${action.href()}}"
           th:attr="data-cl-dialog-open=${action.dialogId()}, data-cl-select-pending=${action.selectPending()} ? 'true' : null"
           th:text="#{${action.labelKey()}}"></a>
    </div>
</section>
</body>
</html>
