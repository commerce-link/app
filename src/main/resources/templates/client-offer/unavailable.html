<!DOCTYPE HTML>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{public-layout}" th:with="publicWidth='is-narrow'">
<head>
    <title th:text="#{client.offer.unavailable.pageTitle}">Oferta niedostępna</title>
</head>
<body>
<th:block layout:fragment="content">
    <section th:replace="~{fragments/public-message :: card(eyebrow=#{client.offer.eyebrow.short(${shortId})},
            title=#{client.offer.unavailable.title}, lead=#{client.offer.unavailable.lead},
            contact=#{client.offer.unavailable.contact}, fallback=null)}"></section>
</th:block>
</body>
</html>
