<!DOCTYPE HTML>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}">
<body>

<div layout:fragment="content">

    <section class="cl-page">
        <div class="cl-page-body">

            <header class="cl-page-header">
                <div class="cl-page-header-row">
                    <h1 class="cl-page-title"
                        th:text="${isSuperAdmin} ? ${#messages.msg('store.title.settings', form.store.name)} : #{store.title}"></h1>
                    <button th:replace="~{fragments/screen-intro :: toggle}"></button>
                    <div class="cl-page-actions" th:if="${isSuperAdmin}">
                        <a th:href="@{'/dashboard/store/' + ${form.store.storeId} + '/copy'}" class="cl-button">
                            <span class="icon is-small" aria-hidden="true"><i class="fas fa-copy"></i></span>
                            <span th:text="#{store.copy}"></span>
                        </a>
                    </div>
                </div>
            </header>

            <div th:replace="~{fragments/screen-intro :: panel('store', 'fas fa-cog')}"></div>

            <div th:replace="~{fragments/store-settings :: alerts(${overview.alerts()})}"></div>

            <div th:replace="~{fragments/store-settings :: sections(${overview.sections()})}"></div>

        </div>
    </section>

</div>

</body>
</html>
