<!DOCTYPE HTML>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}">
<body>
<div layout:fragment="content">
    <style>
        #offerTable td.qty { width: 72px; }
        #offerTable td.price, #offerTable td.cost { width: 110px; }
        #offerTable td.qty .input, #offerTable td.price .input, #offerTable td.cost .input { text-align: right; font-variant-numeric: tabular-nums; padding-inline: 0.5em; }
        #offerTable td.dist { white-space: nowrap; font-size: 0.74rem; line-height: 1.25; }
        #offerTable td.dist span { display: block; font-variant-numeric: tabular-nums; }
        #offerTable td.dist small { display: block; font-size: 0.64rem; color: #7a7a7a; letter-spacing: 0.02em; }
        #offerTable td.dist.missing span { color: #f14668; }
        #offerTable th.dist-h { font-size: 0.78rem; font-weight: 600; color: #7a7a7a; }
        #offerTable tr.in-group td { background: #f9fafc; }
        #offerTable tr.in-group td.name { padding-left: 2.2em; position: relative; }
        #offerTable tr.in-group td.name::before { content: ""; position: absolute; left: 0.9em; top: 0; width: 12px; height: 55%; border-left: 2px solid #b5b5b5; border-bottom: 2px solid #b5b5b5; border-bottom-left-radius: 4px; }
        #offerTable tr.in-group td.catcell .select { display: none; }
        #offerTable tr.group-head td { background: #eef3fb; border-top: 2px solid #b5b5b5; border-bottom: 1px solid #d5e0f2; padding-top: 0.45em; padding-bottom: 0.45em; }
        #offerTable tr.group-head .drag-handle { color: #296fa8; }
        #offerTable tr.group-foot td { background: #f9fafc; border-bottom: 2px solid #b5b5b5; padding: 0; height: 4px; font-size: 0.62rem; color: #296fa8; letter-spacing: 0.06em; text-transform: uppercase; line-height: 1.4; }
        #offerTable tr.group-foot td span { display: none; }
        #offerTable tr.group-head + tr.group-foot td, body.is-dragging-row #offerTable tr.group-foot td { padding: 0.1em 0.75em 0.15em; height: auto; }
        #offerTable tr.group-head + tr.group-foot td .drop-hint { display: inline; }
        body.is-dragging-row #offerTable tr.group-foot td .end-hint { display: inline; }
        body.is-dragging-row #offerTable tr.group-head + tr.group-foot td .end-hint { display: none; }
        .group-bar { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
        .group-bar .gname { width: 220px; font-weight: 600; }
        .group-bar .gwarn { font-size: 0.75rem; color: #f14668; display: none; }
        .group-bar .gname.is-danger ~ .gwarn { display: inline; }
        .group-bar .gmeta { font-size: 0.78rem; color: #7a7a7a; }
        .group-bar .gmeta strong { color: #363636; }
        .group-bar .gactions { margin-left: auto; }
        .default-tag { margin-top: 4px; }
        .sortable-ghost td { background: #eef5ff !important; }
    </style>
    <h1 class="title"
        th:text="${mode == 'EDIT'} ? #{general.edit} + ' ' + (${offer.type == T(pl.commercelink.baskets.BasketType).Offer} ? #{offers.title} : #{offers.template}) : #{general.create} + ' ' + (${offer.type == T(pl.commercelink.baskets.BasketType).Offer} ? #{offers.title} : #{offers.template})">
    </h1>

    <form id="offerForm" th:object="${offer}" method="post">
        <input type="hidden" th:field="*{storeId}" />
        <input type="hidden" th:field="*{type}" />

        <div class="columns">
            <div class="column">
                <fieldset class="box">
                    <legend class="label" th:text="#{offers.details}"></legend>
                    <input type="hidden" th:field="*{basketId}" />

                    <div class="field">
                        <label class="label" th:text="${offer.type == T(pl.commercelink.baskets.BasketType).Offer} ? #{offers.title} + ' ' + #{offers.name} : #{offers.template} + ' ' + #{offers.name}"></label>
                        <div class="control">
                            <input class="input" type="text" th:field="*{name}" th:placeholder="#{offers.name.placeholder}" required>
                        </div>
                    </div>

                    <div class="field">
                        <label class="label" th:text="#{offers.fulfilment.type}"></label>
                        <div class="select">
                            <select th:field="*{fulfilmentType}">
                                <option th:each="fulfilmentType : ${fulfilmentTypes}" th:value="${fulfilmentType}" th:text="${fulfilmentType}"></option>
                            </select>
                        </div>
                    </div>

                    <div class="field" th:if="${offer.type == T(pl.commercelink.baskets.BasketType).Offer}">
                        <label class="label" th:text="#{offers.delivery.option}"></label>
                        <div class="select">
                            <select th:field="*{deliveryOptionId}">
                                <option value="" th:text="'— ' + #{general.select} + ' —'"></option>
                                <option th:each="opt : ${deliveryOptions}" th:value="${opt.id}" th:text="${opt.name} + ' (' + ${opt.price} + ' PLN)'"></option>
                            </select>
                        </div>
                    </div>

                    <div class="field" th:if="${offer.type == T(pl.commercelink.baskets.BasketType).Offer}">
                        <label class="label" th:text="#{offers.expired.at}"></label>
                        <div class="control">
                            <input type="datetime-local" name="expiresAt"
                                   th:value="${#temporals.format(offer.expiresAt, 'yyyy-MM-dd''T''HH:mm')}"
                                   class="input is-small">
                        </div>
                    </div>

                    <div class="field" th:if="${offer.type == T(pl.commercelink.baskets.BasketType).Offer && mode == 'EDIT'}">
                        <label class="label" th:text="#{offers.link.for.client}"></label>
                        <div class="control is-flex" style="gap: 8px; align-items: center;">
                            <input class="input"
                                   type="text"
                                   id="offerLinkInput"
                                   th:value="${offer.createOfferUrl(backofficeDomain)}"
                                   readonly
                                   style="text-decoration: underline; cursor: pointer;"
                                   onclick="openOfferLink()" />
                            <button class="button is-small is-info" type="button"
                                    onclick="copyOfferLink()" th:text="#{general.copy}"></button>
                        </div>
                    </div>

                    <div class="field" th:if="${offer.type == T(pl.commercelink.baskets.BasketType).Offer}">
                        <label class="label" th:text="#{offers.contact.gclid.label}"></label>
                        <div class="control">
                            <input class="input" type="text" th:field="*{gclid}">
                        </div>
                    </div>

                    <div class="field">
                        <label class="checkbox">
                            <input type="checkbox" th:field="*{showPrices}" />
                            <span th:text="#{offers.show.prices}"></span>
                        </label>
                    </div>
                </fieldset>
            </div>

            <div class="column" th:if="${offer.type == T(pl.commercelink.baskets.BasketType).Offer}">
                <fieldset class="box">
                    <legend class="label" th:text="#{offers.contact.section}"></legend>
                    <div class="field">
                        <label class="label" th:text="#{offers.contact.name}"></label>
                        <div class="control">
                            <input class="input" type="text" th:field="*{contactDetails.name}">
                        </div>
                    </div>
                    <div class="field">
                        <label class="label" th:text="#{offers.contact.surname}"></label>
                        <div class="control">
                            <input class="input" type="text" th:field="*{contactDetails.surname}">
                        </div>
                    </div>
                    <div class="field">
                        <label class="label" th:text="#{offers.contact.company}"></label>
                        <div class="control">
                            <input class="input" type="text" th:field="*{contactDetails.companyName}">
                        </div>
                    </div>
                    <div class="field">
                        <label class="label" th:text="#{offers.contact.email}"></label>
                        <div class="control">
                            <input class="input" type="email" th:field="*{contactDetails.email}">
                        </div>
                    </div>
                    <div class="field">
                        <label class="label" th:text="#{offers.contact.phone}"></label>
                        <div class="control">
                            <input class="input" type="tel" th:field="*{contactDetails.phone}">
                        </div>
                    </div>
                </fieldset>
            </div>
        </div>

        <h4 th:text="#{offers.items}"></h4>
        <div class="box">
            <div class="table-container">
                <table class="table is-fullwidth" id="offerTable">
                    <thead>
                    <tr>
                        <th></th>
                        <th th:text="#{product.category}"></th>
                        <th th:text="#{product.name}"></th>
                        <th th:text="#{product.manufacturer.code}"></th>
                        <th th:text="#{offers.quantity}"></th>
                        <th th:text="#{offers.price}"></th>
                        <th th:text="#{offers.cost}"></th>
                        <th class="dist-h" th:text="#{offers.costs.distribution}"></th>
                        <th class="dist-h" th:text="#{offers.availability.distribution}"></th>
                        <th class="dist-h" th:text="#{offers.providers.distribution}"></th>
                        <th th:text="#{offers.item.consolidated}"></th>
                        <th th:text="#{general.actions}"></th>
                    </tr>
                    </thead>
                    <tbody id="offerRows">
                    <th:block th:each="row : ${offerRows}">
                    <tr th:if="${row.isGroupHead()}" class="group-head" th:attr="data-group=${row.groupId()}">
                        <td class="handle"><span class="drag-handle" style="cursor:grab; padding:0 .4rem;" th:title="#{offers.group.drag.hint}"><i class="fas fa-arrows-alt"></i></span></td>
                        <td colspan="11">
                            <div class="group-bar">
                                <input class="input is-small gname" type="text" th:value="${row.groupId()}" th:placeholder="#{offers.group.name}" th:attr="aria-label=#{offers.group.name}" oninput="refreshGroups()" />
                                <span class="gwarn" th:text="#{offers.group.name.duplicate}"></span>
                                <span class="gmeta"><span th:text="#{offers.group.picks}"></span> <strong class="gcount" th:text="${row.groupSize()}"></strong></span>
                                <span class="gactions"><button class="button is-small is-light" type="button" onclick="ungroup(this)" th:text="#{offers.group.ungroup}"></button></span>
                            </div>
                        </td>
                    </tr>
                    <tr th:if="${row.isItem()}" th:with="offerItem=${row.item()}" class="item" th:classappend="${row.groupId() != null} ? 'in-group'" th:attr="data-group=${row.groupId()}">
                        <input type="hidden" th:field="*{basketItems[__${offerItem.sequenceNumber}__].id}" />
                        <input type="hidden" th:field="*{basketItems[__${offerItem.sequenceNumber}__].catalogId}" />
                        <input type="hidden" th:field="*{basketItems[__${offerItem.sequenceNumber}__].estimatedDeliveryDays}" />
                        <input type="hidden" th:field="*{basketItems[__${offerItem.sequenceNumber}__].service}" />
                        <input type="hidden" class="variant-group" th:field="*{basketItems[__${offerItem.sequenceNumber}__].variantGroupId}" />
                        <input type="hidden" th:field="*{basketItems[__${offerItem.sequenceNumber}__].variantSelected}" />
                        <td class="handle"><span class="drag-handle" style="cursor:grab; padding:0 .4rem; color:#7a8290;" th:title="#{offers.item.drag.hint}"><i class="fas fa-arrows-alt"></i></span></td>
                        <td class="catcell">
                            <div class="select is-small">
                                <select th:field="*{basketItems[__${offerItem.sequenceNumber}__].category}">
                                    <option value=""></option>
                                    <option th:if="${offerItem.basketItem != null && !#strings.isEmpty(offerItem.basketItem.category) && !productCategories.contains(offerItem.basketItem.category)}"
                                            th:value="${offerItem.basketItem.category}" th:text="${offerItem.basketItem.category}"></option>
                                    <optgroup th:each="group : ${productCategoryGroups}" th:label="${group.catalog}">
                                        <option th:each="cat : ${group.names}" th:value="${cat}" th:text="${cat}"></option>
                                    </optgroup>
                                </select>
                            </div>
                        </td>
                        <td class="name" style="min-width: 220px;">
                            <input class="input is-small" type="text" th:field="*{basketItems[__${offerItem.sequenceNumber}__].name}" />
                            <span class="tag is-success is-light default-tag" th:if="${row.groupId() != null && offerItem.basketItem != null && offerItem.basketItem.variantSelected}" th:text="#{offers.group.default}"></span>
                        </td>
                        <td class="mfn" style="min-width: 150px;">
                            <input class="input is-small" type="text" th:field="*{basketItems[__${offerItem.sequenceNumber}__].mfn}" />
                        </td>
                        <td class="qty">
                            <input class="input is-small" type="number" th:field="*{basketItems[__${offerItem.sequenceNumber}__].qty}" min="0" onblur="if(this.value===''){this.value='0';}" />
                        </td>
                        <td class="price">
                            <input class="input is-small" type="number" step="0.01" th:field="*{basketItems[__${offerItem.sequenceNumber}__].unitPrice}" min="0" onblur="if(this.value===''){this.value='0';}" />
                        </td>
                        <td class="cost">
                            <input class="input is-small" type="number" step="0.01" th:field="*{basketItems[__${offerItem.sequenceNumber}__].unitCost}" min="0" onblur="if(this.value===''){this.value='0';}" />
                        </td>
                        <td class="dist" th:classappend="${!offerItem.existInInventory} ? 'missing'">
                            <span th:text="${offerItem.costRange}"></span>
                            <small th:unless="${#strings.isEmpty(offerItem.costRange)}" th:text="#{offers.dist.cost.caption}"></small>
                        </td>
                        <td class="dist" th:classappend="${!offerItem.existInInventory} ? 'missing'">
                            <span th:text="${offerItem.qtyRange}"></span>
                            <small th:unless="${#strings.isEmpty(offerItem.qtyRange)}" th:text="#{offers.dist.qty.caption}"></small>
                        </td>
                        <td class="dist" th:classappend="${!offerItem.existInInventory} ? 'missing'">
                            <span th:text="${offerItem.medianCostProviders}"></span>
                            <small th:text="${offerItem.remainingProviders}"></small>
                        </td>
                        <td>
                            <input type="checkbox" th:field="*{basketItems[__${offerItem.sequenceNumber}__].consolidated}" />
                        </td>
                        <td>
                            <button class="button is-small is-danger" type="button"
                                    th:onclick="|submitRemoveItem(event, ${offerItem.sequenceNumber})|"
                                    th:text="#{general.delete}">
                            </button>
                        </td>
                    </tr>
                    <tr th:if="${row.isGroupFoot()}" class="group-foot" th:attr="data-group=${row.groupId()}">
                        <td colspan="12"><span class="drop-hint" th:text="#{offers.group.drop.empty}"></span><span class="end-hint" th:text="#{offers.group.drop.hint}"></span></td>
                    </tr>
                    </th:block>
                    </tbody>
                </table>
            </div>
            <div class="buttons">
                <button class="button is-info is-small" type="button" onclick="toggleOfferItemModal(true)" th:text="#{offers.add.items}"></button>
                <button class="button is-info is-light is-small" type="button" onclick="addGroup()" th:text="#{offers.group.add}"></button>
            </div>
            <div th:replace="~{fragments/item-add-modal :: itemAddModal(entityId=${offer.basketId}, actionPrefix='/dashboard/offer')}"></div>
        </div>

        <div class="field">
            <h4 th:text="#{general.comment}"></h4>
            <div class="control">
                <textarea class="textarea" th:field="*{comment}" th:placeholder="#{general.comment.placeholder}"></textarea>
            </div>
        </div>

        <fieldset class="box" id="offerSummary">
            <legend class="label" th:text="#{offers.summary}"></legend>
            <div class="field">
                <label class="label" th:text="#{offers.client.price} + ': ' + ${totalPrice}"></label>
            </div>
            <div class="field">
                <label class="label" th:text="#{offers.our.cost} + ': ' + ${totalCost}"></label>
            </div>
            <div class="field">
                <label class="label" th:text="#{offers.our.profit.gross} + ': ' + ${totalProfitGross}"></label>
            </div>
            <div class="field">
                <label class="label" th:text="#{offers.our.profit.net} + ': ' + ${totalProfitNet}"></label>
            </div>
            <div class="field" th:if="${hasVariantGroups}">
                <p class="is-size-7 has-text-grey" th:text="#{offers.summary.variants.note}"></p>
            </div>
        </fieldset>

        <div class="field is-grouped">
            <div class="field is-grouped control" th:if="${offer.type == T(pl.commercelink.baskets.BasketType).Offer}">
                <div class="control" th:if="${mode == 'EDIT'}">
                    <button class="button is-primary" type="button" onclick="submitForm('createOrder')"
                            th:text="#{offers.create.order}"></button>
                </div>
                <div class="control">
                    <button class="button is-primary" type="submit" onclick="submitForm('save')" th:text="#{offers.save}"></button>
                </div>
                <div class="control">
                    <button class="button is-primary" type="button" onclick="submitForm('saveAsTemplate')" th:text="#{offers.save.as.template}"></button>
                </div>
                <div class="control" th:if="${mode == 'EDIT'}" >
                    <button class="button is-warning" type="button" onclick="submitForm('recalculate')" th:text="#{offers.recalculate}"></button>
                </div>
                <div class="control" th:if="${mode == 'EDIT'}">
                    <button class="button is-warning" type="button" onclick="submitForm('createProformaInvoice')" th:text="#{offers.createProformaInvoice}"></button>
                </div>
                <div class="control" th:if="${mode == 'EDIT'}">
                    <button class="button is-warning" type="button" onclick="submitForm('copy')"
                            th:text="#{offers.duplicate}"></button>
                </div>
                <div class="control"
                     th:if="${mode == 'EDIT' && offer.contactDetails != null && offer.contactDetails.isProperlyFilled()}">
                    <button class="button is-warning" type="button" onclick="submitForm('copyWithContact')"
                            th:text="#{offers.duplicate.with.contact}"></button>
                </div>
            </div>
            <div class="control" th:if="${offer.type == T(pl.commercelink.baskets.BasketType).OfferTemplate}">
                <button class="button is-primary" type="submit" onclick="submitForm('save')" th:text="#{offers.save.template}"></button>
                <a class="button is-primary"
                   th:href="@{/dashboard/offer/new(intent='template',sourceId=${offer.basketId})}"
                   th:text="#{offers.manual.button}">
                </a>
            </div>
            <div class="control">
                <a class="button is-light" th:href="@{/dashboard/offers}" th:text="#{general.cancel}"></a>
            </div>
        </div>
    </form>

    <script th:inline="javascript">
        function openOfferLink() {
            const input = document.getElementById('offerLinkInput');
            window.open(input.value, '_blank', 'noopener');
        }

        function copyOfferLink() {
            const link = /*[[${offer.createOfferUrl(backofficeDomain)}]]*/ '';
            navigator.clipboard.writeText(link).then(() => showToast(CL_TOAST_COPIED));
        }
    </script>

    <script th:inline="javascript">
        const GROUP_NEW_NAME = /*[[#{offers.group.new}]]*/ 'Nowa grupa';
        const GROUP_NAME_REQUIRED = /*[[#{offers.group.name.required}]]*/ '';
        const GROUP_NAME_DUPLICATE = /*[[#{offers.group.name.duplicate}]]*/ '';
        const GROUP_NAME_LABEL = /*[[#{offers.group.name}]]*/ '';
        const GROUP_PICKS = /*[[#{offers.group.picks}]]*/ '';
        const GROUP_UNGROUP = /*[[#{offers.group.ungroup}]]*/ '';
        const GROUP_DRAG_HINT = /*[[#{offers.group.drag.hint}]]*/ '';
        const GROUP_DROP_EMPTY = /*[[#{offers.group.drop.empty}]]*/ '';
        const GROUP_DROP_HINT = /*[[#{offers.group.drop.hint}]]*/ '';

        function escapeHtml(text) {
            return text.replace(/[&<>"']/g, ch => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[ch]));
        }

        function groupRowsHtml(name) {
            return `
                <tr class="group-head" data-group="${escapeHtml(name)}">
                    <td class="handle"><span class="drag-handle" style="cursor:grab; padding:0 .4rem;" title="${escapeHtml(GROUP_DRAG_HINT)}"><i class="fas fa-arrows-alt"></i></span></td>
                    <td colspan="11">
                        <div class="group-bar">
                            <input class="input is-small gname" type="text" value="${escapeHtml(name)}" placeholder="${escapeHtml(GROUP_NAME_LABEL)}" aria-label="${escapeHtml(GROUP_NAME_LABEL)}" oninput="refreshGroups()" />
                            <span class="gwarn">${escapeHtml(GROUP_NAME_DUPLICATE)}</span>
                            <span class="gmeta"><span>${escapeHtml(GROUP_PICKS)}</span> <strong class="gcount">0</strong></span>
                            <span class="gactions"><button class="button is-small is-light" type="button" onclick="ungroup(this)">${escapeHtml(GROUP_UNGROUP)}</button></span>
                        </div>
                    </td>
                </tr>
                <tr class="group-foot" data-group="${escapeHtml(name)}">
                    <td colspan="12"><span class="drop-hint">${escapeHtml(GROUP_DROP_EMPTY)}</span><span class="end-hint">${escapeHtml(GROUP_DROP_HINT)}</span></td>
                </tr>`;
        }

        const offerRows = () => [...document.getElementById('offerRows').children];
        const isHead = row => row.classList.contains('group-head');
        const isFoot = row => row.classList.contains('group-foot');

        function groupMembers(head) {
            const members = [];
            let row = head.nextElementSibling;
            while (row && !isFoot(row)) {
                members.push(row);
                row = row.nextElementSibling;
            }
            return { members, foot: row };
        }

        function refreshGroups() {
            let current = null;
            offerRows().forEach(row => {
                if (isHead(row)) {
                    current = row.querySelector('.gname').value.trim();
                    row.dataset.group = current;
                    return;
                }
                if (isFoot(row)) {
                    row.dataset.group = current ?? '';
                    current = null;
                    return;
                }
                row.classList.toggle('in-group', current !== null);
                row.querySelector('.variant-group').value = current ?? '';
            });
            offerRows().filter(isHead).forEach(head => {
                head.querySelector('.gcount').textContent = groupMembers(head).members.length;
            });
            validateGroupNames();
        }

        function validateGroupNames() {
            const inputs = offerRows().filter(isHead).map(head => head.querySelector('.gname'));
            const counts = {};
            inputs.forEach(input => {
                const key = input.value.trim().toLowerCase();
                counts[key] = (counts[key] || 0) + 1;
            });
            inputs.forEach(input => {
                const key = input.value.trim().toLowerCase();
                input.classList.toggle('is-danger', key === '' || counts[key] > 1);
            });
            return inputs.every(input => !input.classList.contains('is-danger'));
        }

        function groupsAreValid() {
            const inputs = offerRows().filter(isHead).map(head => head.querySelector('.gname'));
            if (inputs.some(input => input.value.trim() === '')) {
                alert(GROUP_NAME_REQUIRED);
                return false;
            }
            if (!validateGroupNames()) {
                alert(GROUP_NAME_DUPLICATE);
                return false;
            }
            return true;
        }

        function insideGroup(related, willInsertAfter) {
            if (related.classList.contains('in-group')) return true;
            if (isHead(related)) return willInsertAfter;
            if (isFoot(related)) return !willInsertAfter;
            return false;
        }

        function uniqueGroupName(base) {
            const taken = new Set(offerRows().filter(isHead).map(head => head.querySelector('.gname').value.trim().toLowerCase()));
            if (!taken.has(base.toLowerCase())) return base;
            let n = 2;
            while (taken.has((base + ' ' + n).toLowerCase())) n++;
            return base + ' ' + n;
        }

        function addGroup() {
            document.getElementById('offerRows').insertAdjacentHTML('beforeend', groupRowsHtml(uniqueGroupName(GROUP_NEW_NAME)));
            refreshGroups();
            const head = offerRows().filter(isHead).pop();
            head.scrollIntoView({ block: 'nearest' });
            head.querySelector('.gname').focus();
            head.querySelector('.gname').select();
        }

        function ungroup(button) {
            const head = button.closest('tr');
            const { foot } = groupMembers(head);
            head.remove();
            if (foot) foot.remove();
            refreshGroups();
        }

        document.addEventListener('DOMContentLoaded', () => {
            refreshGroups();
            new Sortable(document.getElementById('offerRows'), {
                handle: '.drag-handle',
                draggable: 'tr',
                filter: '.group-foot',
                animation: 150,
                onStart: (evt) => {
                    document.body.classList.add('is-dragging-row');
                    if (!isHead(evt.item)) return;
                    const { members, foot } = groupMembers(evt.item);
                    [...members, foot].forEach(row => row.classList.add('is-hidden'));
                },
                onMove: (evt) => isHead(evt.dragged) ? !insideGroup(evt.related, evt.willInsertAfter) : true,
                onEnd: (evt) => {
                    document.body.classList.remove('is-dragging-row');
                    if (isHead(evt.item)) {
                        let anchor = evt.item;
                        offerRows().filter(row => row.classList.contains('is-hidden')).forEach(row => {
                            row.classList.remove('is-hidden');
                            anchor.after(row);
                            anchor = row;
                        });
                    }
                    refreshGroups();
                }
            });
        });

        function renumberOfferRows() {
            refreshGroups();
            let index = 0;
            offerRows().forEach(row => {
                if (!row.classList.contains('item')) return;
                row.querySelectorAll('input, select').forEach(el => {
                    if (el.name) el.name = el.name.replace(/basketItems\[\d+\]/, 'basketItems[' + index + ']');
                });
                index++;
            });
        }
        function submitForm(actionType) {
            const form = document.getElementById('offerForm');
            const offerId = /*[[${offer.basketId}]]*/ '';
            renumberOfferRows();

            if (actionType === 'recalculate') {
                form.action = `/dashboard/offer/${offerId}/recalculate`;
            } else if (actionType === 'save') {
                const isOfferNameValid = validateInputField('input[name="name"]', [[#{offers.name.required}]]);
                if (!isOfferNameValid || !groupsAreValid()) return;
                form.action = `/dashboard/offer/${offerId}`;
            } else if (actionType === 'saveAsTemplate') {
                const isTemplateNameValid = validateInputField('input[name="name"]', [[#{offers.name.required}]]);
                if (!isTemplateNameValid || !groupsAreValid()) return;
                form.action = `/dashboard/offer/${offerId}/saveAsTemplate`;
            } else if (actionType === 'createProformaInvoice') {
                form.action = `/dashboard/offer/${offerId}/createProformaInvoice`;
            } else if (actionType === 'copy') {
                form.action = `/dashboard/offer/${offerId}/copy`;
            } else if (actionType === 'copyWithContact') {
                form.action = `/dashboard/offer/${offerId}/copy?withContact=true`;
            } else if (actionType === 'createOrder') {
                window.location.href = `/dashboard/orders/new/from-basket?basketId=${offerId}`;
                return;
            }

            form.submit();
        }

        function submitRemoveItem(event, index) {
            event.preventDefault();
            const form = document.getElementById('offerForm');
            const offerId = /*[[${offer.basketId}]]*/ '';

            const items = document.querySelectorAll('#offerRows tr.item');
            if (items.length <= 1) {
                alert([[#{offers.min.items.error}]]);
                return;
            }

            form.action = `/dashboard/offer/${offerId}/remove-item/${index}`;
            form.method = 'POST';
            form.submit();
        }

        function toggleOfferItemModal(show) {
            toggleAddItemModal(show);
        }
    </script>
</div>

</body>
</html>
