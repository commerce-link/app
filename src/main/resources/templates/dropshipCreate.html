<!DOCTYPE HTML>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}">
<body>
<!--/* Dropship delivery of one order at one supplier: the delivery header, the products with their order lines, then
       "Zamów u dostawcy" (to the confirmation page) or "Zapisz" (a delivery without an order at the supplier). Reached
       from the order header's "Dropship" button, a dropship item's delivery link and the deliveries planning page. */-->
<div layout:fragment="content">
    <section class="cl-page"
             th:with="orderPath=${isSuperAdmin} ? |/dashboard/store/${form.storeId}/orders/${order.orderId}| : |/dashboard/orders/${order.orderId}|,
                      supplierName=${supplierLabels.of(form.provider)}">
        <div class="cl-page-body">
            <!--/* The lead is defined inside the replaced element: the body of a th:replace host is dropped. */-->
            <div th:replace="~{fragments/settings-header :: subpageWithActions(${orderPath}, #{order.page.title(${order.shortenedOrderId})},
                    #{orders.dropship.page.create.title(${supplierName})}, ~{::dropshipLead}, null)}">
                <th:block th:fragment="dropshipLead"><span class="cl-status is-info is-leading" th:text="#{deliveries.dropship.badge}"></span> <span th:text="#{orders.dropship.confirm.consignee}"></span></th:block>
            </div>

            <div th:if="${purchaseBlockedReason != null}" class="cl-alert is-warn" id="purchase-blocked-reason">
                <i class="fas fa-exclamation-triangle cl-alert-icon" aria-hidden="true"></i>
                <p class="cl-alert-text" th:text="#{${purchaseBlockedReason}}"></p>
            </div>

            <div class="cl-layout-aside">
                <form th:action="@{${orderPath + '/dropship/create'}}" th:object="${form}" method="post"
                      id="deliveryCreateForm" class="cl-layout-main" data-cl-dropship-form>
                    <input type="hidden" th:field="*{storeId}"/>
                    <input type="hidden" th:field="*{provider}"/>

                    <section class="cl-card" aria-labelledby="dropship-delivery-title">
                        <div class="cl-card-head">
                            <h2 class="cl-card-title" id="dropship-delivery-title" th:text="#{orders.dropship.page.card.delivery}"></h2>
                        </div>
                        <div class="cl-form-grid cl-card-grid is-last">
                            <div class="cl-span-3 cl-field">
                                <label class="cl-label" for="externalDeliveryId"><span th:text="#{general.delivery.id}"></span> <span class="cl-optional" th:text="#{form.optional}"></span></label>
                                <input class="cl-input" type="text" th:field="*{externalDeliveryId}" autocomplete="off"/>
                            </div>
                            <div class="cl-span-3 cl-field">
                                <label class="cl-label" for="estimatedDeliveryAt"><span th:text="#{deliveries.estimated.delivery}"></span> <span class="cl-optional" th:text="#{form.optional}"></span></label>
                                <input class="cl-input" type="date" th:field="*{estimatedDeliveryAt}"/>
                            </div>
                            <div class="cl-span-2 cl-field">
                                <label class="cl-label" for="shippingCost" th:text="#{deliveries.shippingCost}"></label>
                                <input class="cl-input" type="number" inputmode="decimal" th:field="*{shippingCost}" step="0.01" required/>
                            </div>
                            <div class="cl-span-2 cl-field">
                                <label class="cl-label" for="paymentCost" th:text="#{deliveries.paymentCost}"></label>
                                <input class="cl-input" type="number" inputmode="decimal" th:field="*{paymentCost}" step="0.01" required/>
                            </div>
                            <div class="cl-span-2 cl-field">
                                <label class="cl-label" for="sourceCurrency" th:text="#{general.currency}"></label>
                                <select class="cl-select" th:field="*{sourceCurrency}" data-cl-dropship-currency>
                                    <option value="PLN">PLN</option>
                                    <option value="EUR">EUR</option>
                                    <option value="USD">USD</option>
                                </select>
                            </div>
                            <div class="cl-span-3 cl-field">
                                <label class="cl-label" for="tax" th:text="#{deliveries.tax}"></label>
                                <input class="cl-input" type="number" inputmode="decimal" th:field="*{tax}" step="0.01" min="1.0"
                                       required aria-describedby="tax-help"/>
                                <p class="cl-help" id="tax-help" th:text="#{orders.dropship.page.tax.help}"></p>
                            </div>
                            <div class="cl-span-3 cl-field">
                                <label class="cl-label" for="paymentTerms" th:text="#{deliveries.paymentTerms}"></label>
                                <input class="cl-input cl-input-days" type="number" inputmode="numeric" th:field="*{paymentTerms}"
                                       required aria-describedby="paymentTerms-help"/>
                                <p class="cl-help" id="paymentTerms-help" th:text="#{orders.dropship.page.paymentTerms.help}"></p>
                            </div>
                        </div>
                    </section>

                    <section class="cl-card" aria-labelledby="dropship-items-title">
                        <div class="cl-card-head">
                            <h2 class="cl-card-title" id="dropship-items-title" th:text="#{orders.dropship.page.card.items}"></h2>
                        </div>
                        <p class="cl-card-desc" th:text="#{deliveries.create.includeAllocation.note}"></p>
                        <div class="cl-card-section">
                            <table class="cl-table is-key-wrap">
                                <colgroup>
                                    <col>
                                    <col>
                                    <col class="cl-col-qty">
                                    <col class="cl-col-price-input">
                                </colgroup>
                                <thead>
                                <tr>
                                    <th scope="col" th:text="#{general.product}"></th>
                                    <th scope="col" th:text="#{deliveries.create.include}"></th>
                                    <th scope="col" class="is-numeric" th:text="#{deliveries.requestedQty}"></th>
                                    <th scope="col" th:text="#{general.net.cost}"></th>
                                </tr>
                                </thead>
                                <tbody>
                                <tr th:each="item, itemStat : *{items}" data-cl-dropship-item>
                                    <th scope="row" class="cl-table-key" th:attr="data-label=#{general.product}">
                                        <span th:text="${item.name}"></span>
                                        <span class="cl-table-sub" th:text="#{orders.dropship.page.item.codes(${item.ean}, ${item.mfn})}"></span>
                                        <input type="hidden" th:field="*{items[__${itemStat.index}__].name}"/>
                                        <input type="hidden" th:field="*{items[__${itemStat.index}__].ean}"/>
                                        <input type="hidden" th:field="*{items[__${itemStat.index}__].mfn}"/>
                                        <input type="hidden" th:field="*{items[__${itemStat.index}__].orderedQty}"/>
                                        <input type="hidden" th:field="*{items[__${itemStat.index}__].requestedQty}" data-cl-requested-qty/>
                                    </th>
                                    <td th:attr="data-label=#{deliveries.create.include}">
                                        <ul class="cl-check-list">
                                            <li th:each="allocation, allocStat : ${item.allocations}">
                                                <input type="hidden" th:field="*{items[__${itemStat.index}__].allocations[__${allocStat.index}__].key.orderId}"/>
                                                <input type="hidden" th:field="*{items[__${itemStat.index}__].allocations[__${allocStat.index}__].key.itemId}"/>
                                                <input type="hidden" th:field="*{items[__${itemStat.index}__].allocations[__${allocStat.index}__].key.name}"/>
                                                <input type="hidden" th:field="*{items[__${itemStat.index}__].allocations[__${allocStat.index}__].type}"/>
                                                <input type="hidden" th:field="*{items[__${itemStat.index}__].allocations[__${allocStat.index}__].name}"/>
                                                <input type="hidden" th:field="*{items[__${itemStat.index}__].allocations[__${allocStat.index}__].qty}"/>
                                                <input type="hidden" th:field="*{items[__${itemStat.index}__].allocations[__${allocStat.index}__].ean}"/>
                                                <input type="hidden" th:field="*{items[__${itemStat.index}__].allocations[__${allocStat.index}__].mfn}"/>
                                                <input type="hidden" th:field="*{items[__${itemStat.index}__].allocations[__${allocStat.index}__].deliveryId}"/>
                                                <input type="hidden" th:field="*{items[__${itemStat.index}__].allocations[__${allocStat.index}__].unitCost}"/>
                                                <label class="cl-check">
                                                    <input type="checkbox"
                                                           th:field="*{items[__${itemStat.index}__].allocations[__${allocStat.index}__].selected}"
                                                           th:attr="data-cl-allocation-qty=${allocation.qty}"/>
                                                    <span th:text="#{orders.dropship.page.allocation(${allocation.key.name}, ${allocation.qty})}"></span>
                                                </label>
                                            </li>
                                        </ul>
                                    </td>
                                    <td class="is-numeric" th:attr="data-label=#{deliveries.requestedQty}">
                                        <span data-cl-requested-qty-label th:text="${item.requestedQty}"></span>
                                    </td>
                                    <td th:attr="data-label=#{general.net.cost}">
                                        <input class="cl-input is-price" type="number" inputmode="decimal" step="0.01" min="0"
                                               th:field="*{items[__${itemStat.index}__].unitCost}"
                                               th:attr="aria-label=#{orders.dropship.page.unitCost.label(${item.name})}"/>
                                    </td>
                                </tr>
                                </tbody>
                            </table>
                        </div>
                        <div class="cl-list-summary">
                            <label class="cl-check">
                                <input type="checkbox" th:field="*{removeUnselected}"/>
                                <span th:text="#{deliveries.create.removeUnselected}"></span>
                            </label>
                            <p><span th:text="#{deliveries.create.netValue}"></span>: <strong><output id="deliveryNetValue" form="deliveryCreateForm" aria-live="polite"
                                    th:text="${#numbers.formatDecimal(#aggregates.sum(form.items.![requestedQty * unitCost]), 1, 'WHITESPACE', 2, 'COMMA')}">0,00</output> <span id="deliveryNetCurrency" th:text="*{sourceCurrency}">PLN</span></strong></p>
                        </div>
                        <!--/* "Zapisz" comes first in the markup so that Enter in a field saves, as before the redesign;
                               is-primary-first shows "Zamów u dostawcy" first on screen. */-->
                        <div class="cl-card-footer is-primary-first">
                            <button type="submit" class="cl-button" id="dropship-save-button" th:text="#{general.save}"></button>
                            <button type="submit" class="cl-button is-primary" id="purchase-order-button"
                                    formnovalidate
                                    th:disabled="${purchaseBlockedReason != null}"
                                    th:attr="data-blocked=${purchaseBlockedReason != null},aria-describedby=${purchaseBlockedReason != null} ? 'purchase-blocked-reason' : null"
                                    th:formaction="@{${orderPath + '/dropship/purchase'}}"
                                    th:text="#{deliveries.purchase.button}"></button>
                        </div>
                    </section>
                </form>

                <aside class="cl-layout-side">
                    <section th:replace="~{fragments/consignee-address :: clConsignee(${consignee}, ${pickupShipment})}"></section>
                </aside>
            </div>
        </div>
    </section>
    <script th:src="@{/js/dropship-create.js}" defer></script>
</div>
</body>
</html>
