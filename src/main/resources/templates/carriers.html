<!DOCTYPE HTML>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}">
<body>
<div layout:fragment="content">
    <section class="cl-page">
        <div class="cl-page-body">
            <header class="cl-page-header">
                <div class="cl-page-header-row">
                    <h1 class="cl-page-title" th:text="#{carriers.title}"></h1>
                </div>
                <p class="cl-page-lead" th:text="#{carriers.lead}"></p>
            </header>
            <div th:replace="~{fragments/settings-form :: savedAlert}"></div>

            <section class="cl-card" aria-labelledby="carriers-list-title">
                <div class="cl-card-head">
                    <h2 class="cl-card-title" id="carriers-list-title" th:text="#{carriers.list.title}"></h2>
                </div>
                <p class="cl-card-desc" th:text="#{carriers.list.description}"></p>
                <ul th:unless="${carriers.isEmpty()}" class="cl-list" aria-labelledby="carriers-list-title">
                    <li class="cl-list-item" th:each="carrier : ${carriers}">
                        <div>
                            <div class="cl-list-title" th:text="${carrier.name}"></div>
                            <p th:if="${carrier.description != null}" class="cl-list-desc" th:text="${carrier.description}"></p>
                        </div>
                    </li>
                </ul>
                <p th:if="${carriers.isEmpty()}" class="cl-list-empty" th:text="#{carriers.list.empty}"></p>

                <form class="cl-form cl-carrier-create" th:action="@{/dashboard/carriers}" method="post">
                    <fieldset class="cl-fieldset">
                        <legend class="cl-fieldset-title" th:text="#{carriers.create.title}"></legend>
                        <div class="cl-form-grid">
                            <div class="cl-field cl-span-3">
                                <label class="cl-label" for="carrier-name" th:text="#{carriers.create.name}"></label>
                                <input class="cl-input" id="carrier-name" name="name" type="text" required maxlength="64"
                                       autocomplete="off"/>
                                <p class="cl-help" th:text="#{carriers.create.name.help}"></p>
                            </div>
                            <div class="cl-field cl-span-3">
                                <label class="cl-label" for="carrier-description" th:text="#{carriers.create.description}"></label>
                                <input class="cl-input" id="carrier-description" name="description" type="text" maxlength="200"
                                       autocomplete="off"/>
                            </div>
                        </div>
                    </fieldset>
                    <div class="cl-card-footer">
                        <button class="cl-button is-primary" type="submit" th:text="#{carriers.create.submit}"></button>
                    </div>
                </form>
            </section>

            <section class="cl-card" aria-labelledby="carriers-dictionaries-title">
                <div class="cl-card-head">
                    <h2 class="cl-card-title" id="carriers-dictionaries-title" th:text="#{carriers.dictionaries.title}"></h2>
                </div>
                <p class="cl-card-desc" th:text="#{carriers.dictionaries.description}"></p>
                <th:block th:each="integration, integrationStat : ${integrations}">
                    <h3 class="cl-list-group" th:id="'carrier-integration-' + ${integrationStat.index}"
                        th:text="${integration.heading()}"></h3>
                    <ul class="cl-list" th:attr="aria-labelledby='carrier-integration-' + ${integrationStat.index}">
                        <li class="cl-list-item" th:each="d : ${integration.dictionaries()}">
                            <div>
                                <div class="cl-list-title" th:text="${d.title()}"></div>
                                <p class="cl-list-desc" th:text="${d.description()}"></p>
                                <p th:if="${d.pairs() > 0}" class="cl-list-desc"
                                   th:text="#{carriers.dictionaries.pairs(${d.pairs()})}"></p>
                                <p th:unless="${d.pairs() > 0}" class="cl-list-desc is-warn"
                                   th:text="${d.whenEmpty()}"></p>
                            </div>
                            <div class="cl-list-actions">
                                <a class="cl-link-button" th:href="@{${d.href()}}" th:text="#{settings.list.edit}"
                                   th:attr="aria-label=#{settings.list.edit.for(${integration.heading() + ': ' + d.title()})}"></a>
                            </div>
                        </li>
                    </ul>
                </th:block>
            </section>
        </div>
    </section>
</div>
</body>
</html>
