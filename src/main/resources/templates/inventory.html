<!DOCTYPE HTML>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}">
<body>

<div layout:fragment="content">
    <link rel="stylesheet" th:href="@{/css/inventory.css}">

    <div class="cl-page cl-page-body is-wide cl-inv-page" data-inventory-page data-browse-root
         th:data-browse-dialog-url="${browseDialogUrl}"
         th:data-summary-url="@{/dashboard/inventory/summary}"
         th:data-warehouse-url="${superAdmin} ? '' : @{/dashboard/inventory/warehouse}"
         th:data-msg-load-error="#{inventory.load.error}"
         th:data-msg-retry="#{inventory.retry}">

        <header class="cl-page-header">
            <div class="cl-page-header-row">
                <h1 class="cl-page-title" th:text="#{inventory.title}"></h1>
                <button th:replace="~{fragments/screen-intro :: toggle}"></button>
            </div>
            <p class="cl-page-lead" th:text="${superAdmin} ? #{inventory.tech.lead} : #{inventory.lead}"></p>
        </header>

        <div th:replace="~{fragments/screen-intro :: panel(${superAdmin} ? 'inventory-tech' : 'inventory', ${superAdmin} ? 'fas fa-database' : 'fas fa-cubes')}"></div>

        <div th:if="${inventoryNotice}" class="cl-alert is-ok" role="status">
            <span class="cl-alert-icon" aria-hidden="true"><i class="fas fa-check-circle"></i></span>
            <div class="cl-alert-text"><p><span th:text="${inventoryNotice}"></span>
                <a th:if="${inventoryNoticeHref}" th:href="${inventoryNoticeHref}" th:text="#{inventory.browse.added.open}"></a></p></div>
        </div>
        <div th:if="${inventoryError}" class="cl-alert is-bad" role="alert">
            <span class="cl-alert-icon" aria-hidden="true"><i class="fas fa-exclamation-circle"></i></span>
            <div class="cl-alert-text"><p th:text="${inventoryError}"></p></div>
        </div>

        <section class="cl-inv-summary-slot" data-inventory-summary aria-busy="true"
                 th:attr="aria-label=#{inventory.summary.aria}">
            <ul class="cl-stat-grid" aria-hidden="true">
                <li class="cl-stat" th:each="i : ${#numbers.sequence(1, superAdmin ? 3 : 4)}">
                    <span class="cl-skeleton cl-inv-skeleton-label"></span>
                    <span class="cl-skeleton cl-inv-skeleton-number"></span>
                    <span class="cl-skeleton cl-inv-skeleton-hint"></span>
                </li>
            </ul>
            <div th:unless="${superAdmin}" class="cl-inv-sources cl-inv-sources-bar" aria-hidden="true">
                <span class="cl-skeleton cl-inv-skeleton-label"></span>
            </div>
            <span class="cl-visually-hidden" th:text="#{inventory.summary.loading}"></span>
            <noscript><p class="cl-inv-muted" th:text="#{inventory.noscript}"></p></noscript>
        </section>

        <div th:replace="~{fragments/inventory-browse :: browse}"></div>
    </div>

    <script th:src="@{/js/inventory.js}" defer></script>
    <script th:src="@{/js/list-page.js}" defer></script>
    <script th:src="@{/js/table-select.js}" defer></script>
    <script th:src="@{/js/menu.js}" defer></script>
    <script th:if="${canManageSuppliers}" th:src="@{/js/inventory-browse.js}" defer></script>
</div>

</body>
</html>
