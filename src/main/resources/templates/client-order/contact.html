<!DOCTYPE HTML>
<html xmlns:th="http://www.thymeleaf.org">
<body>

<!--/* The seller card of the side column: who sells (logo, company, address) and, when the store has a contact, how to
       ask about the order. The sentence is put together from escaped pieces: the contact e-mail is typed by the store, so it
       is never inserted as markup. */-->
<section th:fragment="contact" class="cl-card cl-seller-card"
         th:attr="aria-labelledby=${publicPage.hasContact() ? 'order-help-title' : null}, aria-label=${publicPage.hasContact() ? null : #messages.msg('public.seller.card')}"
         th:with="email=${publicPage.contactEmail}, phone=${publicPage.contactPhone}">
    <div class="cl-card-inset">
        <div th:replace="~{fragments/public-seller :: identity}"></div>
        <div th:if="${publicPage.hasContact()}" class="cl-seller-help">
            <h2 class="cl-card-title" id="order-help-title" th:text="#{client.order.contact}"></h2>
            <p class="cl-note">
                <th:block th:if="${email != null}">
                    <th:block th:text="#{client.order.contact.write}"></th:block>
                    <a th:href="'mailto:' + ${email}" th:text="${email}"></a>
                    <th:block th:if="${phone != null}" th:text="#{client.order.contact.orCall}"></th:block>
                </th:block>
                <th:block th:if="${email == null}" th:text="#{client.order.contact.call}"></th:block>
                <a th:if="${phone != null}" th:href="'tel:' + ${#strings.replace(phone, ' ', '')}" th:text="${phone}"></a>
                <th:block th:text="#{client.order.contact.quote}"></th:block>
                <strong th:text="${view.shortOrderId}"></strong>.
            </p>
        </div>
    </div>
</section>

</body>
</html>
