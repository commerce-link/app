<!DOCTYPE HTML>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{public-layout}" th:with="publicWidth='is-narrow'">
<head>
    <title th:text="#{client.order.unavailable.pageTitle}">Zamówienie niedostępne</title>
</head>
<body>
<th:block layout:fragment="content">
    <section th:replace="~{fragments/public-message :: card(
            eyebrow=${shortId != null} ? #{client.order.unavailable.eyebrow(${shortId})} : null,
            title=#{client.order.unavailable.title}, lead=#{client.order.unavailable.lead},
            contact=#{client.order.unavailable.contact}, fallback=null)}"></section>
</th:block>
</body>
</html>
