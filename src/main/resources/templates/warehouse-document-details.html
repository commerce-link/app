<!DOCTYPE HTML>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}">
<body>
<div layout:fragment="content">
<section class="cl-page" th:fragment="body" th:with="p=${page}">
    <div class="cl-page-body is-wide">

        <div th:replace="~{fragments/settings-header :: record(${p.backHref()}, ${p.backLabel()}, ~{::documentNumber},
                ~{::documentCopy}, ~{::documentType}, ~{::documentMeta}, ${p.print() != null} ? ~{::documentActions} : null)}">
            <th:block th:fragment="documentNumber"><th:block th:replace="~{fragments/doc-number :: parts(${p.number()})}"></th:block></th:block>
            <th:block th:fragment="documentCopy">
                <button type="button" class="cl-copy-inline is-icon"
                        th:attr="data-cl-copy=${p.number()}, aria-label=#{warehouse.documents.details.copy}">
                    <span class="cl-copy-icon"><span class="icon is-small" aria-hidden="true"><i class="far fa-copy"></i></span></span>
                </button>
            </th:block>
            <th:block th:fragment="documentType">
                <span class="cl-record-type">
                    <span class="cl-icon-text"><i class="fas" th:classappend="${p.incoming()} ? 'fa-sign-in-alt' : 'fa-sign-out-alt'" aria-hidden="true"></i><span th:text="${p.typeName()}"></span></span>
                    <span th:if="${p.reason() != null}" th:text="'· ' + ${p.reason()}"></span>
                </span>
            </th:block>
            <th:block th:fragment="documentMeta">
                <p class="cl-record-meta">
                    <span th:if="${p.createdText() != null}" th:text="${p.createdText()}"></span>
                    <span th:text="${p.author()}"></span>
                    <span><strong th:text="${p.totalNet()}"></strong> <span th:text="#{warehouse.documents.details.net}"></span></span>
                </p>
            </th:block>
            <th:block th:fragment="documentActions">
                <!--/* Printing goes through the Zebra Browser Print app on this computer, so it needs the script: the
                       controls stay hidden until label-print.js shows them, and say why without it. */-->
                <div class="cl-label-print" data-cl-label-print hidden
                     th:attr="data-endpoint=@{${p.print().endpoint()}}, data-document-id=${p.documentId()}, data-count=${p.print().labels()},
                              data-sent=#{warehouse.documents.print.sent('{printer}', '{count}')}, data-failed=#{warehouse.documents.print.failed('{error}')}">
                    <button th:if="${p.print().printers().size() == 1}" type="button" class="cl-button is-primary"
                            th:attr="data-printer=${p.print().printers()[0].name()}, data-device-id=${p.print().printers()[0].deviceId()}">
                        <span class="icon is-small" aria-hidden="true"><i class="fas fa-print"></i></span>
                        <span th:text="#{warehouse.documents.print.labels}"></span>
                    </button>
                    <details th:if="${p.print().printers().size() > 1}" class="cl-menu">
                        <summary class="cl-button is-primary">
                            <span class="icon is-small" aria-hidden="true"><i class="fas fa-print"></i></span>
                            <span th:text="#{warehouse.documents.print.labels}"></span>
                            <span class="icon is-small" aria-hidden="true"><i class="fas fa-chevron-down"></i></span>
                        </summary>
                        <ul class="cl-menu-list" id="label-printers-menu">
                            <li th:each="printer : ${p.print().printers()}">
                                <button type="button" class="cl-menu-item" th:attr="data-printer=${printer.name()}, data-device-id=${printer.deviceId()}">
                                    <span th:text="${printer.name()}"></span>
                                    <span class="cl-menu-desc" th:text="${p.print().labelsText()}"></span>
                                </button>
                            </li>
                        </ul>
                    </details>
                </div>
                <noscript><p class="cl-help" th:text="#{warehouse.documents.print.noscript}"></p></noscript>
            </th:block>
        </div>

        <div class="cl-layout-aside">
            <div class="cl-layout-main">
                <section class="cl-card" aria-labelledby="items-title">
                    <div class="cl-card-head"><h2 class="cl-card-title" id="items-title" th:text="${p.itemsTitle()}"></h2></div>
                    <table class="cl-table is-compact is-wrap is-line-items" th:unless="${p.items().isEmpty()}">
                        <thead>
                        <tr>
                            <th scope="col" th:text="#{warehouse.documents.details.column.product}"></th>
                            <th scope="col" class="is-numeric is-qty" th:text="#{warehouse.documents.details.column.qty}"></th>
                            <th scope="col" class="is-numeric" th:text="#{warehouse.documents.details.column.unitCost}"></th>
                            <th scope="col" class="is-numeric" th:text="#{warehouse.documents.details.column.value}"></th>
                            <th scope="col" class="cl-table-actions" th:if="${p.anyItemMenu()}"><span class="cl-visually-hidden" th:text="#{warehouse.documents.details.column.actions}"></span></th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr th:each="item, s : ${p.items()}">
                            <th scope="row" class="cl-table-key" th:attr="data-label=#{warehouse.documents.details.column.product}">
                                <span th:text="${item.name()}"></span>
                                <span class="cl-table-sub">
                                    <th:block th:if="${item.ean() != null}"><span class="cl-code-part" th:text="'EAN ' + ${item.ean()}"></span><span class="cl-table-sep" th:if="${item.mfn() != null}"> · </span></th:block>
                                    <span th:if="${item.mfn() != null}" class="cl-code-part" th:text="'MFN ' + ${item.mfn()}"></span>
                                </span>
                            </th>
                            <td class="is-numeric is-qty" th:attr="data-label=#{warehouse.documents.details.column.qty}" th:text="${item.qty()}"></td>
                            <td class="is-numeric" th:attr="data-label=#{warehouse.documents.details.column.unitCost}" th:text="${item.unitCost()}"></td>
                            <td class="is-numeric" th:attr="data-label=#{warehouse.documents.details.column.value}"><strong th:text="${item.value()}"></strong></td>
                            <td class="cl-table-actions" th:if="${p.anyItemMenu()}">
                                <details th:if="${item.historyHref() != null}" class="cl-menu">
                                    <summary class="cl-button is-icon" th:attr="aria-label=${item.menuLabel()}"><span class="cl-menu-glyph" aria-hidden="true">⋯</span></summary>
                                    <ul class="cl-menu-list" th:id="|item-menu-${s.index}|">
                                        <li><a class="cl-menu-item" th:href="@{${item.historyHref()}}" th:text="#{warehouse.documents.details.item.history}"></a></li>
                                    </ul>
                                </details>
                            </td>
                        </tr>
                        </tbody>
                    </table>
                    <p class="cl-list-empty" th:if="${p.items().isEmpty()}" th:text="#{warehouse.documents.details.items.empty}"></p>
                    <p class="cl-list-summary" th:unless="${p.items().isEmpty()}"><span th:text="${p.summaryQty()}"></span> · <strong th:text="${p.summaryTotal()}"></strong></p>
                </section>
            </div>

            <div class="cl-layout-side is-grid">
                <section class="cl-card" aria-labelledby="links-title" th:unless="${p.links().isEmpty()}">
                    <div class="cl-card-head"><h2 class="cl-card-title" id="links-title" th:text="${p.linksTitle()}"></h2></div>
                    <dl class="cl-kv is-column">
                        <div th:each="link : ${p.links()}" th:class="${link.wide()} ? 'cl-kv-wide' : null">
                            <dt th:text="${link.label()}"></dt>
                            <dd th:class="${link.wide()} ? 'cl-kv-text' : null">
                                <a th:if="${link.href() != null}" th:href="@{${link.href()}}" th:text="${link.text()}"></a>
                                <span th:unless="${link.href() != null}" th:text="${link.text()}"></span>
                            </dd>
                        </div>
                    </dl>
                </section>
                <th:block th:each="card : ${ {'counterparty', 'deliveryAddress', 'issuer'} }"
                          th:with="a=${card == 'counterparty'} ? ${p.counterparty()} : (${card == 'issuer'} ? ${p.issuer()} : ${p.deliveryAddress()})">
                    <section th:if="${a != null}" class="cl-card" th:attr="aria-labelledby=${card} + '-title'">
                        <div class="cl-card-head"><h2 class="cl-card-title" th:id="${card} + '-title'"
                                                      th:text="#{${'warehouse.documents.details.' + card}}"></h2></div>
                        <div class="cl-address">
                            <th:block th:if="${a.name() != null}"><strong th:text="${a.name()}"></strong><br></th:block>
                            <th:block th:each="line, ls : ${a.lines()}"><span th:text="${line}"></span><br th:unless="${ls.last}"></th:block>
                            <div th:if="${a.taxId() != null}" th:text="${a.taxId()}"></div>
                        </div>
                    </section>
                </th:block>
            </div>
        </div>
    </div>
</section>
<script th:src="@{/js/menu.js}" defer></script>
<script th:src="@{/js/copy-field.js}" defer></script>
<script th:src="@{/js/label-print.js}" defer></script>
</div>
</body>
</html>
