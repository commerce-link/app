<!DOCTYPE HTML>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}">
<body>
<div layout:fragment="content">
    <section class="cl-page">
        <div class="cl-page-body">
            <div th:replace="~{fragments/settings-header :: subpage(${shippingHref}, ${backLabel}, ${pageTitle})}"></div>

            <form th:fragment="accountForm" id="shipping-account-form" class="cl-form"
                  th:action="@{${formAction}}" th:object="${form}" method="post" novalidate data-cl-async
                  th:attr="data-cl-redirect=${redirectTo}, data-error-message=#{form.save.failed}">
                <div th:replace="~{fragments/settings-form :: errorSummary('shipping-account-errors', ${errors}, ${errorLabels})}"></div>

                <div class="cl-card">
                    <fieldset class="cl-fieldset">
                        <legend class="cl-fieldset-title" th:text="#{store.shipping.account.title}"></legend>
                        <div class="cl-field">
                            <label class="cl-label" for="providerName" th:text="#{store.shipping.account.provider}"></label>
                            <select class="cl-select" id="providerName" name="providerName" data-cl-variant-select="shipping-provider"
                                    th:classappend="${errors['providerName'] != null} ? 'is-invalid'"
                                    th:attr="aria-invalid=${errors['providerName'] != null ? 'true' : null},
                                             aria-describedby=${errors['providerName'] != null ? 'providerName-help providerName-error' : 'providerName-help'}">
                                <!--/* Without an account, or with one whose adapter is gone, nothing matches an option: the empty
                                       option keeps the browser from silently picking the first provider. */-->
                                <option th:unless="${providerKnown}" value="" th:text="#{store.shipping.account.choose}"></option>
                                <option th:each="provider : ${providers}" th:value="${provider.name()}"
                                        th:text="${provider.displayName()}"
                                        th:selected="${provider.name() == form.providerName}"></option>
                            </select>
                            <p class="cl-help" id="providerName-help" th:text="#{store.shipping.account.description}"></p>
                            <p th:if="${errors['providerName'] != null}" class="cl-field-error" id="providerName-error">
                                <i class="fas fa-exclamation-circle" aria-hidden="true"></i>
                                <span th:text="#{${errors['providerName']}}"></span>
                            </p>
                        </div>
                    </fieldset>

                    <fieldset th:each="provider : ${providers}" th:unless="${provider.configurationFields().isEmpty()}"
                              class="cl-fieldset" data-cl-variant-group="shipping-provider"
                              th:attr="data-cl-variant=${provider.name()}">
                        <legend class="cl-fieldset-title" th:text="#{store.shipping.account.settings(${provider.displayName()})}"></legend>

                        <!--/* The webhook comes first: the token typed in the provider's panel goes into the field below. */-->
                        <th:block th:if="${webhooks[provider.name()] != null}">
                            <div th:replace="~{fragments/settings-form :: copyField('webhook-' + ${provider.name()},
                                    #{store.shipping.account.webhook}, ${webhooks[provider.name()]},
                                    #{store.shipping.account.webhook.help(${provider.displayName()})})}"></div>
                            <details class="cl-disclosure" th:id="'webhook-steps-' + ${provider.name()}">
                                <summary th:text="#{store.shipping.account.webhook.steps.title(${provider.displayName()})}"></summary>
                                <div class="cl-disclosure-body">
                                    <ol class="cl-steps" th:with="where=${#messages.msgOrNull('store.shipping.account.webhook.steps.' + provider.name() + '.where')}">
                                        <li>
                                            <span th:text="#{store.shipping.account.webhook.steps.open(${provider.displayName()})}"></span>
                                            <span th:if="${where != null}" th:text="${where}"></span>
                                        </li>
                                        <li th:text="#{store.shipping.account.webhook.steps.paste}"></li>
                                        <li th:text="#{store.shipping.account.webhook.steps.states}"></li>
                                        <li th:text="#{store.shipping.account.webhook.steps.token}"></li>
                                        <li th:text="#{store.shipping.account.webhook.steps.test}"></li>
                                    </ol>
                                    <p class="cl-help cl-steps-note" th:text="#{store.shipping.account.webhook.steps.note}"></p>
                                </div>
                            </details>
                        </th:block>

                        <div class="cl-form-grid">
                            <div class="cl-span-3 cl-field" th:each="field : ${provider.configurationFields()}"
                                 th:with="id=${T(pl.commercelink.web.dtos.IntegrationSettingsForm).fieldId(provider.name(), field)},
                                          secret=${field.type().name() == 'PASSWORD'},
                                          error=${errors.get(id)},
                                          stored=${storedSecretIds.contains(id)},
                                          label=${T(pl.commercelink.web.settings.ProviderFieldText).label(field)},
                                          example=${T(pl.commercelink.web.settings.ProviderFieldText).example(field)},
                                          token=${field.key() == webhookTokenKey},
                                          help=${stored or example != null or token}">
                                <label class="cl-label" th:for="${id}">
                                    <span th:text="${label}"></span>
                                    <span th:unless="${field.required()}" class="cl-optional" th:text="#{form.optional}"></span>
                                </label>
                                <input class="cl-input" th:classappend="${error != null} ? 'is-invalid'"
                                       th:id="${id}" th:name="${T(pl.commercelink.web.dtos.IntegrationSettingsForm).fieldName(provider.name(), field)}"
                                       th:type="${secret ? 'password' : (field.type().name() == 'URL' ? 'url' : 'text')}"
                                       th:value="${form.value(provider.name(), field)}"
                                       th:attr="autocomplete=${secret ? 'new-password' : 'off'},
                                                inputmode=${field.type().name() == 'NUMBER' ? 'decimal' : null},
                                                aria-invalid=${error != null ? 'true' : null},
                                                aria-describedby=${(help or error != null) ? ((help ? id + '-help' : '') + (help and error != null ? ' ' : '') + (error != null ? id + '-error' : '')) : null}"/>
                                <p th:if="${help}" class="cl-help" th:id="${id} + '-help'">
                                    <span th:if="${stored}" th:text="#{integration.secret.stored}"></span>
                                    <span th:if="${example != null}" th:text="#{integration.setting.example(${example})}"></span>
                                    <span th:if="${token and !stored}" th:text="#{store.shipping.account.webhookToken.help}"></span>
                                </p>
                                <p th:if="${error != null}" class="cl-field-error" th:id="${id} + '-error'">
                                    <i class="fas fa-exclamation-circle" aria-hidden="true"></i>
                                    <span th:text="#{${error}}"></span>
                                </p>
                            </div>
                        </div>
                    </fieldset>

                    <div class="cl-card-footer">
                        <button class="cl-button is-primary" type="submit" th:text="#{store.shipping.account.save}"></button>
                        <a class="cl-button" th:href="@{${shippingHref}}" th:text="#{general.cancel}"></a>
                    </div>
                </div>
            </form>
        </div>
    </section>
    <script th:if="${!errors.isEmpty()}">
        document.getElementById('shipping-account-errors').focus();
    </script>
    <script th:src="@{/js/async-form.js}" defer></script>
    <script th:src="@{/js/variant-fields.js}" defer></script>
    <script th:src="@{/js/copy-field.js}" defer></script>
</div>
</body>
</html>
