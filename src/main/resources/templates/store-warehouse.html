<!DOCTYPE HTML>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}">
<body>
<div layout:fragment="content">
    <section class="cl-page">
        <div class="cl-page-body">
            <div th:replace="~{fragments/settings-header :: header(false, null)}"></div>
            <div th:replace="~{fragments/settings-form :: savedAlert}"></div>

            <div class="cl-stack">
                <form th:fragment="documentsForm" id="warehouse-documents-form" class="cl-form"
                      th:action="@{${formAction}}" th:object="${form}" method="post" novalidate data-cl-async
                      th:attr="data-success-message=${savedMessage}, data-error-message=#{form.save.failed}">
                    <div th:replace="~{fragments/settings-form :: errorSummary('warehouse-documents-errors', ${errors}, null)}"></div>

                    <div class="cl-card">
                        <fieldset class="cl-fieldset">
                            <legend class="cl-fieldset-title" th:text="#{store.warehouse.documents.title}"></legend>
                            <div th:replace="~{fragments/settings-form :: check('documentsEnabled', 'store.warehouse.documents.enable', *{documentsEnabled}, 'store.warehouse.documents.enable.description', 'warehouse-documents-ids')}"></div>
                            <div id="warehouse-documents-ids" class="cl-reveal">
                                <div th:unless="${invoicingConnected}" class="cl-alert is-warn">
                                    <i class="fas fa-exclamation-triangle cl-alert-icon" aria-hidden="true"></i>
                                    <div>
                                        <p class="cl-alert-title" th:text="#{store.warehouse.documents.noInvoicing.title}"></p>
                                        <p class="cl-alert-text">
                                            <span th:text="#{store.warehouse.documents.noInvoicing.text}"></span>
                                            <a th:href="@{${invoicingHref}}" th:text="#{store.warehouse.documents.noInvoicing.link}"></a>
                                        </p>
                                    </div>
                                </div>
                                <div class="cl-form-grid">
                                    <div class="cl-span-3" th:insert="~{fragments/settings-form :: textField('warehouseId', 'store.warehouse.configuration.warehouse.id', *{warehouseId}, 'text', 'off', true, ${errors['warehouseId']}, null)}"></div>
                                    <div class="cl-span-3" th:insert="~{fragments/settings-form :: textField('costCenterId', 'store.warehouse.configuration.cost.center.id', *{costCenterId}, 'text', 'off', true, ${errors['costCenterId']}, null)}"></div>
                                    <p class="cl-help" th:text="#{store.warehouse.documents.ids.help}"></p>
                                </div>
                            </div>
                        </fieldset>
                        <div class="cl-card-footer">
                            <button class="cl-button is-primary" type="submit" th:text="#{form.save.changes}"></button>
                        </div>
                    </div>
                </form>

                <section class="cl-card" aria-labelledby="warehouse-addresses-title">
                    <div class="cl-card-head">
                        <h2 class="cl-card-title" id="warehouse-addresses-title" th:text="#{store.warehouse.addresses.title}"></h2>
                        <a class="cl-button" th:href="@{${newAddressHref}}">
                            <i class="fas fa-plus" aria-hidden="true"></i>
                            <span th:text="#{store.warehouse.addresses.add}"></span>
                        </a>
                    </div>
                    <p class="cl-card-desc" th:text="#{store.warehouse.addresses.description}"></p>
                    <ul th:unless="${addresses.isEmpty()}" class="cl-list">
                        <li class="cl-list-item" th:each="address : ${addresses}"
                            th:with="name=${#strings.isEmpty(address.title())} ? #{settings.list.untitled} : ${address.title()}">
                            <div>
                                <div class="cl-list-title">
                                    <span th:text="${name}"></span>
                                    <span th:if="${address.isDefault()}" class="cl-status is-info" th:text="#{settings.list.default}"></span>
                                    <span th:unless="${address.complete()}" class="cl-status is-warn" th:text="#{settings.list.incomplete}"></span>
                                    <!--/* The shortcut sits where the Default pill would be, so the state and the way to move it share a place
                                           and the row keeps two actions on the right. An incomplete address is completed first. */-->
                                    <form th:if="${!address.isDefault() and address.complete()}" class="cl-list-title-action" method="post"
                                          th:action="@{${address.defaultHref()}}">
                                        <button type="submit" class="cl-link-button" th:text="#{settings.list.makeDefault}"
                                                th:attr="aria-label=#{settings.list.makeDefault.for(${name})}"></button>
                                    </form>
                                </div>
                                <p th:if="${address.addressLine() != null}" class="cl-list-desc" th:text="${address.addressLine()}"></p>
                                <p th:if="${address.contactLine() != null and address.complete()}" class="cl-list-desc" th:text="${address.contactLine()}"></p>
                                <p th:unless="${address.complete()}" class="cl-list-desc is-warn"
                                   th:text="#{store.warehouse.addresses.missing(${#strings.listJoin(#messages.listMsg(address.missingFieldKeys()), ', ')})}"></p>
                            </div>
                            <div class="cl-list-actions">
                                <a class="cl-link-button" th:href="@{${address.editHref()}}"
                                   th:text="${address.complete()} ? #{settings.list.edit} : #{settings.list.complete}"
                                   th:attr="aria-label=${address.complete()} ? #{settings.list.edit.for(${name})} : #{settings.list.complete.for(${name})}"></a>
                                <a class="cl-link-button is-danger" th:href="@{${address.deleteHref()}}" data-cl-confirm
                                   th:text="#{settings.list.delete}"
                                   th:attr="aria-label=#{settings.list.delete.for(${name})},
                                            data-cl-confirm-title=#{store.warehouse.address.delete.title(${name})},
                                            data-cl-confirm-message=#{store.warehouse.address.delete.message},
                                            data-cl-confirm-action=#{store.warehouse.address.delete.action}"></a>
                            </div>
                        </li>
                    </ul>
                    <p th:if="${addresses.isEmpty()}" class="cl-list-empty" th:text="#{store.warehouse.addresses.empty}"></p>
                </section>

                <section class="cl-card" aria-labelledby="warehouse-printers-title">
                    <div class="cl-card-head">
                        <h2 class="cl-card-title" id="warehouse-printers-title" th:text="#{store.warehouse.printers.title}"></h2>
                        <a th:if="${printerTypesAvailable}" class="cl-button" th:href="@{${newPrinterHref}}">
                            <i class="fas fa-plus" aria-hidden="true"></i>
                            <span th:text="#{store.warehouse.printers.add}"></span>
                        </a>
                    </div>
                    <p class="cl-card-desc" th:text="#{store.warehouse.printers.description}"></p>
                    <ul th:unless="${printers.isEmpty()}" class="cl-list">
                        <li class="cl-list-item" th:each="printer : ${printers}"
                            th:with="name=${#strings.isEmpty(printer.name())} ? #{settings.list.untitled} : ${printer.name()}">
                            <div>
                                <div class="cl-list-title"><span th:text="${name}"></span></div>
                                <p class="cl-list-desc"
                                   th:text="${printer.summary() != null} ? ${printer.typeName() + ' · ' + printer.summary()} : ${printer.typeName()}"></p>
                            </div>
                            <div class="cl-list-actions">
                                <a class="cl-link-button" th:href="@{${printer.editHref()}}" th:text="#{settings.list.edit}"
                                   th:attr="aria-label=#{settings.list.edit.for(${name})}"></a>
                                <a class="cl-link-button is-danger" th:href="@{${printer.deleteHref()}}" data-cl-confirm
                                   th:text="#{settings.list.delete}"
                                   th:attr="aria-label=#{settings.list.delete.for(${name})},
                                            data-cl-confirm-title=#{store.warehouse.printer.delete.title(${name})},
                                            data-cl-confirm-message=#{store.warehouse.printer.delete.message},
                                            data-cl-confirm-action=#{store.warehouse.printer.delete.action}"></a>
                            </div>
                        </li>
                    </ul>
                    <p th:if="${printers.isEmpty() and printerTypesAvailable}" class="cl-list-empty" th:text="#{store.warehouse.printers.empty}"></p>
                    <p th:if="${printers.isEmpty() and !printerTypesAvailable}" class="cl-list-empty" th:text="#{store.warehouse.printers.noTypes}"></p>
                </section>
            </div>
            <dialog th:replace="~{fragments/confirm-dialog :: dialog}"></dialog>
        </div>
    </section>
    <script th:if="${!errors.isEmpty()}">
        document.getElementById('warehouse-documents-errors').focus();
    </script>
    <script th:src="@{/js/async-form.js}" defer></script>
    <script th:src="@{/js/reveal.js}" defer></script>
    <script th:src="@{/js/confirm-dialog.js}" defer></script>
</div>
</body>
</html>
