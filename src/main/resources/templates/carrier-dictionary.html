<!DOCTYPE HTML>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}">
<body>
<div layout:fragment="content">
    <section class="cl-page">
        <div class="cl-page-body is-form">
            <div th:replace="~{fragments/settings-header :: subpageWithActions(${backHref}, ${backLabel}, ${title}, ${description}, null)}"></div>
            <div th:replace="~{fragments/settings-form :: savedAlert}"></div>

            <form class="cl-form" th:action="@{${formAction}}" method="post" data-carrier-dictionary>
                <input th:if="${dictionaryKey != null}" type="hidden" name="dictionary" th:value="${dictionaryKey}"/>
                <input type="hidden" name="version" th:value="${version}"/>
                <div class="cl-card">
                    <p class="cl-card-desc" th:each="hint : ${hints}" th:text="${hint}"></p>
                    <p th:if="${dictionaryKey != null}" class="cl-card-desc"><small th:text="#{carriers.dictionary.key(${dictionaryKey})}"></small></p>

                    <table class="cl-table is-compact">
                        <thead>
                        <tr>
                            <th scope="col" th:text="${externalTextColumn}"></th>
                            <th scope="col" th:text="#{carriers.dictionary.column.carrier}"></th>
                            <th scope="col"><span class="cl-visually-hidden" th:text="#{carriers.dictionary.column.actions}"></span></th>
                        </tr>
                        </thead>
                        <tbody data-carrier-rows>
                        <tr th:each="pair : ${pairs}" data-carrier-row>
                            <td>
                                <input class="cl-input" type="text" name="externalText" maxlength="200" autocomplete="off"
                                       th:value="${pair.externalText}"
                                       th:attr="aria-label=${externalTextColumn}"/>
                            </td>
                            <td>
                                <select class="cl-select" name="carrier" th:attr="aria-label=#{carriers.dictionary.column.carrier}">
                                    <option value="" th:text="#{carriers.dictionary.choose}"></option>
                                    <option th:each="name : ${carrierNames}" th:value="${name}" th:text="${name}"
                                            th:selected="${name == pair.carrier}"></option>
                                    <!--/* a carrier missing from the list (written straight to the table) is kept, not dropped on save */-->
                                    <option th:if="${pair.carrier != null and !carrierNames.contains(pair.carrier)}"
                                            th:value="${pair.carrier}" th:text="${pair.carrier}" selected></option>
                                </select>
                            </td>
                            <td class="cl-table-actions">
                                <button type="button" class="cl-icon-button" data-carrier-move="-1" hidden
                                        th:attr="aria-label=#{carriers.dictionary.up}"><i class="fas fa-arrow-up" aria-hidden="true"></i></button>
                                <button type="button" class="cl-icon-button" data-carrier-move="1" hidden
                                        th:attr="aria-label=#{carriers.dictionary.down}"><i class="fas fa-arrow-down" aria-hidden="true"></i></button>
                                <button type="button" class="cl-icon-button" data-carrier-remove hidden
                                        th:attr="aria-label=#{carriers.dictionary.remove}"><i class="fas fa-trash" aria-hidden="true"></i></button>
                            </td>
                        </tr>
                        </tbody>
                    </table>

                    <div class="cl-card-footer">
                        <button class="cl-button is-primary" type="submit" th:text="#{carriers.dictionary.save}"></button>
                        <button class="cl-button" type="button" data-carrier-add hidden th:text="#{carriers.dictionary.add}"></button>
                        <a class="cl-button" th:href="@{${backHref}}" th:text="#{general.cancel}"></a>
                    </div>
                </div>
            </form>
        </div>
    </section>
    <script th:src="@{/js/carrier-dictionary.js}" defer></script>
</div>
</body>
</html>
