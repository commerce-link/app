<!DOCTYPE HTML>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}" th:with="showNavbar=false">
<body>

<div layout:fragment="content">

    <style>
        .client-order-head {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 1.5rem;
            flex-wrap: wrap;
            margin-bottom: 1.5rem;
        }
        .client-order-id {
            text-align: right;
        }
        .client-order-section-head {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            gap: 1rem;
            margin-bottom: 1rem;
        }
        /* Bulma's .content wrapper (from layout.html) styles ol/li with margins that would push
           every step but the first down; the .content prefix wins over those rules. */
        .content .stepper {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            align-items: start;
            padding: 0.25rem 0;
            list-style: none;
            margin: 0;
        }
        .content .stepper .step {
            display: grid;
            grid-template-rows: 32px auto 1.2rem;
            align-content: start;
            justify-items: center;
            text-align: center;
            position: relative;
            margin: 0;
            padding: 0 0.25rem;
        }
        .step::before, .step::after {
            content: "";
            position: absolute;
            top: 15px;
            height: 2px;
            background: #dbdbdb;
            width: 50%;
        }
        .step::before { left: 0; }
        .step::after { right: 0; }
        .step:first-child::before, .step:last-child::after { display: none; }
        .step.is-done::before, .step.is-done::after, .step.is-current::before {
            background: var(--client-primary-color, #485fc7);
        }
        .step .marker {
            position: relative;
            z-index: 1;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            display: grid;
            place-items: center;
            background: #fff;
            border: 2px solid #dbdbdb;
            color: #7a7a7a;
            font-size: 0.8125rem;
            font-weight: 600;
        }
        .step.is-done .marker {
            background: var(--client-primary-color, #485fc7);
            border-color: var(--client-primary-color, #485fc7);
            color: #fff;
        }
        .step.is-current .marker {
            border-color: var(--client-primary-color, #485fc7);
            color: var(--client-primary-color, #485fc7);
            box-shadow: 0 0 0 4px rgba(0, 0, 0, 0.06);
        }
        .step .name {
            margin-top: 0.6rem;
            font-size: 0.8125rem;
            color: #7a7a7a;
            line-height: 1.25;
        }
        .step.is-done .name, .step.is-current .name { color: #363636; }
        .step.is-current .name { font-weight: 600; }
        .step .when {
            font-size: 0.75rem;
            line-height: 1.2rem;
            color: #7a7a7a;
        }
        .stepper-note {
            margin-top: 1.25rem;
            color: #7a7a7a;
        }
        .shipment-row {
            display: flex;
            align-items: center;
            gap: 1rem;
            padding: 0.875rem 1rem;
            border: 1px solid #dbdbdb;
            border-radius: 6px;
        }
        .shipment-row + .shipment-row { margin-top: 0.75rem; }
        .shipment-row .shipment-body { flex: 1; }
        .shipments-empty {
            color: #7a7a7a;
            font-size: 0.9rem;
            padding: 0.875rem 1rem;
            border: 1px dashed #dbdbdb;
            border-radius: 6px;
        }
        .kv {
            display: grid;
            grid-template-columns: 9.5rem 1fr;
            row-gap: 0.55rem;
            column-gap: 1rem;
        }
        .kv dt { color: #7a7a7a; font-size: 0.875rem; }
        .kv dd { margin: 0; }
        .date-row {
            display: flex;
            justify-content: space-between;
            gap: 1rem;
            align-items: baseline;
            padding: 0.55rem 0;
            border-bottom: 1px solid #edf0f3;
        }
        .date-row:last-of-type { border-bottom: 0; }
        @media screen and (max-width: 768px) {
            .client-order-id { text-align: left; }
            .content .stepper { grid-template-columns: 1fr; gap: 0.25rem; }
            .content .stepper .step {
                grid-template-columns: 32px 1fr;
                grid-template-rows: auto auto;
                justify-items: start;
                text-align: left;
                column-gap: 0.75rem;
                align-items: center;
            }
            .step::before, .step::after { display: none; }
            .step .marker { grid-row: 1 / span 2; }
            .step .name { margin-top: 0; grid-column: 2; }
            .step .when { grid-column: 2; }
            .kv { grid-template-columns: 1fr; row-gap: 0.15rem; }
            .kv dd { margin-bottom: 0.5rem; }
        }
    </style>

    <div class="container" th:style="${#strings.isEmpty(branding.primaryColor)} ? null : '--client-primary-color:' + ${branding.primaryColor}">

        <header class="client-order-head">
            <div class="client-order-brand">
                <div>
                    <p class="has-text-weight-semibold" th:text="${store.name}"></p>
                    <p class="is-size-7 has-text-grey" th:text="#{client.order.title}"></p>
                </div>
            </div>
            <div class="client-order-id">
                <p class="heading mb-1" th:text="#{client.order.number}"></p>
                <p class="title is-4 mb-1" th:text="${view.shortOrderId}"></p>
                <p class="is-size-7 has-text-grey">
                    <span th:text="${view.orderId}"></span>
                    <span th:if="${view.orderedAt != null}" th:text="' · ' + #{client.order.ordered.at} + ' ' + ${#temporals.format(view.orderedAt, 'd MMMM yyyy')}"></span>
                </p>
            </div>
        </header>

        <div th:if="${view.cancelled}" class="notification is-danger is-light mb-5">
            <p class="has-text-weight-semibold" th:text="#{client.order.cancelled.title}"></p>
            <p th:text="#{client.order.cancelled.text}"></p>
        </div>

        <div class="columns">
            <div class="column">

                <section class="box" th:unless="${view.cancelled}">
                    <div class="client-order-section-head">
                        <h2 class="title is-5 mb-0" th:text="#{client.order.progress}"></h2>
                        <span class="tag is-medium is-light" th:text="${enumI18n.localize(view.stage, view.personalCollection ? 'collection' : '')}"></span>
                    </div>
                    <ol class="stepper">
                        <li class="step" th:each="stage, iter : ${T(pl.commercelink.orders.ClientOrderStage).values()}"
                            th:classappend="${view.isStageDone(stage)} ? 'is-done' : (${view.isStageCurrent(stage)} ? 'is-current' : '')">
                            <span class="marker">
                                <i th:if="${view.isStageDone(stage)}" class="fas fa-check"></i>
                                <span th:unless="${view.isStageDone(stage)}" th:text="${iter.count}"></span>
                            </span>
                            <span class="name" th:text="${enumI18n.localize(stage, view.personalCollection ? 'collection' : '')}"></span>
                            <span class="when">
                                <span th:if="${stage.name() == 'Accepted' and view.orderedAt != null}" th:text="${#temporals.format(view.orderedAt, 'd MMM')}"></span>
                                <span th:if="${stage.name() == 'Shipping' and view.shippedAt != null}" th:text="${#temporals.format(view.shippedAt, 'd MMM')}"></span>
                                <span th:if="${stage.name() == 'Delivered' and view.deliveredAt != null}" th:text="${#temporals.format(view.deliveredAt, 'd MMM')}"></span>
                            </span>
                        </li>
                    </ol>
                    <p class="stepper-note" th:text="#{${view.noteKey}}"></p>
                </section>

                <section class="box">
                    <div class="client-order-section-head">
                        <h2 class="title is-5 mb-0" th:text="#{client.order.items}"></h2>
                        <span class="is-size-7 has-text-grey" th:unless="${view.cancelled}"
                              th:text="#{client.order.items.assembled(${view.assembledCount}, ${view.productCount})}"></span>
                    </div>
                    <div class="table-container">
                        <table class="table is-fullwidth">
                            <thead>
                            <tr>
                                <th th:text="#{client.order.item.product}"></th>
                                <th class="has-text-right" th:text="#{client.order.item.qty}"></th>
                                <th class="has-text-right" th:unless="${view.cancelled}" th:text="#{client.order.item.status}"></th>
                            </tr>
                            </thead>
                            <tbody>
                            <tr th:each="item : ${view.items}">
                                <td>
                                    <span th:text="${item.name()}"></span>
                                    <div class="is-size-7 has-text-grey" th:text="${item.category()}"></div>
                                </td>
                                <td class="has-text-right" th:text="${item.qty()}"></td>
                                <td class="has-text-right" th:unless="${view.cancelled}">
                                    <span class="tag"
                                          th:classappend="${item.status().name() == 'Assembled'} ? 'is-success is-light' :
                                                          (${item.status().name() == 'AwaitingDelivery'} ? 'is-info is-light' :
                                                          (${item.status().name() == 'InClaim'} ? 'is-danger is-light' : 'is-light'))"
                                          th:text="${enumI18n.localize(item.status())}"></span>
                                </td>
                            </tr>
                            </tbody>
                        </table>
                    </div>
                </section>

                <section class="box">
                    <div class="client-order-section-head">
                        <h2 class="title is-5 mb-0" th:text="#{client.order.delivery}"></h2>
                    </div>
                    <dl class="kv">
                        <dt th:text="#{client.order.delivery.method}"></dt>
                        <dd th:text="${view.deliveryMethod != null} ? ${view.deliveryMethod} : ${enumI18n.localize(view.shipmentType)}"></dd>

                        <th:block th:if="${view.personalCollection}">
                            <dt th:text="#{client.order.delivery.pickup.address}"></dt>
                            <dd th:if="${view.pickupAddress != null}">
                                <span th:if="${view.pickupAddress.companyName() != null}" th:text="${view.pickupAddress.companyName()}"></span><br th:if="${view.pickupAddress.companyName() != null}">
                                <span th:text="${view.pickupAddress.streetAndNumber()}"></span><br>
                                <span th:text="${view.pickupAddress.postalCode() + ' ' + view.pickupAddress.city()}"></span>
                            </dd>
                            <dd th:if="${view.pickupAddress == null}">-</dd>
                        </th:block>

                        <th:block th:if="${view.pickupPoint}">
                            <dt th:text="#{client.order.delivery.carrier}"></dt>
                            <dd th:text="${view.carrier != null} ? ${view.carrier} : '-'"></dd>
                            <dt th:text="#{client.order.delivery.point.code}"></dt>
                            <dd>
                                <span th:if="${view.collectionPointCode != null}" th:replace="~{fragments/masked-field :: masked(${view.collectionPointCode})}"></span>
                                <span th:if="${view.collectionPointCode == null}">-</span>
                            </dd>
                        </th:block>

                        <th:block th:if="${!view.personalCollection and !view.pickupPoint and view.shippingDetails != null}">
                            <dt th:text="#{client.order.delivery.address}"></dt>
                            <dd>
                                <span th:replace="~{fragments/masked-field :: masked(${view.shippingDetails.displayName})}"></span><br>
                                <span th:replace="~{fragments/masked-field :: masked(${view.shippingDetails.streetAndNumber})}"></span><br>
                                <span th:text="${view.shippingDetails.postalCode + ' ' + view.shippingDetails.city + ', ' + view.shippingDetails.country}"></span><br>
                                <span class="is-size-7 has-text-grey">
                                    <span th:replace="~{fragments/masked-field :: masked(${view.shippingDetails.phone})}"></span>
                                    <span> · </span>
                                    <span th:replace="~{fragments/masked-field :: masked(${view.shippingDetails.email})}"></span>
                                </span>
                            </dd>
                        </th:block>

                        <th:block th:if="${view.shipmentsVisible}">
                            <dt th:text="#{client.order.shipments}"></dt>
                            <dd>
                                <div th:if="${#lists.isEmpty(view.shipments)}" class="shipments-empty" th:text="#{client.order.shipments.empty}"></div>
                                <div class="shipment-row" th:each="shipment : ${view.shipments}">
                                    <span class="icon is-medium has-text-grey">
                                        <i th:class="${shipment.type.name() == 'PersonalCollection'} ? 'fas fa-building fa-lg' : 'fas fa-truck fa-lg'"></i>
                                    </span>
                                    <div class="shipment-body">
                                        <p class="has-text-weight-semibold">
                                            <span th:text="${shipment.carrier != null} ? ${shipment.carrier} : ${enumI18n.localize(shipment.type)}"></span>
                                            <span th:if="${shipment.trackingNo != null}" th:text="' · ' + ${shipment.trackingNo}"></span>
                                        </p>
                                        <p class="is-size-7 has-text-grey">
                                            <span th:if="${shipment.shippedAt != null}"
                                                  th:text="(${shipment.type.name() == 'PersonalCollection'} ? #{client.order.shipment.ready} : #{client.order.shipment.shipped}) + ' ' + ${#temporals.format(shipment.shippedAt, 'd MMMM yyyy, HH:mm')}"></span>
                                            <span th:if="${shipment.deliveredAt != null}"
                                                  th:text="' · ' + #{client.order.shipment.delivered} + ' ' + ${#temporals.format(shipment.deliveredAt, 'd MMMM yyyy, HH:mm')}"></span>
                                        </p>
                                    </div>
                                    <a th:if="${shipment.trackingUrl != null}" class="button is-primary is-small"
                                       th:href="${shipment.trackingUrl}" target="_blank" rel="noopener"
                                       th:style="${#strings.isEmpty(branding.primaryColor)} ? null : 'background-color:' + ${branding.primaryColor} + ' !important; color: #fff;'"
                                       th:text="#{client.order.shipment.track}"></a>
                                </div>
                            </dd>
                        </th:block>
                    </dl>
                </section>

            </div>

            <div class="column is-one-third">

                <div class="box">
                    <h2 class="title is-5 mb-2" th:text="#{client.order.dates}"></h2>
                    <th:block th:if="${!view.cancelled and view.hasEstimatedDates()}">
                        <div class="date-row" th:if="${view.estimatedAssemblyAt != null}">
                            <span class="has-text-grey" th:text="#{client.order.dates.assembly}"></span>
                            <span class="has-text-weight-semibold" th:text="${#temporals.format(view.estimatedAssemblyAt, 'd MMMM')}"></span>
                        </div>
                        <div class="date-row" th:if="${view.estimatedShippingAt != null}">
                            <span class="has-text-grey" th:text="${view.personalCollection} ? #{client.order.dates.collection} : #{client.order.dates.shipping}"></span>
                            <span class="has-text-weight-semibold" th:text="${#temporals.format(view.estimatedShippingAt, 'd MMMM')}"></span>
                        </div>
                        <p class="is-size-7 has-text-grey mt-3" th:text="#{client.order.dates.note}"></p>
                    </th:block>
                    <p class="is-size-7 has-text-grey" th:if="${!view.cancelled and !view.hasEstimatedDates()}" th:text="#{client.order.dates.unknown}"></p>
                    <p class="is-size-7 has-text-grey" th:if="${view.cancelled}" th:text="#{client.order.dates.cancelled}"></p>
                </div>

                <div class="box">
                    <h2 class="title is-5 mb-3" th:text="#{client.order.payment}"></h2>
                    <div class="is-flex is-justify-content-space-between is-align-items-baseline">
                        <span class="has-text-grey" th:text="#{client.order.payment.total}"></span>
                        <span class="is-size-5 has-text-weight-semibold"
                              th:text="${#numbers.formatDecimal(view.totalPrice, 1, 'COMMA', 2, 'POINT')} + ' PLN'"></span>
                    </div>
                    <th:block th:if="${view.paymentRecorded and !view.fullyPaid}">
                        <div class="is-flex is-justify-content-space-between is-align-items-baseline mt-2">
                            <span class="has-text-grey" th:text="#{client.order.payment.settled}"></span>
                            <span class="has-text-weight-semibold"
                                  th:text="${#numbers.formatDecimal(view.paidAmount, 1, 'COMMA', 2, 'POINT')} + ' PLN'"></span>
                        </div>
                        <div class="is-flex is-justify-content-space-between is-align-items-baseline mt-2" th:unless="${view.overpaid}">
                            <span class="has-text-grey" th:text="#{client.order.payment.remaining}"></span>
                            <span class="has-text-weight-semibold has-text-danger"
                                  th:text="${#numbers.formatDecimal(view.unpaidAmount, 1, 'COMMA', 2, 'POINT')} + ' PLN'"></span>
                        </div>
                        <div class="is-flex is-justify-content-space-between is-align-items-baseline mt-2" th:if="${view.overpaid}">
                            <span class="has-text-grey" th:text="#{client.order.payment.refund}"></span>
                            <span class="has-text-weight-semibold"
                                  th:text="${#numbers.formatDecimal(view.overpaidAmount, 1, 'COMMA', 2, 'POINT')} + ' PLN'"></span>
                        </div>
                    </th:block>
                    <div class="mt-3" th:if="${view.paymentRecorded and view.fullyPaid}">
                        <span class="tag is-success is-light" th:text="#{client.order.payment.paid}"></span>
                    </div>
                    <div class="mt-4" th:if="${view.bankAccountVisible}">
                        <p class="is-size-7 has-text-grey mb-2" th:text="#{client.order.bank.description}"></p>
                        <ul style="list-style: none; margin-left: 0">
                            <li class="mb-1">
                                <strong th:text="#{bank.account.holder} + ':'"></strong>
                                <span th:text="${view.bankAccount.accountHolder}"></span>
                            </li>
                            <li class="mb-1">
                                <strong th:text="#{bank.iban} + ':'"></strong>
                                <span th:text="${view.bankAccount.iban}"></span>
                            </li>
                            <li class="mb-1" th:if="${view.bankAccount.swiftCode != null}">
                                <strong th:text="#{bank.swift} + ':'"></strong>
                                <span th:text="${view.bankAccount.swiftCode}"></span>
                            </li>
                            <li class="mb-1" th:if="${view.bankAccount.bankName != null}">
                                <strong th:text="#{bank.name} + ':'"></strong>
                                <span th:text="${view.bankAccount.bankName}"></span>
                            </li>
                            <li class="mb-1" th:if="${view.bankAccount.currency != null}">
                                <strong th:text="#{bank.currency} + ':'"></strong>
                                <span th:text="${view.bankAccount.currency}"></span>
                            </li>
                            <li class="mb-1">
                                <strong th:text="#{bank.transfer.title} + ':'"></strong>
                                <span th:text="${view.orderId}"></span>
                            </li>
                        </ul>
                    </div>
                </div>

                <div class="box" th:if="${view.contactEmail != null}">
                    <h2 class="title is-5 mb-2" th:text="#{client.order.contact}"></h2>
                    <p th:utext="#{client.order.contact.text('<a href=&quot;mailto:' + ${view.contactEmail} + '&quot;>' + ${view.contactEmail} + '</a>', '<strong>' + ${view.shortOrderId} + '</strong>')}"></p>
                </div>

                <div class="image-preview mt-2 field has-text-centered" th:if="${branding.logo != null}">
                    <img th:src="@{'/StoreLogo/' + ${store.storeId}}"
                         alt="Store Logo"
                         style="max-width: 160px; max-height: 160px; border-radius: 12px; padding: 8px; margin: 0 auto;">
                </div>

            </div>
        </div>
    </div>

</div>

</body>
</html>
