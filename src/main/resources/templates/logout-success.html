<!DOCTYPE HTML>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{auth-layout}">
<head>
    <title th:text="#{logout.page-title}"></title>
</head>
<body>

<section class="cl-card" layout:fragment="content">
    <div class="cl-auth-body">
        <header class="cl-auth-head">
            <h1 class="cl-page-title" th:text="#{logout.success}"></h1>
            <p class="cl-page-lead" th:text="#{logout.thank.you}"></p>
        </header>
    </div>
    <div class="cl-card-footer">
        <a class="cl-button is-primary" href="/oauth2/authorization/cognito" th:text="#{logout.return.to.login}"></a>
    </div>
</section>

</body>
</html>
