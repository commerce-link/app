<!DOCTYPE HTML>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}">
<body>
<div layout:fragment="content">
    <section class="cl-page">
        <div class="cl-page-body is-form">
            <div th:replace="~{fragments/settings-header :: subpageWithActions(${backHref}, ${backLabel}, #{store.copy.title}, #{store.copy.lead}, null)}"></div>

            <form id="store-copy-form" class="cl-form" th:action="@{/dashboard/store/{id}/copy(id=${source.storeId})}" th:object="${form}"
                  method="post" novalidate data-cl-submit-once>
                <div th:replace="~{fragments/settings-form :: errorSummary('store-copy-errors', ${errors}, null)}"></div>
                <!--/* A failed or stale copy is no field's fault; errors is empty then, so the two alerts never show together. */-->
                <div th:if="${formError != null}" id="store-copy-errors" class="cl-alert is-bad" tabindex="-1" data-cl-error-summary>
                    <i class="fas fa-exclamation-circle cl-alert-icon" aria-hidden="true"></i>
                    <p class="cl-alert-text" th:text="#{${formError}(${form.trimmedName()})}"></p>
                </div>
                <input type="hidden" name="newStoreId" th:value="*{newStoreId}"/>
                <input type="hidden" name="back" th:if="${back != null}" th:value="${back}"/>
                <div class="cl-card">
                    <fieldset class="cl-fieldset">
                        <legend class="cl-fieldset-title" th:text="#{store.copy.section.source}"></legend>
                        <dl class="cl-kv">
                            <div>
                                <dt th:text="#{store.copy.source.label}"></dt>
                                <dd><a class="cl-text-link" th:href="@{/dashboard/store/{id}(id=${source.storeId})}" th:text="${sourceName}"></a>
                                    <span class="cl-help is-note" th:text="#{store.copy.source.id(${source.storeId})}"></span></dd>
                            </div>
                        </dl>
                    </fieldset>
                    <fieldset class="cl-fieldset">
                        <legend class="cl-fieldset-title" th:text="#{store.copy.section.new}"></legend>
                        <div class="cl-form-grid">
                            <div class="cl-span-4" th:insert="~{fragments/settings-form :: textFieldWith('newStoreName', 'store.copy.name', *{newStoreName}, 'text', 'off', true, ${errors['newStoreName']}, null, null, null, ${errors.isEmpty() and formError == null})}"></div>
                        </div>
                    </fieldset>
                    <fieldset class="cl-fieldset">
                        <legend class="cl-fieldset-title" th:text="#{store.copy.scope.title}"></legend>
                        <!--/* Mirrors StoreCopyService.copyStoreEntity; the comment there points back at these keys. */-->
                        <div class="cl-scope">
                            <div>
                                <p class="cl-scope-title" id="store-copy-scope-yes" th:text="#{store.copy.scope.yes}"></p>
                                <ul class="cl-scope-list is-yes" aria-labelledby="store-copy-scope-yes">
                                    <li th:each="item : ${ {'catalogs','notifications','suppliers','settings','warehouse','invoicing','packages','brandColor'} }">
                                        <span class="icon is-small" aria-hidden="true"><i class="fas fa-check"></i></span>
                                        <span th:text="#{${'store.copy.scope.yes.' + item}}"></span>
                                    </li>
                                </ul>
                            </div>
                            <div>
                                <p class="cl-scope-title" id="store-copy-scope-no" th:text="#{store.copy.scope.no}"></p>
                                <ul class="cl-scope-list is-no" aria-labelledby="store-copy-scope-no">
                                    <li th:each="item : ${ {'company','addresses','warehouse','payments','marketplaces','reporting','ownSuppliers','users'} }">
                                        <span class="icon is-small" aria-hidden="true"><i class="fas fa-minus"></i></span>
                                        <span th:text="#{${'store.copy.scope.no.' + item}}"></span>
                                    </li>
                                </ul>
                            </div>
                        </div>
                    </fieldset>
                    <div class="cl-card-footer">
                        <button class="cl-button is-primary" type="submit" th:text="#{store.copy.submit}"
                                th:attr="data-cl-busy-label=#{store.copy.busy}"></button>
                        <a class="cl-button" th:href="@{${backHref}}" th:text="#{general.cancel}"></a>
                        <p class="cl-help" role="status" data-cl-busy-note hidden th:text="#{store.copy.busy.note}"></p>
                    </div>
                </div>
            </form>
        </div>
    </section>
    <script th:if="${!errors.isEmpty() or formError != null}">
        document.getElementById('store-copy-errors').focus();
    </script>
    <script th:src="@{/js/submit-once.js}" defer></script>
</div>
</body>
</html>
