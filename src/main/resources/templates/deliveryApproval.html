<!DOCTYPE HTML>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}">
<body>

<div layout:fragment="content">

    <section class="section">
        <div class="container">
            <h1 class="title" th:text="#{deliveries.approval.screen.title}">Request realisation</h1>
            <h2 class="subtitle" th:text="${delivery.provider} + ' — ' + ${delivery.shortenedDeliveryId}">Supplier</h2>

            <div id="approval-validation-area" class="mb-6"
                 th:attr="data-validate-url=@{/dashboard/store/{storeId}/deliveries/{deliveryId}/approval/validate(storeId=${delivery.storeId},deliveryId=${delivery.deliveryId})}">
                <p class="mb-2" th:text="#{deliveries.purchase.confirm.checking}">Checking availability at the supplier...</p>
                <progress class="progress is-small is-primary" max="100"></progress>
            </div>

            <input type="hidden" id="approval-address-blocked" th:if="${approvalAddressError}"/>

            <div class="notification is-danger" th:if="${approvalAddressError}">
                <span th:text="#{deliveries.purchase.confirm.addressUnavailable}"></span>
                <span th:text="' (' + ${approvalAddressError} + ')'"></span>
            </div>

            <div class="notification is-info is-light"
                 th:if="${approvalAddressError == null and approvalAddresses != null and #lists.isEmpty(approvalAddresses)}"
                 th:text="#{deliveries.purchase.confirm.addressFromSupplier}"></div>

            <div class="notification is-info is-light" th:if="${delivery.dropship}">
                <strong th:text="#{deliveries.dropship.badge}">Dropshipping</strong> &mdash;
                <span th:text="#{orders.dropship.confirm.consignee}">Ships directly to the customer</span>
                <span th:if="${consignee == null}" th:text="': ' + ${delivery.deliveryAddress}"></span>
            </div>

            <div th:if="${delivery.dropship and consignee != null}">
                <div th:replace="~{fragments/consignee-address :: consigneeAddress(${consignee}, ${pickupShipment})}"></div>
            </div>

            <div class="notification is-info is-light" th:if="${!delivery.dropship and suggestedAddress != null}">
                <strong th:text="#{deliveries.approval.suggestedAddress}">Store default shipping address</strong>:
                <span th:text="${suggestedAddress.streetAndNumber} + ', ' + ${suggestedAddress.postalCode} + ' ' + ${suggestedAddress.city}"></span>
            </div>

            <div class="notification is-light" th:if="${!delivery.dropship and suggestedAddress == null}"
                 th:text="#{deliveries.approval.suggestedAddress.none}"></div>

            <div class="notification is-warning is-light" th:if="${delivery.hasDirectToConsumerAllocations()}"
                 th:text="#{deliveries.directToConsumer.viaWarehouse.notice}"></div>

            <form id="approval-approve-form" method="post"
                  th:action="@{/dashboard/store/{storeId}/deliveries/{deliveryId}/approve(storeId=${delivery.storeId},deliveryId=${delivery.deliveryId})}"
                  onsubmit="document.getElementById('approval-approve-button').disabled = true;">

                <th:block th:if="${approvalAddresses != null and !#lists.isEmpty(approvalAddresses)}">
                    <div th:replace="~{fragments/address-modal :: addressModal('deliveryAddressId', ${approvalAddressOptions}, ${suggestedAddressId}, ${#lists.size(approvalAddresses) > 6}, true)}"></div>
                </th:block>

                <input type="hidden" id="order-options-blocked" th:if="${orderOptionsError}"/>
                <div class="notification is-danger" th:if="${orderOptionsError}">
                    <span th:text="#{deliveries.options.error}"></span>
                    <span th:text="' (' + ${orderOptionsError} + ')'"></span>
                </div>
                <div th:replace="~{fragments/order-options :: orderOptions(${orderOptions}, ${selectedOptions})}"></div>
                <th:block th:replace="~{fragments/order-options :: orderOptionsScript}"></th:block>

                <div class="buttons mt-5">
                    <button type="submit" id="approval-approve-button" class="button is-primary" disabled
                            th:text="#{deliveries.approval.realize}">Order at supplier</button>
                    <a class="button"
                       th:href="@{/dashboard/store/{storeId}/deliveries/details(storeId=${delivery.storeId},deliveryId=${delivery.deliveryId})}"
                       th:text="#{deliveries.approval.back}">Back to delivery</a>
                </div>
            </form>

            <th:block th:replace="~{fragments/address-modal :: addressModalStyle}"></th:block>
            <th:block th:replace="~{fragments/address-modal :: addressModalScript}"></th:block>

            <script th:inline="none">
                let approvalValidationPassed = false;

                function selectedAddressId() {
                    const checked = document.querySelector('#address-options input[type="radio"]:checked');
                    return checked ? checked.value : '';
                }

                function addressRequired() {
                    return document.getElementById('address-options') !== null;
                }

                function refreshApprovalSubmitState() {
                    const approve = document.getElementById('approval-approve-button');
                    if (!approve) {
                        return;
                    }
                    const addressBlocked = document.getElementById('approval-address-blocked') !== null;
                    const optionsBlocked = document.getElementById('order-options-blocked') !== null;
                    approve.disabled = addressBlocked || optionsBlocked || !orderOptionsComplete() || !approvalValidationPassed;

                    const confirm = document.getElementById('address-confirm');
                    if (confirm) {
                        confirm.disabled = selectedAddressId() === '';
                    }
                }

                function loadValidation() {
                    const area = document.getElementById('approval-validation-area');
                    if (!area) {
                        return;
                    }
                    approvalValidationPassed = false;
                    refreshApprovalSubmitState();
                    fetch(area.dataset.validateUrl, {method: 'POST'})
                        .then(function (response) {
                            if (!response.ok) {
                                throw new Error('HTTP ' + response.status);
                            }
                            return response.text();
                        })
                        .then(function (html) {
                            area.innerHTML = html;
                            const result = area.querySelector('[data-fully-available]');
                            approvalValidationPassed = !!(result && result.dataset.fullyAvailable === 'true');
                            refreshApprovalSubmitState();
                        })
                        .catch(function () {
                            approvalValidationPassed = false;
                            refreshApprovalSubmitState();
                        });
                }

                function openAddressModal() {
                    const modal = document.getElementById('address-modal');
                    if (modal) {
                        modal.classList.add('is-active');
                        scrollAddressOptionsToSelection();
                    }
                }

                function closeAddressModal() {
                    const modal = document.getElementById('address-modal');
                    if (modal) {
                        modal.classList.remove('is-active');
                    }
                }

                document.addEventListener('DOMContentLoaded', function () {
                    const approve = document.getElementById('approval-approve-button');
                    if (!approve) {
                        return;
                    }

                    document.querySelectorAll('#address-options input[type="radio"]').forEach(function (radio) {
                        radio.addEventListener('change', refreshApprovalSubmitState);
                    });

                    document.querySelectorAll('[data-address-cancel]').forEach(function (element) {
                        element.addEventListener('click', closeAddressModal);
                    });

                    const filter = document.getElementById('address-filter');
                    if (filter) {
                        filter.addEventListener('input', function () {
                            const needle = filter.value.toLowerCase();
                            document.querySelectorAll('.address-option').forEach(function (option) {
                                const matches = option.textContent.toLowerCase().indexOf(needle) !== -1;
                                option.classList.toggle('is-hidden', !matches);
                            });
                        });
                    }

                    if (addressRequired()) {
                        approve.addEventListener('click', function (event) {
                            if (!document.getElementById('address-modal').classList.contains('is-active')) {
                                event.preventDefault();
                                openAddressModal();
                            }
                        });
                    }

                    refreshApprovalSubmitState();
                    loadValidation();
                });
            </script>

        </div>
    </section>
</div>

</body>
</html>
