<!DOCTYPE HTML>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}">
<body>
<div layout:fragment="content">
    <section class="cl-page">
        <div class="cl-page-body">
            <div th:replace="~{fragments/settings-header :: header(false, null)}"></div>
            <div th:replace="~{fragments/settings-form :: savedAlert}"></div>

            <div class="cl-stack">
                <section class="cl-card" aria-labelledby="marketplaces-title">
                    <div class="cl-card-head">
                        <h2 class="cl-card-title" id="marketplaces-title" th:text="#{store.marketplaces.list.title}"></h2>
                        <a th:if="${newMarketplaceHref != null}" class="cl-button" th:href="@{${newMarketplaceHref}}">
                            <i class="fas fa-plus" aria-hidden="true"></i>
                            <span th:text="#{store.marketplaces.add}"></span>
                        </a>
                    </div>
                    <p class="cl-card-desc" th:text="#{store.marketplaces.list.description}"></p>

                    <th:block th:if="${marketplaces.isEmpty()}">
                        <p th:if="${marketplacesInstalled}" class="cl-list-empty" th:text="#{store.marketplaces.list.empty}"></p>
                        <div th:unless="${marketplacesInstalled}" class="cl-alert is-warn">
                            <i class="fas fa-exclamation-triangle cl-alert-icon" aria-hidden="true"></i>
                            <p class="cl-alert-text" th:text="#{store.marketplaces.list.noneInstalled}"></p>
                        </div>
                    </th:block>

                    <ul th:unless="${marketplaces.isEmpty()}" class="cl-list" aria-labelledby="marketplaces-title">
                        <li class="cl-list-item" th:each="marketplace : ${marketplaces}" th:attr="data-marketplace=${marketplace.name()}">
                            <div>
                                <div class="cl-list-title">
                                    <span th:text="${marketplace.displayName()}"></span>
                                    <span th:if="${marketplace.state().name() == 'NOT_AUTHORIZED'}" class="cl-status is-warn"
                                          th:text="#{store.marketplaces.state.notAuthorized}"></span>
                                    <span th:if="${marketplace.state().name() == 'EXPIRED'}" class="cl-status is-warn"
                                          th:text="#{store.marketplaces.state.expired}"></span>
                                    <span th:if="${marketplace.state().name() == 'MISSING'}" class="cl-status is-warn"
                                          th:text="#{store.marketplaces.state.missing}"></span>
                                    <a th:if="${marketplace.needsAuthorization()}" class="cl-link-button cl-list-title-action"
                                       th:href="@{${marketplace.authorizeHref()}}" th:text="#{store.marketplaces.authorize}"
                                       th:attr="aria-label=#{store.marketplaces.authorize.for(${marketplace.displayName()})}"></a>
                                </div>
                                <th:block th:if="${marketplace.installed()}">
                                    <p th:if="${marketplace.state().name() == 'NOT_AUTHORIZED'}" class="cl-list-desc is-warn"
                                       th:text="#{store.marketplaces.state.notAuthorized.text}"></p>
                                    <p th:if="${marketplace.state().name() == 'EXPIRED'}" class="cl-list-desc is-warn"
                                       th:text="${marketplace.authorizeHref() != null} ? #{store.marketplaces.state.expired.authorize}
                                                                                      : #{store.marketplaces.state.expired.keys}"></p>
                                    <p class="cl-list-desc" th:text="${marketplace.orders()}"></p>
                                    <p th:if="${marketplace.returns() != null}" class="cl-list-desc" th:text="${marketplace.returns()}"></p>
                                    <p th:unless="${marketplace.catalogs().isEmpty()}" class="cl-list-desc">
                                        <span th:text="#{store.marketplaces.list.catalogs(${#strings.listJoin(marketplace.catalogs(), ', ')})}"></span>
                                        · <a th:href="@{${marketplace.exportsHref()}}" th:text="#{store.marketplaces.list.exports}"
                                             th:attr="aria-label=#{store.marketplaces.list.exports.for(${marketplace.displayName()})}"></a>
                                    </p>
                                </th:block>
                                <p th:unless="${marketplace.installed()}" class="cl-list-desc is-warn" th:text="#{store.marketplaces.state.missing.text}"></p>
                            </div>
                            <div class="cl-list-actions">
                                <a th:if="${marketplace.installed()}" class="cl-link-button" th:href="@{${marketplace.editHref()}}"
                                   th:text="${marketplace.state().name() == 'EXPIRED' and marketplace.authorizeHref() == null}
                                            ? #{store.marketplaces.complete} : #{store.marketplaces.edit}"
                                   th:attr="aria-label=#{store.marketplaces.edit.for(${marketplace.displayName()})}"></a>
                                <a class="cl-link-button is-danger" th:href="@{${marketplace.disconnectHref()}}" data-cl-confirm
                                   th:text="#{store.marketplaces.disconnect}"
                                   th:attr="aria-label=#{store.marketplace.disconnect.title(${marketplace.displayName()})},
                                            data-cl-confirm-title=#{store.marketplace.disconnect.title(${marketplace.displayName()})},
                                            data-cl-confirm-message=${disconnectMessages[marketplace.name()]},
                                            data-cl-confirm-action=#{store.marketplace.disconnect.action}"></a>
                            </div>
                        </li>
                    </ul>
                </section>
            </div>

            <dialog th:replace="~{fragments/confirm-dialog :: dialog}"></dialog>
        </div>
    </section>
    <script th:src="@{/js/confirm-dialog.js}" defer></script>
</div>
</body>
</html>
