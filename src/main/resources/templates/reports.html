<!DOCTYPE HTML>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}">
<body>
<div layout:fragment="content">
    <section class="cl-page" th:fragment="body">
        <div class="cl-page-body is-wide">
            <header th:replace="~{reports/parts :: header(${page})}"></header>
            <div th:replace="~{fragments/screen-intro :: panel('reports', 'fas fa-chart-bar')}"></div>
            <div th:replace="~{reports/parts :: toolbar(${page})}"></div>
            <div class="cl-chart-grid2">
                <section th:replace="~{reports/parts :: channels(${page.channels()})}"></section>
                <section th:replace="~{reports/parts :: daily(${page.charts()}, ${page.channels().empty()})}"></section>
                <section th:replace="~{reports/parts :: suppliers(${page.suppliers()})}"></section>
            </div>
        </div>
    </section>
    <script th:src="@{/js/menu.js}" defer></script>
    <script th:src="@{/js/report-charts.js}" defer></script>
</div>
</body>
</html>
