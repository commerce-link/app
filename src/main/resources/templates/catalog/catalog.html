<!DOCTYPE HTML>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}">
<body>
<div layout:fragment="content">
    <section class="cl-page">
        <div class="cl-page-body">
            <!--/* The actions are defined inside the replaced element: the header pulls them in as its actions slot,
                   and the body of a th:replace host is dropped, so they are never rendered twice. */-->
            <div th:replace="~{fragments/settings-header :: subpageWithActions('/dashboard/catalogs', #{catalog.title}, ${catalog.name},
                    #{catalog.lead(${categories.size()}, ${productsTotal}, ${scheduleText})}, ~{::catalogActions})}">
                <th:block th:fragment="catalogActions">
                    <a class="cl-button" th:href="@{${settingsHref}}">
                        <span class="icon is-small" aria-hidden="true"><i class="fas fa-cog"></i></span>
                        <span th:text="#{catalog.settings.title}"></span>
                    </a>
                    <a class="cl-button is-primary" th:href="@{${addCategoryHref}}">
                        <span class="icon is-small" aria-hidden="true"><i class="fas fa-plus"></i></span>
                        <span th:text="#{catalog.category.add}"></span>
                    </a>
                </th:block>
            </div>

            <div th:replace="~{fragments/settings-form :: savedAlert}"></div>
            <!--/* Outcome of a refused catalog action, in the page body; the layout banner is Bulma markup. */-->
            <div th:if="${catalogError}" class="cl-alert is-bad" role="status">
                <i class="fas fa-exclamation-circle cl-alert-icon" aria-hidden="true"></i>
                <p class="cl-alert-text" th:text="${catalogError}"></p>
            </div>

            <section class="cl-card" aria-labelledby="categories-title">
                <div class="cl-card-head">
                    <h2 class="cl-card-title" id="categories-title" th:text="#{catalog.categories.title}"></h2>
                </div>
                <p class="cl-card-desc" th:text="#{catalog.categories.desc}"></p>
                <ul class="cl-list" th:if="${!categories.isEmpty()}">
                    <li class="cl-list-item" th:each="category : ${categories}">
                        <div>
                            <div class="cl-list-title">
                                <a th:href="@{${category.href()}}" th:text="${category.name()}"></a>
                                <span th:if="${category.dynamic()}" class="cl-status is-info" th:text="#{catalog.category.type.Dynamic}"></span>
                                <span th:unless="${category.hasPimMapping()}" class="cl-status is-warn" th:text="#{catalog.category.noPim}"></span>
                                <span th:if="${category.productsOutsideLabels() > 0}" class="cl-status is-warn"
                                      th:text="#{catalog.category.labelsOutside(${category.productsOutsideLabels()})}"></span>
                            </div>
                            <p class="cl-list-desc">
                                <span th:text="${category.hasPimMapping()} ? #{catalog.category.row.pim(${#strings.listJoin(category.pimCategoryNames(), ', ')})} : #{catalog.category.row.pim.none}"></span>
                                <span> · </span>
                                <span th:text="${category.dynamic()} ? #{catalog.category.row.products.dynamic} : #{catalog.category.row.products(${category.productsCount()})}"></span>
                                <th:block th:if="${category.labelsCount() > 0}"><span> · </span><span th:text="#{catalog.category.row.labels(${category.labelsCount()})}"></span></th:block>
                                <span> · </span>
                                <span th:text="${category.marketplaceNames().isEmpty()} ? #{catalog.category.row.marketplaces.none} : #{catalog.category.row.marketplaces(${#strings.listJoin(category.marketplaceNames(), ', ')})}"></span>
                                <span> · </span>
                                <span th:text="#{catalog.category.row.maxQty(${category.maxQty()})}"></span>
                                <th:block th:if="${category.required()}"><span> · </span><span th:text="#{catalog.category.row.required}"></span></th:block>
                            </p>
                        </div>
                        <div class="cl-list-actions">
                            <a class="cl-link-button" th:href="@{${category.settingsHref()}}" th:text="#{catalog.settings}"
                               th:attr="aria-label=#{catalog.settings.for(${category.name()})}"></a>
                            <!--/* The dialog says what the confirmation page behind the link says: an automatic category
                                   deletes no products, and a manual one keeps them when another category shares its PIM
                                   categories. */-->
                            <a th:if="${category.deletable()}" class="cl-link-button is-danger" th:href="@{${category.deleteHref()}}" data-cl-confirm
                               th:text="#{settings.list.delete}"
                               th:attr="aria-label=#{settings.list.delete.for(${category.name()})},
                                        data-cl-confirm-title=#{catalog.category.delete.title(${category.name()})},
                                        data-cl-confirm-message=${category.dynamic()} ? #{catalog.category.delete.message.dynamic} : (${category.productsKept()} ? #{catalog.category.delete.message.kept} : #{catalog.category.delete.message(${category.productsToDelete()})}),
                                        data-cl-confirm-action=#{catalog.category.delete}"></a>
                        </div>
                    </li>
                </ul>
                <p class="cl-list-empty" th:if="${categories.isEmpty()}">
                    <span th:text="#{catalog.categories.empty}"></span>
                    <a class="cl-button is-primary" th:href="@{${addCategoryHref}}" th:text="#{catalog.category.add}"></a>
                </p>
            </section>
            <dialog th:replace="~{fragments/confirm-dialog :: dialog}"></dialog>
        </div>
    </section>
    <script th:src="@{/js/confirm-dialog.js}" defer></script>
</div>
</body>
</html>
