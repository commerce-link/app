<!DOCTYPE HTML>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}">
<body>
<div layout:fragment="content">
    <section class="cl-page">
        <div class="cl-page-body">
            <div th:replace="~{fragments/settings-header :: subpageWithActions(${backHref}, ${category.name}, #{catalog.category.settings.title}, null, null)}"></div>

            <div th:replace="~{fragments/settings-form :: savedAlert}"></div>
            <div th:replace="~{fragments/settings-form :: warnAlert}"></div>

            <ul class="cl-tile-grid">
                <li>
                    <a class="cl-tile" th:href="@{${basicsHref}}">
                        <span class="cl-tile-icon" aria-hidden="true"><i class="fas fa-tag"></i></span>
                        <span class="cl-tile-title" th:text="#{catalog.category.basics.title}"></span>
                        <span class="cl-tile-desc" th:text="#{catalog.category.basics.tile}"></span>
                    </a>
                </li>
                <li>
                    <a class="cl-tile" th:href="@{${pricingHref}}">
                        <span class="cl-tile-icon" aria-hidden="true"><i class="fas fa-calculator"></i></span>
                        <span class="cl-tile-title" th:text="#{catalog.category.pricing.title}"></span>
                        <span class="cl-tile-desc" th:text="#{catalog.category.pricing.tile}"></span>
                    </a>
                </li>
                <li>
                    <a class="cl-tile" th:href="@{${marketplacesHref}}">
                        <span class="cl-tile-icon" aria-hidden="true"><i class="fas fa-shopping-cart"></i></span>
                        <span class="cl-tile-title" th:text="#{catalog.category.marketplaces.title}"></span>
                        <span class="cl-tile-desc" th:text="#{catalog.category.marketplaces.tile}"></span>
                    </a>
                </li>
                <li>
                    <a class="cl-tile" th:href="@{${filtersHref}}">
                        <span class="cl-tile-icon" aria-hidden="true"><i class="fas fa-filter"></i></span>
                        <span class="cl-tile-title" th:text="#{catalog.category.filters.title}"></span>
                        <span class="cl-tile-desc" th:text="#{catalog.category.filters.tile}"></span>
                    </a>
                </li>
            </ul>
        </div>
    </section>
</div>
</body>
</html>
