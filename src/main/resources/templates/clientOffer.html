<!DOCTYPE HTML>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{public-layout}" th:with="publicWidth='is-form'">
<head>
    <title th:text="#{client.offer.pageTitle}">Oferta</title>
    <script th:src="@{/js/variant-fields.js}" defer></script>
    <script th:src="@{/js/submit-once.js}" defer></script>
    <script th:src="@{/js/error-summary.js}" defer></script>
    <script th:src="@{/js/copy-field.js}" defer></script>
    <script th:src="@{/js/client-offer.js}" defer></script>
</head>
<body>
<th:block layout:fragment="content">
    <div class="cl-offer-page">
        <header class="cl-page-header">
            <p class="cl-eyebrow" th:text="${page.validUntil == null} ? #{client.offer.eyebrow.short(${page.shortId})}
                    : (${page.expired} ? #{client.offer.eyebrow.expired(${page.shortId}, ${page.validUntil})}
                                       : #{client.offer.eyebrow(${page.shortId}, ${page.validUntil})})"></p>
            <h1 class="cl-page-title" th:text="#{client.offer.title}"></h1>
            <p class="cl-page-lead" th:if="${!page.expired or page.canEdit}">
                <th:block th:unless="${page.expired}" th:text="#{client.offer.lead}"></th:block>
                <th:block th:if="${page.canEdit}">
                    <th:block th:unless="${page.expired}"> · </th:block>
                    <a class="cl-edit-link" th:href="@{/dashboard/offer/{id}(id=${page.offerId})}" th:text="#{client.offer.editInPanel}"></a>
                </th:block>
            </p>
        </header>

        <section th:if="${page.expired}" class="cl-card">
            <div class="cl-card-inset"><div class="cl-alert is-warn">
                <span class="cl-alert-icon" aria-hidden="true"><i class="far fa-clock"></i></span>
                <div>
                    <p class="cl-alert-title" th:text="#{client.offer.expired.title}"></p>
                    <p class="cl-alert-text">
                        <th:block th:text="#{client.offer.expired.text(${page.validUntil})}"></th:block>
                        <th:block th:if="${publicPage.contactEmail != null}">
                            <th:block th:text="#{client.offer.expired.write}"></th:block>
                            <a th:href="'mailto:' + ${publicPage.contactEmail}" th:text="${publicPage.contactEmail}"></a><th:block
                                th:if="${publicPage.contactPhone != null}"> <th:block th:text="#{client.offer.expired.orCall}"></th:block>
                                <a th:href="'tel:' + ${#strings.replace(publicPage.contactPhone, ' ', '')}"
                                   th:text="${publicPage.contactPhone}"></a></th:block>.
                        </th:block>
                        <th:block th:if="${publicPage.contactEmail == null and publicPage.contactPhone != null}">
                            <th:block th:text="#{client.offer.expired.call}"></th:block>
                            <a th:href="'tel:' + ${#strings.replace(publicPage.contactPhone, ' ', '')}"
                               th:text="${publicPage.contactPhone}"></a>.
                        </th:block>
                    </p>
                </div>
            </div></div>
        </section>

        <!--/* client-offer.js reads the new total here after a variant update in the background */-->
        <p th:unless="${page.expired}" id="client-offer-live" class="cl-visually-hidden" role="status" aria-live="polite"></p>
        <div th:unless="${page.expired}" class="cl-stack">
            <section th:replace="~{client-offer/items :: items}"></section>
            <section th:replace="~{client-offer/data :: data}"></section>
            <section th:replace="~{client-offer/payment :: payment}"></section>
        </div>
    </div>
</th:block>
</body>
</html>
