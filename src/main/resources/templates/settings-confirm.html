<!DOCTYPE HTML>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}">
<body>
<div layout:fragment="content">
    <section class="cl-page">
        <div class="cl-page-body">
            <header class="cl-page-header">
                <a class="cl-back" th:href="@{${confirm.cancelPath()}}">
                    <span class="icon is-small" aria-hidden="true"><i class="fas fa-chevron-left"></i></span>
                    <span th:text="${backLabel}"></span>
                </a>
                <div class="cl-page-header-row">
                    <h1 class="cl-page-title" th:text="${confirm.title()}"></h1>
                </div>
            </header>
            <form class="cl-form" method="post" th:action="@{${confirm.actionPath()}}">
                <div class="cl-card">
                    <p class="cl-card-body" th:text="${confirm.message()}"></p>
                    <div class="cl-card-footer">
                        <button type="submit" class="cl-button is-danger" th:text="${confirm.confirmLabel()}"></button>
                        <a class="cl-button" th:href="@{${confirm.cancelPath()}}" th:text="#{general.cancel}"></a>
                    </div>
                </div>
            </form>
        </div>
    </section>
</div>
</body>
</html>
