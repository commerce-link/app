<!DOCTYPE HTML>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}">
<body>
<div layout:fragment="content">
<section class="cl-page" th:fragment="body" th:with="p=${page}, f=${page.form()}">
    <div class="cl-page-body is-wide">

        <div th:replace="~{fragments/settings-header :: record(${p.backHref()}, ${p.backLabel()}, ${p.name()}, null, ~{::itemStatus}, ~{::itemMeta}, ${p.delete() != null} ? ~{::itemActions} : null)}">
            <th:block th:fragment="itemStatus"><span class="cl-status" th:classappend="${p.statusTone()}" th:text="${p.statusLabel()}"></span></th:block>
            <th:block th:fragment="itemMeta">
                <p class="cl-record-meta">
                    <span th:if="${p.ean() != null}" th:text="#{warehouse.item.meta.ean(${p.ean()})}"></span>
                    <span th:if="${p.mfn() != null}" th:text="#{warehouse.item.meta.mfn(${p.mfn()})}"></span>
                    <span><span th:text="#{warehouse.item.meta.id}"></span>&nbsp;<button type="button" class="cl-copy-inline"
                            th:attr="data-cl-copy=${p.itemId()}, aria-label=#{warehouse.item.meta.copy}"><span class="cl-copy-code"><span th:text="${p.shortId()}"></span><span class="cl-copy-icon" aria-hidden="true">&#8288;<i class="far fa-copy"></i></span></span></button></span>
                </p>
            </th:block>
            <th:block th:fragment="itemActions">
                <a class="cl-button is-danger-outline" th:href="@{${p.delete().href()}}" data-cl-confirm
                   th:attr="data-cl-confirm-title=${p.delete().title()}, data-cl-confirm-message=${p.delete().message()}, data-cl-confirm-action=${p.delete().action()}">
                    <span class="icon is-small" aria-hidden="true"><i class="fas fa-trash-alt"></i></span><span th:text="${p.delete().action()}"></span>
                </a>
            </th:block>
        </div>

        <th:block th:replace="~{fragments/settings-form :: savedAlert}"></th:block>
        <div th:if="${p.errorMessage() != null}" class="cl-alert is-bad" role="status" tabindex="-1" data-cl-error-summary>
            <i class="fas fa-exclamation-circle cl-alert-icon" aria-hidden="true"></i>
            <p class="cl-alert-text" th:text="${p.errorMessage()}"></p>
        </div>

        <div class="cl-layout-aside">
            <div class="cl-layout-main">
              <div class="cl-stack is-wide">
                <section th:if="${p.mode().name() == 'DESTROYED'}" class="cl-card is-status" aria-labelledby="item-state-title">
                    <div class="cl-card-head"><h2 class="cl-card-title" id="item-state-title"><i class="fas fa-archive" aria-hidden="true"></i><span th:text="${p.destroyedTitle()}"></span></h2></div>
                    <p class="cl-card-desc" th:text="#{warehouse.item.destroyed.text}"></p>
                    <div class="cl-status-actions" th:if="${p.origin().documentsHref() != null}">
                        <a class="cl-button" th:href="@{${p.origin().documentsHref()}}"><span class="icon is-small" aria-hidden="true"><i class="fas fa-file-alt"></i></span><span th:text="#{warehouse.item.documents}"></span></a>
                    </div>
                </section>

                <section th:if="${p.mode().name() == 'DESTROYED'}" class="cl-card" aria-labelledby="item-data-title">
                    <div class="cl-card-head"><h2 class="cl-card-title" id="item-data-title" th:text="#{warehouse.item.card.data}"></h2></div>
                    <dl class="cl-kv">
                        <div><dt th:text="#{warehouse.item.new.category}"></dt><dd th:text="${f.category}"></dd></div>
                        <div><dt th:text="#{warehouse.item.field.condition}"></dt><dd><span class="cl-status" th:classappend="${p.readonlyCondition().tone()}" th:text="${p.readonlyCondition().label()}"></span></dd></div>
                        <div><dt th:text="#{warehouse.item.field.serialNo}"></dt><dd th:text="${f.serialNo != null and !#strings.isEmpty(f.serialNo)} ? ${f.serialNo} : '—'"></dd></div>
                    </dl>
                </section>

                <form class="cl-form is-wide" id="warehouseItemForm" method="post" novalidate data-cl-submit-once
                      th:action="@{/dashboard/warehouse/items/{id}(id=${p.itemId()})}">
                    <input type="hidden" name="back" th:if="${f.back != null}" th:value="${f.back}">
                    <input type="hidden" name="version" th:if="${f.version != null}" th:value="${f.version}">
                    <div th:replace="~{fragments/settings-form :: errorSummary('warehouse-item-errors', ${p.errors()}, null)}"></div>
                    <section class="cl-card" aria-labelledby="item-form-title">
                        <div class="cl-card-head"><h2 class="cl-card-title" id="item-form-title"
                             th:text="${p.mode().name() == 'DESTROYED'} ? #{warehouse.item.card.comment} : #{warehouse.item.card.data}"></h2></div>

                        <th:block th:unless="${p.mode().name() == 'DESTROYED'}">
                        <fieldset class="cl-fieldset">
                            <legend class="cl-fieldset-title" th:text="#{warehouse.item.group.product}"></legend>
                            <div class="cl-form-grid">
                                <div class="cl-span-6" th:insert="~{fragments/settings-form :: textFieldWith('name', 'warehouse.item.new.name', ${f.name}, 'text', 'off', true, ${p.errors()['name']}, null, null, null, false)}"></div>
                                <div class="cl-span-3 cl-field">
                                    <label class="cl-label" for="category" th:text="#{warehouse.item.new.category}"></label>
                                    <select class="cl-select" id="category" name="category">
                                        <option th:if="${p.categoryOutsideCatalog()}" th:value="${f.category}" th:text="${f.category}" selected></option>
                                        <optgroup th:each="g : ${p.categoryGroups()}" th:label="${g.catalog()}">
                                            <option th:each="c : ${g.names()}" th:value="${c}" th:text="${c}" th:selected="${c == f.category}"></option>
                                        </optgroup>
                                    </select>
                                </div>
                                <div class="cl-span-3 cl-field">
                                    <label class="cl-label" for="condition" th:text="#{warehouse.item.field.condition}"></label>
                                    <select class="cl-select" id="condition" name="condition" aria-describedby="condition-help">
                                        <option th:each="c : ${p.conditions()}" th:value="${c.value()}" th:text="${c.label()}" th:selected="${c.value() == f.condition}"></option>
                                    </select>
                                    <p class="cl-help" id="condition-help" th:text="#{warehouse.item.field.condition.help}"></p>
                                </div>
                            </div>
                        </fieldset>

                        <fieldset class="cl-fieldset" th:if="${p.mode().name() == 'NEW'}">
                            <legend class="cl-fieldset-title" th:text="#{warehouse.item.group.qty}"></legend>
                            <div class="cl-form-grid">
                                <div class="cl-span-2" th:insert="~{fragments/settings-form :: textFieldWith('qty', 'warehouse.item.fact.qty.label', ${f.qty}, 'text', 'off', true, ${p.errors()['qty']}, null, 'numeric', null, false)}"></div>
                                <div class="cl-span-2" th:insert="~{fragments/settings-form :: textFieldWith('cost', 'warehouse.item.field.cost', ${f.cost}, 'text', 'off', true, ${p.errors()['cost']}, null, 'decimal', null, false)}"></div>
                                <div class="cl-span-2" th:insert="~{fragments/settings-form :: textFieldWith('tax', 'warehouse.item.field.tax', ${f.tax}, 'text', 'off', true, ${p.errors()['tax']}, null, 'numeric', null, false)}"></div>
                                <div class="cl-span-3" th:insert="~{fragments/settings-form :: textFieldWith('ean', 'warehouse.item.new.ean', ${f.ean}, 'text', 'off', true, ${p.errors()['ean']}, null, 'numeric', null, false)}"></div>
                                <div class="cl-span-3" th:insert="~{fragments/settings-form :: textFieldWith('manufacturerCode', 'warehouse.item.new.mfn', ${f.manufacturerCode}, 'text', 'off', true, ${p.errors()['manufacturerCode']}, null, null, null, false)}"></div>
                                <div class="cl-span-6" th:insert="~{fragments/settings-form :: textFieldWith('deliveryId', 'warehouse.item.field.deliveryId', ${f.deliveryId}, 'text', 'off', false, null, #{warehouse.item.field.deliveryId.help}, null, null, false)}"></div>
                            </div>
                            <fieldset class="cl-choice-group" id="status">
                                <legend class="cl-label" th:text="#{warehouse.item.new.status}"></legend>
                                <label class="cl-choice" th:each="s : ${p.statuses()}">
                                    <input type="radio" name="status" th:value="${s.value()}" th:checked="${f.status == s.value()}">
                                    <span class="cl-choice-text"><span class="cl-choice-title" th:text="${s.label()}"></span><span class="cl-choice-description" th:text="${s.description()}"></span></span>
                                </label>
                                <p th:if="${p.errors()['status'] != null}" class="cl-field-error"><i class="fas fa-exclamation-circle" aria-hidden="true"></i><span th:text="#{${p.errors()['status']}}"></span></p>
                            </fieldset>
                        </fieldset>

                        </th:block>

                        <!--/* "Ewidencja"; a destroyed item keeps only the comment here, named by the card title, in the same padded group */-->
                        <fieldset class="cl-fieldset" th:with="destroyed=${p.mode().name() == 'DESTROYED'}">
                            <legend th:unless="${destroyed}" class="cl-fieldset-title" th:text="#{warehouse.item.group.record}"></legend>
                            <div class="cl-form-grid">
                                <div th:unless="${destroyed}" class="cl-span-6" th:insert="~{fragments/settings-form :: textFieldWith('serialNo', 'warehouse.item.field.serialNo', ${f.serialNo}, 'text', 'off', false, null, #{warehouse.item.field.serialNo.help}, null, null, false)}"></div>
                                <div th:unless="${destroyed}" class="cl-span-3" th:insert="~{fragments/settings-form :: textFieldWith('unitSystemCost', 'warehouse.item.field.systemCost', ${f.unitSystemCost}, 'text', 'off', false, ${p.errors()['unitSystemCost']}, #{warehouse.item.system.cost.help}, 'decimal', null, false)}"></div>
                                <div class="cl-span-6 cl-field">
                                    <label class="cl-label" for="comment" th:classappend="${destroyed} ? 'cl-visually-hidden' : ''">
                                        <span th:text="#{warehouse.item.field.comment}"></span>
                                        <span th:unless="${destroyed}" class="cl-optional" th:text="#{form.optional}"></span>
                                    </label>
                                    <textarea class="cl-input cl-textarea" id="comment" name="comment" rows="3" th:text="${f.comment}"
                                              th:classappend="${p.errors()['comment'] != null} ? 'is-invalid'"></textarea>
                                    <p th:if="${p.errors()['comment'] != null}" class="cl-field-error"><i class="fas fa-exclamation-circle" aria-hidden="true"></i><span th:text="#{${p.errors()['comment']}}"></span></p>
                                </div>
                            </div>
                        </fieldset>

                        <div class="cl-card-footer">
                            <button class="cl-button is-primary" type="submit" th:text="#{form.save.changes}"></button>
                            <a class="cl-button" th:href="@{${p.backHref()}}" th:text="#{general.cancel}"></a>
                        </div>
                    </section>
                </form>
              </div>
            </div>

            <div class="cl-layout-side is-grid">
                <section th:if="${!p.facts().isEmpty()}" class="cl-card" aria-labelledby="item-cost-title">
                    <div class="cl-card-head"><h2 class="cl-card-title" id="item-cost-title" th:text="#{warehouse.item.card.cost}"></h2></div>
                    <dl class="cl-kv is-column">
                        <div th:each="fact : ${p.facts()}"><dt th:text="${fact.label()}"></dt><dd th:classappend="${fact.numeric()} ? 'is-numeric'" th:text="${fact.value()}"></dd></div>
                        <div class="cl-kv-total"><dt th:text="#{warehouse.item.fact.total}"></dt><dd class="is-numeric" th:text="${p.totalNet()}"></dd></div>
                    </dl>
                </section>
                <section class="cl-card" aria-labelledby="item-origin-title" th:with="o=${p.origin()}">
                    <div class="cl-card-head"><h2 class="cl-card-title" id="item-origin-title" th:text="#{warehouse.item.card.origin}"></h2></div>
                    <dl class="cl-kv is-column">
                        <div><dt th:text="#{warehouse.item.origin.delivery}"></dt>
                            <dd><a th:if="${o.deliveryHref() != null}" th:href="@{${o.deliveryHref()}}" th:text="${o.deliveryText() != null ? o.deliveryText() : o.supplier()}"></a>
                                <span th:if="${o.deliveryHref() == null and o.supplier() != null}" th:text="${o.supplier()}"></span>
                                <span th:if="${o.deliveryHref() == null and o.supplier() == null}" class="cl-muted">—</span></dd></div>
                        <div><dt th:text="#{warehouse.item.origin.documents}"></dt>
                            <dd><a th:if="${o.documentsHref() != null}" th:href="@{${o.documentsHref()}}" th:text="#{warehouse.item.documents.link}"></a>
                                <span th:unless="${o.documentsHref() != null}" class="cl-muted" th:text="#{warehouse.item.documents.none}"></span></dd></div>
                        <div th:unless="${o.serials().isEmpty()}"><dt th:text="#{warehouse.item.origin.history}"></dt>
                            <dd><th:block th:each="s, it : ${o.serials()}"><a th:href="@{${s.href()}}" th:text="${s.text()}"></a><br th:unless="${it.last}"></th:block></dd></div>
                    </dl>
                </section>
            </div>
        </div>
        <th:block th:if="${p.delete() != null}"><dialog th:replace="~{fragments/confirm-dialog :: dialog}"></dialog></th:block>
    </div>
</section>
<script th:src="@{/js/copy-field.js}" defer></script>
<script th:src="@{/js/confirm-dialog.js}" defer></script>
<script th:src="@{/js/error-summary.js}" defer></script>
<script th:src="@{/js/submit-once.js}" defer></script>
</div>
</body>
</html>
