<!DOCTYPE HTML>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{public-layout}" th:with="publicWidth='is-narrow'">
<head>
    <title th:text="#{store.inactive.page.pageTitle}">Sklep nieaktywny</title>
</head>
<body>
<th:block layout:fragment="content">
    <section th:replace="~{fragments/public-message :: card(eyebrow=null,
            title=#{store.inactive.page.title}, lead=#{store.inactive.page.lead},
            contact=#{store.inactive.page.contact}, fallback=#{store.inactive.page.noContact})}"></section>
</th:block>
</body>
</html>
