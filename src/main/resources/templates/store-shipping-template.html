<!DOCTYPE HTML>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}">
<body>
<div layout:fragment="content">
    <section class="cl-page">
        <div class="cl-page-body">
            <div th:replace="~{fragments/settings-header :: subpage(${shippingHref}, ${backLabel}, ${pageTitle})}"></div>

            <form th:fragment="templateForm" id="shipping-template-form" class="cl-form"
                  th:action="@{${formAction}}" th:object="${form}" method="post" novalidate data-cl-async
                  th:attr="data-cl-redirect=${redirectTo}, data-error-message=#{form.save.failed}">
                <div th:replace="~{fragments/settings-form :: errorSummary('shipping-template-errors', ${errors}, ${errorLabels})}"></div>

                <div class="cl-card">
                    <fieldset class="cl-fieldset">
                        <legend class="cl-fieldset-title" th:text="#{store.shipping.template.section}"></legend>
                        <div class="cl-form-grid">
                            <div th:insert="~{fragments/settings-form :: textField('name', 'store.shipping.template.name', *{name}, 'text', 'off', true, ${errors['name']}, #{store.shipping.template.name.help(${returnPrefix})})}"></div>
                            <!--/* The store's first template becomes the default anyway, so there is nothing to choose. */-->
                            <th:block th:unless="${firstTemplate}">
                                <p th:if="${alreadyDefault}" class="cl-help" th:text="#{store.shipping.template.isDefault}"></p>
                                <th:block th:unless="${alreadyDefault}">
                                    <div th:replace="~{fragments/settings-form :: check('makeDefault', 'store.shipping.template.makeDefault', *{makeDefault}, 'store.shipping.template.makeDefault.description', null, null)}"></div>
                                </th:block>
                            </th:block>
                        </div>
                    </fieldset>

                    <div class="cl-repeat" data-cl-repeat="parcels" data-cl-repeat-id="parcel" id="parcels" tabindex="-1"
                         th:with="parcelsError=${errors.get('parcels')}">
                        <!--/* th:insert runs before th:each on one element, so the loop sits on its own block. */-->
                        <th:block th:each="parcel, stat : *{parcels}">
                            <fieldset class="cl-fieldset" data-cl-repeat-item
                                      th:insert="~{store-shipping-template :: parcelFields(${stat.index}, ${stat.count}, ${parcel})}"></fieldset>
                        </th:block>
                        <template data-cl-repeat-template>
                            <fieldset class="cl-fieldset" data-cl-repeat-item
                                      th:insert="~{store-shipping-template :: parcelFields('@INDEX@', '@NUMBER@', null)}"></fieldset>
                        </template>
                        <noscript>
                            <fieldset class="cl-fieldset"
                                      th:insert="~{store-shipping-template :: parcelFields(${form.parcels.size()}, ${form.parcels.size() + 1}, null)}"></fieldset>
                        </noscript>
                        <div class="cl-repeat-add">
                            <button type="button" class="cl-button" data-cl-repeat-add hidden>
                                <i class="fas fa-plus" aria-hidden="true"></i>
                                <span th:text="#{store.shipping.template.parcel.add}"></span>
                            </button>
                            <p th:if="${parcelsError != null}" class="cl-field-error" id="parcels-error">
                                <i class="fas fa-exclamation-circle" aria-hidden="true"></i>
                                <span th:text="#{${parcelsError}}"></span>
                            </p>
                            <p class="cl-help" th:text="#{store.shipping.template.insurance.help}"></p>
                            <span class="cl-visually-hidden" role="status" data-cl-repeat-status
                                  th:attr="data-template=#{store.shipping.template.parcel.removed('@N@')}"></span>
                        </div>
                    </div>

                    <div class="cl-card-footer">
                        <button class="cl-button is-primary" type="submit" th:text="#{store.shipping.template.save}"></button>
                        <a class="cl-button" th:href="@{${shippingHref}}" th:text="#{general.cancel}"></a>
                    </div>
                </div>
            </form>
        </div>
    </section>
    <script th:if="${!errors.isEmpty()}">
        document.getElementById('shipping-template-errors').focus();
    </script>
    <script th:src="@{/js/async-form.js}" defer></script>
    <script th:src="@{/js/repeat-fields.js}" defer></script>
</div>

<!--/* One parcel: index in the posted list, its number shown to people, and its values (null for a blank one). */-->
<th:block th:fragment="parcelFields(index, number, parcel)">
    <legend class="cl-fieldset-title">
        <span th:text="#{store.shipping.template.parcel}"></span>
        <span data-cl-repeat-number th:text="${number}"></span>
    </legend>
    <div class="cl-form-grid">
        <th:block th:each="field : ${ {'width', 'depth', 'height', 'weight'} }">
            <div class="cl-span-2 cl-field"
                 th:with="id=${'parcel-' + index + '-' + field}, error=${errors.get(id)}">
                <label class="cl-label" th:for="${id}" th:text="#{'store.shipping.template.parcel.' + ${field}}"></label>
                <input class="cl-input" type="text" inputmode="numeric" autocomplete="off"
                       th:classappend="${error != null} ? 'is-invalid'"
                       th:id="${id}" th:name="${'parcels[' + index + '].' + field}"
                       th:value="${parcel != null ? parcel[field] : null}"
                       th:attr="aria-invalid=${error != null ? 'true' : null}, aria-describedby=${error != null ? id + '-error' : null}"/>
                <p th:if="${error != null}" class="cl-field-error" th:id="${id} + '-error'">
                    <i class="fas fa-exclamation-circle" aria-hidden="true"></i>
                    <span th:text="#{${error}}"></span>
                </p>
            </div>
        </th:block>
        <div class="cl-span-4 cl-field"
             th:with="id=${'parcel-' + index + '-description'}, error=${errors.get(id)}">
            <label class="cl-label" th:for="${id}" th:text="#{store.shipping.template.parcel.description}"></label>
            <input class="cl-input" type="text" autocomplete="off"
                   th:classappend="${error != null} ? 'is-invalid'"
                   th:id="${id}" th:name="${'parcels[' + index + '].description'}"
                   th:value="${parcel != null ? parcel.description : null}"
                   th:attr="aria-invalid=${error != null ? 'true' : null}, aria-describedby=${error != null ? id + '-error' : null}"/>
            <p th:if="${error != null}" class="cl-field-error" th:id="${id} + '-error'">
                <i class="fas fa-exclamation-circle" aria-hidden="true"></i>
                <span th:text="#{${error}}"></span>
            </p>
        </div>
    </div>
    <!--/* After the grid: the floated legend is cleared by the element that follows it, so it must be the grid. */-->
    <button type="button" class="cl-link-button is-danger cl-repeat-remove" data-cl-repeat-remove hidden
            th:text="#{store.shipping.template.parcel.remove}"
            th:attr="aria-label=#{store.shipping.template.parcel.remove.for(${number})},
                     data-cl-repeat-label=#{store.shipping.template.parcel.remove.for('@N@')}"></button>
</th:block>
</body>
</html>
