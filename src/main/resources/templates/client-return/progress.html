<!DOCTYPE HTML>
<html xmlns:th="http://www.thymeleaf.org">
<body>

<!--/* The five stages of a return with the current one announced as the step; the headline already says the state, so
       the card head carries no status. */-->
<section th:fragment="progress" id="return-progress" class="cl-card" aria-labelledby="return-progress-title"
         th:with="names=${ {'accepted', 'awaitingParcel', 'parcelArrived', 'reviewing', 'completed'} }">
    <div class="cl-card-head">
        <h2 class="cl-card-title" id="return-progress-title" th:text="#{client.return.progress}"></h2>
    </div>
    <div class="cl-card-inset">
        <ol class="cl-stages" th:aria-label="#{client.return.stages.label}">
            <li th:each="name, iter : ${names}"
                th:with="done=${view.stageDone(iter.index)}, current=${view.stageCurrent(iter.index)}"
                class="cl-stage" th:classappend="${done} ? 'is-done' : (${current} ? 'is-current' : '')"
                th:attr="aria-current=${current and !done ? 'step' : null}">
                <span class="cl-stage-dot" aria-hidden="true"><i th:if="${done}" class="fas fa-check"></i><th:block
                        th:unless="${done}" th:text="${iter.count}"></th:block></span>
                <span class="cl-stage-text">
                    <span th:if="${done}" class="cl-visually-hidden" th:text="#{client.return.stage.done} + ' '"></span>
                    <span class="cl-stage-name" th:text="#{${'client.return.stage.' + name}}"></span>
                    <span th:if="${name == 'accepted' and view.createdAt() != null}" class="cl-stage-when"
                          th:text="${#temporals.format(view.createdAt(), 'd MMM')}"></span>
                    <span th:if="${name == 'parcelArrived' and view.arrivedAt() != null}" class="cl-stage-when"
                          th:text="${#temporals.format(view.arrivedAt(), 'd MMM')}"></span>
                </span>
            </li>
        </ol>
    </div>
</section>

</body>
</html>
