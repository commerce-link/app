<!DOCTYPE HTML>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}">
<body>
<div layout:fragment="content">
    <section class="cl-page">
        <div class="cl-page-body">
            <div th:replace="~{fragments/settings-header :: header(false, null)}"></div>
            <div th:replace="~{fragments/settings-form :: savedAlert}"></div>

            <div class="cl-stack">
                <!--/* The invoicing system comes first: without it no pro forma or invoice is issued, whatever is set below.
                       It is a status here, chosen and configured on its own page, so this page carries one form. */-->
                <section class="cl-card is-status" aria-labelledby="invoicing-system-title"
                         th:with="status=${systemStatus}">
                    <div class="cl-card-head">
                        <h2 class="cl-card-title" id="invoicing-system-title">
                            <i class="fas" th:classappend="${status.configured()} ? 'fa-check-circle is-ok' : 'fa-exclamation-triangle is-warn'"
                               aria-hidden="true"></i>
                            <span th:if="${status.configured()}" th:text="#{store.invoicing.system.status.ok(${status.displayName()})}"></span>
                            <span th:unless="${status.chosen()}" th:text="#{store.invoicing.system.none.title}"></span>
                            <span th:if="${status.chosen() and !status.installed()}"
                                  th:text="#{store.invoicing.system.missing.title(${status.providerName()})}"></span>
                            <span th:if="${status.installed() and !status.configured()}"
                                  th:text="#{store.invoicing.system.status.incomplete(${status.displayName()})}"></span>
                        </h2>
                        <div class="cl-list-actions">
                            <a class="cl-link-button" th:href="@{${systemHref}}"
                               th:text="${!status.chosen()} ? #{store.invoicing.system.choose.action}
                                        : (${status.installed() and !status.configured()} ? #{store.invoicing.system.complete} : #{store.invoicing.system.change})"></a>
                            <a th:if="${status.chosen()}" class="cl-link-button is-danger" th:href="@{${disconnectHref}}"
                               data-cl-confirm th:text="#{store.invoicing.system.disconnect}"
                               th:attr="data-cl-confirm-title=#{store.invoicing.system.disconnect.title(${status.displayName()})},
                                        data-cl-confirm-message=#{store.invoicing.system.disconnect.message},
                                        data-cl-confirm-action=#{store.invoicing.system.disconnect.action}"></a>
                        </div>
                    </div>
                    <p class="cl-card-desc"
                       th:text="${status.configured()} ? #{store.invoicing.system.status.ok.text}
                                : (${!status.chosen()} ? #{store.invoicing.system.none.text}
                                : (${!status.installed()} ? #{store.invoicing.system.missing.text} : #{store.invoicing.system.incomplete.text}))"></p>
                </section>

                <form th:fragment="invoicesForm" id="invoicing-invoices-form" class="cl-form"
                      th:action="@{${invoicesAction}}" th:object="${invoicesForm}" method="post" novalidate data-cl-async
                      th:attr="data-success-message=${savedMessage}, data-error-message=#{form.save.failed}">
                    <div th:replace="~{fragments/settings-form :: errorSummary('invoicing-invoices-errors', ${invoicesErrors}, null)}"></div>

                    <div class="cl-card">
                        <fieldset class="cl-fieldset">
                            <legend class="cl-fieldset-title" th:text="#{store.invoicing.invoices.title}"></legend>
                            <div class="cl-form-grid">
                                <div class="cl-span-3" th:insert="~{fragments/settings-form :: textField('paymentTerms', 'store.invoicing.paymentTerms.label', *{paymentTerms}, 'number', 'off', true, ${invoicesErrors['paymentTerms']}, #{store.invoicing.paymentTerms.help})}"></div>
                            </div>
                            <div th:replace="~{fragments/settings-form :: check('sendInvoicesAsAttachment', 'store.invoicing.attachment.label', *{sendInvoicesAsAttachment}, 'store.invoicing.attachment.description', null, null)}"></div>
                            <div th:replace="~{fragments/settings-form :: check('splitPaymentsEnabled', 'store.invoicing.splitPayments.label', *{splitPaymentsEnabled}, 'store.invoicing.splitPayments.description', null, null)}"></div>
                            <div th:replace="~{fragments/settings-form :: check('positionsConsolidation', 'store.invoicing.consolidation.label', *{positionsConsolidation}, 'store.invoicing.consolidation.description', 'invoicing-consolidation-prefix', null)}"></div>
                            <div id="invoicing-consolidation-prefix" class="cl-reveal">
                                <div class="cl-form-grid">
                                    <div class="cl-span-3" th:insert="~{fragments/settings-form :: textField('positionsConsolidationPrefix', 'store.invoicing.consolidationPrefix.label', *{positionsConsolidationPrefix}, 'text', 'off', true, ${invoicesErrors['positionsConsolidationPrefix']}, #{store.invoicing.consolidationPrefix.help})}"></div>
                                </div>
                            </div>
                        </fieldset>
                        <div class="cl-card-footer">
                            <button class="cl-button is-primary" type="submit" th:text="#{form.save.changes}"></button>
                        </div>
                    </div>
                </form>
            </div>

            <dialog th:replace="~{fragments/confirm-dialog :: dialog}"></dialog>
        </div>
    </section>
    <script th:if="${!invoicesErrors.isEmpty()}">
        document.getElementById('invoicing-invoices-errors').focus();
    </script>
    <script th:src="@{/js/async-form.js}" defer></script>
    <script th:src="@{/js/reveal.js}" defer></script>
    <script th:src="@{/js/confirm-dialog.js}" defer></script>
</div>
</body>
</html>
