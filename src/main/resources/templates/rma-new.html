<!DOCTYPE HTML>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}">
<body>
<!--/* New RMA (spec docs/active/rma-new-redesign/2026-10-13-rma-new-design.md): one search, then the order's items. */-->
<div layout:fragment="content" th:with="p=${page}">
    <section class="cl-page">
        <div class="cl-page-body is-wide">
            <div th:replace="~{rma-new/parts :: header(${p})}"></div>
            <div th:if="${p.pageError() != null}" class="cl-alert is-bad" tabindex="-1" data-cl-error-summary>
                <i class="fas fa-exclamation-circle cl-alert-icon" aria-hidden="true"></i>
                <p class="cl-alert-text" th:text="${p.pageError()}"></p>
            </div>
            <div th:replace="~{fragments/settings-form :: errorSummaryTextTitled('rma-errors', ${p.errorSummary()}, 'rma.new.errors.title')}"></div>
            <!--/* th:replace runs before th:if on the same element, so every conditional fragment sits in a th:block */-->
            <th:block th:if="${p.state().name() == 'START'}"><section th:replace="~{rma-new/parts :: searchCard(${p})}"></section></th:block>
            <th:block th:if="${p.state().name() == 'NOT_FOUND'}"><section th:replace="~{rma-new/parts :: notFound(${p})}"></section></th:block>
            <th:block th:if="${p.state().name() == 'INELIGIBLE'}"><section th:replace="~{rma-new/parts :: ineligible(${p})}"></section></th:block>
            <th:block th:if="${p.state().name() == 'CHOICE'}"><section th:replace="~{rma-new/parts :: choice(${p})}"></section></th:block>
            <form th:if="${p.state().name() == 'ORDER'}" id="rma-create-form" class="cl-layout-aside" method="post"
                  th:action="@{/dashboard/rma/new}" novalidate data-cl-submit-once data-cl-rma-new>
                <input type="hidden" name="orderId" th:value="${p.order().orderId()}"/>
                <input th:if="${p.from() != null}" type="hidden" name="from" th:value="${p.from()}"/>
                <div class="cl-layout-main">
                    <section th:replace="~{rma-new/parts :: items(${p})}"></section>
                </div>
                <aside class="cl-layout-side is-sticky">
                    <section th:replace="~{rma-new/parts :: orderCard(${p})}"></section>
                    <section th:replace="~{rma-new/parts :: summaryCard(${p})}"></section>
                </aside>
            </form>
        </div>
    </section>
    <script th:src="@{/js/error-summary.js}" defer></script>
    <script th:src="@{/js/submit-once.js}" defer></script>
    <script th:src="@{/js/rma-new.js}" defer></script>
</div>
</body>
</html>
