<!DOCTYPE HTML>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<!--/* The outcome of the last action (RmaFlash, model attribute rmaNotice), shown where it belongs: scope 'PAGE' under the
       header, 'ITEMS' next to the items the action was taken on. lines name what was skipped and why. */-->
<div th:fragment="notice(scope)" th:if="${rmaNotice != null and rmaNotice.scope().name() == scope}"
     class="cl-alert" th:classappend="${rmaNotice.tone()}" role="status" data-cl-saved-alert>
    <i class="fas cl-alert-icon" aria-hidden="true"
       th:classappend="${rmaNotice.tone() == 'is-ok'} ? 'fa-check-circle' : 'fa-exclamation-triangle'"></i>
    <div>
        <p class="cl-alert-text" th:text="${rmaNotice.text()}"></p>
        <ul th:if="${rmaNotice.lines() != null and !rmaNotice.lines().isEmpty()}" class="cl-alert-list">
            <li th:each="line : ${rmaNotice.lines()}" th:text="${line}"></li>
        </ul>
    </div>
</div>
</body>
</html>
