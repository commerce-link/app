<!DOCTYPE HTML>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{signup-layout}">
<head>
    <title th:text="#{registration.page-title}"></title>
</head>
<body>

<th:block layout:fragment="top">
    <p th:replace="~{fragments/signup :: signIn}"></p>
</th:block>

<div layout:fragment="content">
    <header class="cl-signup-head">
        <span class="cl-status is-info is-lg"
              th:text="${demoMode} ? #{registration.pill.demo} : #{registration.pill.trial(${trialDays})}"></span>
        <h1 class="cl-hero-title"><span th:text="#{registration.hero.line1}"></span><br><span th:text="#{registration.hero.line2}"></span></h1>
        <p class="cl-page-lead" th:text="${demoMode} ? #{registration.lead.demo} : #{registration.lead}"></p>
    </header>

    <div th:if="${errorMessage}" class="cl-alert is-bad">
        <i class="fas fa-exclamation-circle cl-alert-icon" aria-hidden="true"></i>
        <p class="cl-alert-text" th:text="${errorMessage}"></p>
    </div>

    <form method="post" th:action="@{/register}" novalidate>
        <div th:replace="~{fragments/settings-form :: textFieldWith('email', 'registration.email.label', ${email}, 'email',
                'email', true, ${fieldErrors?.get('email')}, null, null, null, ${autofocus == 'email'})}"></div>
        <th:block th:unless="${demoMode}">
            <div th:replace="~{fragments/settings-form :: textFieldLimited('storeName', 'registration.store-name.label', ${storeName},
                    'text', 'organization', true, ${fieldErrors?.get('storeName')}, #{registration.store-name.help}, null, null,
                    ${autofocus == 'storeName'}, ${storeNameMaxLength})}"></div>
        </th:block>
        <div class="cl-field" th:with="termsError=${fieldErrors?.get('termsConsent')}">
            <label class="cl-check is-wrap">
                <input type="checkbox" id="termsConsent" name="termsConsent" required th:checked="${termsConsent}"
                       th:autofocus="${autofocus == 'termsConsent'}"
                       th:attr="aria-invalid=${termsError != null ? 'true' : null},
                                aria-describedby=${termsError != null ? 'termsConsent-error' : null}">
                <span><th:block th:text="#{registration.terms.accept}"></th:block>
                    <a th:if="${termsUrl != null}" th:href="${termsUrl}" target="_blank" rel="noopener"
                       th:text="#{registration.terms.link}"></a><th:block th:unless="${termsUrl != null}"
                       th:text="#{registration.terms.link}"></th:block>.</span>
            </label>
            <p th:if="${termsError != null}" class="cl-field-error" id="termsConsent-error">
                <i class="fas fa-exclamation-circle" aria-hidden="true"></i>
                <span th:text="#{${termsError}}"></span>
            </p>
        </div>
        <input class="cl-honeypot" type="text" name="company" tabindex="-1" autocomplete="off" aria-hidden="true">
        <!--/* interaction-only: Cloudflare shows the widget only when it needs a click; otherwise the check is invisible. */-->
        <th:block th:if="${captchaSiteKey != null}">
            <div class="cf-turnstile" data-appearance="interaction-only" data-size="flexible"
                 th:attr="data-sitekey=${captchaSiteKey}"></div>
            <!--/* Picks the widget size before Turnstile renders it, so api.js is loaded only after this script. */-->
            <script th:src="@{/js/turnstile-size.js}"></script>
            <script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>
        </th:block>
        <button type="submit" class="cl-button is-primary is-lg">
            <span th:text="${demoMode} ? #{registration.submit} : #{registration.submit.trial(${trialDays})}"></span>
            <i class="fas fa-arrow-right" aria-hidden="true"></i>
        </button>
    </form>

    <ul th:unless="${demoMode}" class="cl-inline-checks">
        <li><i class="fas fa-check" aria-hidden="true"></i><span th:text="#{registration.check.no-card}"></span></li>
        <li><i class="fas fa-check" aria-hidden="true"></i><span th:text="#{registration.check.no-commitment}"></span></li>
        <li><i class="fas fa-check" aria-hidden="true"></i><span th:text="#{registration.check.all-modules}"></span></li>
    </ul>
    <p class="cl-signup-note"
       th:text="${demoMode} ? #{registration.demo-notice(${ttlDays})} : #{registration.trial-note(${trialRetentionDays})}"></p>
</div>

</body>
</html>
