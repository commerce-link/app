<!DOCTYPE HTML>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}">
<body>
<div layout:fragment="content">
    <section class="cl-page">
        <div class="cl-page-body">
            <div th:replace="~{fragments/settings-header :: subpage(${paymentsHref}, ${backLabel}, ${pageTitle})}"></div>

            <form th:fragment="accountForm" id="bank-account-form" class="cl-form"
                  th:action="@{${formAction}}" th:object="${form}" method="post" novalidate data-cl-async
                  th:attr="data-cl-redirect=${redirectTo}, data-error-message=#{form.save.failed}">
                <div th:replace="~{fragments/settings-form :: errorSummary('bank-account-errors', ${errors}, null)}"></div>

                <div class="cl-card">
                    <fieldset class="cl-fieldset">
                        <legend class="cl-fieldset-title" th:text="#{store.payments.account.section}"></legend>
                        <div class="cl-form-grid">
                            <div th:insert="~{fragments/settings-form :: textField('iban', 'bank.iban', *{iban}, 'text', 'off', true, ${errors['iban']}, #{store.payments.account.iban.help})}"></div>
                            <div class="cl-span-4" th:insert="~{fragments/settings-form :: textField('accountHolder', 'bank.account.holder', *{accountHolder}, 'text', 'organization', true, ${errors['accountHolder']}, null)}"></div>
                            <div class="cl-span-2" th:insert="~{fragments/form-field :: select('currency', 'bank.currency', *{currency}, ${currencies}, 'off', true, ${errors['currency']})}"></div>
                            <div class="cl-span-3" th:insert="~{fragments/settings-form :: textField('bankName', 'bank.name', *{bankName}, 'text', 'off', false, ${errors['bankName']}, null)}"></div>
                            <div class="cl-span-3" th:insert="~{fragments/settings-form :: textField('swiftCode', 'bank.swift.code', *{swiftCode}, 'text', 'off', false, ${errors['swiftCode']}, #{store.payments.account.swift.help})}"></div>
                            <p th:if="${alreadyDefault}" class="cl-help" th:text="#{store.payments.account.isDefault}"></p>
                            <th:block th:unless="${alreadyDefault}">
                                <div th:replace="~{fragments/settings-form :: check('makeDefault', 'store.payments.account.makeDefault', *{makeDefault}, 'store.payments.account.makeDefault.description', null)}"></div>
                            </th:block>
                        </div>
                    </fieldset>
                    <div class="cl-card-footer">
                        <button class="cl-button is-primary" type="submit" th:text="#{store.payments.account.save}"></button>
                        <a class="cl-button" th:href="@{${paymentsHref}}" th:text="#{general.cancel}"></a>
                    </div>
                </div>
            </form>
        </div>
    </section>
    <script th:if="${!errors.isEmpty()}">
        document.getElementById('bank-account-errors').focus();
    </script>
    <script th:src="@{/js/async-form.js}" defer></script>
</div>
</body>
</html>
