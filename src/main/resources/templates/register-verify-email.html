<!DOCTYPE HTML>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{signup-layout}">
<head>
    <title th:text="#{registration.verify.title}"></title>
</head>
<body>

<!--/* No "Masz już konto?" here: this step comes after the automatic sign-in. */-->
<div layout:fragment="content">
    <header class="cl-signup-head">
        <span class="cl-status is-info is-lg" th:text="#{registration.step(3, 3)}"></span>
        <h1 class="cl-hero-title" th:text="#{registration.verify.title}"></h1>
        <p class="cl-page-lead"><th:block th:text="#{registration.verify.lead.before}"></th:block>
            <strong th:text="${email}"></strong>
            <th:block th:text="#{registration.verify.lead.after}"></th:block></p>
    </header>

    <div th:if="${errorMessage}" class="cl-alert is-bad">
        <i class="fas fa-exclamation-circle cl-alert-icon" aria-hidden="true"></i>
        <p class="cl-alert-text" th:text="${errorMessage}"></p>
    </div>
    <div th:if="${infoMessage}" class="cl-alert is-ok">
        <i class="fas fa-check-circle cl-alert-icon" aria-hidden="true"></i>
        <p class="cl-alert-text" th:text="${infoMessage}"></p>
    </div>

    <form method="post" th:action="@{/register/verify-email}" novalidate>
        <div th:replace="~{fragments/settings-form :: textFieldWith('code', 'registration.verify.label', null, 'text',
                'one-time-code', true, ${fieldErrors['code']}, null, 'numeric', null, ${autofocus == 'code'})}"></div>
        <button type="submit" class="cl-button is-primary is-lg">
            <span th:text="#{registration.verify.submit}"></span>
            <i class="fas fa-arrow-right" aria-hidden="true"></i>
        </button>
    </form>

    <div class="cl-signup-link">
        <span th:text="#{registration.verify.resend.prompt}"></span>
        <form method="post" th:action="@{/register/verify-email/resend}">
            <button type="submit" class="cl-link-button" th:text="#{registration.verify.resend}"></button>
        </form>
    </div>
</div>

</body>
</html>
