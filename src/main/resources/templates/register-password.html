<!DOCTYPE HTML>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{signup-layout}">
<head>
    <title th:text="#{registration.password.title}"></title>
</head>
<body>

<th:block layout:fragment="top">
    <p th:replace="~{fragments/signup :: signIn}"></p>
</th:block>

<div layout:fragment="content">
    <header class="cl-signup-head">
        <span class="cl-status is-info is-lg" th:text="#{registration.step(2, ${stepTotal})}"></span>
        <h1 class="cl-hero-title" th:text="#{registration.password.title}"></h1>
        <p class="cl-page-lead"><th:block th:text="#{registration.password.lead.before}"></th:block>
            <strong th:text="${email}"></strong>
            <th:block th:text="${demoMode} ? #{registration.password.lead.after.demo}
                    : #{registration.password.lead.after.trial(${trialDays})}"></th:block></p>
    </header>

    <div th:if="${errorMessage}" class="cl-alert is-bad">
        <i class="fas fa-exclamation-circle cl-alert-icon" aria-hidden="true"></i>
        <p class="cl-alert-text" th:text="${errorMessage}"></p>
    </div>

    <form method="post" th:action="@{/register/password}" novalidate>
        <div th:replace="~{fragments/settings-form :: textFieldWith('password', 'registration.password.label', null,
                'password', 'new-password', true, ${fieldErrors?.get('password')}, #{registration.password.requirements},
                null, null, ${autofocus == 'password'})}"></div>
        <button type="submit" class="cl-button is-primary is-lg">
            <span th:text="#{registration.password.submit}"></span>
            <i class="fas fa-arrow-right" aria-hidden="true"></i>
        </button>
    </form>

    <p class="cl-signup-link"><a href="/register" th:text="#{registration.password.restart}"></a></p>
</div>

</body>
</html>
