<!DOCTYPE HTML>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}">
<body>

<div layout:fragment="content">
<section class="cl-page">
    <div class="cl-page-body is-wide">

        <header class="cl-page-header">
            <a class="cl-back" th:href="@{${page.backHref()}}">
                <span class="icon is-small" aria-hidden="true"><i class="fas fa-chevron-left"></i></span>
                <span th:text="#{${page.backKey()}}"></span>
            </a>
            <div class="cl-page-header-row">
                <h1 class="cl-page-title" th:text="#{${page.titleKey()}}"></h1>
                <th:block th:if="${page.isOrders()}"><button th:replace="~{fragments/screen-intro :: toggle}"></button></th:block>
            </div>
            <p class="cl-page-lead" th:text="#{${page.leadKey()}}"></p>
            <p class="cl-group-meta">
                <span class="cl-status is-info"><i class="fas" th:classappend="${page.kind().icon()}" aria-hidden="true"></i><span th:text="#{${page.kind().key()}}"></span></span>
                <span th:if="${page.step() != null}" class="cl-status is-neutral" th:text="#{fulfilment.select.step(${page.step().index()}, ${page.step().total()})}"></span>
                <span th:if="${page.storeName() != null}"><span class="cl-icon-text"><i class="fas fa-store" aria-hidden="true"></i><span th:text="#{fulfilment.queue.store}"></span></span> <strong th:text="${page.storeName()}"></strong></span>
                <span th:text="${page.context()}"></span>
                <a th:if="${page.isOrders() and page.orders().size() == 1 and page.orders().get(0).href() != null}" class="cl-link-button" th:href="@{${page.orders().get(0).href()}}" target="_blank" rel="noopener"
                   th:text="#{fulfilment.select.openOrder(${page.orders().get(0).number()})}"></a>
                <span th:if="${page.strategyKey() != null}" th:text="#{${page.strategyKey()}}"></span>
                <span th:each="key : ${page.narrowingKeys()}" class="cl-status is-neutral" th:text="#{${key}}"></span>
            </p>
        </header>

        <th:block th:if="${page.isOrders()}"><div th:replace="~{fragments/screen-intro :: panel('fulfilmentSelect', 'fas fa-truck-loading')}"></div></th:block>

        <section class="cl-card" th:unless="${page.hasOffers()}" aria-labelledby="select-empty-title">
            <div class="cl-card-head">
                <h2 class="cl-card-title" id="select-empty-title" th:text="#{${page.emptyState().titleKey()}}"></h2>
            </div>
            <div class="cl-list-empty">
                <span th:text="#{${page.emptyState().textKey()}}"></span>
                <div class="cl-list-empty-action">
                    <a class="cl-button is-primary" th:href="@{${page.backHref()}}">
                        <span class="icon is-small" aria-hidden="true"><i class="fas fa-arrow-left"></i></span>
                        <span th:text="#{${page.emptyState().actionKey()}}"></span>
                    </a>
                </div>
            </div>
        </section>

        <!--/* Layout of the queue and "Nowa dostawa" (spec 2026-10-08-fulfilment-select-design.md, variant A2): the
               offers table is the work, the sticky side column the summary with the actions. The offers' state lives
               in their checkboxes; fulfilment-select.js decides which offer wins each item (the cheapest gross one),
               keeps every number in step and builds the entries[...] fields at submit. Addresses come from the page,
               never from hidden fields. */-->
        <form th:if="${page.hasOffers()}" method="post" th:action="@{${page.actions().commit()}}" class="cl-layout-aside"
              data-cl-select data-cl-submit-once
              th:attr="data-items-total=${page.itemsTotal()}, data-profit-known=${page.profitKnown()}">
            <input type="hidden" name="fulfilmentType" th:value="${form.fulfilmentType}">
            <input type="hidden" name="pathSelector" th:value="${form.pathSelector}">
            <input type="hidden" name="onlyWithProfit" th:value="${form.onlyWithProfit}">
            <input type="hidden" name="onlyMultiOrder" th:value="${form.onlyMultiOrder}">
            <input type="hidden" name="onlyLocalSuppliers" th:value="${form.onlyLocalSuppliers}">
            <input type="hidden" name="orderByOrder" th:value="${form.orderByOrder}">
            <input type="hidden" name="orderCountAtStart" th:value="${form.orderCountAtStart}">
            <input type="hidden" th:each="order, stat : ${form.selectedOrders}" th:name="|selectedOrders[${stat.index}]|" th:value="${order}">
            <input type="hidden" th:each="supplier : ${form.committedSuppliers}" th:name="|committedSuppliers[${supplier.key}]|" th:value="${supplier.value}">
            <input type="hidden" th:each="id : ${form.skippedOrderIds}" name="skippedOrderIds" th:value="${id}">
            <input type="hidden" name="skippedGroups" th:value="${form.skippedGroups}">
            <div data-cl-payload hidden></div>
            <div hidden data-cl-select-text
                 th:attr="data-covered-on=#{fulfilment.select.covered.on}, data-covered-off=#{fulfilment.select.covered.off},
                          data-lost=#{fulfilment.select.lost}, data-margin=#{fulfilment.select.margin},
                          data-count=#{fulfilment.select.count},
                          data-hidden=#{fulfilment.select.filter.hidden}, data-partial=#{fulfilment.select.partial},
                          data-uncovered=#{fulfilment.select.uncovered}, data-partial-end=#{fulfilment.select.partial.end},
                          data-all=#{fulfilment.select.filter.all}, data-many=#{fulfilment.select.filter.many},
                          data-any=#{fulfilment.select.filter.any}, data-from=#{fulfilment.select.filter.from},
                          data-to=#{fulfilment.select.filter.to}, data-range=#{fulfilment.select.filter.range},
                          data-category-offers=#{fulfilment.select.category.offers}, data-category-ordered=#{fulfilment.select.category.ordered},
                          data-category-chosen=#{fulfilment.select.category.chosen}, data-money=#{fulfilment.select.money},
                          data-ratio=#{fulfilment.select.ratio}, data-chip-filter=#{fulfilment.select.orders.filter},
                          data-chip-filter-split=#{fulfilment.select.orders.filter.split},
                          data-dearer=#{fulfilment.select.alt.dearer}, data-fold=#{fulfilment.select.alt.fold}, data-fold-plain=#{fulfilment.select.alt.fold.plain}, data-fold-locked=#{fulfilment.select.alt.fold.locked},
                          data-select-visible=#{fulfilment.select.list.selectVisible}, data-clear-all=#{fulfilment.select.list.clearAll},
                          data-clear-matching=#{fulfilment.select.list.clearMatching},
                          data-swap-orders=#{fulfilment.select.swap.orders}, data-swap-items=#{fulfilment.select.swap.items},
                          data-live-items=#{fulfilment.select.live.items}, data-live-cost=#{fulfilment.select.live.cost}, data-live-profit=#{fulfilment.select.live.profit}"></div>

            <div class="cl-layout-main">
                <noscript>
                    <div class="cl-alert is-warn" role="status">
                        <i class="fas fa-exclamation-triangle cl-alert-icon" aria-hidden="true"></i>
                        <p class="cl-alert-text" th:text="#{fulfilment.select.noscript}"></p>
                    </div>
                </noscript>

                <section class="cl-card" aria-labelledby="offers-title">
                    <div class="cl-card-head cl-offers-head">
                        <h2 class="cl-card-title" id="offers-title" th:text="#{fulfilment.select.offers.title}"></h2>
                        <!--/* filters work in the browser only: no form of their own (it would nest), inputs without names */-->
                        <div class="cl-card-head-actions" data-cl-select-filters hidden>
                            <details class="cl-filter-menu" data-cl-filter-menu="supplier">
                                <summary class="cl-filter-menu-trigger">
                                    <span class="cl-filter-menu-key" th:text="#{fulfilment.select.filter.supplier}"></span>
                                    <span class="cl-filter-menu-value" data-cl-filter-value="supplier" th:text="#{fulfilment.select.filter.all}"></span>
                                </summary>
                                <div class="cl-filter-menu-panel">
                                    <div class="cl-filter-menu-group" role="group" th:attr="aria-label=#{fulfilment.select.filter.supplier}">
                                        <label class="cl-filter-menu-check" th:each="s : ${page.suppliers()}">
                                            <input type="checkbox" data-cl-filter-provider th:value="${s.provider()}">
                                            <span class="cl-filter-menu-text"><span th:replace="~{fragments/supplier-pill :: pill(${s.label()}, ${s.color()}, ${s.warehouse()})}"></span></span>
                                            <span class="cl-filter-menu-meta" th:text="${s.offers()}"></span>
                                        </label>
                                    </div>
                                </div>
                            </details>
                            <details class="cl-filter-menu is-end" data-cl-filter-menu="price">
                                <summary class="cl-filter-menu-trigger">
                                    <span class="cl-filter-menu-key" th:text="#{fulfilment.select.filter.price}"></span>
                                    <span class="cl-filter-menu-value" data-cl-filter-value="price" th:text="#{fulfilment.select.filter.any}"></span>
                                </summary>
                                <div class="cl-filter-menu-panel">
                                    <div class="cl-filter-menu-dates">
                                        <label>
                                            <span th:text="#{fulfilment.select.filter.price.from}"></span>
                                            <input class="cl-input is-price" type="number" inputmode="decimal" min="0" step="0.01" data-cl-filter-min>
                                        </label>
                                        <label>
                                            <span th:text="#{fulfilment.select.filter.price.to}"></span>
                                            <input class="cl-input is-price" type="number" inputmode="decimal" min="0" step="0.01" data-cl-filter-max>
                                        </label>
                                    </div>
                                </div>
                            </details>
                        </div>
                    </div>

                    <div class="cl-offers-bar" th:if="${!page.variants().isEmpty() or page.showCoverage()}">
                        <div class="cl-bar-row" th:if="${!page.variants().isEmpty()}">
                            <span class="cl-bar-label" id="variant-label" th:text="#{fulfilment.select.variants}"></span>
                            <div class="cl-bar-content">
                                <!--/* name clVariant: posted, but FulfilmentForm has no such property, so binding ignores it */-->
                                <fieldset class="cl-variant-options" aria-labelledby="variant-label">
                                    <label class="cl-variant-option cl-tooltip" th:each="v : ${page.variants()}" th:attr="data-tooltip=${v.providers()}">
                                        <input type="radio" name="clVariant" data-cl-variant th:attr="data-groups=${v.groupIds()}" th:checked="${v.applied()}">
                                        <strong th:text="${v.supplierCount() == 1} ? #{fulfilment.select.suppliers.one} : #{fulfilment.select.suppliers.many(${v.supplierCount()})}"></strong>
                                        <span class="cl-variant-sub" th:text="#{fulfilment.select.variant.total(${T(pl.commercelink.web.orders.Money).format(v.total())})}"></span>
                                        <span class="cl-variant-tag" th:if="${v.cheapest()}" th:text="#{fulfilment.select.variant.cheapest}"></span>
                                        <span class="cl-variant-tag" th:if="${!v.cheapest() and v.fewest()}" th:text="#{fulfilment.select.variant.fewest}"></span>
                                        <span class="cl-visually-hidden" th:text="${v.providers()}"></span>
                                    </label>
                                    <label class="cl-variant-option">
                                        <input type="radio" name="clVariant" data-cl-variant-custom th:checked="${page.noVariantApplied()}">
                                        <strong th:text="#{fulfilment.select.variant.custom}"></strong>
                                    </label>
                                </fieldset>
                                <span class="cl-bar-info cl-tooltip is-lines is-end" tabindex="0" role="img"
                                      th:attr="data-tooltip=#{fulfilment.select.variants.help}, aria-label=#{fulfilment.select.variants.help}"><i class="fas fa-info-circle" aria-hidden="true"></i></span>
                            </div>
                        </div>
                        <div class="cl-bar-row" th:if="${page.showCoverage()}">
                            <span class="cl-bar-label" id="coverage-label" th:text="#{fulfilment.select.orders}"></span>
                            <!--/* a chip is two controls: the number opens the order in a new tab, the bar part narrows the
                                   table to its offers. The script keeps the state class on the filter button; the chip
                                   takes its tint from it, so the icons, bar and count change together. */-->
                            <div class="cl-bar-content cl-order-chips" role="group" aria-labelledby="coverage-label">
                                <span class="cl-order-chip" th:each="o : ${page.orders()}" th:attr="data-order=${o.orderId()}">
                                    <span class="cl-coverage-icon is-ok"><i class="fas fa-check-circle" aria-hidden="true"></i></span>
                                    <span class="cl-coverage-icon is-warn"><i class="fas fa-exclamation-circle" aria-hidden="true"></i></span>
                                    <span class="cl-coverage-icon is-bad"><i class="fas fa-circle" aria-hidden="true"></i></span>
                                    <a th:if="${o.href() != null}" class="cl-order-chip-link" th:href="@{${o.href()}}" target="_blank" rel="noopener"
                                       th:title="#{fulfilment.select.openOrder(${o.number()})}" th:text="${o.number()}"></a>
                                    <span th:unless="${o.href() != null}" class="cl-order-chip-link" th:text="${o.number()}"></span>
                                    <button type="button" class="cl-order-chip-filter" aria-pressed="false" data-cl-coverage
                                            th:attr="data-order=${o.orderId()}, data-total=${o.items()}, data-number=${o.number()}, data-href=@{${o.href()}},
                                                     aria-label=#{fulfilment.select.orders.filter(${o.number()}, 0, ${o.items()})}">
                                        <span class="cl-coverage-split" hidden role="img" th:attr="aria-label=#{fulfilment.select.orders.split}, title=#{fulfilment.select.orders.split}"><i class="fas fa-code-branch" aria-hidden="true"></i></span>
                                        <span class="cl-order-chip-bar" aria-hidden="true"><span class="cl-order-chip-fill" data-cl-coverage-fill></span></span>
                                        <span class="cl-coverage-count" data-cl-coverage-count th:text="#{fulfilment.select.ratio(0, ${o.items()})}"></span>
                                    </button>
                                </span>
                            </div>
                        </div>
                    </div>

                    <div class="cl-alert is-info cl-offers-notice" role="status" data-cl-hidden-notice hidden>
                        <i class="fas fa-filter cl-alert-icon" aria-hidden="true"></i>
                        <p class="cl-alert-text"><span data-cl-hidden-text></span> <button type="button" class="cl-link-button" data-cl-show-all th:text="#{fulfilment.select.filter.showAll}"></button></p>
                    </div>
                    <div class="cl-alert is-warn cl-offers-notice" role="status" th:if="${page.noOfferMatched()}">
                        <i class="fas fa-exclamation-triangle cl-alert-icon" aria-hidden="true"></i>
                        <p class="cl-alert-text"><span th:text="#{${page.noMatchKey()}}"></span><th:block th:if="${page.multiOnSingleOrder()}"> <span th:text="#{fulfilment.select.noMatch.multi}"></span></th:block></p>
                    </div>

                    <!--/* above the list: tick or clear the visible offers on the left (the header checkbox went with the
                           visible header row), expand and collapse every category on the right */-->
                    <div class="cl-list-bar">
                        <button type="button" class="cl-link-button" data-cl-select-visible th:text="#{fulfilment.select.list.selectVisible}"></button>
                        <span class="cl-list-bar-end">
                            <button type="button" class="cl-link-button" data-cl-expand-all>
                                <i class="fas fa-expand" aria-hidden="true"></i><span th:text="#{fulfilment.select.list.expand}"></span>
                            </button>
                            <button type="button" class="cl-link-button" data-cl-collapse-all>
                                <i class="fas fa-compress" aria-hidden="true"></i><span th:text="#{fulfilment.select.list.collapse}"></span>
                            </button>
                        </span>
                    </div>

                    <!--/* Offers as separated card rows (variant A4). The header row stays for screen readers only: every
                           value carries its unit in the cell. Only the first category starts expanded, as on the old page;
                           the script hides the rows of the collapsed ones. */-->
                    <div class="cl-card-section cl-offers-list">
                        <table class="cl-table is-supplier-offers" data-cl-offers>
                            <colgroup><col><col class="cl-col-qty-s"><col class="cl-col-price"><col class="cl-col-profit"><col class="cl-col-toggle"></colgroup>
                            <thead class="cl-visually-hidden">
                            <tr>
                                <th scope="col" th:text="#{fulfilment.select.column.offer}"></th>
                                <th scope="col" th:text="#{fulfilment.select.column.qty}"></th>
                                <th scope="col" th:text="#{fulfilment.select.column.price}"></th>
                                <th scope="col" th:text="#{fulfilment.select.column.profit}"></th>
                                <th scope="col" th:text="#{fulfilment.select.column.select}"></th>
                            </tr>
                            </thead>
                            <tbody th:each="c, cStat : ${page.categories()}" th:id="${c.id()}" data-cl-category>
                            <tr class="cl-table-group">
                                <th colspan="5" scope="rowgroup">
                                    <button type="button" class="cl-group-toggle" th:attr="aria-controls=${c.id()}, aria-expanded=${cStat.first}">
                                        <i class="fas fa-chevron-down" aria-hidden="true"></i><span class="cl-group-name" th:text="${c.name() != null} ? ${c.name()} : #{fulfilment.select.category.other}"></span>
                                    </button>
                                    <span class="cl-group-count" data-cl-category-count></span>
                                    <span class="cl-group-chosen" data-cl-category-chosen hidden></span>
                                </th>
                            </tr>
                            <tr th:each="o, oStat : ${c.offers()}" th:with="e=${o.entry()}, tid=|${c.id()}-o${oStat.index}|" th:id="${tid}" data-cl-offer th:class="${e.accepted} ? 'is-on' : 'is-off'"
                                th:data-groupid="${e.id}" th:data-provider="${e.source.provider}" th:data-provider-label="${o.label()}"
                                th:data-name="${e.source.name}" th:data-ean="${e.source.ean}" th:data-mfn="${e.source.mfn}"
                                th:data-sourceqty="${e.source.qty}" th:data-net="${e.source.priceNet}" th:data-gross="${e.source.priceGross}"
                                th:data-category="${e.source.category}">
                                <th scope="row" class="cl-table-key">
                                    <span class="cl-offer-name" th:text="${e.source.name}"></span>
                                    <span class="cl-offer-line">
                                        <span th:replace="~{fragments/supplier-pill :: pill(${o.label()}, ${o.color()}, ${o.warehouse()})}"></span>
                                        <span class="cl-offer-stock" th:text="#{fulfilment.select.stock(${e.source.qty})}"></span>
                                        <span class="cl-offer-codes"><span th:text="#{general.ean}"></span> <span class="cl-code-nowrap" th:text="${e.source.ean}"></span> · <span th:text="#{fulfilment.select.mfn}"></span> <span class="cl-code-nowrap" th:text="${e.source.mfn}"></span></span>
                                        <span class="cl-offer-covered" data-cl-covered hidden></span>
                                        <span class="cl-offer-swap" data-cl-swap hidden></span>
                                    </span>
                                    <span class="cl-order-refs" th:hidden="${!page.showOrderRefs()}">
                                        <span class="cl-order-ref" th:each="a : ${e.allocations}" th:with="ref=${page.order(a.orderId)}" data-cl-alloc
                                              th:attr="data-order=${a.orderId}, data-item=${a.orderItemId}, data-qty=${a.orderItemQty}, data-price=${a.orderItemPrice}">
                                            <a th:if="${ref.href() != null}" th:href="@{${ref.href()}}" target="_blank" rel="noopener" th:text="${ref.number()}"></a>
                                            <span class="cl-order-ref-qty" th:text="|×${a.orderItemQty}|"></span>
                                            <span class="cl-order-ref-price" th:text="|· ${T(pl.commercelink.web.orders.Money).format(a.orderItemPrice)}|"></span>
                                        </span>
                                    </span>
                                </th>
                                <td class="is-numeric cl-cell-qty"><span data-cl-qty>0</span> <span class="cl-unit" th:text="#{fulfilment.select.unit.pieces}"></span></td>
                                <td class="is-numeric cl-cell-price">
                                    <span class="cl-price-main"><span th:text="${T(pl.commercelink.web.orders.Money).format(e.source.priceNet)}"></span> <span class="cl-unit" th:text="#{fulfilment.select.unit.perPiece}"></span></span>
                                    <span class="cl-table-sub" th:text="#{fulfilment.select.gross(${T(pl.commercelink.web.orders.Money).format(e.source.priceGross)})}"></span>
                                </td>
                                <td class="is-numeric cl-cell-profit">
                                    <th:block th:if="${page.profitKnown()}">
                                        <span class="cl-profit" data-cl-profit><span class="cl-loss-icon"><i class="fas fa-exclamation-circle" aria-hidden="true"></i></span><span data-cl-profit-value>—</span></span>
                                        <span class="cl-table-sub" data-cl-margin></span>
                                    </th:block>
                                    <span th:unless="${page.profitKnown()}" class="cl-profit is-unknown cl-tooltip is-end" tabindex="0" role="img"
                                          th:attr="data-tooltip=#{fulfilment.select.profit.unknown}, aria-label=#{fulfilment.select.profit.unknown}">—</span>
                                </td>
                                <!--/* the toggle is a label around the offer's checkbox: the checkbox keeps the state and the keyboard;
                                       CSS shows the one text that fits the row (ticked or not, covered cheaper or not). The checkbox
                                       is named by that visible text plus the offer and supplier (WCAG 2.5.3): fulfilment-select.js
                                       points aria-labelledby at the text shown */-->
                                <td class="cl-cell-toggle">
                                    <label class="cl-offer-toggle"><input type="checkbox" data-cl-offer-check autocomplete="off" th:checked="${e.accepted}"
                                                                          th:attr="aria-labelledby=|${tid}-${e.accepted ? 'on' : 'off'} ${tid}-name|"><span class="cl-offer-toggle-on" th:id="|${tid}-on|"><i class="fas fa-check" aria-hidden="true"></i><span th:text="#{fulfilment.select.toggle.on}"></span></span><span class="cl-offer-toggle-off" th:id="|${tid}-off|" th:text="#{fulfilment.select.toggle.off}"></span><span class="cl-offer-toggle-alt" th:id="|${tid}-alt|" th:text="#{fulfilment.select.toggle.alt}"></span><span class="cl-offer-toggle-kept" th:id="|${tid}-kept|"><i class="fas fa-check" aria-hidden="true"></i><span th:text="#{fulfilment.select.toggle.kept}"></span></span></label>
                                    <span class="cl-visually-hidden" th:id="|${tid}-name|" th:text="#{fulfilment.select.offer.name(${e.source.name}, ${o.label()})}"></span>
                                </td>
                            </tr>
                            </tbody>
                            <tbody th:if="${!page.missing().isEmpty()}" class="cl-offers-missing">
                            <tr class="cl-table-group is-warn">
                                <th colspan="5" scope="rowgroup">
                                    <i class="fas fa-exclamation-triangle" aria-hidden="true"></i><span class="cl-group-name" th:text="#{fulfilment.select.missing.title}"></span>
                                    <span class="cl-group-count" th:text="#{fulfilment.select.missing.count(${page.missing().size()})}"></span>
                                </th>
                            </tr>
                            <tr class="is-missing" th:each="m : ${page.missing()}">
                                <th scope="row" class="cl-table-key" colspan="5">
                                    <span class="cl-offer-name" th:text="${m.name()}"></span>
                                    <span class="cl-offer-line">
                                        <span class="cl-order-ref" th:if="${page.showOrderRefs()}">
                                            <a th:href="@{${m.href()}}" target="_blank" rel="noopener" th:text="${m.number()}"></a>
                                            <span class="cl-order-ref-qty" th:text="|×${m.qty()}|"></span>
                                            <span class="cl-order-ref-price" th:text="|· ${T(pl.commercelink.web.orders.Money).format(m.price())}|"></span>
                                        </span>
                                        <span class="cl-offer-stock" th:text="#{${m.reasonKey()}}"></span>
                                    </span>
                                </th>
                            </tr>
                            </tbody>
                        </table>
                    </div>
                </section>

                <!--/* below 1366 px the summary sits under the table: this bar keeps the totals in sight (hidden from 1366 px) */-->
                <div class="cl-summary-peek" data-cl-peek>
                    <span th:if="${page.isOrders()}"><strong class="cl-num"><span data-cl-peek-items></span></strong> <span th:text="#{fulfilment.select.peek.items}"></span></span>
                    <span><strong class="cl-num"><span data-cl-peek-cost>0,00</span></strong> PLN</span>
                    <span th:if="${page.profitKnown()}" class="cl-profit"><span data-cl-peek-profit></span> PLN</span>
                    <a class="cl-button is-primary" href="#summary" th:text="#{fulfilment.select.summary.title}"></a>
                </div>
            </div>

            <aside class="cl-layout-side is-sticky">
                <section class="cl-card" id="summary" aria-labelledby="summary-title">
                    <div class="cl-card-head"><h2 class="cl-card-title" id="summary-title" th:text="#{fulfilment.select.summary.title}"></h2></div>
                    <!--/* one polite sentence a moment after the operator stops clicking, instead of every number announcing itself */-->
                    <p class="cl-visually-hidden" role="status" data-cl-live></p>
                    <dl class="cl-kv is-column cl-card-inset">
                        <div th:if="${page.isOrders()}"><dt th:text="#{fulfilment.select.summary.items}"></dt>
                            <dd class="is-numeric"><output data-cl-total-items></output></dd></div>
                        <div class="cl-kv-total"><dt th:text="#{fulfilment.select.summary.cost}"></dt>
                            <dd class="is-numeric"><output data-cl-total-cost>0,00</output> PLN<span class="cl-help" th:if="${!page.variants().isEmpty()}" th:text="#{fulfilment.select.summary.cost.help}"></span></dd></div>
                        <div><dt th:text="#{fulfilment.select.summary.profit}"></dt>
                            <dd class="is-numeric">
                                <span th:if="${page.profitKnown()}" class="cl-profit" data-cl-total-profit-tone><output data-cl-total-profit></output> PLN</span>
                                <span th:unless="${page.profitKnown()}" class="cl-profit is-unknown cl-tooltip is-end" tabindex="0" role="img"
                                      th:attr="data-tooltip=#{fulfilment.select.profit.unknown}, aria-label=#{fulfilment.select.profit.unknown}">—</span>
                            </dd></div>
                        <div th:if="${page.profitKnown()}"><dt th:text="#{fulfilment.select.summary.margin}"></dt>
                            <dd class="is-numeric"><output data-cl-total-margin>—</output></dd></div>
                    </dl>
                    <div class="cl-card-inset cl-by-supplier">
                        <p class="cl-eyebrow" th:text="#{fulfilment.select.summary.suppliers}"></p>
                        <ul class="cl-supplier-totals" data-cl-supplier-totals>
                            <li th:each="s : ${page.suppliers()}" data-cl-supplier-total th:attr="data-provider=${s.provider()}" hidden>
                                <span th:replace="~{fragments/supplier-pill :: pill(${s.label()}, ${s.color()}, ${s.warehouse()})}"></span>
                                <span class="cl-num" data-cl-supplier-value>0,00</span>
                            </li>
                            <li th:each="s : ${page.committed()}" class="is-earlier">
                                <span class="cl-supplier-line"><span th:replace="~{fragments/supplier-pill :: pill(${s.label()}, ${s.color()}, ${s.warehouse()})}"></span>
                                    <span class="cl-muted" th:text="#{fulfilment.select.summary.earlier}"></span></span>
                                <span class="cl-num" th:text="${T(pl.commercelink.web.orders.Money).format(s.amount())}"></span>
                            </li>
                            <li data-cl-supplier-empty class="cl-muted" th:text="#{fulfilment.select.summary.nothing}"></li>
                        </ul>
                    </div>
                    <div th:if="${page.isOrders()}" class="cl-alert is-warn cl-summary-alert" role="status" data-cl-partial hidden>
                        <i class="fas fa-exclamation-triangle cl-alert-icon" aria-hidden="true"></i>
                        <p class="cl-alert-text" data-cl-partial-text></p>
                    </div>
                    <div class="cl-card-footer is-stacked">
                        <p class="cl-help is-warn" id="select-reason" data-cl-select-reason hidden th:text="#{fulfilment.select.reason}"></p>
                        <button type="submit" class="cl-button is-primary" data-cl-needs-selection data-help="select-help-commit"
                                th:formaction="@{${page.actions().commit()}}" aria-describedby="select-help-commit" th:text="#{fulfilment.select.commit}"></button>
                        <p class="cl-help" id="select-help-commit" th:text="#{${page.commitHelpKey()}}"></p>
                        <th:block th:if="${page.actions().canContinue()}">
                            <button type="submit" class="cl-button" data-cl-needs-selection data-help="select-help-continue"
                                    th:formaction="@{${page.actions().commitAndContinue()}}" aria-describedby="select-help-continue" th:text="#{fulfilment.select.continue}"></button>
                            <p class="cl-help" id="select-help-continue" th:text="#{fulfilment.select.continue.help}"></p>
                        </th:block>
                        <th:block th:if="${page.actions().canSkip()}">
                            <button type="submit" class="cl-button" data-cl-skip th:formaction="@{${page.actions().skip()}}" aria-describedby="select-help-skip">
                                <span class="icon is-small" aria-hidden="true"><i class="fas fa-forward"></i></span>
                                <span th:text="#{fulfilment.select.skip}"></span>
                            </button>
                            <p class="cl-help" id="select-help-skip" th:text="#{fulfilment.select.skip.help}"></p>
                        </th:block>
                    </div>
                </section>
            </aside>
        </form>
    </div>
</section>
<script th:src="@{/js/submit-once.js}" defer></script>
<script th:src="@{/js/fulfilment-select.js}" defer></script>
</div>

</body>
</html>
