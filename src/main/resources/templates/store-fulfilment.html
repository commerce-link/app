<!DOCTYPE HTML>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}">
<body>
<div layout:fragment="content">
    <section class="cl-page">
        <div class="cl-page-body">
            <div th:replace="~{fragments/settings-header :: header(false, null)}"></div>
            <div th:replace="~{fragments/settings-form :: savedAlert}"></div>

            <div class="cl-stack">
                <form th:fragment="fulfilmentForm" id="fulfilment-form" class="cl-form"
                      th:action="@{${formAction}}" th:object="${form}" method="post" novalidate data-cl-async
                      th:attr="data-success-message=${savedMessage}, data-error-message=#{form.save.failed}">
                    <div th:replace="~{fragments/settings-form :: errorSummary('fulfilment-errors', ${errors}, null)}"></div>
                    <div th:if="${failure != null}" class="cl-alert is-bad" data-cl-error-summary tabindex="-1">
                        <i class="fas fa-exclamation-circle cl-alert-icon" aria-hidden="true"></i>
                        <p class="cl-alert-text" th:text="${failure}"></p>
                    </div>

                    <div class="cl-card">
                        <fieldset class="cl-fieldset">
                            <legend class="cl-fieldset-title" th:text="#{store.fulfilment.delivery.title}"></legend>
                            <div class="cl-form-grid">
                                <div class="cl-span-3 cl-field" th:each="day : ${ {'orderAssemblyDays', 'orderRealizationDays'} }"
                                     th:with="error=${errors.get(day)}">
                                    <label class="cl-label" th:for="${day}" th:text="#{'store.fulfilment.' + ${day}}"></label>
                                    <input class="cl-input cl-input-days" th:classappend="${error != null} ? 'is-invalid'" type="text"
                                           inputmode="numeric" autocomplete="off" th:id="${day}" th:name="${day}"
                                           th:value="${day == 'orderAssemblyDays'} ? *{orderAssemblyDays} : *{orderRealizationDays}"
                                           th:attr="aria-invalid=${error != null ? 'true' : null},
                                                    aria-describedby=${day} + '-help' + (${error != null} ? ' ' + ${day} + '-error' : '')"/>
                                    <p class="cl-help" th:id="${day} + '-help'" th:text="#{'store.fulfilment.' + ${day} + '.help'}"></p>
                                    <p th:if="${error != null}" class="cl-field-error" th:id="${day} + '-error'">
                                        <i class="fas fa-exclamation-circle" aria-hidden="true"></i>
                                        <span th:text="#{${error}}"></span>
                                    </p>
                                </div>
                            </div>
                        </fieldset>

                        <fieldset class="cl-fieldset">
                            <legend class="cl-fieldset-title" th:text="#{store.fulfilment.mode.title}"></legend>
                            <!--/* The group's title says what is chosen; a legend of its own would repeat it above the options. */-->
                            <fieldset class="cl-choice-group is-row" id="defaultFulfilmentType" tabindex="-1"
                                      th:attr="aria-label=#{store.fulfilment.type}">
                                <label class="cl-choice" th:each="type : ${T(pl.commercelink.orders.fulfilment.FulfilmentType).values()}">
                                    <input type="radio" name="defaultFulfilmentType" th:value="${type.name()}"
                                           th:checked="${type.name() == form.defaultFulfilmentType}"
                                           th:attr="aria-describedby='fulfilment-type-' + ${type.name()} + '-description'"/>
                                    <span class="cl-choice-text">
                                        <span class="cl-choice-title" th:text="#{'store.fulfilment.type.' + ${type.name()}}"></span>
                                        <span class="cl-choice-description" th:id="'fulfilment-type-' + ${type.name()} + '-description'"
                                              th:text="#{'store.fulfilment.type.' + ${type.name()} + '.description'}"></span>
                                    </span>
                                </label>
                                <p th:if="${errors['defaultFulfilmentType'] != null}" class="cl-field-error" id="defaultFulfilmentType-error">
                                    <i class="fas fa-exclamation-circle" aria-hidden="true"></i>
                                    <span th:text="#{${errors['defaultFulfilmentType']}}"></span>
                                </p>
                            </fieldset>
                            <div th:replace="~{fragments/settings-form :: check('automatedFulfilment', 'store.enable.automated.fulfilment', *{automatedFulfilment}, 'store.fulfilment.automated.description', null, null)}"></div>
                        </fieldset>

                        <fieldset class="cl-fieldset" id="client-order-page">
                            <legend class="cl-fieldset-title" th:text="#{store.fulfilment.orderPage.title}"></legend>
                            <div th:replace="~{fragments/settings-form :: check('clientOrderPageEnabled', 'store.fulfilment.orderPage.enable', *{clientOrderPageEnabled}, 'store.fulfilment.orderPage.description', 'fulfilment-address-change', null)}"></div>
                            <div id="fulfilment-address-change" class="cl-reveal">
                                <div th:replace="~{fragments/settings-form :: check('clientShippingAddressChangeEnabled', 'store.fulfilment.addressChange.enable', *{clientShippingAddressChangeEnabled}, 'store.fulfilment.addressChange.description', null, null)}"></div>
                                <div th:replace="~{fragments/settings-form :: check('clientPreferredShippingDateEnabled', 'store.fulfilment.preferredDate.enable', *{clientPreferredShippingDateEnabled}, 'store.fulfilment.preferredDate.description', 'fulfilment-preferred-days', null)}"></div>
                                <div id="fulfilment-preferred-days" class="cl-reveal">
                                    <fieldset class="cl-choice-group" id="preferredShippingDays" tabindex="-1"
                                              th:attr="aria-label=#{store.fulfilment.preferredDays.title},
                                                       aria-invalid=${errors['preferredShippingDays'] != null ? 'true' : null},
                                                       aria-describedby='preferredShippingDays-help' + (${errors['preferredShippingDays'] != null} ? ' preferredShippingDays-error' : '')">
                                        <p class="cl-help" id="preferredShippingDays-help" th:text="#{store.fulfilment.preferredDays.description}"></p>
                                        <table class="cl-table">
                                            <thead>
                                            <tr>
                                                <th scope="col" th:text="#{store.fulfilment.preferredDays.type}"></th>
                                                <th scope="col" th:each="day : ${T(java.time.DayOfWeek).values()}"
                                                    th:text="#{'DayOfWeek.short.' + ${day.name()}}"
                                                    th:attr="abbr=#{'DayOfWeek.' + ${day.name()}}"></th>
                                            </tr>
                                            </thead>
                                            <tbody>
                                            <tr th:each="type : ${T(pl.commercelink.orders.ShipmentType).values()}">
                                                <th scope="row" th:text="#{'ShipmentType.' + ${type.name()}}"></th>
                                                <td th:each="day : ${T(java.time.DayOfWeek).values()}">
                                                    <label class="cl-check">
                                                        <input type="checkbox" th:name="'preferredShippingDays[' + ${type.name()} + ']'"
                                                               th:value="${day.name()}"
                                                               th:checked="${form.hasPreferredShippingDay(type.name(), day.name())}"
                                                               th:attr="aria-label=#{'ShipmentType.' + ${type.name()}} + ', ' + #{'DayOfWeek.' + ${day.name()}}"/>
                                                    </label>
                                                </td>
                                            </tr>
                                            </tbody>
                                        </table>
                                        <p th:if="${errors['preferredShippingDays'] != null}" class="cl-field-error" id="preferredShippingDays-error">
                                            <i class="fas fa-exclamation-circle" aria-hidden="true"></i>
                                            <span th:text="#{${errors['preferredShippingDays']}}"></span>
                                        </p>
                                    </fieldset>
                                </div>
                            </div>
                        </fieldset>

                        <div class="cl-card-footer">
                            <button class="cl-button is-primary" type="submit" th:text="#{form.save.changes}"></button>
                        </div>
                    </div>
                </form>
            </div>
        </div>
    </section>
    <script th:if="${!errors.isEmpty()}">
        document.getElementById('fulfilment-errors').focus();
    </script>
    <script th:src="@{/js/async-form.js}" defer></script>
    <script th:src="@{/js/reveal.js}" defer></script>
</div>
</body>
</html>
