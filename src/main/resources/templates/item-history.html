<!DOCTYPE HTML>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}">
<body>
<div layout:fragment="content">
    <section class="cl-page">
        <div class="cl-page-body">
            <div class="cl-stack">
                <div class="cl-page-header">
                    <div class="cl-page-header-row">
                        <h1 class="cl-page-title" th:text="#{item.history}"></h1>
                        <th:block th:if="${page.searched()}"><form th:replace="~{item-history/parts :: searchForm(true, false)}"></form></th:block>
                    </div>
                    <p th:unless="${page.searched()}" class="cl-page-lead" th:text="#{item.history.lead}"></p>
                </div>
                <th:block th:unless="${page.searched()}"><section th:replace="~{item-history/parts :: searchCard}"></section></th:block>
                <th:block th:if="${page.searched() and !page.found()}"><section th:replace="~{item-history/parts :: notFound}"></section></th:block>
                <th:block th:if="${page.found()}">
                    <div th:if="${page.warningCounts() != null}" class="cl-alert is-warn" role="note">
                        <i class="fas fa-exclamation-triangle cl-alert-icon" aria-hidden="true"></i>
                        <p class="cl-alert-text"><strong th:text="#{item.history.warning.title}"></strong>
                            <span th:text="${page.warningCounts()}"></span>.
                            <span th:text="#{item.history.warning.text}"></span></p>
                    </div>
                    <section th:replace="~{item-history/parts :: product}"></section>
                    <section th:replace="~{item-history/parts :: history}"></section>
                </th:block>
            </div>
        </div>
    </section>
    <script th:src="@{/js/timeline.js}" defer></script>
    <script th:src="@{/js/copy-field.js}" defer></script>
</div>
</body>
</html>
