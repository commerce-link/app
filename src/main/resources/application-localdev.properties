application.env=localhost
localstack.aws.endpoint=http://localhost:4566

spring.config.import=optional:file:./.ministack-data/.cognito.env[.properties]

spring.security.oauth2.client.registration.cognito.client-id=${COGNITO_CLIENT_ID}
spring.security.oauth2.client.registration.cognito.client-secret=${COGNITO_CLIENT_SECRET}
spring.security.oauth2.client.registration.cognito.redirect-uri=http://localhost:8080/login/oauth2/code/cognito
spring.security.oauth2.client.provider.cognito.issuer-uri=http://localhost:4566/${COGNITO_USER_POOL_ID}

cognito.domain=http://localhost:4566
cognito.logout.redirect-uri=http://localhost:8080/logout-success

spring.data.redis.host=localhost
spring.data.redis.port=6379

cognito.user-pool-id=${COGNITO_USER_POOL_ID}

dropship.tracking.sweep-cron=0 * * * * ?
dropship.tracking.initial-delay=PT0S
dropship.tracking.interval-first-day=PT1M
dropship.tracking.interval-later=PT1M
