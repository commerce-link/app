# Receipts › operator alerts
receipts.attention.ISSUING_UNKNOWN=Paragon {1}: wynik wystawienia nieznany po {5} próbach ({2}). Aplikacja ponawia tym samym kluczem, nigdy nowym. Jeśli dostawca zgłasza kilka dokumentów pod tym kluczem, rozstrzygnij je w Fakturowni: zostaw dokument z fiscal_status lub znacznikiem commercelink:fiscal-print-ordered, usuń tylko dokumenty bez nich; gdy więcej niż jeden ma któreś z nich — nie ruszaj i zgłoś.
receipts.attention.PROVIDER_UNAVAILABLE=Paragon {1} nie został jeszcze wysłany do systemu e-paragonów: {2}. Sprawdź konfigurację systemu e-paragonów sklepu (wybrany system, dane dostępu, zainstalowany adapter) albo czy nie wyczerpano limitu wywołań systemu. Nic nie zostało zafiskalizowane.
receipts.attention.INVALID_AFTER_SEND=Paragon {1}: dostawca odrzuca dane ({2}), a wcześniej mogło już coś dotrzeć. Sprawdź dokument w Fakturowni; nie wystawiaj nowego paragonu, dopóki nie wiesz, że poprzedni nie został zafiskalizowany. Po rozstrzygnięciu użyj „Zamknij ręcznie”.
receipts.attention.PENDING_LONG=Paragon {1} czeka na fiskalizację ponad 48 h. Sprawdź fiscal_status w Fakturowni: to_print lub printing = drukarka albo moduł Paragony.pl wyłączone (uruchom je); brak statusu przy znaczniku commercelink:fiscal-print-ordered = zlecenie zgubione — zleć fiskalizację ręcznie jeden raz. Nigdy nie zlecaj paragonu, który ma jakikolwiek fiscal_status.
receipts.attention.PENDING_MONTH_END=Paragon {1} nie jest zafiskalizowany, a sprzedaż trzeba zafiskalizować do końca miesiąca. Sprawdź fiscal_status w Fakturowni: to_print lub printing = uruchom drukarkę albo moduł Paragony.pl; brak statusu przy znaczniku = zleć fiskalizację ręcznie jeden raz. Nigdy nie zlecaj paragonu z jakimkolwiek fiscal_status.
receipts.attention.FAILED=Paragon {1} nie został zafiskalizowany: {3}. Popraw przyczynę i użyj „Wystaw ponownie” na zamówieniu. Nie zlecaj ponownie starego paragonu w Fakturowni — aplikacja wystawi nowy.
receipts.attention.BLOCKED=Paragon do zamówienia {0} nie został wysłany: {4}. Popraw dane zamówienia i użyj „Wystaw ponownie”.
receipts.attention.BLOCKED_POS=Sprzedaż z kasy (POS) {0} nie dostała e-paragonu, bo zamówienie nie ma e-maila klienta. Kasa wydrukowała paragon? Wpisz jego numer: „Dodaj dokument” → Paragon. Klient chce e-paragon? Wpisz jego e-mail w danych rozliczeniowych, potem „Wystaw ponownie”. Nie rób obu — sprzedaż zostałaby zafiskalizowana dwa razy.
receipts.attention.LINK_MISSING=Paragon {1} jest zafiskalizowany, ale e-paragon nie powstał (drukarka wydrukowała paragon papierowy). Klient nie dostał e-maila z linkiem.
receipts.attention.EMAIL_NOT_SENT=Paragon {1}: nie udało się wysłać e-maila z e-paragonem do zamówienia {0}. Sprawdź szablon „E-paragon” w szablonach e-maili sklepu i użyj „Wyślij e-mail ponownie” na zamówieniu; link jest w dokumentach zamówienia.
receipts.attention.EFFECTS_FAILED=Paragon {1} jest zafiskalizowany, ale kolejne próby dołączenia go do zamówienia {0}, powiadomienia marketplace’u lub wysłania e-maila się nie udają. Sprawdź zamówienie; szczegóły w logach.
