orders.dropship.rejected.unsettledItems=Nie wszystkie pozycje zam\u00f3wienia zosta\u0142y przypisane \u2014 doko\u0144cz planowanie przed wysy\u0142k\u0105 od dostawcy.
orders.dropship.rejected.noDropshipCapableSupplier=\u017baden z dostawc\u00f3w tego zam\u00f3wienia nie obs\u0142uguje wysy\u0142ki bezpo\u015brednio do klienta \u2014 przypisz pozycje do dostawcy, kt\u00f3ry obs\u0142uguje dropshipping, albo zrealizuj zam\u00f3wienie z magazynu.
