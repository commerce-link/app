# Screen intro guides
intro.eyebrow=Przewodnik po ekranie
intro.toggle=Pokaż opis ekranu
intro.dismiss=Rozumiem
intro.hint=Ten opis znajdziesz zawsze pod ikoną ? u góry ekranu.

intro.inventory.title=Ca\u0142y asortyment dostawc\u00f3w w jednym miejscu
intro.inventory.lead=CommerceLink na bie\u017c\u0105co agreguje stany magazynowe i ceny od kilkunastu dostawc\u00f3w, dopasowuj\u0105c produkty po kodach EAN i kodach producenta. Nie musisz sprawdza\u0107 ofert u ka\u017cdego z osobna \u2014 tutaj widzisz je obok siebie.
intro.inventory.item1=Przegl\u0105daj po kategoriach
intro.inventory.item1.text=kategorie PIM z liczb\u0105 produkt\u00f3w u w\u0142\u0105czonych dostawc\u00f3w, filtry dostawcy, dost\u0119pno\u015bci i katalogu.
intro.inventory.item2=Zobacz miejsce w katalogu
intro.inventory.item2.text=przy ka\u017cdym produkcie jego kategoria PIM i kategoria Twojego katalogu, do kt\u00f3rej pasuje.
intro.inventory.item3=Dodaj do katalogu
intro.inventory.item3.text=pojedynczo albo zaznaczone; dane sprawdzisz w \u201eUzupe\u0142nij dane\u201d.
intro.inventory.item4=Wychwy\u0107 braki
intro.inventory.item4.text=dostawc\u0119 bez pliku feedu zauwa\u017cysz tu, zanim wp\u0142ynie to na Twoje oferty.
intro.inventory-prices.title=Wszyscy dostawcy w jednym miejscu
intro.inventory-prices.lead=CommerceLink na bie\u017c\u0105co agreguje stany magazynowe i ceny od kilkunastu dostawc\u00f3w, dopasowuj\u0105c produkty po kodach EAN i kodach producenta. Nie musisz sprawdza\u0107 ofert u ka\u017cdego z osobna \u2014 tutaj widzisz je obok siebie.
intro.inventory-prices.item1=Sprawd\u017a cen\u0119 produktu
intro.inventory-prices.item1.text=poznasz najni\u017cszy koszt z dostaw\u0105, median\u0119 cen i \u0142\u0105czn\u0105 dost\u0119pno\u015b\u0107 u wszystkich dostawc\u00f3w.
intro.inventory-prices.item2=Kontroluj dopasowania
intro.inventory-prices.item2.text=zobaczysz, po jakim kodzie produkt zosta\u0142 znaleziony i kt\u00f3rzy dostawcy go maj\u0105.
intro.inventory-tech.title=Dane asortymentu ca\u0142ej platformy
intro.inventory-tech.lead=Widok super admina pokazuje stan indeks\u00f3w, z kt\u00f3rych korzystaj\u0105 wszystkie sklepy. Wyszukiwanie obejmuje dostawc\u00f3w globalnych \u2014 bez po\u0142\u0105cze\u0144 w\u0142asnych sklepu i bez jego magazynu.
intro.inventory-tech.item1=Sprawd\u017a indeksy
intro.inventory-tech.item1.text=inwentarz globalny, taksonomia i indeks PIM m\u00f3wi\u0105, na czym opiera si\u0119 dopasowywanie produkt\u00f3w.
intro.inventory-tech.item2=Zweryfikuj feedy
intro.inventory-tech.item2.text=lista wczytanych feed\u00f3w globalnych pokazuje, kiedy ostatnio przysz\u0142y dane od ka\u017cdego dostawcy.
intro.inventory-tech.item3=Ca\u0142y asortyment globalny
intro.inventory-tech.item3.text=kategorie PIM i wszyscy dostawcy globalni, bez akcji katalogu.

intro.fulfilment.title=System sam dobierze dostawców
intro.fulfilment.lead=Dla zaznaczonych zamówień silnik realizacji wyznacza najtańszą lub najszybszą ścieżkę zakupu u dostawców — jednym kliknięciem, dla całej paczki zamówień naraz.
intro.fulfilment.item1=Wybierz strategię
intro.fulfilment.item1.text=sam wskaż dostawców albo pozwól systemowi zasugerować optymalny podział.
intro.fulfilment.item2=Zawęź wyniki
intro.fulfilment.item2.text=pokaż tylko rentowne pozycje, preferuj lokalnych dostawców, grupuj zamówienie po zamówieniu.
intro.fulfilment.item3=Zatwierdź
intro.fulfilment.item3.text=dostawy do dostawców utworzą się automatycznie na ekranie Dostaw.

intro.orders.title=Zamówienia od przyjęcia po wysyłkę
intro.orders.lead=Lista pokazuje otwarte zamówienia sklepu, najpilniejsze na górze. Kafelki nad listą liczą, co wymaga uwagi w całym sklepie — kliknij kafelek, żeby zobaczyć właśnie te zamówienia; menu „Status” i filtr własny zawężają to, na co patrzysz.
intro.orders.item1=Zawężaj listę
intro.orders.item1.text=w menu „Status” zaznacz jeden lub kilka statusów, w menu filtra wybierz zapisany filtr; chipy nad tabelą pokazują, co jest włączone, a × przy każdym wyłącza tylko jego; „Wyczyść filtry” zdejmuje wszystko naraz.
intro.orders.item2=Sprawdź, co zostało do zrobienia
intro.orders.item2.text=znaczniki pod statusem to WZ, FZ (faktura zaliczkowa), FV, FK (faktura końcowa) albo PAR (paragon) i ★ (opinia klienta); zielony ✓ — jest, pomarańczowy ✗ — brakuje i to wstrzymuje zakończenie dostarczonego zamówienia.
intro.orders.item3=Zarządzaj szczegółami
intro.orders.item3.text=w widoku zamówienia obsłużysz realizację, faktury, płatności, wysyłkę i podział pozycji; datę dostarczenia uzupełnia Furgonetka, ręcznie wpisujesz ją tylko awaryjnie.

intro.store.title=Zacznij od konfiguracji sklepu
intro.store.lead=Ustawienia decydują o działaniu całego systemu — od danych na fakturach po sposób realizacji zamówień. Najlepiej przejść je w kolejności poniżej.
intro.store.item1=Dane firmy i fakturowanie
intro.store.item1.text=uzupełnij dane sprzedawcy i połącz dostawcę faktur.
intro.store.item2=Wysyłka i płatności
intro.store.item2.text=skonfiguruj kuriera (Furgonetka) wraz z powiadomieniami webhook oraz bramki płatności z domyślną metodą.
intro.store.item3=Realizacja
intro.store.item3.text=ustaw czasy kompletacji i włącz automatyczny dobór dostawców.

intro.deliveries.title=Dostawy od zamówienia u dostawcy po rozliczenie
intro.deliveries.lead=Lista pokazuje nieodebrane dostawy, najbliższy termin na górze. Kafelki liczą, co wymaga uwagi — kliknij kafelek, żeby zobaczyć właśnie te dostawy.
intro.deliveries.item1=Przełączaj zakres
intro.deliveries.item1.text=Nieodebrane, Odebrane albo Wszystkie; odebrane pokazują ostatnie 90 dni, w menu dat wybierzesz inny okres.
intro.deliveries.item2=Zawężaj listę
intro.deliveries.item2.text=menu Stan, Dostawca, Rozliczenie i daty; chipy pokazują, co jest włączone, a „Wyczyść filtry” zdejmuje wszystko.
intro.deliveries.item3=Rozliczaj odebrane
intro.deliveries.item3.text=znaczniki FV i SYNC pod statusem mówią, czego brakuje; kafelek „Bez faktury” zbiera wszystkie odebrane dostawy bez faktury zakupowej.


intro.payments.title=Rozliczenia z dostawcami i klientami w jednym miejscu
intro.payments.lead=Zobowiązania to dostawy, za które sklep jeszcze nie zapłacił; należności to zamówienia, za które klienci jeszcze nie zapłacili. Kafelki liczą obie strony i zawężają listę.
intro.payments.item1=Pilnuj terminów
intro.payments.item1.text=kafelki pokazują, co jest po terminie i na dziś.
intro.payments.item2=Rejestruj wpłaty i zwroty
intro.payments.item2.text=przycisk w wierszu, bez przechodzenia do zamówienia czy dostawy.
intro.payments.item3=Pobieraj wpłaty z faktur
intro.payments.item3.text=system fakturowy powie, które faktury zakupu są już zapłacone.

intro.warehouse.title=Wbudowany magazyn bez dodatkowego systemu
intro.warehouse.lead=Każda pozycja magazynowa ma swój stan — od przyjęcia, przez rezerwację i kompletację, po wydanie. U góry ekranu widzisz bieżącą wartość całego magazynu.
intro.warehouse.item1=Filtruj po statusach
intro.warehouse.item1.text=tagi pokazują pozycje dostępne, zarezerwowane, w kompletacji czy w RMA.
intro.warehouse.item2=Zmieniaj stany
intro.warehouse.item2.text=oznaczaj pozycje jako dostępne, zarezerwowane, zniszczone lub w serwisie zewnętrznym.
intro.warehouse.item3=Kompletuj zamówienia
intro.warehouse.item3.text=zatwierdzenie kompletacji rezerwuje towar i przesuwa zamówienie dalej.

intro.warehouse-documents.title=Dokumenty magazynowe tworzą się automatycznie
intro.warehouse-documents.lead=Przyjęcia i wydania towaru generują numerowane dokumenty magazynowe. Masz tu pełną historię obrotu z możliwością druku etykiet.
intro.warehouse-documents.item1=Znajdź dokument
intro.warehouse-documents.item1.text=filtruj po typie, magazynie i zakresie dat.
intro.warehouse-documents.item2=Sprawdź szczegóły
intro.warehouse-documents.item2.text=każdy dokument pokazuje pozycje, ilości i powiązane zamówienie lub dostawę.
intro.warehouse-documents.item3=Drukuj etykiety
intro.warehouse-documents.item3.text=etykiety magazynowe wydrukujesz bezpośrednio z dokumentu.

intro.offers.title=Oferty budowane z cen wszystkich dostawców
intro.offers.lead=Ofertę dla klienta składasz z pozycji wycenianych na podstawie zagregowanego inwentarza i cenników. Gotową ofertę skopiujesz, zapiszesz jako szablon lub zamienisz w dokument sprzedaży.
intro.offers.item1=Twórz oferty
intro.offers.item1.text=ręcznie, z szablonu albo importem z pliku CSV.
intro.offers.item2=Wyszukuj
intro.offers.item2.text=filtruj oferty po koszyku, nazwie, typie i zakresie dat.
intro.offers.item3=Zamieniaj w dokumenty
intro.offers.item3.text=z oferty jednym kliknięciem wygenerujesz fakturę proforma.

intro.catalogs.title=Katalog produktów pod Twoją marką
intro.catalogs.lead=Katalog dzieli produkty na kategorie; w każdej kategorii ustalasz listę produktów, wycenę i miejsca sprzedaży.
intro.catalogs.item1=Buduj kategorie
intro.catalogs.item1.text=kategoria to krok w ofercie klienta; produkty dodajesz z asortymentu albo ręcznie.
intro.catalogs.item2=Ustal wycenę
intro.catalogs.item2.text=progi zapasów, grupy cenowe i marketplace'y ustawiasz osobno dla każdej kategorii.
intro.catalogs.item3=Działaj masowo
intro.catalogs.item3.text=włączaj, wyłączaj i usuwaj wiele produktów naraz z listy kategorii.

intro.rma.title=Zwroty i reklamacje pod kontrolą
intro.rma.lead=Ekran zbiera wszystkie zgłoszenia RMA — od rejestracji, przez centrum zwrotów, po decyzję i wysyłkę zwrotną. Statusy prowadzą Cię przez cały proces.
intro.rma.item1=Znajdź zgłoszenie
intro.rma.item1.text=szukaj po numerze RMA, numerze zamówienia, adresie e-mail lub dacie.
intro.rma.item2=Prowadź proces
intro.rma.item2.text=każde zgłoszenie przechodzi przez kolejne statusy aż do decyzji.
intro.rma.item3=Współpracuj z centrami zwrotów
intro.rma.item3.text=zwroty trafiają do skonfigurowanych centrów RMA wraz z wysyłką zwrotną.

intro.reports.title=Wyniki sprzedaży na jednym wykresie
intro.reports.lead=Raporty rozdzielają sprzedaż własną od marketplace i pokazują wolumen, liczbę zamówień oraz koszty dostaw w wybranym okresie.
intro.reports.item1=Analizuj okresy
intro.reports.item1.text=wybierz zakres dat, a wykresy przeliczą się automatycznie.
intro.reports.item2=Porównuj kanały
intro.reports.item2.text=sprzedaż własna i marketplace prezentowane są osobno.
intro.reports.item3=Eksportuj dane
intro.reports.item3.text=pobierz CSV zamówień, konwersji Google Ads czy księgi stanów magazynowych.

