# Screen intro guides
intro.eyebrow=Screen guide
intro.toggle=Show screen guide
intro.dismiss=Got it
intro.hint=You can always reopen this guide with the ? icon at the top of the screen.

intro.inventory.title=Your suppliers' whole assortment in one place
intro.inventory.lead=CommerceLink gathers the products of all your suppliers and arranges them in PIM categories. For each one you see what it costs delivered, how much is in stock and whether it is already in your catalog.
intro.inventory.item1=One shared layout
intro.inventory.item1.text=we file every supplier's products under the same categories of our own, and a product sold by several suppliers appears once, at its lowest cost. Don't look for the suppliers' own price-list categories here.
intro.inventory.item2=Browse by category
intro.inventory.item2.text=PIM categories with product counts at your enabled suppliers, a supplier filter and search; a product's name opens its prices and availability.
intro.inventory.item3=See what you already have
intro.inventory.item3.text=a \u2713 in the "In catalog" column, and its tooltip lists the catalog categories that hold the product.
intro.inventory.item4=Add to the catalog
intro.inventory.item4.text=one product from its \u22ef menu or the selected ones at once; you check the data in "Complete the data".
intro.inventory.item5=Catch the gaps
intro.inventory.item5.text=a supplier without a feed file shows up here before it affects your offers.
intro.inventory-prices.title=All suppliers in one place
intro.inventory-prices.lead=CommerceLink continuously aggregates stock levels and prices from over a dozen suppliers, matching products by EAN and manufacturer codes. No need to check each supplier separately \u2014 here you see them side by side.
intro.inventory-prices.item1=Check a product's price
intro.inventory-prices.item1.text=see the lowest delivered cost, the median price and total availability across suppliers.
intro.inventory-prices.item2=Monitor the matches
intro.inventory-prices.item2.text=see which code the product was found by and which suppliers carry it.
intro.inventory-tech.title=Inventory data of the whole platform
intro.inventory-tech.lead=The super admin view shows the state of the indexes every store relies on. The search covers global suppliers \u2014 not a store's own connections and not its warehouse.
intro.inventory-tech.item1=Check the indexes
intro.inventory-tech.item1.text=global inventory, taxonomy and the PIM index tell you what product matching is built on.
intro.inventory-tech.item2=Verify the feeds
intro.inventory-tech.item2.text=the list of loaded global feeds shows when each supplier last sent data.
intro.inventory-tech.item3=The whole global assortment
intro.inventory-tech.item3.text=PIM categories and every global supplier, without catalog actions.

intro.fulfilment.title=The system picks suppliers for you
intro.fulfilment.lead=For the selected orders the fulfilment engine finds the cheapest or fastest purchasing path across suppliers — with one click, for a whole batch of orders at once.
intro.fulfilment.item1=Choose a strategy
intro.fulfilment.item1.text=pick suppliers yourself or let the system suggest the optimal split.
intro.fulfilment.item2=Narrow the results
intro.fulfilment.item2.text=show only profitable items, prefer local suppliers, group order by order.
intro.fulfilment.item3=Confirm
intro.fulfilment.item3.text=supplier deliveries are created automatically on the Deliveries screen.

intro.orders.title=Orders from intake to shipment
intro.orders.lead=The list shows the store's open orders, most urgent first. The tiles above it count what needs attention in the whole store — click a tile to see exactly those orders; the Status menu and a custom filter narrow what you look at.
intro.orders.item1=Narrow the list
intro.orders.item1.text=tick one or more statuses in the Status menu, pick a saved filter in the filter menu; the chips above the table show what is on, and the × on each turns off only that one; "Clear filters" removes them all at once.
intro.orders.item2=See what is left to do
intro.orders.item2.text=the markers under the status are WZ, ADV (advance invoice), INV, FIN (final invoice) or RCP (receipt) and ★ (customer review); green ✓ — in place, orange ✗ — missing and holding a delivered order open.
intro.orders.item3=Manage the details
intro.orders.item3.text=the order view covers fulfilment, invoices, payments, shipping and item splitting; Furgonetka fills in the delivery date, you only enter it manually as a fallback.

intro.store.title=Start with your store configuration
intro.store.lead=Settings drive the whole system — from invoice details to how orders are fulfilled. It's best to go through them in the order below.
intro.store.item1=Company details and invoicing
intro.store.item1.text=fill in seller details and connect an invoicing provider.
intro.store.item2=Shipping and payments
intro.store.item2.text=configure the courier (Furgonetka) with webhook notifications and the payment gateways with a default method.
intro.store.item3=Fulfilment
intro.store.item3.text=set picking times and enable automatic supplier selection.

intro.deliveries.title=Deliveries from the supplier order to settlement
intro.deliveries.lead=The list shows deliveries not received yet, nearest date first. The tiles count what needs attention — click a tile to see exactly those deliveries.
intro.deliveries.item1=Switch the scope
intro.deliveries.item1.text=Not received, Received or All; Received and All show deliveries ordered in the last 90 days, and the date menu lets you pick another period.
intro.deliveries.item2=Narrow the list
intro.deliveries.item2.text=the State, Supplier, Settlement and date menus; chips show what is on, and “Clear filters” removes everything.
intro.deliveries.item3=Settle what was received
intro.deliveries.item3.text=the FV and SYNC marks under the status say what is missing; the “Without invoice” tile gathers every received delivery without a purchase invoice.


intro.payments.title=Supplier and customer settlements in one place
intro.payments.lead=Payables are deliveries the store has not paid for yet; receivables are orders customers have not paid for yet. The tiles count both sides and narrow the list.
intro.payments.item1=Watch the deadlines
intro.payments.item1.text=the tiles show what is overdue and due today.
intro.payments.item2=Record payments and refunds
intro.payments.item2.text=a button in the row, without opening the order or the delivery.
intro.payments.item3=Fetch payments from invoices
intro.payments.item3.text=the invoicing system tells which purchase invoices are already paid.

intro.warehouse.title=A built-in warehouse, no extra system needed
intro.warehouse.lead=Every warehouse item has its own state — from receipt, through reservation and picking, to release. The current value of the whole warehouse is shown at the top.
intro.warehouse.item1=Filter by status
intro.warehouse.item1.text=tags show items that are available, reserved, being picked or in RMA.
intro.warehouse.item2=Change states
intro.warehouse.item2.text=mark items as available, reserved, destroyed or in external service.
intro.warehouse.item3=Pick orders
intro.warehouse.item3.text=confirming the picking reserves the goods and moves the order forward.

intro.warehouse-documents.title=Warehouse documents create themselves
intro.warehouse-documents.lead=Goods receipts and issues create numbered documents automatically — this is the full history of stock movement.
intro.warehouse-documents.item1=Find a document
intro.warehouse-documents.item1.text=pick a type (PZ, WZ, PW, RW) and enter a document number, EAN or manufacturer code.
intro.warehouse-documents.item2=Check the details
intro.warehouse-documents.item2.text=a document shows its items with value, the counterparty and the related delivery, order or return.
intro.warehouse-documents.item3=Print labels
intro.warehouse-documents.item3.text=print receipt (PZ) labels with the "Print labels" button in the document header.

intro.offers.title=Offers built from all suppliers' prices
intro.offers.lead=You compose a customer offer from items priced against the aggregated inventory and pricelists. A finished offer can be copied, saved as a template or turned into a sales document.
intro.offers.item1=Create offers
intro.offers.item1.text=an empty one, from a template or from a CSV file, with the New offer button.
intro.offers.item2=Search
intro.offers.item2.text=by name or ID; narrow by validity and creation date.
intro.offers.item3=Turn them into documents
intro.offers.item3.text=generate a proforma invoice from an offer with one click.

intro.catalogs.title=A product catalog under your brand
intro.catalogs.lead=A catalog splits products into categories; each category has its own product list, pricing and places to sell.
intro.catalogs.item1=Build categories
intro.catalogs.item1.text=a category is a step in the customer's offer; add products from inventory or manually.
intro.catalogs.item2=Set the pricing
intro.catalogs.item2.text=stock thresholds, pricing groups and marketplaces are set separately for each category.
intro.catalogs.item3=Act in bulk
intro.catalogs.item3.text=enable, disable and delete many products at once from the category list.

intro.rma.title=Returns and complaints under control
intro.rma.lead=This screen gathers all RMA requests — from registration, through the return center, to the decision and return shipment. Statuses guide you through the whole process.
intro.rma.item1=Find a request
intro.rma.item1.text=search by RMA number, order number, e-mail address or date.
intro.rma.item2=Run the process
intro.rma.item2.text=each request moves through consecutive statuses until the decision.
intro.rma.item3=Work with return centers
intro.rma.item3.text=returns are routed to your configured RMA centers along with return shipping.

intro.reports.title=Sales results on a single chart
intro.reports.lead=Reports separate your own sales from marketplace sales and show volume, order counts and delivery costs for the selected period.
intro.reports.item1=Analyze periods
intro.reports.item1.text=pick a date range and the charts recalculate automatically.
intro.reports.item2=Compare channels
intro.reports.item2.text=own sales and marketplace sales are presented separately.
intro.reports.item3=Export data
intro.reports.item3.text=download CSVs of orders, Google Ads conversions or the stock ledger.

