# Receipts › operator alerts
receipts.attention.ISSUING_UNKNOWN=Receipt {1}: the outcome of issuing is unknown after {5} attempts ({2}). The application retries with the same key, never a new one. If the provider reports several documents under this key, resolve them in Fakturownia: keep the document with a fiscal_status or the commercelink:fiscal-print-ordered tag, delete only documents without either; if more than one has either — do not touch them and report it.
receipts.attention.PROVIDER_UNAVAILABLE=Receipt {1} has not been sent to the e-receipt system yet: {2}. Check the store’s e-receipt system configuration (chosen system, credentials, installed adapter), or the system’s call limit may be exhausted. Nothing has been fiscalised.
receipts.attention.INVALID_AFTER_SEND=Receipt {1}: the provider rejects the data ({2}), and something may already have gone through earlier. Check the document in Fakturownia; do not issue a new receipt until you know the previous one was not fiscalised. Once resolved, use “Close manually”.
receipts.attention.PENDING_LONG=Receipt {1} has been waiting for fiscalisation for over 48 h. Check fiscal_status in Fakturownia: to_print or printing = the printer or the Paragony.pl module is off (turn it on); no status with the commercelink:fiscal-print-ordered tag = the order was lost — order fiscalisation manually once. Never order a receipt that already has any fiscal_status.
receipts.attention.PENDING_MONTH_END=Receipt {1} is not fiscalised, and the sale must be fiscalised by the end of the month. Check fiscal_status in Fakturownia: to_print or printing = turn on the printer or the Paragony.pl module; no status with the tag = order fiscalisation manually once. Never order a receipt that already has any fiscal_status.
receipts.attention.FAILED=Receipt {1} was not fiscalised: {3}. Fix the cause and use “Reissue” on the order. Do not reorder the old receipt in Fakturownia — the application will issue a new one.
receipts.attention.BLOCKED=The receipt for order {0} was not sent: {4}. Fix the order data and use “Reissue”.
receipts.attention.BLOCKED_POS=Cash register (POS) sale {0} got no e-receipt because the order has no customer email. The cash register printed the receipt? Enter its number: “Add document” → Receipt. The customer wants an e-receipt? Enter their email in the billing details, then “Reissue”. Never both: the sale would be fiscalised twice.
receipts.attention.LINK_MISSING=Receipt {1} is fiscalised, but the e-receipt was not created (the printer printed a paper receipt). The customer did not get the email with the link.
receipts.attention.EMAIL_NOT_SENT=Receipt {1}: the e-receipt email for order {0} could not be sent. Check the “E-receipt” template in the store’s email templates and use “Resend email” on the order; the link is in the order’s documents.
receipts.attention.EFFECTS_FAILED=Receipt {1} is fiscalised, but attaching it to order {0}, notifying the marketplace or sending the email keeps failing (repeated attempts do not succeed). Check the order; details are in the logs.
receipts.blocked.NO_LINES=no line with a value greater than 0 PLN
receipts.blocked.NEGATIVE_LINE=a line with a negative price (discounts are not supported)
receipts.blocked.UNKNOWN_VAT=unsupported VAT rate
receipts.blocked.TOTAL_MISMATCH=the line total differs from the order value
receipts.blocked.EMPTY_NAME=a line with no printable name
