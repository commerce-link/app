app.registration.enabled=true
app.registration.demo=true
app.registration.ttl-days=7
app.gtm.container-id=
app.terms-url=

# Dropship tracking on demo mirrors localdev: Acme/AcmeB are in-memory simulations, so a shipment is confirmed ~2 min after ordering
# These properties only take effect outside AWS: application.env is not set here, so on the deployed demo
# environment it resolves to "prod" (supplied as an environment variable) and the queue listener drives the
# sweep instead of this local cron trigger.
dropship.tracking.sweep-cron=0 * * * * ?
dropship.tracking.initial-delay=PT0S
dropship.tracking.interval-first-day=PT1M
dropship.tracking.interval-later=PT1M
